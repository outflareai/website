# Ships docs pull requests that are only waiting for production (AGENTS.md,
# "Docs after the deploy"), so nobody has to watch for the deploy. Every 15
# minutes it looks at each open pull request, drafts included, that names
# what it waits for on a "Needs outflareai/..." line:
# - if `deployed` is the only job that failed in its latest CI run, it
#   re-runs that job;
# - once every check on its head is green, it merges it (a merge commit),
#   marking a draft ready first.
# After re-running any checks it waits for them (up to 10 minutes) and looks
# again, so a pull request goes green and merges in the same run.
# A pull request labelled `unfinished` or `hold` is left alone. It runs no
# pull request code.
#
# GitHub runs schedules late or skips them when busy, so Cloud's Deploy also
# sends a `production-deployed` dispatch as soon as a production deploy passes
# its smoke test; the schedule is the fallback.
name: Recheck deployed

on:
  repository_dispatch:
    types: [production-deployed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

# One pass at a time, so a dispatch and the schedule never merge twice.
concurrency:
  group: recheck-deployed
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the failed job
      contents: write # merge
      pull-requests: write # mark a draft ready
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-run waiting deployed checks and merge green docs
        run: |
          pass() {
          gh api "repos/$GH_REPO/pulls?state=open&per_page=50" --jq '.[]
            | select([.labels[].name] | index("unfinished") or index("hold") | not)
            | select((.body // "") | test("\\bNeeds\\b:?[*_]*\\s+[^\\n]*outflareai/"; "i"))
            | "\(.number) \(.head.sha) \(.draft) \(.node_id)"' |
          while read -r pr sha draft node; do
            run=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=20" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | sort_by(.created_at) | last | select(. != null and .status == "completed") | "\(.id) \(.run_attempt) \(.conclusion)"')
            [ -n "$run" ] || continue
            set -- $run
            if [ "$3" = failure ]; then
              # A day of re-runs is enough; after that a person looks.
              [ "$2" -lt 100 ] || continue
              failed=$(gh api "repos/$GH_REPO/actions/runs/$1/attempts/$2/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(",")')
              if [ "$failed" = deployed ]; then
                echo "Re-running deployed for #$pr (run $1)."
                gh api -X POST "repos/$GH_REPO/actions/runs/$1/rerun-failed-jobs" >/dev/null \
                  && echo "$1" >> "$RUNNER_TEMP/reruns" || echo "::warning::Could not re-run run $1."
              fi
              continue
            fi
            [ "$3" = success ] || continue
            # Every check on the head, not just CI, has finished and passed.
            bad=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))] | length')
            [ "$bad" = 0 ] || continue
            if [ "$draft" = true ]; then
              gh api graphql -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { clientMutationId } }' -f id="$node" >/dev/null || { echo "::warning::Could not mark #$pr ready."; continue; }
            fi
            echo "Merging #$pr: production runs what it documents and every check passed."
            gh api -X PUT "repos/$GH_REPO/pulls/$pr/merge" -f merge_method=merge -f sha="$sha" >/dev/null || echo "::warning::Could not merge #$pr."
          done
          }
          : > "$RUNNER_TEMP/reruns"
          pass
          [ -s "$RUNNER_TEMP/reruns" ] || exit 0
          # Wait for the re-runs, then merge whatever went green.
          for _ in $(seq 20); do
            sleep 30
            waiting=0
            while read -r id; do
              [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)" = completed ] || waiting=1
            done < "$RUNNER_TEMP/reruns"
            [ "$waiting" = 1 ] || break
          done
          : > "$RUNNER_TEMP/reruns"
          pass
