name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: the "Needs" lines in the description can change.
    types: [opened, synchronize, reopened, edited]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # last-updated dates come from git history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Internal links resolve
        run: node scripts/check-links.mjs

  # Docs merge only once app.outflare.ai runs what they describe
  # (scripts/check-deployed.mjs, AGENTS.md "Docs after the deploy").
  deployed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Production runs what these docs describe
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- spec/openapi.yaml; then export SPEC_CHANGED=0; else export SPEC_CHANGED=1; fi
          node scripts/check-deployed.mjs
