                  site: { type: string, description: The default site; empty when none is set. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/{id}/sites/{site}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The integration id. }
      - { name: site, in: path, required: true, schema: { type: string }, description: "The site's id from GET .../sites, URL-encoded (Search Console ids contain `:` and `/`)." }
