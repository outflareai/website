                site: { type: string, example: properties/123456789, description: "The site's id, from GET .../analytics/{id}/sites." }
                brand: { type: string, example: repocket, description: "A brand's handle or id, none for shared, or auto to follow the domain." }
      responses:
        "200":
          description: The site's brand now.
