        less often, for three days. Emails can only be sent from a verified
        domain or its subdomains.
      tags: [emails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, description: "Such as example.com or mail.example.com." }
                provider_id: { type: string, format: uuid }
                brand_id: { type: string, format: uuid }
