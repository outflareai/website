      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [score, added, email], default: score } }
        - { name: q, in: query, description: "Search email, name, company and title.", schema: { type: string } }
        - { name: min_score, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
