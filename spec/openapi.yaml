      responses:
        "200":
          description: The timeline.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
                  next_before: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}/consents:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
    get:
      operationId: listRecordConsents
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: A person's consents
      description: |
        Scope: customers.read. The current consent for each channel, topic and purpose the person was asked about: the
        latest grant or withdrawal. history=true lists every one, newest first. A topic's own row wins over the whole
        channel's, except a later withdrawal from the whole channel.
      tags: [records]
      parameters:
        - { name: history, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Consents.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Consent" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: recordConsent
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Record consent
      description: |
        Scope: customers.manage. Records that a person granted or withdrew consent, with where and what proves it.
        Nothing is overwritten: the latest one counts, and the rest stay as the history. Lifecycle email sends
        marketing only to people whose current email consent is granted.
      tags: [records]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentInput" }
      responses:
        "201":
          description: The consent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/customer-events:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listCustomerEvents
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: List product events
      description: "Scope: customers.read. Product events, newest first. matched=false lists anonymous visitors' events not yet linked to a person."
      tags: [records]
      parameters:
        - { name: name, in: query, description: "A catalog name, such as order_completed or page.viewed.", schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [track, identify, page, screen, group, alias] } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: anonymous_id, in: query, schema: { type: string } }
        - { name: matched, in: query, schema: { type: string, enum: ["true", "false", all] } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CustomerEvent" } }
                  next_before: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: trackCustomerEvents
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      summary: Send product events
      description: |
        Scope: customers.manage. Sends what people do in your product, in Segment's format: one event, or
        {"batch": [...]} with up to 500 (5 MB). type is track, identify, page, screen, group or alias; camelCase
        (userId, anonymousId, messageId) and snake_case both work, so a product already sending to Segment or
        RudderStack can point here as is. Send it from your servers: the token can change customer records.

        Each event is matched to a person: by userId (a new userId makes a new person, origin first_party), then by a
        verified email in identify's traits (traits.email_verified true), then by anonymousId. An anonymous visitor's
        events wait unmatched and join the person when an identify links their anonymousId. Two userIds are never
        merged and an unverified email never matches anyone. identify's traits that match a person field in the
        catalog (firstName is first_name) are written with source first_party; the rest are kept on the event and
        listed in ignored_traits. group makes or finds the company by groupId and adds it to the person's companies.

        A retry with the same messageId is stored once. Each event is accepted, duplicate or rejected on its own, and
        a new track name enters the catalog quarantined until someone approves it.
      tags: [records]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerEventsInput" }
      responses:
        "200":
          description: What happened to each event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEventsResult" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/brands:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listBrands
      x-outflare-access: { scope: workspace.read, brand_limited: true }
      summary: List brands
      description: |
        Scope: workspace.read. The businesses this company markets, each
        with its own website, such as Geonode and Repocket. Connectors,
        members, tokens, leads and suppressions are the workspace's and
        shared by every brand; a brand owns its context, memories, projects
