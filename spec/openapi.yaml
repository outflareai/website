        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAPIToken
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a scoped API token
      description: "Scope: tokens.manage. A token cannot hold scopes or looser limits than its creator. The secret is returned once."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/Scope" }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
                daily_send_budget: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
                max_priority: { type: [string, "null"], enum: [low, normal, high, null] }
                may_take_mailboxes: { type: boolean }
                default_team_id: { type: [string, "null"], format: uuid }
                project_id: { type: [string, "null"], format: uuid, description: "Binds the token to one project: it sees and changes only that project's records, and endpoints that are not project-aware refuse it. Fixed for the token's life." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_token: { $ref: "#/components/schemas/APIToken" }
                  token: { type: string, description: "The secret, starting oft_. Shown once." }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/api-tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
