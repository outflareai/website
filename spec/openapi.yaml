            text: { type: string }
            metric: { type: [string, "null"], enum: [meetings, replies, sends, leads, null] }
            target: { type: [integer, "null"] }
            current: { type: integer }
            reached: { type: boolean }
        instructions: { type: string }
        plan: { type: string }
        plan_updated_at: { type: [string, "null"], format: date-time }
        mode: { $ref: "#/components/schemas/MissionMode" }
        status: { $ref: "#/components/schemas/MissionStatus" }
        status_reason: { type: string }
        token_id: { type: [string, "null"], format: uuid }
        token_name: { type: [string, "null"] }
        limits:
