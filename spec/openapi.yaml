        active_sequences: { type: integer }
        sent_7d: { type: integer }
        replies_7d: { type: integer }
        bounced_7d: { type: integer }
        bounce_rate_7d: { type: [number, "null"], description: "Percent of sends that bounced, last 7 days." }
        reply_rate_7d: { type: [number, "null"], description: "Percent of sends that got a reply, last 7 days." }
        open_replies: { type: integer, description: Replies not done or snoozed. }
