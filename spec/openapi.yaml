        .../integrations` and it appears here, with delivery events being set
        up on its own. The default provider sends when a send names none.
      tags: [emails]
      responses:
        "200":
          description: Providers, the default first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmailProvider" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-providers/{id}:
