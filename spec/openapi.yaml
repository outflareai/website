      summary: Get a run's progress or result
      description: "Scope: leads.read"
      tags: [lists]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/list-runs/{run}/cancel:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelListRun
      x-outflare-access: { scope: leads.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Stop a queued or running run. Leads already added stay.
      description: "Scope: leads.manage"
