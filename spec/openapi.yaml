        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/suggestions/{id}/decline:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: declineAllocationSuggestion
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Decline a suggestion, so it is not proposed again
      description: "Scope: sequences.manage."
      tags: [allocation]
      responses:
        "204": { description: Declined. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/changes:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listAllocationChanges
      x-outflare-access: { scope: sequences.read }
      summary: Mailbox assignment history, newest first
      description: "Scope: sequences.read."
      tags: [allocation]
      parameters:
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/changes/{id}/undo:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: undoAllocationChange
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Undo a change
      description: |
        Scope: sequences.manage. Only the latest change to a mailbox can be
        undone. Undoing an automatic choice also stops the allocator from
        making it again.
      tags: [allocation]
      responses:
        "200":
          description: The reversing change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { $ref: "#/components/schemas/PlannedChange" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/attention:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getAllocationAttention
      x-outflare-access: { scope: sequences.read }
      summary: What needs a person
      description: "Scope: sequences.read. Approvals, suggestions to review, shortages, follow-ups whose mailbox is gone and unconfirmed senders."
      tags: [allocation]
      responses:
        "200":
          description: Items needing attention.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals: { type: array, items: { $ref: "#/components/schemas/AllocationSuggestion" } }
                  suggestions_to_review: { type: integer }
                  shortages:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence_id: { type: string, format: uuid }
                        sequence_name: { type: string }
                        needed_daily: { type: integer }
                        active_daily: { type: integer }
                        blocking: { type: array, items: { $ref: "#/components/schemas/AllocationBlocking" } }
                        note: { type: string }
                  orphaned_follow_ups:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence_id: { type: string, format: uuid }
                        sequence_name: { type: string }
                        leads: { type: integer }
                  unconfirmed_senders: { type: integer, description: Only counted once the workspace has teams. }
                  platforms:
                    type: array
                    description: Platform accounts that are out of date, have a first plan to review, or have mailboxes in conflict.
                    items: { $ref: "#/components/schemas/PlatformAccount" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listPlatforms
      x-outflare-access: { scope: sequences.read }
      summary: List connected sequencer accounts
      description: "Scope: sequences.read. Every connected account of an outside sequencer (EmailBison, Instantly, Smartlead) that mailbox allocation reads. Outflare reads each one every 5 minutes; its live campaigns become sequences with `links`, and its mailboxes become mailboxes with `has_login: false` unless Outflare already has them."
      tags: [allocation]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlatformAccount" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms/{id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: The connection (integration) id., schema: { type: string, format: uuid } }
    post:
      operationId: syncPlatform
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Read a sequencer account now
      description: "Scope: sequences.manage. Reads mailboxes and campaigns now instead of waiting for the next 5-minute sync. Mailboxes added to or removed from a campaign in the platform are accepted as manual changes; attaches Outflare asked for are confirmed once the platform shows them."
      tags: [allocation]
      responses:
        "200":
          description: What the sync found and changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailboxes: { type: integer }
                  campaigns: { type: integer, description: Live campaigns linked to sequences. }
                  accepted: { type: integer, description: Changes made in the platform, accepted as manual ones. }
                  confirmed: { type: integer, description: Attaches the platform now shows. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: The connection (integration) id., schema: { type: string, format: uuid } }
    post:
      operationId: reviewPlatformPlan
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Let allocation change a newly connected account
      description: "Scope: sequences.manage. Until this is called, every change for the account's campaigns is only suggested, so you can look at the first plan before anything moves. Runs a plan straight away."
      tags: [allocation]
      responses:
        "200":
          description: The plan that ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
                  suggested: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/assign:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: assignMailboxes
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Assign mailboxes to a sequence by hand
      description: |
        Scope: sequences.manage. A mailbox with leads mid-sequence elsewhere
        drains first: it finishes those follow-ups, then joins. Locks are
        honoured; a mailbox locked elsewhere is refused.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, sequence_id]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                sequence_id: { type: string, format: uuid }
      responses:
        "200":
          description: One result per mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/release:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: releaseMailboxes
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Take mailboxes off their sequence
      description: "Scope: sequences.manage. Mailboxes with leads in flight drain first."
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
      responses:
        "200":
          description: One result per mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/lock:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: lockMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Lock mailboxes, or clear their locks
      description: |
        Scope: mailboxes.manage. sequence: keep on this sequence (assigns it
        now). team: only this team's sequences. manual_only: the allocator
        never touches it. A null kind clears the lock. until is optional.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, kind]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                kind: { type: [string, "null"], enum: [sequence, team, manual_only, null] }
                sequence_id: { type: string, format: uuid }
                team_id: { type: string, format: uuid }
                until: { type: [string, "null"], format: date-time }
                note: { type: string }
      responses:
        "200":
          description: Mailboxes changed, and any assignments a sequence lock made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  assignments: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/allocation:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSequenceAllocation
      x-outflare-access: { scope: sequences.read }
      summary: A sequence's mailboxes, capacity, suggestions and history
      description: "Scope: sequences.read."
      tags: [allocation]
      responses:
        "200":
          description: The sequence's allocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence_id: { type: string, format: uuid }
                  mode: { $ref: "#/components/schemas/AllocationMode" }
                  needed_daily: { type: [integer, "null"] }
                  active_daily: { type: integer }
                  blocking: { type: array, items: { $ref: "#/components/schemas/AllocationBlocking" } }
                  note: { type: string }
                  planned_at: { type: [string, "null"], format: date-time }
                  mailboxes: { type: array, items: { $ref: "#/components/schemas/AssignedMailbox" } }
                  incoming: { type: array, items: { $ref: "#/components/schemas/AssignedMailbox" }, description: Mailboxes draining elsewhere that join next. }
                  suggestions: { type: array, items: { $ref: "#/components/schemas/AllocationSuggestion" } }
                  changes: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
                  orphaned_follow_ups: { type: integer }
                  links: { type: array, items: { $ref: "#/components/schemas/CampaignLink" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/orphaned-follow-ups:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveOrphanedFollowUps
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Decide what happens to follow-ups whose mailbox is gone
      description: |
        Scope: sequences.manage. cancel stops them. handoff sends the next
        step from another of the sequence's mailboxes as a fresh email, not a
        reply, since the new sender never wrote before.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [cancel, handoff] }
      responses:
        "200":
          description: How many leads changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getInfrastructure
      x-outflare-access: { scope: infrastructure.read }
      summary: Mailboxes by lifecycle stage, the ones not ready, and plans in progress
      description: |
        Scope: infrastructure.read. Counts of mailboxes in each lifecycle
        stage (warming, ready, resting, retired), every mailbox that is not
        ready with the reason and until when, the plans that are not finished,
        and the suppliers plans can buy from on this server.
      tags: [infrastructure]
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfrastructureOverview" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure/preview:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: previewInfraPlan
      x-outflare-access: { scope: infrastructure.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Draft a plan without saving it
      description: |
        Scope: infrastructure.read. Takes the same fields as creating a plan
        and returns the domains, mailboxes, timeline, daily capacity and
        warnings it would have. Nothing is saved or bought.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InfraPlanInput" }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlanDraft" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure/move:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: moveMailboxStage
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Move mailboxes to warming, ready, resting or retired
      description: |
        Scope: infrastructure.manage. Works on any mailbox, including ones
        you imported yourself. Only ready mailboxes send cold email; warm-up
        carries on while warming and resting. Retiring pauses the mailbox and
        turns warm-up off for good; its unfinished follow-ups wait for you to
        cancel them or hand them to another mailbox. A mailbox that cannot
        make the move is returned with `skipped` saying why.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, stage]
              properties:
                mailbox_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 1000 }
                stage: { $ref: "#/components/schemas/LifecycleStage" }
                reason: { type: string, maxLength: 500, description: Shown on the mailbox and in the audit log. }
                until:
                  type: string
                  format: date-time
                  description: "Resting: when the rest ends (default 7 days). Warming: the earliest it can be ready (default 14 days)."
                auto_rest:
                  type: boolean
                  description: Rest on its own when warm-up inbox placement drops, and come back when it recovers.
                cancel_at_supplier:
                  type: boolean
                  description: Retiring a mailbox a plan bought also cancels it at the supplier, at the end of the period.
      responses:
        "200":
          description: What happened to each mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [moved, results]
                properties:
                  moved: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, email, from, to]
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string }
                        from: { $ref: "#/components/schemas/LifecycleStage" }
                        to: { $ref: "#/components/schemas/LifecycleStage" }
                        skipped: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInfraPlans
      x-outflare-access: { scope: infrastructure.read }
      summary: List infrastructure plans
      description: "Scope: infrastructure.read. Newest first, without their items."
      tags: [infrastructure]
      responses:
        "200":
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InfraPlan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Draft a plan for domains and mailboxes
      description: |
        Scope: infrastructure.manage. "10 domains and 30 mailboxes for this
        project by the 14th" is `domain_count: 10, mailboxes_per_domain: 3,
        ready_by: "2026-11-14", project_id`. Domain names come from `brand`
        unless you list them in `domains`; listing a domain the workspace
        already has adds mailboxes to it instead of buying it. Mailbox names
        come from `personas`. A plan with a supplier is priced in the
        background; read it again until `quote.status` is `ready`. A draft
        buys nothing until it is approved.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/InfraPlanInput"
                - required: [name, domain_count]
      responses:
        "201":
          description: The draft plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInfraPlan
      x-outflare-access: { scope: infrastructure.read }
      summary: Get a plan with every domain and mailbox and where each one is
      description: "Scope: infrastructure.read"
      tags: [infrastructure]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a draft plan
      description: |
        Scope: infrastructure.manage. Drafts only. Domains already in the plan
        are kept unless you send `domains`; ones the supplier said are taken
        are replaced with new suggestions.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InfraPlanInput" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a draft or cancelled plan
      description: "Scope: infrastructure.manage. Domains and mailboxes it built stay."
      tags: [infrastructure]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveInfraPlan
      x-outflare-access: { scope: infrastructure.approve }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Approve a plan, which starts buying
      description: |
        Scope: infrastructure.approve (owners and admins; give it to an agent
        token only if it may spend). Fails with 409 while the plan has a
        blocking warning. When the plan has a price, send `once_cents` and
        `monthly_cents` exactly as its `quote` shows them, so a price that
        changed is never approved by accident. Customers pay the supplier
        directly, on their own account.
      tags: [infrastructure]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                once_cents: { type: integer, format: int64 }
                monthly_cents: { type: integer, format: int64 }
      responses:
        "200":
          description: The plan, now building.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Stop a plan
      description: |
        Scope: infrastructure.manage. Steps not done yet are cancelled. An
        order already placed with a supplier is not undone; cancel it in your
        supplier account if you need to.
      tags: [infrastructure]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}/bought:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markInfraDomainsBought
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Tell a plan you bought its domains
      description: |
        Scope: infrastructure.manage. For plans you buy yourself (`supplier:
        manual`). Moves the domains on to the DNS check. A domain also moves
        on by itself once its MX records point at the plan's provider.
      tags: [infrastructure]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items: { type: string }
                  description: The domains bought; every domain waiting to be bought when left out.
      responses:
        "200":
          description: How many domains moved on.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: refreshInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Get a new quote for a draft, or check a building plan now
      description: "Scope: infrastructure.manage. Runs in the background. Building plans are also checked every 5 minutes on their own."
      tags: [infrastructure]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token (oft_...) created in the workspace.
    session:
      type: apiKey
      in: cookie
      name: outflare_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes the write safe to retry. A repeat with the same key from the same caller within 24 hours gets the first
        answer back (with `Idempotent-Replayed: true`) instead of running again. The same key for a different request
        is refused with 422 `idempotency_key_reused`; while the first is still running, 409 `idempotency_in_progress`.
        Use a new random key, such as a UUID, for each distinct write.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Agency:
      name: ag
      in: path
      required: true
      schema: { type: string, format: uuid }
    Workspace:
      name: ws
      in: path
      required: true
      schema: { type: string, format: uuid }
    Domain:
      name: domain
      in: path
      required: true
      schema: { type: string, example: acme.com }
    From:
      name: from
      in: query
      description: Start of the period, inclusive. A date (2026-10-01) or a time. Default 30 days before to.
      schema: { type: string, example: "2026-10-01" }
    To:
      name: to
      in: query
      description: End of the period. A date includes that whole day. Default now.
      schema: { type: string, example: "2026-10-31" }
    AnalyticsFrom:
      name: from
      in: query
      description: First day, inclusive (YYYY-MM-DD). Default 27 days before to.
      schema: { type: string, format: date, example: "2026-09-27" }
    AnalyticsTo:
      name: to
      in: query
      description: Last day, inclusive (YYYY-MM-DD). Default today (UTC).
      schema: { type: string, format: date, example: "2026-10-24" }
    AnalyticsFresh:
      name: fresh
      in: query
      description: true skips the short cache and asks the provider again.
      schema: { type: boolean, default: false }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MissionHeld:
      description: |
        Only for a call made inside a mission (with the Outflare-Mission header): the write did not run. It was recorded
        as a dry run, or held until a person approves it. Read mission_action to follow it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MissionHeld" }
  schemas:
    EmailBisonCompatCall:
      type: object
      required: [method, path, query_keys, body_keys, status, supported, user_agent, created_at]
      properties:
        method: { type: string }
        path: { type: string, description: "Path after /emailbison/{ws}, e.g. /api/sender-emails." }
        query_keys: { type: array, items: { type: string } }
        body_keys: { type: array, items: { type: string }, description: "Field names sent, one level deep (sender_emails[].email). Never values." }
        status: { type: integer }
        supported: { type: boolean }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    TelemetryOffReason:
      description: Why usage stats are off; null when on. env is OUTFLARE_TELEMETRY or DO_NOT_TRACK, setting is the owner's choice, build is a build that turns it off (the hosted Cloud), no_endpoint is a build with nowhere to send it.
      type: [string, "null"]
      enum: [env, setting, build, no_endpoint, null]
    TelemetryNotice:
      type: object
      required: [id, severity, title]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        url: { type: string }
    TelemetryStatus:
      type: object
      required: [enabled, disabled_by, endpoint, instance_id, version, last_sent_at, last_error, latest_version, update_available, notices, changed_at, can_change]
      properties:
        enabled: { type: boolean }
        disabled_by: { $ref: "#/components/schemas/TelemetryOffReason" }
        endpoint: { type: [string, "null"], description: Where reports go. }
        instance_id: { type: string, format: uuid, description: Random id naming this install; nothing else. }
        version: { type: string }
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        latest_version: { type: [string, "null"] }
        update_available: { type: boolean }
        notices:
          type: array
          items: { $ref: "#/components/schemas/TelemetryNotice" }
        changed_at: { type: [string, "null"], format: date-time }
        can_change: { type: boolean, description: True for the person who set up the server. }
    TelemetryCounts:
      description: Each count is a range such as "6-10", never exact.
      type: object
      required: [users, workspaces, mailboxes, active_mailboxes, leads, active_sequences, sent_24h, replies_24h, projects, missions, api_tokens, active_users_7d]
      properties:
        users: { type: string }
        workspaces: { type: string }
        mailboxes: { type: string }
        active_mailboxes: { type: string }
        leads: { type: string }
        active_sequences: { type: string }
        sent_24h: { type: string }
        replies_24h: { type: string }
        projects: { type: string }
        missions: { type: string }
        api_tokens: { type: string }
        active_users_7d: { type: string }
    TelemetryReport:
      type: object
      required: [schema, instance_id, version, os, arch, go_version, container, postgres_major, install_age_days, counts, connectors]
      properties:
        schema: { type: integer }
        instance_id: { type: string, format: uuid }
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        go_version: { type: string }
        container: { type: boolean }
        postgres_major: { type: integer }
        install_age_days: { type: string }
        counts: { $ref: "#/components/schemas/TelemetryCounts" }
        connectors:
          type: array
          description: Ids of connectors in use, such as hubspot. Never the accounts they sign in to.
          items: { type: string }
    MissionMode:
      type: string
      enum: [dry_run, approve_writes, autonomous]
      description: "dry_run: writes recorded, never run. approve_writes: each write waits for a person. autonomous: writes run within the limits."
    MissionStatus:
      type: string
      enum: [draft, pending_approval, running, paused, completed, stopped, failed]
    MissionPlanInput:
      type: object
      required: [goal]
      properties:
        goal: { type: string, maxLength: 2000, example: "Book 10 meetings with CFOs at Australian fintechs with 50 to 500 staff by 30 November" }
        project_id: { type: string, format: uuid, description: "Plan inside this project, using its brief." }
    MissionDraft:
      type: object
      description: What the planner proposed. The mission holds the same values; this keeps the parts a mission has no field for.
      required: [steps, connectors, questions, assumptions]
      properties:
        steps:
          type: array
          items: { type: object, required: [title, detail], properties: { title: { type: string }, detail: { type: string } } }
        connectors:
          type: array
          description: Connectors the plan needs that are not connected yet.
          items: { type: object, required: [id, why], properties: { id: { type: string }, name: { type: string }, why: { type: string } } }
        questions: { type: array, items: { type: string } }
        assumptions: { type: array, items: { type: string } }
    MissionPlanResult:
      type: object
      required: [mission, draft, usage]
      properties:
        mission: { $ref: "#/components/schemas/Mission" }
        draft: { $ref: "#/components/schemas/MissionDraft" }
        usage:
          type: object
          required: [model, input_tokens, output_tokens]
          properties:
            model: { type: string, example: claude-opus-5-5 }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
    MissionInput:
      type: object
      properties:
        name: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        goal: { type: string, description: The goal in words. }
        goal_metric: { type: [string, "null"], enum: [meetings, replies, sends, leads, null] }
        goal_target: { type: [integer, "null"], minimum: 1 }
        instructions: { type: string, description: Guidance on top of the project brief (Markdown). }
        plan: { type: string, description: The agent's plan (Markdown). }
        mode: { $ref: "#/components/schemas/MissionMode" }
        token_id: { type: [string, "null"], format: uuid, description: The only token that may act in the mission. }
        max_sends: { type: [integer, "null"], minimum: 1 }
        max_spend_cents: { type: [integer, "null"], minimum: 0, description: US cents, from the spend ledger. }
        ends_at: { type: [string, "null"], format: date-time, description: The mission ends itself at this time. }
    Mission:
      type: object
      required: [id, name, project_id, project_name, goal, instructions, plan, plan_updated_at, mode, status, status_reason, token_id, token_name, limits, progress, writes, pending_actions, calls, last_call_at, brief_version, approved_by, approved_by_name, approved_at, started_at, ended_at, report, created_by, created_by_name, started_by_agent, runner, turns, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        project_name: { type: [string, "null"] }
        goal:
          type: object
          required: [text, metric, target, current, reached]
          properties:
            text: { type: string }
            metric: { type: [string, "null"], enum: [meetings, replies, sends, leads, null] }
            target: { type: [integer, "null"] }
            current: { type: integer }
            reached: { type: boolean }
        instructions: { type: string }
        plan: { type: string }
        plan_updated_at: { type: [string, "null"], format: date-time }
        mode: { $ref: "#/components/schemas/MissionMode" }
        status: { $ref: "#/components/schemas/MissionStatus" }
        status_reason: { type: string }
        token_id: { type: [string, "null"], format: uuid }
        token_name: { type: [string, "null"] }
        limits:
          type: object
          required: [max_sends, max_spend_cents, ends_at]
          properties:
            max_sends: { type: [integer, "null"] }
            max_spend_cents: { type: [integer, "null"] }
            ends_at: { type: [string, "null"], format: date-time }
        progress:
          type: object
          required: [sends, replies, leads, meetings, spend_cents]
          properties:
            sends: { type: integer }
            replies: { type: integer }
            leads: { type: integer }
            meetings: { type: integer }
            spend_cents: { type: integer }
        writes:
          type: string
          enum: [run, wait_for_approval, dry_run, refused]
          description: What happens to a write made in the mission right now.
        pending_actions: { type: integer }
        calls: { type: integer }
        last_call_at: { type: [string, "null"], format: date-time }
        brief_version: { type: [integer, "null"], description: Project brief version at approval. }
        approved_by: { type: [string, "null"], format: uuid }
        approved_by_name: { type: [string, "null"] }
        approved_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        report: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: [string, "null"] }
        started_by_agent: { type: boolean }
        runner:
          type: string
          enum: [builtin, external]
          description: "external: your own agent sends the Outflare-Mission header. builtin: Outflare's agent runs it in turns."
        turns: { $ref: "#/components/schemas/MissionTurns" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MissionTurns:
      type: object
      description: The built-in agent's turns. All empty for an external runner.
      required: [count, last_at, next_at, summary, error]
      properties:
        count: { type: integer }
        last_at: { type: [string, "null"], format: date-time }
        next_at: { type: [string, "null"], format: date-time, description: When the next turn runs; null when none is scheduled. }
        summary: { type: string, description: What the agent said it did in its last turn. }
        error: { type: string, description: Why the last turn failed; empty when it went fine. Three failures in a row pause the mission. }
    MissionBrief:
      type: object
      required: [project_id, name, offer, audience, market, brief, icp, version, updated_at, changed_since_approval]
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string }
        offer: { type: string }
        audience: { type: string }
        market: { type: string }
        brief: { type: string }
        icp: { type: object, additionalProperties: true }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        changed_since_approval: { type: boolean }
    MissionCall:
      type: object
      required: [id, actor_id, actor_name, method, path, query, outcome, status_code, duration_ms, reason, action_id, request_id, created_at]
      properties:
        id: { type: integer }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        method: { type: string }
        path: { type: string }
        query: { type: string }
        outcome: { type: string, enum: [executed, simulated, queued, refused] }
        status_code: { type: integer }
        duration_ms: { type: integer }
        reason: { type: string }
        action_id: { type: [string, "null"], format: uuid }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    MissionAction:
      type: object
      required: [id, mission_id, mission_name, actor_id, actor_name, method, path, query, reason, summary, status, decided_by, decided_by_name, decided_at, decision_note, result_status, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        mission_name: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        method: { type: string }
        path: { type: string }
        query: { type: string }
        body: { description: The request body, as JSON when it was JSON. }
        reason: { type: string }
        summary: { type: string, example: Create sequence }
        status: { type: string, enum: [simulated, pending, executed, failed, rejected, canceled] }
        decided_by: { type: [string, "null"], format: uuid }
        decided_by_name: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: string }
        result_status: { type: [integer, "null"] }
        result: { description: The response when it ran. }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Queued:
      type: object
      description: The work was queued and runs in the background.
      required: [queued]
      properties:
        queued: { type: boolean, enum: [true] }
    MissionHeld:
      type: object
      description: "Answer (202) to a write made in a mission that did not run: a dry run, or held for approval."
      required: [mission_action, dry_run, approval_required, message]
      properties:
        mission_action: { $ref: "#/components/schemas/MissionAction" }
        dry_run: { type: boolean }
        approval_required: { type: boolean }
        message: { type: string }
    MissionUpdate:
      type: object
      required: [id, author, actor_id, actor_name, kind, body, data, resolved_at, created_at]
      properties:
        id: { type: integer }
        author: { type: string, enum: [agent, person, system] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        kind: { type: string, enum: [note, progress, question, instruction, report, connect_request] }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ConnectorCategory:
      type: string
      enum: [email_verification, sequencer, mailbox_provider, dns, crm, data, signals, analytics, seo, calendar, registrar, warehouse, notification, model, custom]
    ConnectorField:
      type: object
      required: [name, label, secret, optional]
      properties:
        name: { type: string }
        label: { type: string }
        secret: { type: boolean }
        optional: { type: boolean }
        placeholder: { type: string }
        help: { type: string }
    Connector:
      type: object
      required: [id, name, category, summary, description, website, docs_url, auth, fields, capabilities, status, configured, connected]
      properties:
        id: { type: string, example: zerobounce }
        name: { type: string }
        category: { $ref: "#/components/schemas/ConnectorCategory" }
        summary: { type: string }
        description: { type: string }
        website: { type: string }
        docs_url: { type: string }
        key_url: { type: string, description: Where to find the API key. }
        auth: { type: string, enum: [api_key, oauth2, none] }
        fields: { type: array, items: { $ref: "#/components/schemas/ConnectorField" } }
        oauth:
          type: object
          properties:
            scopes: { type: array, items: { type: string } }
            client_metadata: { type: boolean, description: "The provider reads Outflare's sign-in details from a document this server hosts, so it only needs PUBLIC_URL on a public https address, no app to register." }
        capabilities: { type: array, items: { type: string }, example: [verify] }
        status: { type: string, enum: [available, planned], description: "planned: listed but not connectable yet." }
        pricing: { type: string }
        also_connects:
          type: array
          items: { type: string }
          description: Other connectors the same sign-in connects too, when the person grants them (one Google sign-in connects Google Analytics and Search Console).
        configured: { type: boolean, description: Can be connected on this server now. }
        connected: { type: integer, description: Accounts the workspace connected (0 in the public catalog). }
    ConnectorAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        credits: { type: number, description: Credits or quota left, when the service reports it. }
        details: { type: object, additionalProperties: { type: string } }
    ReportMetrics:
      type: object
      required: [sent, contacted, new_leads, follow_ups, failed, blocked, bounced, replies, replied_leads, auto_replies, opt_outs, unsubscribes, warmup_inbox, warmup_spam, warmup_missing, reply_rate, bounce_rate, opt_out_rate, inbox_placement, clicks, clicked_leads, click_rate]
      properties:
        sent: { type: integer }
        contacted: { type: integer, description: Distinct leads emailed. }
        new_leads: { type: integer, description: First steps sent. }
        follow_ups: { type: integer }
        failed: { type: integer }
        blocked: { type: integer, description: Stopped by the send policy before sending. }
        bounced: { type: integer }
        replies: { type: integer }
        replied_leads: { type: integer }
        auto_replies: { type: integer }
        opt_outs: { type: integer, description: Replies asking not to be contacted. }
        unsubscribes: { type: integer }
        warmup_inbox: { type: integer }
        warmup_spam: { type: integer }
        warmup_missing: { type: integer }
        reply_rate: { type: [number, "null"], description: Percent of contacted leads who replied. }
        bounce_rate: { type: [number, "null"] }
        opt_out_rate: { type: [number, "null"] }
        inbox_placement: { type: [number, "null"] }
        clicks: { type: integer, description: Tracked link clicks, leaving out likely link scanners. Zero unless click tracking is on. }
        clicked_leads: { type: integer }
        click_rate: { type: [number, "null"], description: Percent of contacted leads who clicked. }
    Report:
      type: object
      required: [from, to, group_by, totals, rows]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string }
        totals: { $ref: "#/components/schemas/ReportMetrics" }
        rows:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportMetrics" }
              - type: object
                required: [key, label]
                properties:
                  key: { type: string }
                  label: { type: string }
    HealthSignal:
      type: object
      required: [key, level, title, detail]
      properties:
        key: { type: string, example: bounce_rate, description: "sign_in, inbox_sync, send_failures, bounce_rate, placement, warmup, domain_spf, domain_dkim, domain_dmarc, blocklist, domain_paused, paused" }
        level: { type: string, enum: [ok, warning, critical, paused] }
        title: { type: string }
        detail: { type: string }
        fix: { type: string }
        value: { type: number }
    MailboxHealth:
      type: object
      required: [mailbox_id, email, domain, provider, status, level, score, signals, stats]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        provider: { type: string }
        status: { $ref: "#/components/schemas/MailboxStatus" }
        level: { type: string, enum: [ok, warning, critical, paused] }
        score: { type: integer, description: 100 is healthy. }
        signals: { type: array, items: { $ref: "#/components/schemas/HealthSignal" } }
        stats:
          type: object
          required: [sent_24h, bounced_24h, sent_7d, bounced_7d, bounce_rate_7d, failed_24h, replies_7d, warmup_landed_7d, warmup_spam_7d, warmup_missing_7d, inbox_placement_7d]
          properties:
            sent_24h: { type: integer }
            bounced_24h: { type: integer }
            sent_7d: { type: integer }
            bounced_7d: { type: integer }
            bounce_rate_7d: { type: [number, "null"], description: Percent; null under 20 sends. }
            failed_24h: { type: integer }
            replies_7d: { type: integer }
            warmup_landed_7d: { type: integer }
            warmup_spam_7d: { type: integer }
            warmup_missing_7d: { type: integer }
            inbox_placement_7d: { type: [number, "null"], description: Percent of warm-up email in the inbox; null under 10. }
    MailboxHealthSummary:
      type: object
      required: [total, ok, warning, critical, paused]
      properties:
        total: { type: integer }
        ok: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
        paused: { type: integer }
    HealthSettings:
      type: object
      required: [auto_pause, pause_bounce_rate, min_sends]
      properties:
        auto_pause: { type: boolean, description: Pause a mailbox when its 24-hour bounce rate reaches pause_bounce_rate. }
        pause_bounce_rate: { type: number, description: "Percent. Default 5." }
        min_sends: { type: integer, description: "Sends in 24 hours before the rate counts. Default 20." }
    ExternalStep:
      type: object
      required: [delay_days, subject, body]
      properties:
        delay_days: { type: integer, description: Days after the previous step. }
        subject: { type: string }
        body: { type: string }
        variants: { type: array, items: { type: string }, description: Other A/B bodies. }
    ExternalCampaign:
      type: object
      required: [id, name, status, steps, mailbox_emails, lead_count]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, description: "The other tool's word: active, paused, draft, completed." }
        timezone: { type: string }
        daily_limit: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/ExternalStep" } }
        mailbox_emails: { type: array, items: { type: string } }
        lead_count: { type: integer }
    ExternalMailbox:
      type: object
      required: [email, warmup_enabled]
      properties:
        email: { type: string }
        name: { type: string }
        provider: { type: string, description: "google, microsoft or smtp" }
        daily_limit: { type: integer }
        warmup_enabled: { type: boolean }
        status: { type: string }
    MailboxMatch:
      type: object
      required: [total, matched, missing]
      properties:
        total: { type: integer }
        matched: { type: integer, description: Already in this workspace. }
        missing: { type: array, items: { $ref: "#/components/schemas/ExternalMailbox" }, description: "Not here yet. Other tools never reveal passwords, so connect these (Google or Microsoft sign-in, or an SMTP/IMAP CSV) to send from them." }
    ImportPreview:
      type: object
      required: [campaigns, mailboxes]
      properties:
        campaigns: { type: array, items: { $ref: "#/components/schemas/ExternalCampaign" } }
        mailboxes: { $ref: "#/components/schemas/MailboxMatch" }
    ImportRun:
      type: object
      required: [id, integration_id, connector, options, status, summary, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        options:
          type: object
          properties:
            campaign_ids: { type: array, items: { type: string } }
            leads: { type: boolean }
            mailboxes: { type: boolean }
        status: { type: string, enum: [queued, running, done, failed] }
        summary:
          type: object
          required: [campaigns, leads]
          properties:
            campaigns:
              type: array
              items:
                type: object
                required: [external_id, name, status, sequence_id, created, steps, leads, enrolled, warnings]
                properties:
                  external_id: { type: string }
                  name: { type: string }
                  status: { type: string }
                  sequence_id: { type: string }
                  created: { type: boolean, description: False when an earlier import's sequence was reused. }
                  steps: { type: integer }
                  leads: { type: integer }
                  enrolled: { type: integer }
                  warnings: { type: array, items: { type: string } }
            mailboxes: { $ref: "#/components/schemas/MailboxMatch" }
            leads:
              type: object
              required: [seen, created, updated, suppressed, enrolled, skipped]
              properties:
                seen: { type: integer }
                created: { type: integer }
                updated: { type: integer }
                suppressed: { type: integer }
                enrolled: { type: integer }
                skipped: { type: integer, description: "Replied, finished, unsubscribed, bounced, or past the last step." }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ConnectRequest:
      type: object
      required: [id, connector, connector_name, name, reason, use_for_verification, status, integration_id, created_by_type, expires_at, completed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        connector: { type: string }
        connector_name: { type: string }
        name: { type: string }
        reason: { type: string }
        use_for_verification: { type: boolean }
        status: { type: string, enum: [pending, connected, cancelled, expired] }
        integration_id: { type: [string, "null"], format: uuid }
        created_by_type: { type: string, description: "human or api_token" }
        expires_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        url: { type: string, description: The one-time link. Only in the answer to POST. }
    Integration:
      type: object
      required: [id, connector, connector_name, category, capabilities, name, status, account, config, last_checked_at, last_error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        connector: { type: string }
        connector_name: { type: string }
        category: { $ref: "#/components/schemas/ConnectorCategory" }
        capabilities: { type: array, items: { type: string } }
        name: { type: string }
        status: { type: string, enum: [connected, error], description: "error: the service refused the credentials; see last_error." }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        config: { type: object, additionalProperties: true }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnalyticsReportName:
      type: string
      enum: [traffic, pages, sources, search_queries, events]
    AnalyticsSource:
      type: object
      required: [id, name, connector, connector_name, status, last_error, account, site, reports]
      properties:
        id: { type: string, format: uuid, description: The integration id. }
        name: { type: string }
        connector: { type: string, example: google_analytics }
        connector_name: { type: string }
        status: { type: string, enum: [connected, error] }
        last_error: { type: [string, "null"] }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        site: { type: string, description: "The default site; empty until one is picked, unless the account has only one." }
        reports: { type: array, items: { $ref: "#/components/schemas/AnalyticsReportName" } }
    AnalyticsSite:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: "123456789" }
        name: { type: string, example: "acme.com (Acme)" }
        url: { type: string }
    AnalyticsMetrics:
      type: object
      description: Every field is optional. A missing field means the provider does not measure it; zero means it measured none.
      properties:
        visitors: { type: number, description: Unique visitors or users. }
        pageviews: { type: number }
        sessions: { type: number, description: Visits. }
        bounce_rate: { type: number, description: A fraction from 0 to 1. }
        avg_duration: { type: number, description: Average visit length in seconds. }
        clicks: { type: number, description: Clicks from search results. }
        impressions: { type: number, description: Times shown in search results. }
        ctr: { type: number, description: "Click-through rate, 0 to 1." }
        position: { type: number, description: Average position in search results; 1 is the top. }
        events: { type: number }
        conversions: { type: number, description: "Events that count as conversions: GA4 key events, Plausible goals, Matomo goals, Fathom events." }
    AnalyticsRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "A page path, a source, a search query or an event name. (none) means not set." }
    AnalyticsPoint:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
    AnalyticsReport:
      type: object
      required: [report, site, from, to, totals, notes, integration_id, connector, cached, fetched_at]
      properties:
        report: { $ref: "#/components/schemas/AnalyticsReportName" }
        site: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date, description: "Clarity only covers the last three days, so its range may differ from the one asked for." }
        totals: { $ref: "#/components/schemas/AnalyticsMetrics" }
        series: { type: array, items: { $ref: "#/components/schemas/AnalyticsPoint" }, description: The traffic report's days. }
        rows: { type: array, items: { $ref: "#/components/schemas/AnalyticsRow" }, description: A breakdown report's rows, biggest first. }
        notes: { type: array, items: { type: string } }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        cached: { type: boolean }
        fetched_at: { type: string, format: date-time }
    AnalyticsHistoryRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          properties:
            day: { type: string, format: date }
            key: { type: string }
            integration_id: { type: string, format: uuid }
            connector: { type: string }
            host: { type: string }
    AnalyticsSync:
      type: object
      required: [integration_id, name, connector, site, host, first_day, last_day, last_run_at, last_ok_at, last_error, paused]
      properties:
        integration_id: { type: string, format: uuid }
        name: { type: string }
        connector: { type: string }
        site: { type: string }
        host: { type: string, description: "The website's domain; empty when the tool shows none. Set it with PUT .../analytics/{id}/site." }
        first_day: { type: [string, "null"], format: date }
        last_day: { type: [string, "null"], format: date }
        last_run_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        paused: { type: boolean }
    AnalyticsChange:
      type: object
      description: One metric now and in the period before. before, change and change_pct are missing when nothing was stored before; change_pct also when before was 0.
      required: [metric, now]
      properties:
        metric: { type: string }
        now: { type: number }
        before: { type: number }
        change: { type: number }
        change_pct: { type: number }
    AnalyticsWindow:
      type: object
      required: [from, to, days_stored]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days_stored: { type: integer }
    AnalyticsGap:
      type: object
      description: Something missing for a full picture, and how to fix it. connectors are ids for a connect request.
      required: [what, why, action]
      properties:
        what: { type: string }
        why: { type: string }
        connectors: { type: array, items: { type: string } }
        integration_id: { type: string, format: uuid }
        action: { type: string }
    AnalyticsMover:
      type: object
      required: [key, now, before, change]
      properties:
        key: { type: string }
        now: { type: number }
        before: { type: number }
        change: { type: number }
    AnalyticsWebsiteChanges:
      type: object
      required: [host, headline, tools]
      properties:
        host: { type: string, description: "The domain; empty for tools whose site shows none." }
        headline: { type: array, items: { type: string }, description: Plain sentences, each naming its tool and dates. }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, now, before, metrics]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              now: { $ref: "#/components/schemas/AnalyticsWindow" }
              before: { $ref: "#/components/schemas/AnalyticsWindow" }
              metrics: { type: array, items: { $ref: "#/components/schemas/AnalyticsChange" } }
        search: { type: array, description: Clicks and impressions added up across search consoles, when there are several., items: { $ref: "#/components/schemas/AnalyticsChange" } }
        movers:
          type: array
          items:
            type: object
            required: [report, tools, metric, up, down]
            properties:
              report: { type: string }
              tools: { type: array, items: { type: string } }
              metric: { type: string }
              up: { type: array, items: { $ref: "#/components/schemas/AnalyticsMover" } }
              down: { type: array, items: { $ref: "#/components/schemas/AnalyticsMover" } }
        unusual_days:
          type: array
          items:
            type: object
            required: [day, connector, name, metric, value, typical, what]
            properties:
              day: { type: string, format: date }
              connector: { type: string }
              name: { type: string }
              metric: { type: string }
              value: { type: number }
              typical: { type: number, description: Median of the 28 days before the period. }
              what: { type: string }
        seo:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, day, metrics]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              day: { type: string, format: date }
              previous_day: { type: string, format: date }
              metrics: { type: array, items: { $ref: "#/components/schemas/AnalyticsChange" } }
              keywords_up: { type: array, items: { $ref: "#/components/schemas/SEOKeywordMove" } }
              keywords_down: { type: array, items: { $ref: "#/components/schemas/SEOKeywordMove" } }
              keywords_new: { type: integer }
              keywords_lost: { type: integer }
        gaps: { type: array, items: { $ref: "#/components/schemas/AnalyticsGap" } }
    SEOKeywordMove:
      type: object
      required: [keyword, position, previous]
      properties:
        keyword: { type: string }
        position: { type: number }
        previous: { type: number }
        volume: { type: number }
    AnalyticsCatalogSite:
      type: object
      required: [host, tools, seo, gaps]
      properties:
        host: { type: string }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, status, measures]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              site: { type: string }
              status: { type: string }
              measures: { type: object, description: "Per report, the metrics stored in the last 35 days.", additionalProperties: { type: array, items: { type: string } } }
              first_day: { type: string, format: date }
              last_day: { type: string, format: date }
              last_synced_at: { type: string, format: date-time }
              error: { type: string }
        seo:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, reports, snapshots, budget_left, budget_unit]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              reports: { type: array, items: { type: string } }
              snapshots: { type: integer }
              first_snapshot: { type: string, format: date }
              last_snapshot: { type: string, format: date }
              budget_left: { type: number }
              budget_unit: { type: string }
        gaps: { type: array, items: { $ref: "#/components/schemas/AnalyticsGap" } }
    AnalyticsOverviewSite:
      type: object
      required: [host, tools, search, seo]
      properties:
        host: { type: string, description: "The domain; empty groups tools whose site has no domain yet." }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, site, totals, first_day, last_day, last_synced_at]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              site: { type: string }
              totals: { $ref: "#/components/schemas/AnalyticsMetrics" }
              first_day: { type: [string, "null"], format: date }
              last_day: { type: [string, "null"], format: date }
              last_synced_at: { type: [string, "null"], format: date-time }
        search: { $ref: "#/components/schemas/AnalyticsMetrics" }
        seo: { type: array, items: { $ref: "#/components/schemas/SEOLatest" }, description: "Each SEO connection's latest snapshot of the domain." }
    SEOReportName:
      type: string
      enum: [overview, keywords, backlinks, competitors, audit]
    SEOMetrics:
      type: object
      description: Every field is optional; a missing field is not measured by the provider.
      properties:
        domain_rating: { type: number, description: "Link strength, 0 to 100: Ahrefs DR, or DataForSEO rank on a 0 to 100 scale (not the same measure)." }
        backlinks: { type: number }
        referring_domains: { type: number }
        organic_keywords: { type: number, description: Keywords ranking in the top 100. }
        top3: { type: number, description: Keywords ranking in the top 3. }
        organic_traffic: { type: number, description: The provider's estimate of monthly visits from search. }
        traffic_value: { type: number, description: What that traffic would cost in ads, in US dollars. }
        position: { type: number, description: "A keyword's position; 1 is the top. For a competitor, its average position." }
        volume: { type: number, description: Monthly searches. }
        traffic: { type: number, description: Estimated monthly visits from this keyword. }
        common_keywords: { type: number, description: Keywords a competitor shares with the domain. }
        health_score: { type: number, description: "Site audit health, 0 to 100." }
        pages: { type: number, description: "Pages crawled, or pages an audit issue affects." }
    SEORow:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "A keyword, linking domain, competitor domain or audit issue." }
            url: { type: string, description: A keyword's ranking page. }
            kind: { type: string, enum: [error, warning, notice], description: An audit issue's importance. }
    SEOCost:
      type: object
      properties:
        usd: { type: number, description: "Dollars, as DataForSEO reported them." }
        units: { type: number, description: Ahrefs API units. }
        estimated: { type: boolean, description: "Worked out from the provider's price list, because it does not report it." }
    SEOBudget:
      type: object
      required: [unit, limit, spent, default]
      properties:
        unit: { type: string, enum: [USD, API unit] }
        limit: { type: number }
        spent: { type: number, description: Spent this calendar month (UTC). }
        default: { type: boolean }
    SEOAnswer:
      type: object
      required: [report, target, country, totals, notes, cost, integration_id, connector, cached, fetched_at, budget]
      properties:
        report: { $ref: "#/components/schemas/SEOReportName" }
        target: { type: string }
        country: { type: string }
        totals: { $ref: "#/components/schemas/SEOMetrics" }
        rows: { type: array, items: { $ref: "#/components/schemas/SEORow" } }
        notes: { type: array, items: { type: string } }
        cost: { $ref: "#/components/schemas/SEOCost" }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        cached: { type: boolean, description: A kept answer under a day old; it cost nothing. }
        fetched_at: { type: string, format: date-time }
        budget: { $ref: "#/components/schemas/SEOBudget" }
    SEOSource:
      type: object
      required: [id, name, connector, connector_name, status, last_error, account, reports, country, sync, domains_set, domains, budget]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        connector: { type: string }
        connector_name: { type: string }
        status: { type: string }
        last_error: { type: [string, "null"] }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        reports: { type: array, items: { $ref: "#/components/schemas/SEOReportName" } }
        country: { type: string }
        sync: { type: string, enum: [weekly, "off"] }
        domains_set: { type: boolean, description: "false: the domains follow the analytics tools." }
        domains:
          type: array
          items:
            type: object
            required: [host, last_run_at, last_ok_at, last_error, last_cost]
            properties:
              host: { type: string }
              last_run_at: { type: [string, "null"], format: date-time }
              last_ok_at: { type: [string, "null"], format: date-time }
              last_error: { type: [string, "null"] }
              last_cost: { type: [number, "null"] }
        budget: { $ref: "#/components/schemas/SEOBudget" }
    SEOHistoryRow:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [day, integration_id, connector, host, country]
          properties:
            day: { type: string, format: date }
            integration_id: { type: string, format: uuid }
            connector: { type: string }
            host: { type: string }
            country: { type: string }
            key: { type: string }
            url: { type: string }
            kind: { type: string }
            previous: { $ref: "#/components/schemas/SEOMetrics" }
    SEOLatest:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [integration_id, name, connector, day]
          properties:
            integration_id: { type: string, format: uuid }
            name: { type: string }
            connector: { type: string }
            day: { type: string, format: date }
    AnalyticsSummaryItem:
      allOf:
        - $ref: "#/components/schemas/AnalyticsSource"
        - type: object
          required: [report, totals, notes, error]
          properties:
            report: { type: string }
            totals:
              oneOf:
                - $ref: "#/components/schemas/AnalyticsMetrics"
                - type: "null"
            from: { type: string, format: date }
            to: { type: string, format: date }
            notes: { type: array, items: { type: string } }
            error: { type: [string, "null"] }
    VerificationStatus:
      type: string
      enum: [deliverable, undeliverable, risky, unknown]
    VerificationSettings:
      type: object
      required: [integration_id, provider, verify_on_import, verify_before_send, block_risky, block_catch_all, block_unknown, max_age_days]
      properties:
        integration_id: { type: [string, "null"], description: Null uses the free built-in checks. }
        provider: { type: string, description: "The connector id, or builtin." }
        verify_on_import: { type: boolean }
        verify_before_send: { type: boolean, description: "Hold a lead's first email until its address has a fresh result." }
        block_risky: { type: boolean }
        block_catch_all: { type: boolean }
        block_unknown: { type: boolean }
        max_age_days: { type: integer, description: Results older than this are checked again before a first email. }
    Verification:
      type: object
      required: [email, status, reason, catch_all, disposable, role, free, provider, provider_status, integration_id, checked_at]
      properties:
        email: { type: string }
        status: { $ref: "#/components/schemas/VerificationStatus" }
        reason: { type: string }
        catch_all: { type: boolean }
        disposable: { type: boolean }
        role: { type: boolean }
        free: { type: boolean }
        suggestion: { type: string, description: "A likely correction, e.g. for a misspelt domain." }
        score: { type: integer, minimum: 0, maximum: 100 }
        provider: { type: string, description: "Connector id that answered, or builtin." }
        provider_status: { type: string, description: The provider's own status words. }
        integration_id: { type: [string, "null"] }
        checked_at: { type: string, format: date-time }
    VerificationSummary:
      type: object
      required: [leads, verified, stale, unverified, deliverable, undeliverable, risky, catch_all, unknown, pending, settings]
      properties:
        leads: { type: integer }
        verified: { type: integer, description: Leads with a fresh result. }
        stale: { type: integer, description: Leads whose result is older than max_age_days. }
        unverified: { type: integer }
        deliverable: { type: integer }
        undeliverable: { type: integer }
        risky: { type: integer }
        catch_all: { type: integer }
        unknown: { type: integer }
        pending: { type: integer, description: Addresses waiting to be verified. }
        settings: { $ref: "#/components/schemas/VerificationSettings" }
    MeetingStatus:
      type: string
      enum: [booked, held, no_show, canceled]
    Attribution:
      type: string
      enum: [lead, company, manual, none]
      description: "How it was tied to outreach. lead: an attendee is a lead. company: an attendee shares a lead's company domain and that lead was emailed. manual: someone said so. none: not tied (not counted in reports)."
    Meeting:
      type: object
