      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a lead list, optionally built from a data provider search
      description: >-
        Scope: leads.manage. A list with search_integration_id and filters is a
        search list that can be built and refreshed from that provider. Set
        build to true to queue the first build in the same call. A project
        token's lists always belong to its project.
      tags: [lists]
