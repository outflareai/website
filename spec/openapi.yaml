          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTopic" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-topics/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: The topic's id or key., schema: { type: string } }
    get:
      operationId: getEmailTopic
      x-outflare-access: { scope: emails.read }
      summary: Get an email topic
      description: "Scope: emails.read."
      tags: [emails]
      responses:
        "200":
          description: The topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTopic" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEmailTopic
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Rename, describe, archive or restore an email topic
      description: "Scope: emails.manage. The key can't change. Archiving stops new sends naming it; templates keep it until you change them."
      tags: [emails]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTopicInput" }
      responses:
        "200":
          description: The topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTopic" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/emails:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listEmails
      x-outflare-access: { scope: emails.read }
      summary: List lifecycle and transactional emails, newest first
      description: "Scope: emails.read. Page with cursor."
      tags: [emails]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: An email id; emails older than it., schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - { name: purpose, in: query, schema: { type: string, enum: [transactional, lifecycle] } }
        - { name: template, in: query, description: A template id or handle., schema: { type: string } }
        - { name: provider_id, in: query, schema: { type: string, format: uuid } }
        - { name: to, in: query, description: "Emails to this address (to, cc or bcc).", schema: { type: string } }
        - { name: test, in: query, schema: { type: boolean } }
        - { name: trigger, in: query, schema: { type: string, enum: [api, test, event, journey, broadcast, system] } }
        - { name: request_id, in: query, description: Emails queued by this API call., schema: { type: string } }
        - { name: topic, in: query, description: "Emails in this topic, by key or id.", schema: { type: string } }
      responses:
        "200":
          description: A page of emails.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Email" } }
                  next_before: { type: [string, "null"], format: uuid }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: sendEmail
      x-outflare-access: { scope: emails.send }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Send a transactional or lifecycle email
      description: |
        Scope: emails.send. Queues one email through the workspace's email
        provider (`provider_id`, or the default) and answers at once; it
        goes out within seconds on its own queue. Name a `template` (id or
        handle) with `data` for its variables, or send `subject` with
        `html` and/or `text` (which may use variables too). `from` must be
        on a verified sending domain; a template's sender is the default.
        Every recipient is checked against the suppression list when it is
        sent; transactional email still reaches people who unsubscribed
        from marketing, lifecycle email does not, and always carries a
        one-click unsubscribe link. Opens and clicks are tracked only when
        the template or `track` turns them on. The email's `trigger` records
        this call (its request_id is on the Logs page). Send an
        Idempotency-Key so a retry never sends twice. Cold outreach does not
        belong here: use sequences.
      tags: [emails]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendEmailInput" }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Email" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/emails/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getEmail
      x-outflare-access: { scope: emails.read }
      summary: Get an email with its content and delivery timeline
      description: "Scope: emails.read. `events` is the timeline: queued, sent, delivered, bounced, opened and so on."
      tags: [emails]
      responses:
        "200":
          description: The email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Email" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-recipients/{address}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: address, in: path, required: true, schema: { type: string }, example: ana@example.com }
    get:
      operationId: getEmailRecipient
      x-outflare-access: { scope: emails.read }
      summary: Everything one address was sent, as a timeline
      description: |
        Scope: emails.read. Counts (test sends left out), whether the
        address is suppressed, the lead it belongs to, and every event of
        every email it was sent (to, cc or bcc), newest first. Page with
        `before` (the `next_before` of the last page).
      tags: [emails]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The address's timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailRecipient" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/emails/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelEmail
      x-outflare-access: { scope: emails.send }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Cancel a queued or scheduled email
      description: "Scope: emails.send. 409 email_not_cancellable once it has been handed to the provider."
      tags: [emails]
      responses:
        "200":
          description: The cancelled email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Email" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/email-events/{provider}/{token}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: receiveEmailEvents
      security: []
      summary: Delivery events from an email provider
      description: |
        Where Amazon SES (through SNS), Postmark and Resend send deliveries,
        bounces and complaints. Outflare registers it with the provider on
        its own; the token is the secret. SNS and Resend signatures are
        checked too.
      tags: [emails]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema: { type: object, required: [received], properties: { received: { type: integer, description: New events applied. } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
