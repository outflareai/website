  /v1/workspaces/{ws}/analytics/{id}/reports/{report}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: report, in: path, required: true, schema: { $ref: "#/components/schemas/AnalyticsReportName" } }
    get:
      operationId: getAnalyticsReport
      x-outflare-access: { scope: analytics.read }
      summary: Read one analytics report
      description: |
        Scope: analytics.read. The same report from any provider:
        `traffic` (totals plus one point per day), `pages`, `sources`
        (referrers), `search_queries` (Search Console and Bing) and
        `events` (events and conversions). A metric a provider does not
        measure is left out, never reported as zero. Read `notes` for
        caveats such as data delay. Answers are kept for 15 minutes (an
        hour for Mixpanel and Amplitude, six hours for Clarity) to spare
        the provider's rate limits; `fresh=true` reads again.
      tags: [analytics]
      parameters:
        - { name: site, in: query, schema: { type: string }, description: "A site id from .../sites. Default: the connection's default site, or its only one." }
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 20 }, description: Rows in a breakdown report. }
        - { $ref: "#/components/parameters/AnalyticsFresh" }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsReport" }
