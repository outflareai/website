        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo/history:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getSEOHistory
      x-outflare-access: { scope: analytics.read }
      summary: Read stored SEO snapshots
      description: |
        Scope: analytics.read. Reads what the weekly snapshots stored, without
        calling or paying the provider. `overview` gives one row per
        connection, domain and snapshot day. `keywords` (and the other
        lists) gives each connection's latest snapshot, with `previous`
        holding the same keyword's numbers from the snapshot before, unless
        `from` or `to` name a range.
      tags: [seo]
      parameters:
        - { name: report, in: query, schema: { $ref: "#/components/schemas/SEOReportName" } }
        - { name: host, in: query, schema: { type: string }, example: example.com }
        - { name: integration, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 200 } }
      responses:
        "200":
          description: Stored rows, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [report, data]
                properties:
                  report: { $ref: "#/components/schemas/SEOReportName" }
                  data: { type: array, items: { $ref: "#/components/schemas/SEOHistoryRow" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo/overview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getSEOOverview
      x-outflare-access: { scope: analytics.read, brand_limited: true }
      summary: Is each brand growing in search
      description: |
        Scope: analytics.read. One answer per brand, from what is already stored (analytics syncs, SEO snapshots,
        site audits and the fixes list), so it calls and costs nothing. Each brand gets whole weeks (Monday to Sunday)
        of branded search, search clicks and visitors, its SEO snapshots (domain rating, backlinks, referring domains),
        and trends that compare the last 4 weeks with the 4 before. Branded search counts the search console queries
        that contain one of the brand's `terms` (its name, handle and domain names); consoles hide rare queries, so it
        is a floor. Websites no brand claims are a shared entry with `brand: null`. Site audits and open fixes need
        seo.read as well.
      tags: [seo]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: weeks, in: query, schema: { type: integer, minimum: 8, maximum: 52, default: 12 } }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, data, notes]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  data: { type: array, items: { $ref: "#/components/schemas/SEOOverviewBrand" } }
                  notes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo/{id}/settings:
