    get:
      operationId: listEmailProviderDomains
      x-outflare-access: { scope: emails.read }
      summary: List sending domains for lifecycle email
      description: "Scope: emails.read. Not the cold-email sending domains under /domains: these are registered with an email provider."
      tags: [emails]
      parameters:
        - { name: provider_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Domains, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmailDomain" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addEmailProviderDomain
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a sending domain to an email provider
      description: |
        Scope: emails.manage. Registers the domain with the provider in the
        background (`provider_id`, or the default provider), then lists the
