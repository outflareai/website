  /v1/workspaces/{ws}/spend-rates:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listSpendRates
      x-outflare-access: { scope: outcomes.read }
      summary: List unit prices
      description: "Scope: outcomes.read. Every rate, plus a zero-priced row for each provider and unit used in the ledger without one, so it is clear what still needs a price."
      tags: [outcomes]
      responses:
        "200":
          description: Rates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SpendRate" } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSpendRate
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Set what a unit costs
      description: "Scope: outcomes.manage. Providers match without case. unit_price_micros is millionths of the currency unit: a $0.004 credit is 4000."
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, unit_name, unit_price_micros]
              properties:
                provider: { type: string, example: zerobounce }
                unit_name: { type: string, example: credit }
                unit_price_micros: { type: integer, minimum: 0, example: 4000 }
                currency: { type: string, description: Default USD. }
      responses:
        "200":
          description: The rate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendRate" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSpendRate
      x-outflare-access: { scope: outcomes.manage }
      summary: Remove a unit price
      description: "Scope: outcomes.manage."
      tags: [outcomes]
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: unit_name, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMissions
      x-outflare-access: { scope: missions.read }
      summary: List missions
      description: "Scope: missions.read. Waiting for approval first, then running, paused, drafts and ended."
      tags: [missions]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: status, in: query, description: "Comma-separated statuses.", schema: { type: string, example: "running,paused" } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Missions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Mission" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMission
      x-outflare-access: { scope: missions.run }
      summary: Create a mission
      description: |
        Scope: missions.run. Starts as a draft: writes made in it are dry
        runs until a person approves it. A mission created with an API token
        is run by that token; a person can assign any token with token_id.
        A token bound to a project creates missions only in that project.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MissionInput" }
                - { required: [name] }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/plan:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: planMission
      x-outflare-access: { scope: missions.run }
      summary: Plan a mission from a goal
      description: |
        Scope: missions.run. Type a goal in plain words ("book 10 meetings
        with fintech CFOs in Australia by 30 November") and the workspace's
        AI model drafts the mission: a measurable goal, steps, instructions for the agent,
        limits sized to your mailboxes, and the connectors it needs. The
        draft is saved as a mission in status draft, with a connect request
        for each missing connector and any questions for you. Nothing runs
        until a person approves it.

        Uses the model chosen in `GET /ai-settings`: Claude, OpenAI, Gemini or
        Mistral, connected under Connectors with your own API key. Without
        one the call fails with 409 `connector_needed`; with a provider but
        no model or price chosen, 409 `ai_model_needed`; past the
        workspace's monthly AI limit, 409 `ai_budget_reached`. The model is
        sent the goal, the project brief and a summary of the workspace,
        never lead lists, email addresses or keys.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionPlanInput" }
      responses:
        "201":
          description: The draft mission and what the planner proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionPlanResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMission
      x-outflare-access: { scope: missions.read }
      summary: Check in on a mission
      description: |
        Scope: missions.read. What an agent reads before it acts: the
        mission, the project brief (and whether it changed since approval),
        what Outflare knows about the company (context and pinned memories),
        limits, progress, open connect requests and the latest notes.
      tags: [missions]
      responses:
        "200":
          description: The mission and its context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission: { $ref: "#/components/schemas/Mission" }
                  brief: { oneOf: [{ $ref: "#/components/schemas/MissionBrief" }, { type: "null" }] }
                  company:
                    type: object
                    properties:
                      context: { $ref: "#/components/schemas/CompanyContext" }
                      memories: { type: array, items: { $ref: "#/components/schemas/Memory" }, description: Pinned memories. }
                      markdown: { type: string }
                  updates: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
                  open_connect_requests: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
                  how_to_act:
                    type: object
                    properties:
                      header: { type: string }
                      reason_header: { type: string }
                      writes: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMission
      x-outflare-access: { scope: missions.run }
      summary: Change a mission
      description: |
        Scope: missions.run. Once a mission is approved, changing its mode,
        limits, token or project also needs missions.approve, and an agent
        cannot change its own. An ended mission cannot change.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/submit:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitMission
      x-outflare-access: { scope: missions.run }
      summary: Submit the plan for approval
      description: "Scope: missions.run. From draft. Writes stay dry runs until approved."
      tags: [missions]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { plan: { type: string, description: Markdown. } } }
      responses:
        "200": { description: Submitted., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/approve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveMission
      x-outflare-access: { scope: missions.approve }
      summary: Approve and start a mission
      description: |
        Scope: missions.approve. A person, or an approver token that is not
        the mission's own. Records the project brief version it was
        approved against.

        `runner: builtin` hands the mission to Outflare's own agent, which
        runs it in turns with the workspace's AI model (`GET /ai-settings`).
        It gets a token of
        its own (operator scopes, never more than yours, never
        missions.approve) and goes through the same gate as any agent, so
        the mode still decides whether its writes run, wait for you or are
        dry runs. A turn runs at once, whenever a person writes to the
        mission or decides on a held change, and when the agent asks to look
        again. Answers 409 `connector_needed` until an AI model is connected,
        or `ai_model_needed` until its model and price are chosen.

        Outflare's agent treats everything it reads from outside (email
        replies, lead fields, web pages) as data. Even in `autonomous` mode,
        its replies to emails, test sends, and changes to mailboxes, sending
        servers, senders, sign-ins, webhooks, suppressions, integrations,
        tokens and the company context wait for a person.
      tags: [missions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { $ref: "#/components/schemas/MissionMode" }
                note: { type: string }
                runner:
                  type: string
                  enum: [builtin, external]
                  description: Who carries the mission out. Left out, it stays as it is (external for a new mission).
      responses:
        "200": { description: Running., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/pause:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: pauseMission
      x-outflare-access: { scope: missions.run }
      summary: Pause a mission
      description: "Scope: missions.run, so an agent can pause itself. Writes are refused and its campaigns stop sending until it resumes."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: Paused., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/resume:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resumeMission
      x-outflare-access: { scope: missions.approve }
      summary: Resume a paused mission
      description: "Scope: missions.approve, and not the mission's own agent."
      tags: [missions]
      responses:
        "200": { description: Running., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/stop:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopMission
      x-outflare-access: { scope: missions.run }
      summary: Stop a mission now
      description: "Scope: missions.run. Ends it: held writes are canceled, its campaigns are paused, and further calls in it are refused."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: Stopped., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeMission
      x-outflare-access: { scope: missions.run }
      summary: Finish a mission with a report
      description: "Scope: missions.run. The agent's final report, in Markdown. Its campaigns are paused."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { report: { type: string } } } } }
      responses:
        "200": { description: Completed., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/calls:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionCalls
      x-outflare-access: { scope: missions.read }
      summary: Every call made in the mission, newest first
      description: "Scope: missions.read. What a write changed is in the audit log under the same request_id."
      tags: [missions]
      parameters:
        - { name: writes, in: query, schema: { type: boolean }, description: Only writes. }
        - { name: before, in: query, schema: { type: integer }, description: "A call id, for the next page." }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionCall" } }
                  next_before: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionActions
      x-outflare-access: { scope: missions.read }
      summary: Writes the mission held or dry-ran
      description: "Scope: missions.read."
      tags: [missions]
      parameters:
        - { name: status, in: query, description: "Comma-separated.", schema: { type: string, example: pending } }
      responses:
        "200":
          description: Actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionAction" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMissionAction
      x-outflare-access: { scope: missions.read }
      summary: One held write, with its decision and result
      description: "Scope: missions.read. Agents poll this after a 202."
      tags: [missions]
      responses:
        "200": { description: The action., content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}/approve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveMissionAction
      x-outflare-access: { scope: missions.approve }
      summary: Approve and run a held write
      description: |
        Scope: missions.approve. Runs the stored request as the agent that
        made it, through every normal check, and keeps the response as the
        result. Works on pending writes, and on dry runs once the mission
        is running. Never by the agent that made it.
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: "The action, executed or failed.", content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}/reject:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectMissionAction
      x-outflare-access: { scope: missions.approve }
      summary: Reject a held write
      description: "Scope: missions.approve. A note is passed to the agent as an instruction."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: Rejected., content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/updates:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionUpdates
      x-outflare-access: { scope: missions.read }
      summary: Notes between the agent and people
      description: "Scope: missions.read."
      tags: [missions]
      parameters:
        - { name: open_requests, in: query, schema: { type: boolean }, description: Only connect requests not yet resolved. }
        - { name: before, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Updates.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
                  next_before: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: postMissionUpdate
      x-outflare-access: { scope: missions.run }
      summary: Post a note, question, instruction or connect request
      description: |
        Scope: missions.run. kind connect_request asks a person to connect
        a tool the agent needs (they paste the key or sign in with OAuth);
        give connector as the connector id. The request closes by itself,
        with a note in the mission, once the workspace has a working
        connection to that connector; Outflare's agent then takes a turn
        straight away. A connector that is already connected answers 409
        `already_connected`: use the connection instead.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                kind: { type: string, enum: [note, progress, question, instruction, connect_request], default: note }
                body: { type: string }
                connector: { type: string, example: zerobounce }
      responses:
        "201": { description: Posted., content: { application/json: { schema: { $ref: "#/components/schemas/MissionUpdate" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/updates/{update}/resolve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: update, in: path, required: true, schema: { type: integer } }
    post:
      operationId: resolveMissionConnectRequest
      x-outflare-access: { scope: missions.run }
      summary: Close a connect request
      description: "Scope: missions.run. The tool was connected, or a person decided not to."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "204": { description: Resolved. }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mission-actions:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listPendingMissionActions
      x-outflare-access: { scope: missions.read }
      summary: Writes waiting for a person, across missions
      description: "Scope: missions.read. The approval inbox."
      tags: [missions]
      responses:
        "200":
          description: Pending actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionAction" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/connect-requests:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listConnectRequests
      x-outflare-access: { scope: integrations.read }
      summary: List connect requests
      description: "Scope: integrations.read. The 100 newest, with status pending, connected, cancelled or expired."
      tags: [connectors]
      responses:
        "200":
          description: Connect requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ConnectRequest" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnectRequest
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Ask a person to connect a service
      description: |
        Scope: integrations.manage. The agent-first way to connect anything:
        returns a one-time link to give the person. They open it, without
        logging in, and paste the key or approve the OAuth sign-in. The
        secret never passes through the agent. Poll
        GET /connect-requests/{id} until status is connected.
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector]
              properties:
                connector: { type: string, example: zerobounce }
                name: { type: string, description: Name for the integration it creates. }
                reason: { type: string, maxLength: 500, description: Why it is needed; shown to the person on the link's page. }
                use_for_verification: { type: boolean, description: "Make it the workspace's verification service. Default true for verification connectors." }
                expires_in_minutes: { type: integer, minimum: 10, maximum: 10080, description: Default 1440 (24 hours). }
      responses:
        "201":
          description: Created. `url` is only returned here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/connect-requests/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConnectRequest
      x-outflare-access: { scope: integrations.read }
      summary: Read a connect request
      description: "Scope: integrations.read. Once status is connected, integration_id is the new integration."
      tags: [connectors]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectRequest" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelConnectRequest
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Cancel a pending connect request
      description: "Scope: integrations.manage. The link stops working."
      tags: [connectors]
      responses:
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/lookup:
    post:
      operationId: connectLookup
      summary: What a connect link is for
      description: Used by the link's page. No login; the token from the link is the authority.
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: The connector and who asked.
          content:
            application/json:
              schema:
                type: object
                required: [workspace_name, connector, name, reason, requested_by, expires_at]
                properties:
                  workspace_name: { type: string }
                  connector: { $ref: "#/components/schemas/Connector" }
                  name: { type: string }
                  reason: { type: string }
                  requested_by: { type: string, enum: [agent, person] }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/complete:
    post:
      operationId: connectComplete
      summary: Finish a connect link with an API key
      description: Tests the credentials and saves the integration. The link then stops working.
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credentials]
              properties:
                token: { type: string }
                credentials: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [connector_name, name, workspace_name]
                properties:
                  connector_name: { type: string }
                  name: { type: string }
                  workspace_name: { type: string }
                  account: { $ref: "#/components/schemas/ConnectorAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/oauth:
    post:
      operationId: connectOAuth
      summary: Start the OAuth sign-in for a connect link
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: The provider's sign-in URL. Afterwards the browser lands on /connect.
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/import-preview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: importPreview
      x-outflare-access: { scope: integrations.read }
      summary: See what an import from another sequencer would bring over
      description: "Scope: integrations.read. Reads the connected Instantly or Smartlead account live: campaigns with their steps, and sending accounts matched to this workspace's mailboxes by address. Changes nothing."
      tags: [imports]
      responses:
        "200":
          description: The outside account's campaigns and sending accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/crm-import-preview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: crmImportPreview
      x-outflare-access: { scope: integrations.read }
      summary: See what an import from another CRM would bring over
      description: "Scope: integrations.read. Reads the connected CRM (Attio) live: its objects (People, Companies, Deals and custom ones) with their fields, select options and pipeline stages, its lists with their own fields, and how many records, list entries, notes, tasks and members it holds. Each count stops at limit and says so with capped; filled is how many of the counted records have a value in that field. Changes nothing, in Outflare or in the CRM."
      tags: [imports]
      responses:
        "200":
          description: The CRM's setup and counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRMImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/crm-imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startCRMImport
      x-outflare-access: { scope: catalog.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Import another CRM into customer records, once
      description: |
        Scope: catalog.manage and customers.manage. Copies the connected CRM
        (Attio) into customer records in the background; read it with GET
        /crm-imports/{import}. People become person records, Companies account
        records, and Deals and custom objects record types of their own. Each
        field becomes a catalog field (an existing one when it holds the same
        kind of value), select and status choices become option lists, and
        emails, phones and domains become identities. Emails and phones come in
        unverified. Values are CRM data (source crm_sync), so they never
        overwrite what someone typed in Outflare or what your own product sent.
        A person whose email, or a company whose domain, a record here already
        holds verified is filled in instead of duplicated. Every record keeps
        its CRM id as an identity (such as attio.record), so running the import
        again updates the same records. Lists, notes and tasks are not imported
        yet. Nothing changes in the CRM.
      tags: [imports]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                objects: { type: array, maxItems: 100, items: { type: string }, description: "Only these objects, by slug from the preview, such as people or deals. Default every object." }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/CRMImport" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crm-imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listCRMImports
      x-outflare-access: { scope: customers.read }
      summary: List CRM imports
      description: "Scope: customers.read. The 50 newest."
      tags: [imports]
      responses:
        "200":
          description: CRM imports, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CRMImport" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crm-imports/{import}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: import, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCRMImport
      x-outflare-access: { scope: customers.read }
      summary: Get a CRM import
      description: "Scope: customers.read. Its status, and once it runs, what it did: records seen, created, matched to records already here, updated and unchanged for each object; the record types, fields and option lists it added; members matched by email; placeholders for records another record points at that the CRM did not return; and values it left out, with why."
      tags: [imports]
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRMImport" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startImport
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Import campaigns, leads and mailboxes from another sequencer
      description: |
        Scope: sequences.manage, plus leads.manage when importing leads. Runs
        in the background; read it with GET /imports/{id}. Campaigns become
        draft sequences, so nothing sends until someone starts them. Leads
        keep the step they reached and the mailbox that wrote to them;
        bounced and unsubscribed leads go on the suppression list. Running it
        again updates the same sequences instead of duplicating them.
      tags: [imports]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_ids: { type: array, items: { type: string }, description: Only these campaigns. Default every campaign. }
                leads: { type: boolean, description: Default true. }
                mailboxes: { type: boolean, description: "Match sending accounts. Default true." }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/ImportRun" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listImports
      x-outflare-access: { scope: sequences.read }
      summary: List imports
      description: "Scope: sequences.read. The 50 newest."
      tags: [imports]
      responses:
        "200":
          description: Imports, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ImportRun" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/imports/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImport
      x-outflare-access: { scope: sequences.read }
      summary: Read an import and what it did
      description: "Scope: sequences.read."
      tags: [imports]
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-health:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: mailboxHealth
      x-outflare-access: { scope: mailboxes.read }
      summary: How every sending mailbox is doing
      description: |
        Scope: mailboxes.read. Graded from every signal: sign-in and inbox sync
        errors (explained, e.g. suspended account or revoked consent), send
        failures, bounce rate, warm-up inbox placement, the domain's SPF, DKIM,
        DMARC and blocklists, and new mailboxes not warming up. Each signal
        says what to do. Worst first. Computed on read.
      tags: [mailboxes]
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [ok, warning, critical, paused] } }
        - { name: mailbox_id, in: query, schema: { type: string }, description: "One or more ids, comma separated." }
      responses:
        "200":
          description: Health by mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [summary, data]
                properties:
                  summary: { $ref: "#/components/schemas/MailboxHealthSummary" }
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxHealth" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-health/settings:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getHealthSettings
      x-outflare-access: { scope: mailboxes.read }
      summary: Automatic pausing settings
      description: "Scope: mailboxes.read."
      tags: [mailboxes]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putHealthSettings
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change automatic pausing
      description: "Scope: mailboxes.manage. Every field is optional."
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_pause: { type: boolean }
                pause_bounce_rate: { type: number }
                min_sends: { type: integer }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/reports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: report
      x-outflare-access: { scope: sequences.read, brand_limited: true }
      summary: Outreach and deliverability report
      description: |
        Scope: sequences.read. Sends, leads contacted, new leads and follow-ups,
        failures, policy blocks, bounces, replies (and replied leads), auto-replies,
        opt-outs, unsubscribes and warm-up placement, with reply, bounce, opt-out
        and placement rates. Totals for the period, and rows by day, week,
        sequence, step, mailbox, domain or brand. Default period is the last 30 days.
        A record's brand is its sequence's, or its mailbox's for warm-up.
      tags: [reports]
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "A date (2026-10-01) or RFC 3339 time." }
        - { name: to, in: query, schema: { type: string }, description: "A date (inclusive) or RFC 3339 time. Default now." }
        - { name: group_by, in: query, schema: { type: string, enum: [day, week, sequence, step, mailbox, domain, brand] } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: timezone, in: query, schema: { type: string }, description: "IANA zone for dates and day buckets. Default UTC." }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: domain, in: query, schema: { type: string } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/context:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getContext
      x-outflare-access: { scope: workspace.read, project_tokens: true, brand_limited: true }
      summary: Read what Outflare knows about the company
      description: |
        Scope: workspace.read. What an agent reads at the start of every
        conversation, so the person never has to repeat themselves: the
        company context (who they are, goals, voice, rules), pinned and
        recent memories, and the projects whose briefs hold each motion's
        offer and audience. `context.missing` lists the onboarding fields
        still empty; when `context.ask_for_missing` is true, ask the person
        for them once and save the answers with PATCH. A project token sees
        workspace-wide memories and its own project's.
      parameters:
        - { name: brand, in: query, description: "A brand's id or handle: adds that brand's context and keeps memories and projects to the company's and the brand's. A project token gets its project's brand.", schema: { type: string } }
      tags: [context]
      responses:
        "200":
          description: The context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceContext" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateContext
      x-outflare-access: { scope: context.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Edit the company context
      description: |
        Scope: context.manage, not available to project tokens. Send only
        the fields to change; a real change bumps `version`. Send the
        `version` you read to avoid overwriting someone else's edit: if the
        context changed since, the update fails with 409 `context_changed`.
        Offer, audience, market and ideal customer belong on projects, not
        here.
      tags: [context]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyContextInput" }
      responses:
        "200":
          description: The company context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyContext" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/onboarding:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getOnboarding
      x-outflare-access: { scope: workspace.read }
      summary: Read the getting-started steps
      description: |
        Scope: workspace.read. The steps a new workspace is walked through,
        aimed at a first result: add its website (a brand), pick what to do
        first (`goal`), connect an AI (its own model key, or an AI app over
        MCP), connect the tools that goal needs and start a first mission.
        Inviting the team comes after, on Home (`walkthrough: false`). Each
        step is `done` when the workspace already has it, however it was
        added, and `skipped` when a person left it for later. None is
        required. `page` is where a person does the step
        and `tool` the MCP tool an agent can use (empty when it needs a
        person). `show` says whether the app opens the walk-through by
        itself.
      tags: [context]
      responses:
        "200":
          description: The steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOnboarding
      x-outflare-access: { scope: workspace.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pick a goal, skip steps or close the walk-through
      description: |
        Scope: workspace.manage. `goal` records what to do first, which
        picks the tools and the first mission suggested. `skip` leaves
        steps for later and `unskip` brings them back; `dismissed: true` closes the walk-through so the
        app stops opening it, and `false` opens it again. Skipping never
        turns anything off: a skipped step still counts as done once the
        workspace has it.
      tags: [context]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "200":
          description: The steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/memories:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMemories
      x-outflare-access: { scope: workspace.read, project_tokens: true, brand_limited: true }
      summary: List memories
      description: |
        Scope: workspace.read. Short lasting facts, preferences and
        decisions agents and people saved, pinned first, then the most
        recently changed. Search with `q` before asking the person
        something they may have said before.
      tags: [context]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: q, in: query, description: Words the memory contains., schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [preference, decision, fact, feedback] } }
        - { name: project_id, in: query, description: "A project's id, or none for workspace-wide memories.", schema: { type: string } }
        - { name: pinned, in: query, schema: { type: boolean } }
        - { name: limit, in: query, description: 1 to 200. Default 50., schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Memories.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, next_offset, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Memory" } }
                  total: { type: integer }
                  next_offset: { type: [integer, "null"] }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMemory
      x-outflare-access: { scope: context.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remember something
      description: |
        Scope: context.manage. Save one lasting fact, preference or decision
        in a sentence, such as "Never mention pricing in a first email".
        Never a transcript. Saving the same text again keeps one memory. A
        call made inside a mission records the mission. A project token
        saves into its own project. A workspace keeps at most 1000.
      tags: [context]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MemoryInput"
                - required: [text]
      responses:
        "201":
          description: The memory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/memories/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMemory
      x-outflare-access: { scope: context.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a memory
      description: "Scope: context.manage. Correct its text, change its kind, pin it, or move it to a project (null for the whole workspace)."
      tags: [context]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: The memory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMemory
      x-outflare-access: { scope: context.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Forget a memory
      description: "Scope: context.manage. For a memory that is wrong or out of date."
      tags: [context]
      responses:
        "204": { description: Forgotten. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/status:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getStatus
      x-outflare-access: { scope: workspace.read }
      summary: What is blocked, and what to do about it
      description: |
        Scope: workspace.read. Everything stopping the workspace, from one
        call: mailboxes that can't sign in or aren't ready, domains with
        critical problems, paused sending servers, broken connections,
        mission changes waiting for a person, paused missions, sequences
        short of mailboxes, plans awaiting approval, unread replies and a
        company context still to fill. Each blocker names the MCP tool and
        dashboard page that resolve it and whether an agent or a person must
        act. Worst first. `setup` is the getting-started checklist.
      tags: [context]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceStatus" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/projects:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listProjects
      x-outflare-access: { scope: projects.read, project_tokens: true, brand_limited: true }
      summary: List projects
      description: |
        Scope: projects.read. A project is one go-to-market motion: an offer
        sold to one ideal customer in one market. It holds the brief people
        and agents work from and owns domains, mailboxes, lead lists and
        sequences. A project token sees only its own project.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - name: status
          in: query
          description: Default lists every project but archived ones.
          schema: { type: string, enum: [active, paused, archived, all] }
      responses:
        "200":
          description: Projects by name, archived last.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Project" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      x-outflare-access: { scope: projects.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a project
      description: "Scope: projects.manage, not available to project tokens. Names are unique in the workspace, ignoring case."
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProjectInput"
                - required: [name]
      responses:
        "201":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProject
      x-outflare-access: { scope: projects.read, project_tokens: true, brand_limited: true }
      summary: Get a project
      description: "Scope: projects.read."
      tags: [projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      x-outflare-access: { scope: projects.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Edit a project's brief, status or daily send limit
      description: |
        Scope: projects.manage. A change to offer, audience, market, brief or
        icp bumps `brief_version`. Send the `brief_version` you read to make
        sure you are not overwriting someone else's edit: if the brief has
        changed since, the update fails with 409 `brief_changed`. `status:
        paused` holds every send from the project's sequences; `archived`
        also hides it from the default list.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      x-outflare-access: { scope: projects.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a project
      description: |
        Scope: projects.manage, not available to project tokens. Its domains,
        mailboxes, lists and sequences stay and become shared by the
        workspace. Fails with 409 `project_has_tokens` while the project has
        live API tokens; revoke them first, or archive the project instead.
      tags: [projects]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/projects/{id}/brief:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProjectBrief
      x-outflare-access: { scope: projects.read, project_tokens: true, brand_limited: true }
      summary: Read a project's brief
      description: |
        Scope: projects.read. What an agent should read before writing copy,
        building a list or planning a campaign for the project: the
        structured fields plus the whole brief as one Markdown document.
        Keep `version` and compare it later to know the brief moved.
      tags: [projects]
      responses:
        "200":
          description: The brief.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBrief" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/projects/{id}/add:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addToProject
      x-outflare-access: { scope: projects.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Move domains, mailboxes, lists or sequences into a project
      description: |
        Scope: projects.manage, plus mailboxes.manage for domains and
        mailboxes, leads.manage for lists and sequences.manage for
        sequences. Not available to project tokens. Records in another
        project move to this one. A domain brings its mailboxes unless
        `with_mailboxes` is false. A project's mailboxes only send for that
        project's sequences, so moving one can take it off a sequence (it
        finishes follow-ups first).
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMembers" }
      responses:
        "200":
          description: How many records moved. Unknown ids and names are ignored.
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { $ref: "#/components/schemas/ProjectMoved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/projects/{id}/remove:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: removeFromProject
      x-outflare-access: { scope: projects.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Make a project's domains, mailboxes, lists or sequences shared again
      description: "Scope: projects.manage, plus read access to each kind of record moved (as addToProject). Only records in this project change."
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMembers" }
      responses:
        "200":
          description: How many records moved.
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { $ref: "#/components/schemas/ProjectMoved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/catalog:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getCatalog
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: Read the catalog
      description: |
        Scope: customers.read. Everything a workspace's customer records can hold: record types (person and account
        built in, plus the workspace's own such as deal), their fields, the shared option lists and the product events
        it has defined. It is the one definition of each fact for every feature (the customer data platform, the CRM,
        imports, list filters, enrichment, merge tags), so read it before writing records.
      tags: [catalog]
      parameters:
        - { name: archived, in: query, description: "true includes archived types, fields and options.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/catalog/types:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listRecordTypes
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: List record types
      description: "Scope: customers.read. Built-in types first, then the workspace's own, with their fields."
      tags: [catalog]
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Record types.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecordType" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRecordType
      x-outflare-access: { scope: catalog.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a record type
