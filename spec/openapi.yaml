      description: "Scope: leads.read"
      tags: [leads]
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLead
      x-outflare-access: { scope: leads.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a lead's fields
      description: "Scope: leads.manage. In custom, a null value removes that field."
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                company: { type: string }
                title: { type: string }
                phone: { type: string }
                linkedin_url: { type: string }
                website: { type: string }
                custom:
                  type: object
                  additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: The updated lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLead
      x-outflare-access: { scope: leads.manage }
      summary: Delete a lead
      description: |
        Scope: leads.manage. With suppress=true the address is also added to
        the suppression list (reason do_not_contact), so an erasure request is
        honoured even if the person is imported again later.
      tags: [leads]
      parameters:
        - { name: suppress, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/lead-lists:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listLeadLists
      x-outflare-access: { scope: leads.read, project_tokens: true }
      summary: List lead lists, with each list's latest run
