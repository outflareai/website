              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgencyToken" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgencyToken
      x-outflare-access: { agency_role: admin }
      summary: Create a token that works in every client workspace
      description: Agency admins. Scopes apply in each client and can't exceed your agency role. The secret is returned once.
      tags: [agencies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                can_create_clients: { type: boolean, default: false }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_token: { $ref: "#/components/schemas/AgencyToken" }
                  token: { type: string, description: "The secret, starting ofa_. Shown once." }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies/{ag}/api-tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/Agency" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeAgencyToken
      x-outflare-access: { agency_role: admin }
