openapi: 3.1.0
info:
  title: Outflare API
  version: 0.1.0
  description: |
    The Outflare REST API. Every client (the web app, the CLI, SDKs, MCP
    servers and your own agents) uses this same API.

    Agents acting toward a goal send `Outflare-Mission: <mission id>` (and
    optionally `Outflare-Reason: <why>`) on their calls. The call is logged
    against the mission, and a write may be answered `202` with a
    `MissionHeld` body instead of running: a dry run, or held until a
    person approves it. See the missions endpoints.

    Every operation says who may call it in `x-outflare-access`: `scope`
    (the API token scope it needs in the workspace) and `project_tokens`
    (whether a project token may call it), `agency_role` and
    `agency_tokens` for agency endpoints, or `signed_in` for endpoints
    only a signed-in person can use. Operations without it are public.
    The engine's tests check every value against the running server.

    Workspace writes take an `Idempotency-Key` header: a retry with the
    same key gets the first answer back instead of running twice.

    Errors always have the `Error` body (`default` on every operation).
    Workspace writes may also answer `202` with `MissionHeld` when made
    inside a mission.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
security:
  - bearer: []
  - session: []
servers:
  - url: http://localhost:8080
    description: Local self-hosted instance
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check
      tags: [system]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default: { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Readiness check, including the database
      tags: [system]
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default: { $ref: "#/components/responses/Error" }
  /v1/meta:
    get:
      operationId: getMeta
      security: []
      summary: Instance version and capabilities
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default: { $ref: "#/components/responses/Error" }
  /v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      security: []
      summary: This document
      tags: [system]
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml: {}
        default: { $ref: "#/components/responses/Error" }
  /.well-known/outflare.json:
    get:
      operationId: getDiscovery
      security: []
      summary: Machine-readable discovery for agents and tools
      tags: [system]
      responses:
        "200":
          description: Discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default: { $ref: "#/components/responses/Error" }
  /v1/setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-run setup is still needed
      tags: [access]
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                type: object
                required: [needed]
                properties:
                  needed: { type: boolean }
                  telemetry:
                    description: Whether this server sends anonymous usage stats, shown on the first-run form.
                    type: object
                    required: [enabled, disabled_by]
                    properties:
                      enabled: { type: boolean }
                      disabled_by: { $ref: "#/components/schemas/TelemetryOffReason" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: setup
      summary: Create the first user and workspace
      description: Only works while the instance has no users. Signs the new owner in.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, workspace_name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 10 }
                workspace_name: { type: string }
                telemetry:
                  type: boolean
                  description: false turns off anonymous usage stats and update checks from the start. Default true.
      responses:
        "201":
          description: Created; a session cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, workspace_id]
                properties:
                  user_id: { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: Sets a session cookie. Ten failed attempts for one email lock it for 15 minutes.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Signed in. }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [access]
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Email a password reset link
      description: |
        Sends a one-time link (valid an hour) to `<PUBLIC_URL>/reset-password#<token>`, through the account email service
        (see `account_email` in /v1/meta). The answer is the same whether or not the email has an account. Ten requests
        for one email, or from one network, in 15 minutes are refused.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: Sent, if the email has an account. }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Choose a new password with a reset link
      description: Sets the password, signs out every session, signs this browser in, and counts the email as confirmed.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: The part of the link after `#`. }
                password: { type: string, minLength: 10 }
      responses:
        "200": { description: Password changed and signed in. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with its link
      description: The link is `<PUBLIC_URL>/verify-email#<token>`, valid 48 hours, sent when an account is made with a password.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerification" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/me/email-verification:
    post:
      operationId: resendEmailVerification
      x-outflare-access: { signed_in: true }
      summary: Send the confirmation link again
      description: Replaces any earlier link. Answers 200 without sending when the address is already confirmed.
      tags: [access]
      responses:
        "200":
          description: Already confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerification" }
        "202":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerification" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/passkey/options:
    post:
      operationId: startPasskeySignIn
      summary: Start signing in with a passkey
      description: |
        Returns WebAuthn request options (`publicKey`) for `navigator.credentials.get`, with no allowed credentials so the
        browser offers whichever passkeys it holds for this site. Sets a short-lived `outflare_passkey` cookie holding the
        challenge. Passkeys are on when PUBLIC_URL is https (or PASSKEYS=on); `passkey` is then in `login_methods`.
      tags: [access]
      security: []
      responses:
        "200":
          description: Options for the browser.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/passkey:
    post:
      operationId: passkeySignIn
      summary: Finish signing in with a passkey
      description: The body is the browser's assertion (`PublicKeyCredential.toJSON()`). Sets a session cookie.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Signed in. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      x-outflare-access: { signed_in: true }
      summary: Your passkeys
      tags: [access]
      responses:
        "200":
          description: Passkeys that sign you in.
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addPasskey
      x-outflare-access: { signed_in: true }
      summary: Save a new passkey
      description: The body is the browser's new credential (`PublicKeyCredential.toJSON()`), answering /v1/me/passkeys/options.
      tags: [access]
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 80 }, description: "A label, such as \"MacBook\". Default Passkey." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/me/passkeys/options:
    post:
      operationId: startAddingPasskey
      x-outflare-access: { signed_in: true }
      summary: Start adding a passkey
      description: Returns WebAuthn creation options (`publicKey`) for `navigator.credentials.create`, and sets the `outflare_passkey` challenge cookie. Up to 10 passkeys.
      tags: [access]
      responses:
        "200":
          description: Options for the browser.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/me/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renamePasskey
      x-outflare-access: { signed_in: true }
      summary: Rename a passkey
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removePasskey
      x-outflare-access: { signed_in: true }
      summary: Remove a passkey
      tags: [access]
      responses:
        "204": { description: Removed. It no longer signs you in. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Start "Continue with Google"
      description: |
        Redirects to Google's sign-in screen (scopes openid, email, profile only). Open it in the browser, not with fetch.
        Needs GOOGLE_OAUTH_CLIENT_ID/SECRET, with `<PUBLIC_URL>/v1/auth/google/callback` added to the client's redirect URIs.
        Google then returns to the callback, which signs the person in to the account linked to that Google account, or the
        account with the same verified email. Nobody gets an account from Google alone: an unknown person is sent back to
        `return` with `identity` (valid 15 minutes), `identity_email` and `identity_name`, and the invite page redeems
        `identity` instead of a password. Errors come back as `login_error`.
      tags: [access]
      security: []
      parameters:
        - name: return
          in: query
          description: Path on this site to come back to, such as /invite#<token>. Default /.
          schema: { type: string }
      responses:
        "302": { description: To Google. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/google/callback:
    get:
      operationId: googleSignInCallback
      summary: Google's return from "Continue with Google"
      description: Called by Google, not by clients. Redirects to the app, or back to `return` with `identity` or `login_error`.
      tags: [access]
      security: []
      responses:
        "302": { description: Back to the app. }
        default: { $ref: "#/components/responses/Error" }
  /v1/invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept a workspace invite
      description: |
        A new email creates an account (name and password required). An existing account must give its password, or be
        signed in already. Instead of a password, `identity` from "Continue with Google" proves the invited email; a new
        account made that way has no password and signs in with Google.
      tags: [access]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string }
                identity: { type: string, description: The identity parameter from the Google sign-in callback. }
      responses:
        "200": { description: Joined; a session cookie is set. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/instance/telemetry:
    get:
      operationId: getTelemetry
      x-outflare-access: { signed_in: true }
      summary: Usage stats and update check for this server
      description: |
        Self-hosted servers send one anonymous report a day (version,
        platform, usage counts as ranges, connector ids) and get back the
        newest version and any security notices. See docs/telemetry.md.
        Needs a signed-in user.
      tags: [instance]
      responses:
        "200":
          description: Telemetry and update status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryStatus" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTelemetry
      x-outflare-access: { signed_in: true }
      summary: Turn usage stats on or off
      description: Only the person who set up the server can change it. Refused with 409 when the server's environment (OUTFLARE_TELEMETRY, DO_NOT_TRACK) or the build decides.
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/instance/telemetry/preview:
    get:
      operationId: previewTelemetry
      x-outflare-access: { signed_in: true }
      summary: The exact report this server would send
      tags: [instance]
      responses:
        "200":
          description: The report, not sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryReport" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      operationId: getMe
      x-outflare-access: { signed_in: true }
      summary: The signed-in user and their workspaces
      tags: [access]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [user, workspaces, agencies]
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      name: { type: string }
                      email_verified:
                        type: boolean
                        description: The person opened a confirmation or reset link sent to this address, or Google vouched for it.
                      has_password:
                        type: boolean
                        description: False for accounts made with Google, until they set a password with a reset link.
                  workspaces:
                    type: array
                    description: Workspaces the user is a member of, plus every client workspace of their agencies, each with their strongest role.
                    items: { $ref: "#/components/schemas/Workspace" }
                  agencies:
                    type: array
                    items: { $ref: "#/components/schemas/Agency" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies:
    get:
      operationId: listAgencies
      x-outflare-access: { signed_in: true }
      summary: Agencies the signed-in user belongs to
      tags: [agencies]
      responses:
        "200":
          description: Agencies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agency" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgency
      x-outflare-access: { signed_in: true }
      summary: Create an agency
      description: |
        Signed-in users only. The creator becomes the agency's owner. Pass
        workspace_ids to bring workspaces you own in as clients.
      tags: [agencies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                workspace_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies/{ag}:
    parameters: [{ $ref: "#/components/parameters/Agency" }]
    get:
      operationId: getAgency
      x-outflare-access: { agency_role: viewer, agency_tokens: true }
      summary: An agency
      description: Agency members, or the agency's own tokens.
      tags: [agencies]
      responses:
        "200":
          description: The agency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAgency
      x-outflare-access: { agency_role: admin }
      summary: Rename the agency or change its white label
      description: Agency admins. Client members see the brand name, logo and accent colour in place of Outflare.
      tags: [agencies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                brand_name: { type: string, maxLength: 60 }
                logo_url: { type: string, description: An https URL, or empty to clear. }
                accent_color: { type: string, pattern: "^(#[0-9a-fA-F]{6})?$" }
                support_email: { type: string }
      responses:
        "200":
          description: The agency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agency" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies/{ag}/clients:
    parameters: [{ $ref: "#/components/parameters/Agency" }]
    get:
      operationId: listAgencyClients
      x-outflare-access: { agency_role: viewer, agency_tokens: true }
      summary: Every client with this week's numbers
      description: Agency members or agency tokens. Worst bounce rate first.
      tags: [agencies]
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AgencyClient" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addAgencyClient
      x-outflare-access: { agency_role: admin, agency_tokens: true }
      summary: Create a client workspace, or bring in one you own
      description: |
        Send name to create a new client workspace (agency admins, or agency
        tokens with can_create_clients). It has no direct members: agency
        people reach it through their agency role. Send workspace_id to bring
        in a workspace you own directly.
      tags: [agencies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                workspace_id: { type: string, format: uuid }
      responses:
        "201":
          description: The client workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies/{ag}/clients/{ws}:
    parameters:
      - { $ref: "#/components/parameters/Agency" }
      - { $ref: "#/components/parameters/Workspace" }
    delete:
      operationId: removeAgencyClient
      x-outflare-access: { agency_role: owner }
      summary: Take a workspace out of the agency
      description: Agency owners. The workspace and its data stay. If nobody owns it directly, you become its owner.
      tags: [agencies]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agencies/{ag}/members:
    parameters: [{ $ref: "#/components/parameters/Agency" }]
    get:
      operationId: listAgencyMembers
      x-outflare-access: { agency_role: viewer }
      summary: Agency members
      tags: [agencies]
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Member" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addAgencyMember
      x-outflare-access: { agency_role: admin }
      summary: Add someone who already has an account
      description: Agency admins. They get this role in every client workspace. Nobody can give a role above their own.
