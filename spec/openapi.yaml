      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setSEOSettings
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Set an SEO connection's domains, country, budget and snapshots
      description: "Scope: integrations.manage. Send only what changes. `domains: null` follows the domains the analytics tools line up (at most five); `monthly_budget: null` is the default ($10 for DataForSEO, 10,000 API units for Ahrefs); 0 stops every call."
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domains: { type: [array, "null"], items: { type: string }, maxItems: 25, example: [example.com] }
                country: { type: string, example: US, description: Two-letter code for keywords and traffic. }
                monthly_budget: { type: [number, "null"], minimum: 0, description: "Per calendar month (UTC): US dollars for DataForSEO, API units for Ahrefs." }
                sync: { type: string, enum: [weekly, "off"] }
      responses:
        "200":
          description: The connection with its new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOSource" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo/{id}/reports/{report}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: report, in: path, required: true, schema: { $ref: "#/components/schemas/SEOReportName" } }
    get:
      operationId: getSEOReport
      x-outflare-access: { scope: analytics.read }
      summary: Read one SEO report live (costs money)
      description: |
        Scope: analytics.read. Asks the provider now, which costs money:
        `cost` says what this answer cost and `budget` what is left this
        month. A call that would go over the connection's monthly budget
        answers 402 `budget_reached` without calling. Answers are kept for
        a day, so asking again is free; `fresh=true` pays again. Every paid
        call is recorded in Outcomes spend. Prefer GET .../seo/history for
        anything the weekly snapshot already has.
      tags: [seo]
      parameters:
        - { name: target, in: query, schema: { type: string }, example: example.com, description: "A domain. Default: the connection's only domain." }
        - { name: country, in: query, schema: { type: string }, example: US }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { name: fresh, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo/{id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncSEO
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Take an SEO snapshot now
      description: "Scope: integrations.manage. Stores the overview and top 50 keywords of every domain the connection follows, within its budget (this also runs weekly). Costs about $0.04 a domain on DataForSEO or 1,200 API units on Ahrefs."
      tags: [seo]
      responses:
        "200":
          description: What was stored and what it cost.
          content:
            application/json:
              schema:
                type: object
                required: [domains, rows, cost, unit]
                properties:
                  domains: { type: array, items: { type: string } }
                  rows: { type: integer }
                  cost: { type: number }
                  unit: { type: string, enum: [USD, API unit] }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo-sites:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listSEOSites
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List SEO sites
      description: "Scope: seo.read. The websites this workspace audits, each with its ownership proof, crawl settings, limits and latest crawl."
      tags: [seo]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
      responses:
        "200":
          description: Sites, by host.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SEOSite" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSEOSite
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a site to audit
      description: |
        Scope: seo.manage. Adds a website for OutflareBot to crawl. The site
        belongs to the brand whose domains include its host unless
        `brand_id` says otherwise. Until you prove you own it (POST
        .../verify, with one of the proofs in `verification`), a crawl reads
        at most 100 pages, waits at least 2 seconds between requests and
        always obeys robots.txt. A proved site may crawl up to 10,000 pages,
        as fast as one request every 250 ms, and may turn `obey_robots` off.
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "https://www.example.com/", description: "The site's address. A path makes the crawl start there." }
                brand_id: { type: [string, "null"], description: "A brand's id or handle; null shares the site with every brand." }
                max_pages: { type: integer, minimum: 1, maximum: 10000, default: 100 }
                crawl_delay_ms: { type: integer, minimum: 250, maximum: 60000, default: 2000, description: "The pause between requests. robots.txt's Crawl-delay can lengthen it." }
                schedule: { type: string, enum: ["off", daily, weekly], default: "off" }
      responses:
        "201":
          description: The site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOSite" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo-sites/{site}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: site, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSEOSite
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: Read an SEO site
      description: "Scope: seo.read."
      tags: [seo]
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOSite" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSEOSite
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change an SEO site's settings
      description: "Scope: seo.manage. Send only what changes, within the site's `limits`. `obey_robots: false` audits pages your own robots.txt hides from crawlers, and is only for a site you have proved you own. A crawl already running keeps the settings it started with."
      tags: [seo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: [string, "null"] }
                max_pages: { type: integer, minimum: 1, maximum: 10000 }
                crawl_delay_ms: { type: integer, minimum: 250, maximum: 60000 }
                obey_robots: { type: boolean }
                schedule: { type: string, enum: ["off", daily, weekly] }
                status: { type: string, enum: [active, paused] }
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOSite" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSEOSite
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove an SEO site
      description: "Scope: seo.manage. Its crawls and the pages they found go with it; a crawl running now stops."
      tags: [seo]
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo-sites/{site}/verify:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: site, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifySEOSite
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Check that you own a site
      description: |
        Scope: seo.manage. Looks now for any one of the site's proofs (see
        `verification`): a DNS TXT record, a meta tag in the start page's
        head, or a file on the site. Found, the site is verified and its
        limits rise. Not found answers 409 `verification_failed`, whose
        message lists the proofs. Outflare checks a verified site again
        every 30 days and lowers its limits if the proof is gone. A test
        workspace's sites pass without a check.
      tags: [seo]
      responses:
        "200":
          description: The verified site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SEOSite" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo-sites/{site}/crawls:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: site, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startCrawl
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Crawl a site now
      description: |
        Scope: seo.manage. Queues a crawl by OutflareBot (outflare.ai/bot/),
        which reads robots.txt and the sitemaps, then the site's pages one
        at a time, and slows down when the site asks. Poll GET
        .../crawls/{crawl} until status is done, stopped or failed, then read
        its pages. One crawl per site at a time: 409 `crawl_running` while
        one runs. 409 `crawl_opted_out` when the site's owner asked this
        server not to crawl it. A test workspace crawls a simulated site.
      tags: [seo]
      responses:
        "202":
          description: "The queued crawl. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Crawl" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listCrawls
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List crawls, newest first
      description: "Scope: seo.read."
      tags: [seo]
      parameters:
        - { name: site, in: query, description: "Only this site's crawls.", schema: { type: string, format: uuid } }
        - { name: before, in: query, description: "A crawl id from next_before.", schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Crawls.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Crawl" } }
                  next_before: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCrawl
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: Read a crawl
      description: "Scope: seo.read. Its status and counts so far; poll it while status is queued or running."
      tags: [seo]
      responses:
        "200":
          description: The crawl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crawl" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}/stop:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopCrawl
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Stop a crawl
      description: "Scope: seo.manage. Pages already read are kept; those still queued are marked skipped. 409 `conflict` when it already ended."
      tags: [seo]
      responses:
        "200":
          description: The stopped crawl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crawl" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}/pages:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listCrawlPages
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List the pages a crawl found
      description: "Scope: seo.read. Every URL the crawl found, in the order found, with what fetching it gave: the HTTP status, where a redirect led, noindex and nofollow, and why a page was blocked (robots.txt), failed or skipped."
      tags: [seo]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, fetched, blocked, failed, skipped] } }
        - { name: http_status, in: query, description: "Only pages that answered this, like 404.", schema: { type: integer, minimum: 100, maximum: 599 } }
        - { name: after, in: query, description: "A page id from next_after.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Pages.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_after, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CrawlPage" } }
                  next_after: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}/pages/{page}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: page, in: path, required: true, schema: { type: string }, example: "1042" }
    get:
      operationId: getCrawlPage
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: Read one crawled page with its links
      description: "Scope: seo.read. The page, every link on it (up to 500, with the linked page's status in this crawl, so broken links show as 404) and the pages that link to it (up to 500)."
      tags: [seo]
      responses:
        "200":
          description: The page and its links.
          content:
            application/json:
              schema:
                type: object
                required: [page, links_out, links_in]
                properties:
                  page: { $ref: "#/components/schemas/CrawlPage" }
                  links_out: { type: array, items: { $ref: "#/components/schemas/CrawlLink" } }
                  links_in: { type: array, items: { $ref: "#/components/schemas/CrawlLink" }, description: "The pages linking here: url is the linking page." }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}/issues:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listCrawlIssues
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List what a crawl's audit found
      description: "Scope: seo.read. One entry per rule broken, errors first and then by how many pages, each with what it means, how to fix it, and the URL templates (like /blog/*) its pages come from, so a problem on many pages made from one template reads as one fix. Worked out when the crawl ends; empty before."
      tags: [seo]
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [error, warning, notice] } }
      responses:
        "200":
          description: Issues, worst first.
          content:
            application/json:
              schema:
                type: object
                required: [data, crawl]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CrawlIssue" } }
                  crawl: { $ref: "#/components/schemas/Crawl" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/crawls/{crawl}/issues/{rule}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: crawl, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rule, in: path, required: true, schema: { type: string }, example: title_missing }
    get:
      operationId: getCrawlIssue
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List the pages with one issue
      description: "Scope: seo.read. The rule, and every page of the crawl that breaks it, with a short detail (the broken link's target, the duplicate's URL, the title's length)."
      tags: [seo]
      parameters:
        - { name: template, in: query, description: "Only pages of this URL template, like /blog/*.", schema: { type: string } }
        - { name: after, in: query, description: "An id from next_after.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: The rule and its pages.
          content:
            application/json:
              schema:
                type: object
                required: [rule, data, next_after, next_cursor]
                properties:
                  rule: { $ref: "#/components/schemas/SEORule" }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, page_id, url, template, detail, http_status]
                      properties:
                        id: { type: string }
                        page_id: { type: string, description: "The page, for GET .../crawls/{crawl}/pages/{page}." }
                        url: { type: string }
                        template: { type: string, example: /blog/* }
                        detail: { type: string, example: "72 characters" }
                        http_status: { type: [integer, "null"] }
                  next_after: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/seo-rules:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSEORules
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List the audit's rules
      description: "Scope: seo.read. Every check a site audit makes, with its severity, what it means and how to fix it. Rule ids never change."
      tags: [seo]
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SEORule" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/fixes:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listFixes
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: List the fixes list
      description: "Scope: seo.read (the list holds site audits' fixes so far). One list of work for the whole workspace, shared by people and agents: in progress first, then open, worst and biggest first. Each fix has a source (what found it), a subject (what it is about) and a rule with why it matters and how to fix it. Site audits (source seo_audit) keep one fix per rule and URL template of a site: each finished crawl recounts the pages, a fix the next complete crawl no longer finds is done, confirmed by that crawl, and one that comes back opens again."
      tags: [fixes]
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [seo_audit] } }
        - { name: subject_id, in: query, description: "One subject's fixes, such as an SEO site's id.", schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, done, ignored] } }
        - { name: severity, in: query, schema: { type: string, enum: [error, warning, notice] } }
        - { $ref: "#/components/parameters/Brand" }
      responses:
        "200":
          description: Fixes (up to 1,000).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Fix" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/fixes/{fix}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: fix, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFix
      x-outflare-access: { scope: seo.read, brand_limited: true }
      summary: Read one fix
      description: "Scope: seo.read. For a site audit's fix, GET .../crawls/{last_found_by}/issues/{rule}?template={group} lists its pages."
      tags: [fixes]
      responses:
        "200":
          description: The fix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fix" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateFix
      x-outflare-access: { scope: seo.manage, brand_limited: true }
      summary: Take, finish or ignore a fix
      description: "Scope: seo.manage. Send only what changes. Marking a fix done stays until its source checks again (for a site audit, the next complete crawl): if the issue is still there, it opens again."
      tags: [fixes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, in_progress, done, ignored] }
                assignee_id: { type: [string, "null"], description: "A member's or an agent's actor id, me for the caller, or null for nobody." }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The fix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fix" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listIntegrations
      x-outflare-access: { scope: integrations.read, brand_limited: true }
      summary: List connected accounts
      description: "Scope: integrations.read. Credentials are never returned."
      tags: [connectors]
      parameters:
        - { name: connector, in: query, schema: { type: string }, description: Only this connector id. }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ConnectorCategory" } }
      responses:
        "200":
          description: Integrations, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Integration" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createIntegration
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Connect an account with an API key
      description: |
        Scope: integrations.manage. The credentials are tested against the
        service before anything is saved, and refused with
        `connector_auth` if wrong. Works for every connector whose
        `auth_methods` include `api_key`, including ones that also offer
        OAuth. Connectors that only sign in (`auth_methods` is `[oauth2]`)
        are connected through `GET /integrations/oauth/{connector}/authorize`
        and answer `use_oauth` here.
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector, credentials]
              properties:
                connector: { type: string, example: zerobounce }
                name: { type: string, description: "Defaults to the connector's name, numbered if taken." }
                credentials:
                  type: object
                  additionalProperties: { type: string }
                  description: The connector's fields by name, e.g. {"api_key":"..."}.
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIntegration
      x-outflare-access: { scope: integrations.read, brand_limited: true }
      summary: Get a connected account
      description: "Scope: integrations.read."
      tags: [connectors]
      responses:
        "200":
          description: The integration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateIntegration
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Rename, replace the API key, or change settings
      description: "Scope: integrations.manage. New credentials are tested before they replace the old ones."
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                credentials: { type: object, additionalProperties: { type: string } }
                config: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteIntegration
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Disconnect an account
      description: "Scope: integrations.manage. Deletes the stored credentials. Features using it fall back (verification goes back to the built-in checks)."
      tags: [connectors]
      responses:
        "204": { description: Disconnected. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/test:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testIntegration
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Sign in again with the stored credentials
      description: "Scope: integrations.manage. Reads the account (and credits, when the service reports them); changes nothing at the service and spends no credits."
      tags: [connectors]
      responses:
        "200":
          description: The integration with its status and last_error updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/models:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listIntegrationModels
      x-outflare-access: { scope: integrations.manage }
      summary: List the models an AI model connection can use
      description: |
        Scope: integrations.manage. For a Claude, OpenAI, Gemini or Mistral
        connection: the chat models its key can use, asked of the provider
        live (costs nothing). `price` is set where Outflare knows the list
        price; for the rest, enter it with your choice in `PUT /ai-settings`.
      tags: [connectors]
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema:
                type: object
                required: [data, default_model]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, price]
                      properties:
                        id: { type: string, example: claude-opus-5-5 }
                        name: { type: string }
                        price: { oneOf: [{ $ref: "#/components/schemas/AIPrice" }, { type: "null" }] }
                  default_model: { type: [string, "null"], description: The model used when none is chosen; null when the provider has none. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/ai-settings:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getAISettings
      x-outflare-access: { scope: integrations.read }
      summary: Which AI model plans missions and runs Outflare's agent
      description: |
        Scope: integrations.read. The chosen connection and model, its
        price, the monthly AI limit and this month's AI spend, the model in
        use now (`active`), and `problem` when something must be done
        first. Keys are never shown.
      tags: [connectors]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAISettings
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Choose the AI model and the monthly AI limit
      description: |
        Scope: integrations.manage. Replaces the settings. `integration_id`
        null uses the first connected AI model (Claude, OpenAI, Gemini,
        Mistral) with its default model. `model` empty uses the provider's
        default; OpenAI, Gemini and Mistral have none, so name one from
        `GET /integrations/{id}/models`. Prices are required for models
        Outflare doesn't know the price of, so spend limits can be kept.
        `monthly_limit_cents` caps every AI call in the workspace each
        calendar month (UTC); null means no workspace limit. The default is
        5000 (US$50).

        `domain_research` turns on research into unknown email domains: the
        workspace's own page reader (connect Geonode) fetches the domain's
        homepage and the model above reads it. It needs both connections,
        spends the workspace's own money, and is off until asked for.
        `domain_research_limit_cents` caps that research each calendar
        month, 20000 (US$200) by default, and 0 stops it; the overall AI
        limit still applies and research stops at whichever comes first.
        Leaving either out keeps what is set.
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integration_id: { type: [string, "null"], format: uuid }
                model: { type: string, maxLength: 200 }
                input_cents_per_million: { type: [number, "null"], exclusiveMinimum: 0, maximum: 10000000 }
                output_cents_per_million: { type: [number, "null"], exclusiveMinimum: 0, maximum: 10000000 }
                monthly_limit_cents: { type: [integer, "null"], minimum: 0, maximum: 10000000 }
                domain_research: { type: boolean, description: Omitted leaves it as it is. }
                domain_research_limit_cents: { type: integer, minimum: 0, maximum: 10000000, description: Omitted leaves it as it is; 0 stops research. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/oauth/{connector}/authorize:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: connector, in: path, required: true, schema: { type: string } }
    get:
      operationId: authorizeIntegration
      x-outflare-access: { scope: integrations.manage }
      summary: Start connecting an OAuth connector
      description: |
        Scope: integrations.manage. For connectors whose `auth_methods`
        include `oauth2`. Redirects to the service's sign-in page;
        afterwards the browser lands on the workspace's Connectors page, or
        on its Get started page with `return=get-started`.
        Answers `not_configured` when this server has no OAuth app for the
        connector; the catalog's `auth_options` says so ahead of time.
        With `format=json` it returns the link instead, for an agent to hand
        to a person.
      tags: [connectors]
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json] } }
        - { name: return, in: query, description: "The app page to land on afterwards. Default: Connectors.", schema: { type: string, enum: [get-started] } }
      responses:
        "200":
          description: The sign-in link (format=json).
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "302": { description: Redirect to the sign-in page. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/integrations/oauth/clients/{file}:
    get:
      operationId: integrationOAuthClientMetadata
      tags: [connectors]
      summary: OAuth client metadata document
      description: "For providers that read the OAuth client from a URL (PostHog). The document's own URL is the client id, so nobody registers an app. `{file}` is `<connector id>.json`."
      security: []
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, example: posthog.json }
      responses:
        "200": { description: The client metadata document., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/integrations/oauth/callback:
    get:
      operationId: integrationOAuthCallback
      security: []
      summary: Where connector sign-in pages return to
      description: Not called directly. Redirects to the Connectors page with `integration` (the new integration id) or `connect_error`.
      tags: [connectors]
      responses:
        "302": { description: Redirect to the web app. }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/verification-settings:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getVerificationSettings
      x-outflare-access: { scope: leads.read }
      summary: How the workspace verifies addresses
      description: "Scope: leads.read."
      tags: [verification]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSettings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateVerificationSettings
      x-outflare-access: { scope: leads.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Choose the verification service and what to block
      description: |
        Scope: leads.manage. Every field is optional. `integration_id` empty
        or `builtin` switches to the free built-in checks. Undeliverable
        addresses are always blocked.
      tags: [verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integration_id: { type: [string, "null"] }
                verify_on_import: { type: boolean }
                verify_before_send: { type: boolean }
                block_risky: { type: boolean }
                block_catch_all: { type: boolean }
                block_unknown: { type: boolean }
                max_age_days: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/verifications:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listVerifications
      x-outflare-access: { scope: leads.read }
      summary: Verification results, newest first
      description: "Scope: leads.read."
      tags: [verification]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/VerificationStatus" } }
        - { name: email, in: query, schema: { type: string }, description: "One or more addresses, comma-separated or repeated." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Results.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_offset, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Verification" } }
                  next_offset: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startVerification
      x-outflare-access: { scope: leads.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Verify addresses, a lead list, or every unverified lead
      description: |
        Scope: leads.manage. Runs in the background; results appear under
        GET /verifications. Addresses with a fresh result are skipped unless
        `force` is true. Paid services spend credits.
      tags: [verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails: { type: array, items: { type: string, format: email } }
                list_id: { type: string, format: uuid }
                unverified: { type: boolean, description: Every lead without a fresh result. }
                force: { type: boolean }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [queued, jobs], properties: { queued: { type: integer }, jobs: { type: integer } } }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/verifications/summary:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getVerificationSummary
      x-outflare-access: { scope: leads.read }
      summary: Lead counts by verification status
      description: "Scope: leads.read."
      tags: [verification]
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSummary" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/classifications:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: classifyEmail
      x-outflare-access: { scope: leads.read }
      summary: Classify an email address or domain
      description: |
        Scope: leads.read. Says what kind of email infrastructure an address
        or domain is: a free consumer mailbox, a private mailbox, an alias
        service, a throwaway inbox, a school, a government, or not known yet,
        with independent attributes, rule-based risk, the evidence behind it
        and a recommended action for a sign-up flow. Send exactly one of
        `email` or `domain`; a domain alone keeps the person's address out
        of the request. Changes nothing, so retries are safe.

        `global` is Outflare's assessment, the same for every workspace.
        `effective` is what this workspace makes of it; until workspaces
        have overrides and rules it applies Outflare's defaults: block
        throwaway domains and domains that take no mail, ask for
        verification when the domain is unknown, allow the rest. The action
        is advice: your sign-up flow decides.

        `confidence` is null until it is calibrated; `confidence_status`
        says what the category rests on. Attributes are `true`, `false` or
        `"unknown"`, and absence of evidence is `"unknown"`, never false.
        Nothing here says a mailbox exists or who owns it: use
        verifications for that.

        An unknown domain is the long tail. A workspace that turns on
        `domain_research` in its AI settings has it researched in the
        background: its own page reader (Geonode) fetches the domain's
        homepage and its own AI model reads the words, on the workspace's
        own accounts. `analysis.status` is then `queued`, and a later call
        answers `researched` with a `research` block. Research never
        changes `global`; where the two disagree the global answer stands
        and the action becomes `review`.
      tags: [classification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, description: "The address. Its local part is checked but never rewritten (no dot or +tag folding).", example: person@example.com }
                domain: { type: string, description: "A domain, instead of an address. Internationalised names are accepted.", example: example.com }
      responses:
        "200":
          description: The classification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-domains/{domain}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: domain, in: path, required: true, schema: { type: string }, example: proton.me }
    get:
      operationId: getEmailDomain
      x-outflare-access: { scope: leads.read }
      summary: What kind of email domain this is
      description: "Scope: leads.read. The same answer as POST /classifications with `domain`, as a GET."
      tags: [classification]
      responses:
        "200":
          description: The classification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/outcomes/report:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: outcomesReport
      x-outflare-access: { scope: outcomes.read, brand_limited: true }
      summary: Cost per reply, meeting and deal
      description: |
        Scope: outcomes.read. Sends, replies, meetings, deals and spend over a
        period, for the workspace or per project or sequence, with cost per
        reply, per meeting, per held meeting and per deal. Spend tied to a
        sequence, project, mailbox or domain is charged to it directly; the
        rest is shared out by each row's share of emails sent. Usage recorded
        only as units (credits) is priced with the workspace's spend rates and
        reported as estimated; usage with no rate is listed under `unpriced`.
        Nothing is converted between currencies. group_by=brand compares
        brands (a row's brand is its sequence's or project's), and brand keeps
        the report to one brand.
      tags: [outcomes]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: group_by, in: query, schema: { type: string, enum: [none, project, sequence, brand], default: none } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mission_id, in: query, schema: { type: string, format: uuid }, description: "Only meetings, deals and spend recorded for this mission." }
        - { name: currency, in: query, schema: { type: string, default: USD, example: AUD } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutcomesReport" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/outcomes/export:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: exportOutcomes
      x-outflare-access: { scope: outcomes.read }
      summary: Export meetings, deals, spend or the report
      description: |
        Scope: outcomes.read. Rows for a warehouse or a spreadsheet, as CSV
        (default) or newline-delimited JSON. Up to 100,000 rows per call;
        narrow from and to for more. The report dataset takes the report's
        query parameters and defaults to group_by=sequence.
      tags: [outcomes]
      parameters:
        - { name: dataset, in: query, required: true, schema: { type: string, enum: [meetings, deals, spend, report] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson], default: csv } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: group_by, in: query, schema: { type: string, enum: [none, project, sequence, brand] } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: currency, in: query, schema: { type: string } }
      responses:
        "200":
          description: The file.
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/outcomes/syncs:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listOutcomeSyncs
      x-outflare-access: { scope: outcomes.read }
      summary: Calendar and CRM sync status
      description: "Scope: outcomes.read. Every connected calendar, booking tool and CRM, with when each stream (meetings, deals, push) last ran, what it changed and its last error. Syncs run every 15 minutes."
      tags: [outcomes]
      responses:
        "200":
          description: Sync status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/OutcomeSync" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/outcomes/syncs/{id}/run:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: The integration id. }
    post:
      operationId: runOutcomeSync
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Sync a calendar or CRM now
      description: "Scope: outcomes.manage. Queues a sync instead of waiting for the next one."
      tags: [outcomes]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/QueuedJob" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/meetings:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listMeetings
      x-outflare-access: { scope: outcomes.read }
      summary: List meetings with leads
      description: "Scope: outcomes.read. Newest first. Page with before=next_before."
      tags: [outcomes]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mission_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MeetingStatus" } }
        - { name: attributed, in: query, schema: { type: boolean }, description: Only meetings tied to outreach. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Meetings.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Meeting" } }
                  next_before: { type: [string, "null"], format: date-time }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMeeting
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Log a meeting
      description: |
        Scope: outcomes.manage. For meetings no connected calendar sees. Give
        lead_id or attendee_email; the meeting is tied to the sequence that
        last emailed that lead, unless sequence_id or project_id is given
        (which pins it). Status defaults to held for a meeting more than an
        hour in the past, otherwise booked.
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMeeting" }
      responses:
        "201":
          description: The meeting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/meetings/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMeeting
      x-outflare-access: { scope: outcomes.read }
      summary: Get a meeting
      description: "Scope: outcomes.read."
      tags: [outcomes]
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMeeting
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Mark a meeting held, no-show or qualified, or fix its attribution
      description: |
        Scope: outcomes.manage. Setting sequence_id, project_id or
        unattributed pins the attribution so syncs never move it. A status a
        person sets (held, no_show) is kept by syncs, unless the source
        cancels the meeting.
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingPatch" }
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMeeting
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a meeting
      description: "Scope: outcomes.manage. A synced meeting comes back on the next sync; mark it canceled or unattributed instead."
      tags: [outcomes]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/deals:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listDeals
      x-outflare-access: { scope: outcomes.read }
      summary: List deals
      description: "Scope: outcomes.read. Deals from the CRM, plus any logged by hand. Newest first."
      tags: [outcomes]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mission_id, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [open, won, lost] } }
        - { name: attributed, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Deals.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Deal" } }
                  next_before: { type: [string, "null"], format: date-time }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeal
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Log a deal
      description: "Scope: outcomes.manage. For workspaces without a connected CRM. Give meeting_id, lead_id or contact_email to tie it to outreach."
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewDeal" }
      responses:
        "201":
          description: The deal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/deals/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDeal
      x-outflare-access: { scope: outcomes.read }
      summary: Get a deal
      description: "Scope: outcomes.read."
      tags: [outcomes]
      responses:
        "200":
          description: The deal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateDeal
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a deal or its attribution
      description: "Scope: outcomes.manage. A deal synced from a CRM only takes attribution changes here; change its name, stage or amount in the CRM."
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealPatch" }
      responses:
        "200":
          description: The deal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDeal
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a deal
      description: "Scope: outcomes.manage. Removes the copy here only; the CRM is not touched."
      tags: [outcomes]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/spend:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listSpend
      x-outflare-access: { scope: outcomes.read }
      summary: List the spend ledger
      description: "Scope: outcomes.read. One-off charges, newest first. The ledger records cost; it never bills. Providers are paid directly."
      tags: [outcomes]
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mission_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/SpendCategory" } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SpendEntry" } }
                  next_before: { type: [string, "null"], format: date-time }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: recordSpend
      x-outflare-access: { scope: outcomes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Record spend
      description: |
        Scope: outcomes.manage. Give amount_cents when the money is known, or
        units with a unit_name (e.g. 1200 credit) to have reports price it
        with the workspace's rates. With a ref already in the ledger nothing
        is added and the existing entry comes back with 200, so retries never
        double count. project_id is filled from the sequence, mailbox or
        domain when left out.
      tags: [outcomes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSpend" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendEntry" }
        "200":
          description: The ref was recorded before; the existing entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/spend/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSpend
      x-outflare-access: { scope: outcomes.read }
      summary: Get a spend entry
      description: "Scope: outcomes.read."
      tags: [outcomes]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendEntry" }
        "404": { $ref: "#/components/responses/Error" }
