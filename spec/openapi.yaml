          type: [object, "null"]
          properties:
            kind: { type: string, enum: [sequence, team, manual_only] }
            sequence_id: { type: [string, "null"], format: uuid }
            team_id: { type: [string, "null"], format: uuid }
            until: { type: [string, "null"], format: date-time }
            note: { type: string }
