      responses:
        "200":
          description: The ended link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordRelationship" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}/timeline:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
    get:
