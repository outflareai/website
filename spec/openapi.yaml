components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token (oft_...) created in the workspace.
    session:
      type: apiKey
      in: cookie
      name: outflare_session
  parameters:
    Brand:
      name: brand
      in: query
      description: "Only records of this brand: its id or handle, none for records shared by every brand, or all (the default)."
      schema: { type: string }
    LogLevel:
      name: level
      in: query
      description: "info (worked), warning (refused, 4xx) or error (broke, 5xx); comma-separated for more than one."
      schema: { type: string }
      example: warning,error
    LogStatus:
      name: status
      in: query
      description: "Status codes (404) or classes (4xx), comma-separated."
      schema: { type: string }
      example: 4xx,500
    LogSurface:
      name: surface
      in: query
      description: "Where calls came from: web, api, mcp, cli, sdk or mission; comma-separated."
      schema: { type: string }
      example: mcp,mission
    LogMethod:
      name: method
      in: query
      description: HTTP methods, comma-separated.
      schema: { type: string }
      example: POST,DELETE
    LogOperation:
      name: operation
      in: query
      description: Operation ids from this document, comma-separated.
      schema: { type: string }
      example: createLead
    LogErrorCode:
      name: error_code
      in: query
      description: Error codes (GET /v1/error-codes), comma-separated.
      schema: { type: string }
      example: rate_limited
    LogMCPTool:
      name: mcp_tool
      in: query
      description: Only calls an MCP tool made.
      schema: { type: string }
      example: create_lead
    LogRequestID:
      name: request_id
      in: query
      schema: { type: string }
    LogActor:
      name: actor_id
      in: query
      description: Only calls by this actor (a person or token's actor_id).
      schema: { type: string, format: uuid }
    LogToken:
      name: token_id
      in: query
      description: Only calls made with this API token.
      schema: { type: string, format: uuid }
    LogMission:
      name: mission_id
      in: query
      description: Only calls made in this mission.
      schema: { type: string, format: uuid }
    LogProject:
      name: project_id
      in: query
      description: Only calls about this project.
      schema: { type: string, format: uuid }
    LogQuery:
      name: q
      in: query
      description: Text to find in the path, route, operation, error code, request id, MCP tool, agent or client.
      schema: { type: string, maxLength: 200 }
    LogSince:
      name: since
      in: query
      description: "From this time: a timestamp (2026-10-26T09:00:00Z) or how long ago (15m, 24h, 7d)."
      schema: { type: string }
      example: 24h
    LogUntil:
      name: until
      in: query
      description: Before this time, in the same forms as since.
      schema: { type: string }
    BrandRef:
      name: brand
      in: path
      required: true
      description: The brand's id or handle.
      schema: { type: string }
    RecordTypeKey:
      name: type
      in: path
      required: true
      description: "The record type's key: person, account or the workspace's own."
      schema: { type: string }
    RecordID:
      name: record
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: |
        next_cursor from the previous page, unchanged. Every paged list takes it, so one loop pages them all:
        call, then call again with cursor=next_cursor until next_cursor is null. Cursors are opaque; don't build them.
      schema: { type: string }
    Fields:
      name: fields
      in: query
      description: |
        Only these fields of each item, comma separated (fields=id,email,status); id always comes back.
        Paging fields stay. A field the items don't have answers 400 naming the ones they do. Any GET takes it.
      style: form
      explode: false
      schema: { type: array, items: { type: string, pattern: "^[a-z][a-z0-9_]*$" } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes the write safe to retry. A repeat with the same key from the same caller within 24 hours gets the first
        answer back (with `Idempotent-Replayed: true`) instead of running again. The same key for a different request
        is refused with 422 `idempotency_key_reused`; while the first is still running, 409 `idempotency_in_progress`.
        Use a new random key, such as a UUID, for each distinct write.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Agency:
      name: ag
      in: path
      required: true
      schema: { type: string, format: uuid }
    Workspace:
      name: ws
      in: path
      required: true
      description: The workspace ID, or its slug (its name in web app URLs). IDs never change; a slug can, so store IDs.
      schema: { type: string }
    Domain:
      name: domain
      in: path
      required: true
      schema: { type: string, example: acme.com }
    From:
      name: from
      in: query
      description: Start of the period, inclusive. A date (2026-10-01) or a time. Default 30 days before to.
      schema: { type: string, example: "2026-10-01" }
    To:
      name: to
      in: query
      description: End of the period. A date includes that whole day. Default now.
      schema: { type: string, example: "2026-10-31" }
    AnalyticsFrom:
      name: from
      in: query
      description: First day, inclusive (YYYY-MM-DD). Default 27 days before to.
      schema: { type: string, format: date, example: "2026-09-27" }
    AnalyticsTo:
      name: to
      in: query
      description: Last day, inclusive (YYYY-MM-DD). Default today (UTC).
      schema: { type: string, format: date, example: "2026-10-24" }
    AnalyticsFresh:
      name: fresh
      in: query
      description: true skips the short cache and asks the provider again.
      schema: { type: boolean, default: false }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MissionHeld:
      description: |
        Only for a call made inside a mission (with the Outflare-Mission header): the write did not run. It was recorded
        as a dry run, or held until a person approves it. Read mission_action to follow it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MissionHeld" }
  schemas:
    ErrorCode:
      type: object
      required: [code, statuses, description, retry]
      properties:
        code: { type: string, example: idempotency_in_progress }
        statuses: { type: array, items: { type: integer }, example: [409] }
        description: { type: string }
        retry: { type: boolean, description: True when the same request may succeed later (after Retry-After where given). }
    Job:
      type: object
      required: [id, kind, status, attempts, max_attempts, error, run_at, created_at, updated_at]
      properties:
        id: { type: string, example: job_1042 }
        kind: { type: string, example: analytics.sync }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: queued also covers a job waiting to retry after a failed attempt (see attempts and error).
        attempts: { type: integer }
        max_attempts: { type: integer }
        error: { type: [string, "null"], description: "The last attempt's error, if it failed." }
        run_at: { type: string, format: date-time, description: When the job runs next (or ran). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LogEntry:
      type: object
      description: One API call. Only what describes the call is kept, never bodies, query values, headers or keys.
      required: [id, request_id, created_at, level, method, route, operation, path, query_keys, status, duration_ms, error_code, error_param, surface, client, mcp_tool, agent, user_agent, mission_id, actor_id, actor_type, actor_name, token_id, brand_id, project_id]
      properties:
        id: { type: string, example: log_48213 }
        request_id: { type: string, description: The X-Request-Id header and request_id in error bodies. }
        created_at: { type: string, format: date-time }
        level: { type: string, enum: [info, warning, error], description: "info: worked. warning: refused (4xx). error: broke (5xx)." }
        method: { type: string, example: POST }
        route: { type: string, example: "POST /v1/workspaces/{ws}/leads" }
        operation: { type: string, example: createLead, description: "The operationId in this document, or the route when it has none." }
        path: { type: string, example: /v1/workspaces/acme/leads }
        query_keys: { type: array, items: { type: string }, description: "The query parameters' names, never their values." }
        status: { type: integer, example: 201 }
        duration_ms: { type: integer }
        error_code: { type: [string, "null"], example: null, description: "The error's code from GET /v1/error-codes, for a refused or failed call." }
        error_param: { type: [string, "null"], example: null, description: "The field an invalid request named, such as email (never its value), or the scope a forbidden call was missing, such as leads.manage." }
        surface: { type: string, enum: [web, api, mcp, cli, sdk, mission] }
        client: { type: [string, "null"], description: "The Outflare-Client header, such as mcp/0.1.0." }
        mcp_tool: { type: [string, "null"], example: create_lead }
        agent: { type: [string, "null"], description: "The agent's app, such as claude-desktop." }
        user_agent: { type: [string, "null"] }
        mission_id: { type: [string, "null"] }
        actor_id: { type: [string, "null"] }
        actor_type: { type: [string, "null"], example: api_token }
        actor_name: { type: [string, "null"], description: The person's or token's name. }
        token_id: { type: [string, "null"] }
        brand_id: { type: [string, "null"], description: "The brand the call was about, when it named one." }
        project_id: { type: [string, "null"] }
    QueuedJob:
      type: object
      required: [queued, job]
      description: Work was queued as a job. Follow it with GET job.url (also in the Location header).
      properties:
        queued: { type: boolean, enum: [true] }
        job:
          type: object
          required: [id, url]
          properties:
            id: { type: string, example: job_1042 }
            url: { type: string, example: /v1/workspaces/acme/jobs/job_1042 }
    NextCursor:
      type: [string, "null"]
      description: Pass as cursor to get the next page; null on the last page.
    WebhookEventType:
      type: object
      required: [type, category, description]
      properties:
        type: { type: string, example: lead.replied }
        category: { type: string, example: replies }
        description: { type: string }
    WebhookEndpoint:
      type: object
      required: [id, url, description, events, categories, enabled, disabled_reason, failing_since, last_success_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        description: { type: string }
        events:
          type: array
          items: { type: string }
          description: 'Event types, category wildcards ("lead.*") or "*".'
        categories:
          type: array
          items: { type: string }
          description: Reply labels this endpoint hears about; empty for every label. Events without a label are always sent.
        enabled: { type: boolean }
        disabled_reason:
          type: [string, "null"]
          description: Why the endpoint is off, when Outflare or a person turned it off.
        failing_since:
          type: [string, "null"]
          format: date-time
          description: When deliveries started failing; null while they succeed. After five days the endpoint is turned off.
        last_success_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        brand_id: { type: [string, "null"], format: uuid, description: "Set when the endpoint gets only this brand's events." }
    WebhookEndpointWithSecret:
      allOf:
        - { $ref: "#/components/schemas/WebhookEndpoint" }
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The signing secret (whsec_...). Verify deliveries with any Standard Webhooks library.
              example: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048, example: "https://example.com/hooks/outflare" }
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
          description: 'Event types (GET /v1/webhook-events), category wildcards such as "lead.*", or "*" for all. Default ["*"].'
          example: [lead.replied, lead.bounced, mailbox.auto_paused]
        categories:
          type: array
          maxItems: 20
          items: { type: string }
          description: "Only replies with these labels: categories (interested, ...) or groups (hot, later, closed, automatic), stored as labels. Empty for all."
          example: [hot]
        brand: { type: [string, "null"], description: "A brand's id or handle: send only events about that brand's records. Null or left out for every brand's.", example: repocket }
        enabled: { type: boolean, description: Default true. }
    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 200 }
        events: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        categories:
          type: array
          maxItems: 20
          items: { type: string }
          description: "Only replies with these labels: categories (interested, ...) or groups (hot, later, closed, automatic), stored as labels. Empty for all."
          example: [hot]
        enabled: { type: boolean }
        brand: { type: [string, "null"], description: "A brand's id or handle for only its events, or null for every brand's." }
    WebhookDeliveryStatus:
      type: string
      enum: [pending, delivered, failed, cancelled]
      description: pending while it is being tried (and retried), delivered on a 2xx answer, failed once retries ran out, cancelled if the endpoint was turned off first.
    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, status, attempts, last_status_code, last_error, last_attempt_at, delivered_at, created_at, payload]
      properties:
        id: { type: integer }
        event_id: { type: string, description: "The webhook-id header: the same for every try and redelivery." }
        event_type: { type: string }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        attempts: { type: integer }
        last_status_code: { type: [integer, "null"], description: "The receiver's answer; null when there was none (timeout, refused)." }
        last_error: { type: [string, "null"] }
        last_attempt_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/WebhookEvent" }
    WebhookRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string, description: "For an actor: human, api_token, agent or system. For a target: the record type, such as lead or mailbox." }
        id: { type: [string, "null"] }
    WebhookEvent:
      type: object
      description: The JSON body of every webhook delivery.
      required: [id, type, created_at, workspace_id, actor, target, request_id, data]
      properties:
        id: { type: string, description: "Unique per event, and the webhook-id header. Use it to ignore repeats.", example: evt_48213 }
        type: { type: string, enum: [lead.replied, lead.unsubscribed, inbox.replied, inbox.updated, inbox.classified, lead.bounced, mailbox.auto_paused, lead.created, lead.updated, lead.deleted, leads.imported, suppressions.added, suppression.removed, lead_list.created, lead_list.leads_added, lead_list.run_started, lead_list.build_done, lead_list.build_failed, lead_list.refresh_done, lead_list.refresh_failed, lead_list.enrich_done, lead_list.enrich_failed, import.done, import.failed, sequence.created, sequence.updated, sequence.activated, sequence.paused, sequence.archived, sequence.deleted, sequence.steps_updated, sequence.leads_enrolled, enrollment.stopped, mailbox.imported, mailbox.updated, mailbox.paused, mailbox.resumed, mailbox.stage_changed, mailbox.deleted, domain.added, domain.paused, domain.resumed, domain.removed, email.queued, email.sent, email.delivered, email.bounced, email.complained, email.failed, email.suppressed, email.cancelled, email.unsubscribed, email.opened, email.clicked, email.preferences_changed, email_domain.verified, email_domain.verification_failed, email_provider.events_failed, email_template.published, meeting.created, meeting.updated, meeting.deleted, deal.created, deal.updated, deal.deleted, spend.recorded, integration.connected, integration.updated, integration.disconnected, connect_request.created, project.created, project.updated, project.deleted, mission.created, mission.updated, mission.submitted, mission.approved, mission.paused, mission.resumed, mission.stopped, mission.completed, mission.action_held, mission.action_approved, mission.action_rejected, infra.plan_created, infra.plan_approved, infra.ordered, infra.order_failed, infra.domains_bought, infra.mailbox_joined, infra.plan_warming, infra.plan_ready, infra.plan_cancelled, workspace.updated, webhook.test] }
        created_at: { type: string, format: date-time }
        workspace_id: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/WebhookRef" }
        target:
          oneOf:
            - { $ref: "#/components/schemas/WebhookRef" }
            - { type: "null" }
        request_id: { type: [string, "null"], description: "The API request that made the change, if one did (same as the audit log)." }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand of the changed record, when it has one." }
        data:
          type: object
          additionalProperties: true
          description: What changed. Fields depend on the type; new ones may be added.
    EmailBisonCompatCall:
      type: object
      required: [method, path, query_keys, body_keys, status, supported, user_agent, created_at]
      properties:
        method: { type: string }
        path: { type: string, description: "Path after /emailbison/{ws}, e.g. /api/sender-emails." }
        query_keys: { type: array, items: { type: string } }
        body_keys: { type: array, items: { type: string }, description: "Field names sent, one level deep (sender_emails[].email). Never values." }
        status: { type: integer }
        supported: { type: boolean }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
    TelemetryOffReason:
      description: Why usage stats are off; null when on. env is OUTFLARE_TELEMETRY or DO_NOT_TRACK, setting is the owner's choice, build is a build that turns it off (the hosted Cloud), no_endpoint is a build with nowhere to send it.
      type: [string, "null"]
      enum: [env, setting, build, no_endpoint, null]
    TelemetryNotice:
      type: object
      required: [id, severity, title]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        url: { type: string }
    TelemetryStatus:
      type: object
      required: [enabled, disabled_by, endpoint, instance_id, version, last_sent_at, last_error, latest_version, update_available, notices, changed_at, can_change]
      properties:
        enabled: { type: boolean }
        disabled_by: { $ref: "#/components/schemas/TelemetryOffReason" }
        endpoint: { type: [string, "null"], description: Where reports go. }
        instance_id: { type: string, format: uuid, description: Random id naming this install; nothing else. }
        version: { type: string }
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        latest_version: { type: [string, "null"] }
        update_available: { type: boolean }
        notices:
          type: array
          items: { $ref: "#/components/schemas/TelemetryNotice" }
        changed_at: { type: [string, "null"], format: date-time }
        can_change: { type: boolean, description: True for the person who set up the server. }
    TelemetryCounts:
      description: Each count is a range such as "6-10", never exact.
      type: object
      required: [users, workspaces, mailboxes, active_mailboxes, leads, active_sequences, sent_24h, replies_24h, projects, missions, api_tokens, active_users_7d]
      properties:
        users: { type: string }
        workspaces: { type: string }
        mailboxes: { type: string }
        active_mailboxes: { type: string }
        leads: { type: string }
        active_sequences: { type: string }
        sent_24h: { type: string }
        replies_24h: { type: string }
        projects: { type: string }
        missions: { type: string }
        api_tokens: { type: string }
        active_users_7d: { type: string }
    TelemetryReport:
      type: object
      required: [schema, instance_id, version, os, arch, go_version, container, postgres_major, install_age_days, counts, connectors]
      properties:
        schema: { type: integer }
