        last_used_at: { type: [string, "null"], format: date-time }
        project_id: { type: [string, "null"], format: uuid, description: "The project this token is bound to, or null for the whole workspace." }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand this token is bound to, or null." }
        daily_send_budget: { type: [integer, "null"], description: Most emails a day across sequences this token started. Null is no budget. }
        max_priority: { type: [string, "null"], enum: [low, normal, high, null], description: Highest sequence priority this token may set. }
        may_take_mailboxes: { type: boolean, description: "Whether its sequences may take mailboxes from lower-priority sequences without the owner's approval. Off by default." }
        default_team_id: { type: [string, "null"], format: uuid, description: Team for sequences it creates without one. }
    APITokenLimits:
      type: object
      properties:
        name: { type: string, description: "A new name. It shows in the audit log next to everything the token does." }
        scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Scope" }, description: "Replaces the token's scopes. Takes effect on its next request." }
        daily_send_budget: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        max_priority: { type: [string, "null"], enum: [low, normal, high, null] }
        may_take_mailboxes: { type: boolean }
        default_team_id: { type: [string, "null"], format: uuid }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        actor_id: { type: [string, "null"] }
        actor_type: { type: string }
        actor_name: { type: [string, "null"] }
        action: { type: string, example: member.role_changed }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        data: { type: object }
        created_at: { type: string, format: date-time }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand of the changed record, when it has one." }
    MailboxStatus:
      type: string
      enum: [verifying, active, paused, error]
    Mailbox:
      type: object
      required: [id, email, domain, display_name, provider, auth_method, smtp_host, smtp_port, smtp_username, imap_host, imap_port, imap_username, status, status_reason, daily_limit, min_gap_seconds, smtp_ok, imap_ok, last_verified_at, last_synced_at, sync_error, source, pool_id, pool_name, warmup, sender, suggested_sender_id, assignment, lock, has_login, server_id, server_host, platforms, lifecycle, created_at, updated_at]
      properties:
        lifecycle:
          type: object
          required: [stage, reason, until, changed_at, auto_rest, plan_id]
          description: Where the mailbox is in its working life. Only ready mailboxes send cold email.
          properties:
            stage: { $ref: "#/components/schemas/LifecycleStage" }
            reason: { type: string }
            until: { type: [string, "null"], format: date-time, description: "Warming: the earliest it can be ready. Resting: when the rest ends." }
            changed_at: { type: string, format: date-time }
            auto_rest: { type: boolean }
            plan_id: { type: [string, "null"], format: uuid, description: The infrastructure plan that built it. }
        id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        display_name: { type: string }
        provider: { type: string, enum: [google, microsoft, other, simulated], description: "simulated: a test workspace's mailbox, which delivers nothing." }
        project_id: { type: [string, "null"], format: uuid, description: "The project that owns the mailbox; it then sends only for that project's sequences. Null: shared by the workspace." }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand that owns it, or null when shared by every brand. In a project it is the project's brand." }
        auth_method: { type: string, enum: [password, oauth] }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        status: { $ref: "#/components/schemas/MailboxStatus" }
        status_reason: { type: [string, "null"], description: Why the last connection check failed. }
        daily_limit: { type: integer, minimum: 1, maximum: 500 }
        min_gap_seconds: { type: integer, minimum: 0, maximum: 3600, description: Least time between two sends from this mailbox. }
        smtp_ok: { type: [boolean, "null"] }
        imap_ok: { type: [boolean, "null"] }
        last_verified_at: { type: [string, "null"], format: date-time }
        last_synced_at: { type: [string, "null"], format: date-time, description: When the inbox was last checked for new mail. }
        sync_error: { type: [string, "null"], description: Why the last inbox sync failed. }
        source: { type: string, example: csv }
        pool_id: { type: [string, "null"], format: uuid }
        pool_name: { type: [string, "null"] }
        server_id: { type: [string, "null"], format: uuid, description: "The sending server it signs in to; null for Google and Microsoft mailboxes." }
        server_host: { type: [string, "null"] }
        warmup: { $ref: "#/components/schemas/MailboxWarmup" }
        sender:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            confirmed: { type: boolean }
        suggested_sender_id: { type: [string, "null"], format: uuid }
        assignment:
          type: [object, "null"]
          description: The sequence this mailbox sends for now. Null when free.
          properties:
            sequence_id: { type: string, format: uuid }
            sequence_name: { type: string }
            state: { type: string, enum: [active, draining] }
            next_sequence_id: { type: [string, "null"], format: uuid }
            source: { type: string, enum: [manual, automatic, external] }
            reason: { type: string }
            platform: { type: [string, "null"], description: The sequencer it sends through for this sequence. Null when Outflare sends. }
            confirmed: { type: boolean, description: False until the platform shows the mailbox on the campaign. }
        lock:
          type: [object, "null"]
          properties:
            kind: { type: string, enum: [sequence, team, manual_only] }
            sequence_id: { type: [string, "null"], format: uuid }
            team_id: { type: [string, "null"], format: uuid }
            until: { type: [string, "null"], format: date-time }
            note: { type: string }
        has_login:
          type: boolean
          description: False for a mailbox Outflare only knows from an outside sequencer. It can be allocated to that platform's campaigns, but Outflare cannot send from it, sync its inbox or warm it up.
        platforms:
          type: array
          description: What each connected sequencer account reports about it.
          items:
            type: object
            properties:
              integration_id: { type: string, format: uuid }
              platform: { type: string }
              status: { type: string, enum: [ok, paused, error, disconnected] }
              status_reason: { type: [string, "null"] }
              daily_limit: { type: [integer, "null"] }
              warmup_enabled: { type: boolean, description: "Whether that sequencer's own warm-up is on for it, whoever runs warm-up in Outflare." }
              warmup_score: { type: [integer, "null"] }
              campaigns: { type: integer, description: Live campaigns it is on there. }
              observed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MailboxWarmup:
      type: object
      description: "Warm-up settings. A connected sequencer runs the warm-up; its view, including its warm-up score, is in `platform`. The 7-day counts, `daily_target`, `reply_rate`, `today_target`, `last_error` and `inbox_rate` were for Outflare's own warm-up, which is gone, and run down to zero or null."
      required: [enabled, daily_target, reply_rate, started_at, today_target, sent_7d, inbox_7d, spam_7d, missing_7d, failed_7d, last_error, provider, platform, waiting_on, inbox_rate]
      properties:
        enabled: { type: boolean }
        daily_target: { type: integer, minimum: 1, maximum: 100, deprecated: true, description: Outflare's own warm-up only. }
        reply_rate: { type: integer, minimum: 0, maximum: 100, deprecated: true, description: Outflare's own warm-up only. }
        started_at: { type: [string, "null"], format: date-time, description: When warm-up was last turned on. }
        today_target: { type: integer, deprecated: true, description: Outflare's own warm-up only; always 0. }
        sent_7d: { type: integer, deprecated: true }
        inbox_7d: { type: integer, deprecated: true, description: Sent warm-up mail found in the recipient's inbox. }
        spam_7d: { type: integer, deprecated: true, description: "Found in spam, and moved to the inbox." }
        missing_7d: { type: integer, deprecated: true, description: Not found within two days. }
        failed_7d: { type: integer, deprecated: true, description: Warm-up sends the mailbox's SMTP server refused. }
        last_error: { type: [string, "null"], deprecated: true, description: Why the latest warm-up send failed. }
        provider: { type: string, description: "The id of the connected sequencer (integration) that runs the warm-up, or outflare when none does. A mailbox a sequencer already warms up when it is first synced takes that sequencer as its provider." }
        platform:
          type: [object, "null"]
          description: The sequencer's own view of its warm-up, as of its last sync; null when no sequencer runs it.
          required: [integration_id, name, enabled, score, observed_at]
          properties:
            integration_id: { type: string, format: uuid }
            name: { type: string }
            enabled: { type: boolean, description: Whether the sequencer shows its warm-up on for this mailbox. }
            score: { type: [integer, "null"], description: "The sequencer's warm-up score, 0 to 100." }
            observed_at: { type: [string, "null"], format: date-time }
        waiting_on:
          type: [string, "null"]
          enum: [another_mailbox, connection, paused, platform, null]
          description: "platform while warm-up is on here but the sequencer running it doesn't show it on yet; null otherwise. another_mailbox, connection and paused were for Outflare's own warm-up and no longer occur."
        inbox_rate: { type: [number, "null"], minimum: 0, maximum: 1, deprecated: true, description: "inbox_7d over all placed messages; null until any are placed." }
    WarmupSettings:
      type: object
      description: Unset fields are left as they are.
      properties:
        enabled: { type: boolean }
        daily_target: { type: integer, minimum: 1, maximum: 100, deprecated: true, description: "Outflare's own warm-up only, which is gone: accepted and ignored." }
        reply_rate: { type: integer, minimum: 0, maximum: 100, deprecated: true, description: "Outflare's own warm-up only, which is gone: accepted and ignored." }
        provider:
          type: string
          description: "The id of a connected sequencer with the control.warmup capability (EmailBison, Instantly, Smartlead), which runs the warm-up with its own. The mailboxes must be in that sequencer's account. On the bulk endpoint without mailbox_ids or pool_id, it applies to every mailbox that sequencer has. outflare is accepted only with enabled false, and detaches the mailboxes from their sequencer's warm-up; Outflare doesn't send warm-up mail itself."
    WarmupDay:
      type: object
      required: [date, sent, inbox, spam, missing, replies]
      properties:
        date: { type: string, format: date }
        sent: { type: integer }
        inbox: { type: integer }
        spam: { type: integer }
        missing: { type: integer }
        replies: { type: integer, description: Warm-up replies this mailbox received. }
    MailboxInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        display_name: { type: string }
        provider: { type: string, enum: [google, microsoft, other] }
        password: { type: string, description: App password used for both SMTP and IMAP. }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        smtp_password: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        imap_password: { type: string }
        pool: { type: string, description: Pool name. Created if missing. }
        daily_limit: { type: integer, minimum: 1, maximum: 500 }
    ImportResult:
      type: object
      required: [created, updated, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [line, error]
            properties:
              line: { type: integer, description: Line number in the file. }
              email: { type: string }
              error: { type: string }
    OAuthConnection:
      type: object
      required: [id, provider, name, details, mailbox_count, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, microsoft] }
        name: { type: string }
        details:
          type: object
          description: "Non-secret identifiers: client_email and client_id for Google, tenant_id and client_id for Microsoft."
          additionalProperties: { type: string }
        mailbox_count: { type: integer }
        created_at: { type: string, format: date-time }
    MailboxPool:
      type: object
      required: [id, name, mailboxes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mailboxes: { type: integer }
        created_at: { type: string, format: date-time }
    SendingDomain:
      type: object
      required: [domain, status, daily_limit, notes, source, health, issues, mx_provider, mx_hosts, spf, spf_record, dkim, dkim_selector, dmarc, dmarc_record, dmarc_policy, blocklists, checked_at, mailboxes, mailbox_counts, daily_capacity, sent_24h, sent_7d, replies_7d, bounces_7d, warmup, created_at, updated_at]
      properties:
        domain: { type: string, example: acme.com }
        status: { type: string, enum: [active, paused], description: "paused: no sequence or test sends from the domain's mailboxes." }
        daily_limit: { type: [integer, "null"], description: Cap on sends from all the domain's mailboxes together in 24 hours. Null is no domain cap. }
        project_id: { type: [string, "null"], format: uuid, description: "The project that owns the domain, or null when shared. Move it with POST /projects/{id}/add." }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand that owns it, or null when shared by every brand. In a project it is the project's brand." }
        notes: { type: string }
        source: { type: string, enum: [mailbox, manual, plan], description: "mailbox: added when a mailbox on it was connected. manual: added by hand. plan: bought by an infrastructure plan." }
        health: { type: string, enum: [healthy, warning, critical, pending], description: The most severe issue; pending until the first check. }
        issues:
          type: array
          description: What to fix, most severe first.
          items: { $ref: "#/components/schemas/DomainIssue" }
        mx_provider: { type: [string, "null"], enum: [google, microsoft, other, none, null] }
        mx_hosts: { type: array, items: { type: string }, description: MX hosts by preference. }
        spf: { type: string, enum: [pass, missing, invalid, pending] }
        spf_record: { type: [string, "null"] }
        dkim: { type: string, enum: [pass, missing, pending] }
        dkim_selector: { type: [string, "null"] }
        dmarc: { type: string, enum: [pass, none_policy, missing, pending] }
        dmarc_record: { type: [string, "null"] }
        dmarc_policy: { type: [string, "null"], enum: [none, quarantine, reject, null] }
        blocklists:
          type: array
          items: { $ref: "#/components/schemas/BlocklistResult" }
        checked_at: { type: [string, "null"], format: date-time, description: When DNS and blocklists were last checked. Null until the first check. }
        mailboxes: { type: integer, description: Mailboxes on the domain. }
        mailbox_counts:
          type: object
          required: [active, error, paused, verifying]
          properties:
            active: { type: integer }
            error: { type: integer }
            paused: { type: integer }
            verifying: { type: integer }
        daily_capacity: { type: integer, description: "Sum of the daily limits of active mailboxes, held to the domain cap. 0 while paused." }
        sent_24h: { type: integer }
        sent_7d: { type: integer }
        replies_7d: { type: integer, description: Replies from people to the domain's mailboxes. }
        bounces_7d: { type: integer }
        warmup:
          type: object
          description: Warm-up across the domain's mailboxes, last 7 days.
          required: [warming, placed_7d, inbox_7d, inbox_rate]
          properties:
            warming: { type: integer, description: Active mailboxes with warm-up on. }
            placed_7d: { type: integer, description: Warm-up emails whose landing place is known. }
            inbox_7d: { type: integer }
            inbox_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SendingDomainDetail:
      allOf:
        - { $ref: "#/components/schemas/SendingDomain" }
        - type: object
          required: [daily]
          properties:
            daily:
              type: array
              description: The last 14 days by UTC date, oldest first.
              items:
                type: object
                required: [date, sent, replies, bounces]
                properties:
                  date: { type: string, format: date }
                  sent: { type: integer }
                  replies: { type: integer }
                  bounces: { type: integer }
    DomainIssue:
      type: object
      required: [code, severity, title, detail]
      properties:
        code:
          type: string
          description: Stable identifier for agents.
          enum: [paused, no_mailboxes, mailboxes_failing, blocklisted, bounce_rate, spf_missing, spf_multiple, spf_provider, spf_permissive, dkim_missing, dmarc_missing, dmarc_none, mx_missing]
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        detail: { type: string, description: Why it matters and how to fix it. }
        record:
          type: object
          description: A DNS record to publish, when the fix is one.
          required: [type, host, value]
          properties:
            type: { type: string, example: TXT }
            host: { type: string, description: "Relative to the domain: @ is the domain itself.", example: _dmarc }
            value: { type: string, example: "v=DMARC1; p=none" }
    SendingServer:
      type: object
      required: [id, host, name, ips, ips_source, status, paused_by, status_reason, pause_on_listing, daily_limit, notes, health, issues, blocklists, checked_at, mailboxes, mailbox_counts, domains, daily_capacity, sent_24h, sent_7d, replies_7d, bounces_7d, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        host: { type: string, example: smtp.mailreef-box.example, description: The SMTP host its mailboxes sign in to. }
        name: { type: string, description: A label you choose; empty by default. }
        ips: { type: array, items: { type: string }, description: Addresses mail leaves from. }
        ips_source: { type: string, enum: [dns, manual], description: "dns: the host's A and AAAA records, refreshed on every check. manual: set by hand." }
        status: { type: string, enum: [active, paused], description: "paused: no sequence or test sends from its mailboxes." }
        paused_by: { type: [string, "null"], enum: [person, blocklist, null], description: "blocklist: paused by a check that found a listed IP; lifts itself once every IP is clear." }
        status_reason: { type: [string, "null"], description: Why it was paused automatically. }
        pause_on_listing: { type: boolean }
        daily_limit: { type: [integer, "null"], description: Cap on sends from all its mailboxes together in 24 hours. Null is no server cap. }
        notes: { type: string }
        health: { type: string, enum: [healthy, warning, critical, pending], description: The most severe issue; pending until the first check. }
        issues:
          type: array
          description: What to fix, most severe first.
          items: { $ref: "#/components/schemas/ServerIssue" }
        blocklists:
          type: array
          description: Each IP on each IP blocklist (Spamhaus ZEN, SpamCop, Barracuda). IPv6 addresses are reported as unknown for now.
          items:
            allOf:
              - { $ref: "#/components/schemas/BlocklistResult" }
              - type: object
                required: [ip]
                properties:
                  ip: { type: string }
        checked_at: { type: [string, "null"], format: date-time, description: When IPs and blocklists were last checked. Null until the first check. }
        mailboxes: { type: integer, description: Mailboxes that sign in to it. }
        mailbox_counts:
          type: object
          required: [active, error, paused, verifying]
          properties:
            active: { type: integer }
            error: { type: integer }
            paused: { type: integer }
            verifying: { type: integer }
        domains: { type: array, items: { type: string }, description: Domains of its mailboxes. }
        daily_capacity: { type: integer, description: "Sum of the daily limits of active mailboxes, held to the server cap. 0 while paused." }
        sent_24h: { type: integer }
        sent_7d: { type: integer }
        replies_7d: { type: integer }
        bounces_7d: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServerIssue:
      type: object
      required: [code, severity, title, detail]
      properties:
        code:
          type: string
          description: Stable identifier for agents.
          enum: [paused, no_mailboxes, mailboxes_failing, no_ips, ip_blocklisted, bounce_rate, no_server_limit]
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        detail: { type: string, description: Why it matters and how to fix it. }
    BlocklistResult:
      type: object
      required: [name, zone, status]
      properties:
        name: { type: string, example: Spamhaus DBL }
        zone: { type: string, example: dbl.spamhaus.org }
        status: { type: string, enum: [clear, listed, unknown], description: "unknown: the list refused the query, often because the server uses a public DNS resolver." }
        detail: { type: string }
    Lead:
      type: object
      required: [id, email, domain, first_name, last_name, company, title, phone, linkedin_url, website, custom, source, suppressed, verification, list_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        title: { type: string }
        phone: { type: string }
        linkedin_url: { type: string }
        website: { type: string }
        custom:
          type: object
          description: Extra imported columns, keyed by snake_case header.
          additionalProperties: { type: string }
        source: { type: string, example: csv }
        suppressed: { type: boolean, description: On the suppression list by address or domain. }
        verification:
          type: [string, "null"]
          enum: [deliverable, undeliverable, risky, unknown, null]
          description: Latest email verification result; null until the address has been checked. Details at GET /verifications.
        list_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LeadInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        title: { type: string }
        phone: { type: string }
        linkedin_url: { type: string }
        website: { type: string }
        custom:
          type: object
          additionalProperties: { type: string }
        list_id: { type: string, format: uuid }
    LeadImportResult:
      type: object
      required: [created, updated, duplicates, suppressed, errors, list_id]
      properties:
        created: { type: integer }
        updated: { type: integer }
        duplicates: { type: integer, description: Rows merged into an earlier row with the same email. }
        suppressed: { type: integer, description: Imported leads that are on the suppression list. }
        errors:
          type: array
          items:
            type: object
            required: [line, error]
            properties:
              line: { type: integer }
              email: { type: string }
              error: { type: string }
        list_id: { type: [string, "null"], format: uuid }
    PeopleFilter:
      type: object
      description: >-
        A people search in shared terms. Each field lists alternatives (any
        may match); fields combine (all must match). GET /data-providers says
        which filters each provider understands.
      properties:
        titles: { type: array, maxItems: 50, items: { type: string }, example: [head of sales, vp sales] }
        seniorities:
          type: array
          maxItems: 50
          items: { type: string, enum: [owner, founder, c_suite, partner, vp, head, director, manager, senior, entry, intern] }
        industries: { type: array, maxItems: 50, items: { type: string } }
        employee_ranges:
          type: array
          maxItems: 50
          items: { type: string, example: 11-50 }
          description: "Company sizes as min-max, or min+ for open-ended: 1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5001-10000, 10001+."
        locations: { type: array, maxItems: 50, items: { type: string }, description: Where the person is. }
        company_locations: { type: array, maxItems: 50, items: { type: string }, description: Where the company is based. }
        company_domains: { type: array, maxItems: 50, items: { type: string }, example: [acme.com] }
        keywords: { type: array, maxItems: 50, items: { type: string } }
    LeadListInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        project_id: { type: [string, "null"], format: uuid, description: Null shares the list with the whole workspace. }
        search_integration_id: { type: [string, "null"], format: uuid, description: The connected provider that searches. Null makes a manual list. }
        filters: { $ref: "#/components/schemas/PeopleFilter" }
        enrich_integration_ids:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
          description: Providers that find missing emails, tried in order until one answers. Empty uses the search provider if it can.
        max_leads: { type: integer, minimum: 1, maximum: 50000, description: "Most new leads one run adds. Default 500." }
        credit_cap: { type: [number, "null"], minimum: 0, description: Most provider credits one run spends. Null for no cap. }
        verify: { type: boolean, description: "Verify new addresses and leave out ones the workspace's verification settings block. Default true." }
        verified_emails_only: { type: boolean, description: "Only add addresses the provider itself verified. Default false." }
        skip_contacted_days: { type: integer, minimum: 0, maximum: 3650, description: "Leave out people any sequence emailed in this many days. 0 turns it off. Default 90." }
        skip_in_sequences: { type: boolean, description: "Leave out people active in another sequence. Default true." }
        min_score: { type: integer, minimum: 0, maximum: 100, description: "Leave out people whose ICP fit is below this, before spending credits. Default 0." }
        refresh_every_days: { type: [integer, "null"], minimum: 1, maximum: 365, description: Refresh on a schedule. Null refreshes only when asked. }
    LeadList:
      type: object
      required: [id, name, description, project_id, brand_id, kind, leads, search_integration_id, filters, enrich_integration_ids, max_leads,
        credit_cap, verify, verified_emails_only, skip_contacted_days, skip_in_sequences, min_score, refresh_every_days,
        next_refresh_at, last_run, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand that owns it, or null when shared by every brand. In a project it is the project's brand." }
        kind: { type: string, enum: [manual, search] }
        leads: { type: integer }
        search_integration_id: { type: [string, "null"], format: uuid }
        filters: { $ref: "#/components/schemas/PeopleFilter" }
        enrich_integration_ids: { type: array, items: { type: string, format: uuid } }
        max_leads: { type: integer }
        credit_cap: { type: [number, "null"] }
        verify: { type: boolean }
        verified_emails_only: { type: boolean }
        skip_contacted_days: { type: integer }
        skip_in_sequences: { type: boolean }
        min_score: { type: integer }
        refresh_every_days: { type: [integer, "null"] }
        next_refresh_at: { type: [string, "null"], format: date-time }
        last_run:
          oneOf:
            - $ref: "#/components/schemas/ListRun"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LeadListMember:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          required: [score, score_reasons, added_at, run_id]
          properties:
            score: { type: [integer, "null"], minimum: 0, maximum: 100, description: ICP fit. Null when the list and its project have no profile. }
            score_reasons: { type: array, items: { type: string }, example: [+ title, "- company size"] }
            added_at: { type: string, format: date-time }
            run_id: { type: [string, "null"], format: uuid }
    DataPerson:
      type: object
      description: A person as a provider described them.
      properties:
        provider_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        title: { type: string }
        seniority: { type: string }
        email: { type: string }
        email_status: { type: string, enum: [verified, guessed, ""] }
        phone: { type: string }
        linkedin_url: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        has_email: { type: boolean }
        company:
          type: object
          properties:
            name: { type: string }
            domain: { type: string }
            website: { type: string }
            industry: { type: string }
            employees: { type: integer }
            linkedin_url: { type: string }
            location: { type: string }
    ListRun:
      type: object
      required: [id, list_id, project_id, kind, status, params, found, total_matches, added, enriched, skipped, credits,
        credits_by, sample, stop_reason, error, requested_by, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: [string, "null"], format: uuid }
        project_id: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [preview, build, refresh, enrich] }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        params: { type: object, additionalProperties: true, description: The settings the run used. }
        found: { type: integer, description: "People the search returned (or leads looked at, for enrich)." }
        total_matches: { type: [integer, "null"], description: Matches the provider reported. }
        added: { type: integer }
        enriched: { type: integer, description: People a provider filled in. }
        skipped:
          type: object
          description: "Why people were left out: already_in_list, low_score, no_email, unverified, suppressed, contacted, in_sequence, undeliverable."
          additionalProperties: { type: integer }
        credits: { type: number }
        credits_by: { type: object, additionalProperties: { type: number }, description: Credits by integration id. }
        sample: { type: array, items: { $ref: "#/components/schemas/DataPerson" }, description: Preview results. }
        stop_reason: { type: [string, "null"], description: "Why the run stopped early, e.g. the credit cap." }
        error: { type: [string, "null"] }
        requested_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    DataProvider:
      type: object
      required: [connector, name, summary, website, docs_url, key_url, auth, fields, pricing, status, capabilities, filters, integrations]
      properties:
        connector: { type: string, example: apollo }
        name: { type: string }
        summary: { type: string }
        website: { type: string }
        docs_url: { type: string }
        key_url: { type: string, description: Where to find the API key. }
        auth: { type: string, enum: [api_key, oauth2, none] }
        fields:
          type: array
          description: What to paste to connect it with POST /integrations.
          items:
            type: object
            required: [name, label, secret, optional]
            properties:
              name: { type: string }
              label: { type: string }
              secret: { type: boolean }
              optional: { type: boolean }
              placeholder: { type: string }
              help: { type: string }
        pricing: { type: string }
        status: { type: string, enum: [available, planned] }
        capabilities: { type: array, items: { type: string } }
        filters: { type: array, items: { type: string }, description: Filters its search understands. Empty if it cannot search. }
        integrations:
          type: array
          items:
            type: object
            required: [id, name, status, account]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string }
              account: { type: object, additionalProperties: true }
    SuppressionReason:
      type: string
      enum: [unsubscribed, bounced, complained, manual, do_not_contact]
    Suppression:
      type: object
      required: [id, kind, value, reason, note, source, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [email, domain] }
        value: { type: string }
        reason: { $ref: "#/components/schemas/SuppressionReason" }
        note: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
    RecipientDecision:
      type: object
      required: [email, allowed, reasons]
      properties:
        email: { type: string }
        allowed: { type: boolean }
        reasons:
          type: array
          description: "Why it is blocked, e.g. invalid_email, suppressed_email:unsubscribed, suppressed_domain:do_not_contact."
          items: { type: string }
    AllocationMode:
      type: string
      enum: [suggest, automatic]
      description: "automatic: the allocator assigns mailboxes itself and explains each change. suggest: it proposes changes for a person to apply."
    ICP:
      type: object
      required: [titles, seniorities, industries, employee_ranges, locations, keywords]
      description: The ideal customer as filters list builders and data providers can run. Every key is always present.
      properties:
        titles: { type: array, items: { type: string }, example: [CFO, VP Finance] }
        seniorities: { type: array, items: { type: string }, example: [c_suite, vp] }
        industries: { type: array, items: { type: string }, example: [Financial Services] }
        employee_ranges: { type: array, items: { type: string }, example: ["51-200", "201-500"] }
        locations: { type: array, items: { type: string }, example: [Australia] }
        keywords: { type: array, items: { type: string }, example: [Series B] }
    ICPInput:
      type: object
      additionalProperties: false
      description: Any of the ICP keys, each up to 200 values of up to 200 characters. Duplicates and blanks are dropped.
      properties:
        titles: { type: array, items: { type: string } }
        seniorities: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        employee_ranges: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
    Project:
      type: object
      required: [id, name, status, brand_id, offer, audience, market, brief, icp, brief_version, brief_updated_at, daily_send_limit, counts, sent_24h, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Fintech CFOs, AU" }
        status: { type: string, enum: [active, paused, archived], description: "paused: none of its sequences send. archived: paused and hidden from the default list." }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand the project markets, or null when it is not one brand's. Everything in the project has its brand." }
        offer: { type: string, description: What is sold. }
        audience: { type: string, description: "Who buys it, in words." }
        market: { type: string, description: "Where, and in which language." }
        brief: { type: string, description: "Everything else, in Markdown: messaging, proof, objections, words to avoid." }
        icp: { $ref: "#/components/schemas/ICP" }
        brief_version: { type: integer, description: "Bumped on every change to offer, audience, market, brief or icp." }
        brief_updated_at: { type: string, format: date-time }
        daily_send_limit: { type: [integer, "null"], description: "Most cold sends from all of the project's sequences together in any 24 hours. Null is no project limit." }
        counts:
          type: object
          required: [domains, mailboxes, lead_lists, sequences, active_sequences]
          properties:
            domains: { type: integer }
            mailboxes: { type: integer }
            lead_lists: { type: integer }
            sequences: { type: integer, description: Not archived. }
            active_sequences: { type: integer }
        sent_24h: { type: integer, description: Cold sends from its sequences in the last 24 hours. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyContext:
      type: object
      required: [company, website, about, goals, voice, rules, notes, brands, version, updated_at, updated_by, missing, ask_for_missing]
      properties:
        company: { type: string, description: The company's name. }
        website: { type: string, description: "Its main site, such as acme.com." }
        about: { type: string, description: "What the company does, in a few sentences." }
        goals: { type: string, description: "What the person wants from Outflare, such as 20 demos a month from US fintech." }
        voice: { type: string, description: "How emails should sound: tone, length, sign-off." }
        rules: { type: string, description: Things never to do. }
        notes: { type: string, description: "Everything else, in Markdown: proof points, competitors, past results." }
        brands: { type: string, description: "How the company's brands relate to each other, for a company that markets more than one. Each brand's own context is at GET /brands/{brand}/context." }
        version: { type: integer, description: Bumped on every real change. }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"], description: Who changed it last. }
        missing:
          type: array
          items: { type: string, enum: [company, about, goals, voice] }
          description: Onboarding fields still empty.
        ask_for_missing: { type: boolean, description: "Whether to ask the person for the missing fields: false once they are filled or a person said not to ask." }
    OnboardingStepId:
      type: string
      enum: [brand, goal, ai, connect, mission, team]
    OnboardingGoal:
      type: string
      description: "What a workspace wants to do first: find and email new customers (outreach), grow search traffic (search), report on what works (reports) or nurture existing customers (nurture)."
      enum: [outreach, search, reports, nurture]
    OnboardingStep:
      type: object
      required: [id, title, detail, done, skipped, walkthrough, page, tool]
      properties:
        id: { $ref: "#/components/schemas/OnboardingStepId" }
        title: { type: string }
        detail: { type: string }
        done: { type: boolean, description: "The workspace already has it, however it was added." }
        skipped: { type: boolean, description: A person left it for later. A done step is never skipped. }
        walkthrough: { type: boolean, description: "Part of the full-page walk-through; false for steps left to Home's checklist, such as inviting the team." }
        page: { type: string, description: "The dashboard page that does the step, such as /acme/brands." }
        tool: { type: string, description: The MCP tool an agent can use for it; empty when a person must. }
    Onboarding:
      type: object
      required: [steps, done, total, next_step, complete, goal, dismissed, dismissed_at, show]
      properties:
        steps:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStep" }
        done: { type: integer }
        total: { type: integer }
        next_step:
          description: The first step neither done nor skipped; null when none is left.
          oneOf:
            - { $ref: "#/components/schemas/OnboardingStepId" }
            - { type: "null" }
        complete: { type: boolean, description: Every step is done or skipped. }
        goal:
          description: What the workspace picked to do first; null until it picks.
          oneOf:
            - { $ref: "#/components/schemas/OnboardingGoal" }
            - { type: "null" }
        dismissed: { type: boolean, description: A person closed the walk-through. }
        dismissed_at: { type: [string, "null"], format: date-time }
        show: { type: boolean, description: "Whether the app opens the walk-through by itself: nothing done or skipped yet and nobody closed it." }
    OnboardingInput:
      type: object
      additionalProperties: false
      properties:
        skip:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStepId" }
          description: Steps to leave for later.
        unskip:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStepId" }
          description: Skipped steps to bring back.
        goal: { $ref: "#/components/schemas/OnboardingGoal" }
        dismissed: { type: boolean, description: True closes the walk-through; false opens it again. }
    CompanyContextInput:
      type: object
      properties:
        company: { type: string, maxLength: 200 }
        website: { type: string, maxLength: 253 }
        about: { type: string, maxLength: 4000 }
        goals: { type: string, maxLength: 4000 }
        voice: { type: string, maxLength: 4000 }
        rules: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 100000 }
        brands: { type: string, maxLength: 4000 }
        version: { type: integer, description: The version you read; the edit fails with 409 context_changed if the context changed since. }
        onboarding_dismissed: { type: boolean, description: True stops agents asking for the missing fields; false asks again. }
    WorkspaceContext:
      type: object
      required: [context, brand, brands, memories, memory_count, projects, markdown]
      properties:
        context: { $ref: "#/components/schemas/CompanyContext" }
        brand:
          description: The brand asked for with ?brand=, or a project token's project's brand; null otherwise.
          oneOf:
            - { $ref: "#/components/schemas/BrandContext" }
            - { type: "null" }
        brands:
          type: array
          description: The workspace's active brands, one line each, so an agent can ask which one the work is for. Empty for a company with one brand.
          items:
            type: object
            required: [id, handle, name, website, platforms, summary]
            properties:
              id: { type: string, format: uuid }
              handle: { type: string }
              name: { type: string }
              website: { type: string }
              platforms: { type: array, items: { type: string } }
              summary: { type: string, description: The first line of the brand's about. }
        memories: { type: array, items: { $ref: "#/components/schemas/Memory" }, description: "Pinned memories first, then the 30 most recent." }
        memory_count: { type: integer, description: "Every memory the caller can see; search the rest with GET .../memories?q=." }
        projects:
          type: array
          items:
            type: object
            required: [id, name, status, brand_id, brief_version, has_brief]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [active, paused, archived] }
              brand_id: { type: [string, "null"], format: uuid }
              brief_version: { type: integer }
              has_brief: { type: boolean }
        markdown: { type: string, description: "The company context and memories as one Markdown document, ready to put in a prompt." }
    Memory:
      type: object
      required: [id, kind, text, project_id, brand_id, pinned, created_by, created_by_id, mission_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [preference, decision, fact, feedback] }
        text: { type: string }
        project_id: { type: [string, "null"], format: uuid, description: Null when it is true for the whole workspace. }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand it is true for. With project_id it is the project's brand; with neither, it is true for the whole company." }
        pinned: { type: boolean, description: Pinned memories come back with every context read. }
        created_by: { type: [string, "null"], description: Who saved it. }
        created_by_id: { type: [string, "null"], format: uuid }
        mission_id: { type: [string, "null"], format: uuid, description: The mission it was saved in. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryInput:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 500, description: "One lasting fact, preference or decision." }
        kind: { type: string, enum: [preference, decision, fact, feedback], description: Defaults to fact. }
        project_id: { type: [string, "null"], format: uuid, description: The project it is about; null for the whole workspace. }
        brand_id: { type: [string, "null"], description: "The brand it is true for: a brand's id or handle. Null with no project: true for the whole company. Ignored with project_id, whose brand it takes." }
        pinned: { type: boolean, description: Pin what every conversation should know. Defaults to false. }
    WorkspaceStatus:
      type: object
      required: [summary, can_send, setup, blockers, checked_at]
      properties:
        summary: { type: string, description: One sentence to repeat to the person. }
        can_send: { type: boolean, description: Whether at least one mailbox can send cold email today from a healthy domain. }
        setup:
          type: array
          items:
            type: object
            required: [step, title, done]
            properties:
              step: { type: string, enum: [context, mailboxes, ready, leads, sequence, live] }
              title: { type: string }
              done: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            required: [code, severity, area, title, detail, count, items, fix]
            properties:
              code:
                type: string
                description: Stable; new codes may be added.
                enum: [no_mailboxes, none_ready, mailbox_error, domain_critical, server_paused, connection_broken, connection_requested, approval_waiting, mission_paused, allocation_short, infra_plan_waiting, unread_replies, context_missing, analytics_site_unmapped, brand_without_analytics]
              severity: { type: string, enum: [critical, warning, info] }
              area: { type: string, enum: [mailboxes, domains, servers, connectors, missions, sequences, infrastructure, inbox, context, analytics] }
              title: { type: string }
              detail: { type: string, description: What it means and how to fix it. }
              count: { type: integer }
              items:
                type: array
                description: Up to five of the affected things.
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    reason: { type: string }
              fix:
                type: object
                required: [tool, page, who]
                properties:
                  tool: { type: string, description: The MCP tool to call first. }
                  page: { type: string, description: The dashboard page that resolves it. }
                  who: { type: string, enum: [agent, person], description: "agent: an agent with the scopes can resolve it. person: it needs a person (a sign-in, a payment, an approval)." }
        checked_at: { type: string, format: date-time }
    Catalog:
      type: object
      required: [types, option_sets, events]
      properties:
        types: { type: array, items: { $ref: "#/components/schemas/RecordType" } }
        option_sets: { type: array, items: { $ref: "#/components/schemas/OptionSet" } }
        events: { type: array, items: { $ref: "#/components/schemas/EventDefinition" } }
    RecordType:
      type: object
      required: [key, name, plural, description, builtin, archived, fields]
      properties:
        key: { type: string, example: deal, description: Never changes. }
        name: { type: string, example: Deal }
        plural: { type: string, example: Deals }
        description: { type: string }
        builtin: { type: boolean, description: "person and account: every workspace has them and they never change." }
        archived: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/Field" } }
    RecordTypeInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: Only when adding. Default from the name. }
        name: { type: string, maxLength: 60 }
        plural: { type: string, maxLength: 60, description: Default the name plus s. }
        description: { type: string, maxLength: 1000 }
        archived: { type: boolean, description: Only when changing. }
    FieldValueType:
      type: string
      enum: [text, number, currency, date, timestamp, checkbox, select, status, rating, email, phone, url, location, record_reference, actor_reference]
      description: |
        How values are written: text and number as JSON; currency {"amount_minor": 1999, "currency": "USD"}; date
        2026-10-26; timestamp RFC 3339; checkbox true or false; select and status an option key; rating 0 to 5; email,
        phone (international format) and url as text; location {"city", "region", "country", ...}; record_reference a
        record id; actor_reference a member's user id. A multiple field takes a list.
    Field:
      type: object
      required: [key, label, description, value_type, option_set, multiple, target_type, write_policy, precedence, sensitivity, filterable, builtin, archived]
      properties:
        key: { type: string, example: deal_stage }
        label: { type: string }
        description: { type: string }
        value_type: { $ref: "#/components/schemas/FieldValueType" }
        option_set: { type: [string, "null"], description: select and status. }
        multiple: { type: boolean }
        target_type: { type: [string, "null"], description: "record_reference: the record type it points at." }
        write_policy:
          type: string
          enum: [source_owned, platform_owned, manual_override_allowed, computed]
          description: |
            source_owned: only its source system writes it (not manual). platform_owned: people and agents in
            Outflare. manual_override_allowed: a source, and people may override. computed: Outflare works it out.
        precedence: { type: array, items: { type: string }, description: "Which source wins when two disagree, first wins. Default manual, first_party, crm_sync, enrichment." }
        sensitivity: { type: string, enum: [public, internal, confidential, restricted] }
        filterable: { type: boolean, description: Shown as a filter and sortable column. }
        builtin: { type: boolean }
        archived: { type: boolean }
    FieldInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$", description: Only when adding. Default from the label. }
        label: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        value_type: { $ref: "#/components/schemas/FieldValueType" }
        option_set: { type: string }
        multiple: { type: boolean }
        target_type: { type: string }
        write_policy: { type: string, enum: [source_owned, platform_owned, manual_override_allowed, computed] }
        precedence: { type: array, items: { type: string, enum: [manual, first_party, crm_sync, enrichment, import] } }
        sensitivity: { type: string, enum: [public, internal, confidential, restricted] }
        filterable: { type: boolean }
        archived: { type: boolean, description: Only when changing. }
    CatalogOption:
      type: object
      required: [key, label, archived]
      properties:
        key: { type: string, example: won }
        label: { type: string, example: Won }
        archived: { type: boolean }
    OptionSet:
      type: object
      required: [key, name, builtin, options]
      properties:
        key: { type: string, example: deal_stage }
        name: { type: string }
        builtin: { type: boolean }
        options: { type: array, items: { $ref: "#/components/schemas/CatalogOption" } }
    OptionSetInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: Only when adding. Default from the name. }
        name: { type: string }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              archived: { type: boolean }
    EventDefinition:
      type: object
      required: [name, label, description, properties, status, sensitivity, first_seen_at, last_seen_at, seen_count, created_at, updated_at]
      properties:
        name: { type: string, example: product.activated }
        label: { type: string }
        description: { type: string }
        properties:
          type: array
          items: { $ref: "#/components/schemas/EventProperty" }
        status: { type: string, enum: [quarantined, approved, deprecated] }
        sensitivity: { type: string, enum: [public, internal, confidential, restricted] }
        first_seen_at: { type: [string, "null"], format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        seen_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventProperty:
      type: object
      required: [key, value_type, description]
      properties:
        key: { type: string }
        value_type: { $ref: "#/components/schemas/FieldValueType" }
        description: { type: string }
    EventDefinitionInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: Only when adding. }
        label: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        properties:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, value_type]
            properties:
              key: { type: string }
              value_type: { $ref: "#/components/schemas/FieldValueType" }
              description: { type: string }
        status: { type: string, enum: [quarantined, approved, deprecated] }
        sensitivity: { type: string, enum: [public, internal, confidential, restricted] }
    RecordOrigin:
      type: string
      enum: [first_party, prospect, crm_sync, import, manual]
      description: |
        Where the record came from: first_party (the workspace's own product, billing or forms), prospect (lead lists
        and data providers), crm_sync, import or manual. Lifecycle mail never relies on it: consent does.
    Record:
      type: object
      required: [id, type, name, brand_id, origin, attributes, attribute_sources, identities, version, merged_into, archived, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: person }
        name: { type: string, example: Ada Lovelace }
        brand_id: { type: [string, "null"], format: uuid, description: Null for a record every brand shares. }
        origin: { $ref: "#/components/schemas/RecordOrigin" }
        attributes: { type: object, additionalProperties: true, description: "Values by field key, as the catalog defines them." }
        attribute_sources: { type: object, additionalProperties: { type: string }, description: Which source set each value. }
        identities: { type: array, items: { $ref: "#/components/schemas/RecordIdentity" }, description: Active identities. }
        version: { type: integer, description: Goes up on every change. }
        merged_into: { type: [string, "null"], format: uuid }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        skipped:
          type: array
          description: "On a write: fields left as they were because a higher-precedence source set them."
          items:
            type: object
            required: [field, kept_source]
            properties:
              field: { type: string }
              kept_source: { type: string }
    RecordInput:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, description: "Only when adding. person, account or a type from the catalog." }
        name: { type: string, maxLength: 500 }
        brand_id: { type: [string, "null"], description: "A brand's id or handle, or null for a record every brand shares." }
        origin: { $ref: "#/components/schemas/RecordOrigin" }
        source: { type: string, enum: [manual, first_party, crm_sync, enrichment, import], description: "Who these values come from, for precedence. Default manual." }
        attributes: { type: object, additionalProperties: true }
        identities: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RecordIdentityInput" }, description: Only when adding. }
        version: { type: integer, description: Only when changing. The version you read. }
        archived: { type: boolean, description: Only when changing. }
    RecordIdentity:
      type: object
      required: [id, namespace, value, verified, verified_at, properties, source, valid_from, valid_to, closed_reason]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, example: email, description: "email, phone, device_token, user_id, anonymous_id, domain, outflare.lead, or a source's own such as stripe.customer." }
        value: { type: string, example: ada@example.com, description: "Normalized: emails and domains lowercase, phones in E.164." }
        verified: { type: boolean, description: Only a verified identity claims its value. }
        verified_at: { type: [string, "null"], format: date-time }
        properties: { type: object, additionalProperties: true }
        source: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        closed_reason: { type: [string, "null"], enum: [changed, merged, removed, claimed, null] }
    RecordIdentityInput:
      type: object
      additionalProperties: false
      required: [namespace, value]
      properties:
        namespace: { type: string, example: email }
        value: { type: string, example: ada@example.com }
        verified: { type: boolean, description: "Default false for email and phone, true for everything else." }
        properties: { type: object, additionalProperties: true, description: "device_token needs platform: ios, android or web." }
        source: { type: string, maxLength: 60, description: "Who said so: api (the default), import, manual or a connector's id." }
        replaces: { type: string, format: uuid, description: "The identity of the same namespace this one replaces, such as the old email." }
    AttributeChange:
      type: object
      required: [id, field, old_value, new_value, source, actor_id, request_id, changed_at]
      properties:
        id: { type: integer }
        field: { type: string }
        old_value: {}
        new_value: {}
        source: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        request_id: { type: string }
        changed_at: { type: string, format: date-time }
    RecordRelationship:
      type: object
      required: [id, kind, field_key, direction, record, properties, valid_from, valid_to]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: partner_of }
        field_key: { type: [string, "null"], description: Set when the link is a record reference field's value. }
        direction: { type: string, enum: [outgoing, incoming] }
        record:
          type: object
          required: [id, type, name]
          properties:
            id: { type: string, format: uuid }
            type: { type: string }
            name: { type: string }
        properties: { type: object, additionalProperties: true }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
    CustomerEventMessage:
      type: object
      additionalProperties: true
      description: |
        One event in Segment's format. camelCase and snake_case names both work. An event that is not valid is rejected
        on its own in the results, so the rest of the batch still counts.
      properties:
        type: { type: string, example: track, description: "track, identify, page, screen, group or alias." }
        userId: { type: [string, number], description: Your product's own id for the person. }
        anonymousId: { type: string, description: The visitor's device or browser id before they sign in. }
        event: { type: string, example: Order Completed, description: "track: what happened. Stored as order_completed." }
        name: { type: string, description: "page and screen: the page's name." }
        properties: { type: object, additionalProperties: true, description: Under 32 KB. }
        traits:
          type: object
          additionalProperties: true
          description: |
            identify: who the person is; group: the company. email (with email_verified true once they proved it) and
            phone become identities; keys that match a field in the catalog are written; the rest are kept on the event.
        context: { type: object, additionalProperties: true, description: Under 8 KB. }
        groupId: { type: string, description: "group: your product's own id for the company." }
        previousId: { type: string, description: "alias: the id the person had before." }
        messageId: { type: string, description: Your id for the event, so a retry is stored once. }
        timestamp: { type: string, format: date-time, description: When it happened. Default now; at most 25 months ago. }
    CustomerEventsInput:
      type: object
      additionalProperties: true
      description: One event, or a batch.
      properties:
        batch: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/CustomerEventMessage" } }
        context: { type: object, additionalProperties: true, description: "batch: context every event in it shares." }
        source: { type: string, example: segment, description: "A label for where the events came from. Default api." }
        brand_id: { type: [string, "null"], description: "The brand new records belong to: a brand's id or handle. Default shared by every brand." }
        type: { type: string, enum: [track, identify, page, screen, group, alias] }
    CustomerEventsResult:
      type: object
      required: [accepted, duplicate, rejected, results]
      properties:
        accepted: { type: integer }
        duplicate: { type: integer }
        rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, status, event_id, record_id]
            properties:
              index: { type: integer, description: The event's place in the batch. }
              status: { type: string, enum: [accepted, duplicate, rejected] }
              event_id: { type: [string, "null"], format: uuid }
              record_id: { type: [string, "null"], format: uuid, description: The person it was matched to; null for an anonymous visitor. }
              name: { type: string, description: Its catalog name. }
              ignored_traits: { type: array, items: { type: string }, description: Traits with no matching field, or a value the field refused. Add the field to keep them. }
              warnings: { type: array, items: { type: string } }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    CustomerEvent:
      type: object
      required: [id, record_id, account_id, brand_id, kind, name, raw_name, user_id, anonymous_id, properties, traits, context, source, message_id, occurred_at, received_at]
      properties:
        id: { type: string, format: uuid }
        record_id: { type: [string, "null"], format: uuid, description: The person; null until an anonymous visitor is identified. }
        account_id: { type: [string, "null"], format: uuid, description: "group: the company." }
        brand_id: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [track, identify, page, screen, group, alias] }
        name: { type: string, example: order_completed }
        raw_name: { type: string, example: Order Completed }
        user_id: { type: [string, "null"] }
        anonymous_id: { type: [string, "null"] }
        properties: { type: object, additionalProperties: true }
        traits: { type: object, additionalProperties: true }
        context: { type: object, additionalProperties: true }
        source: { type: string }
        message_id: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
    TimelineItem:
      type: object
      required: [kind, id, at, title, detail, source]
      properties:
        kind: { type: string, enum: [event, attribute_change, identity, consent] }
        id: { type: string }
        at: { type: string, format: date-time }
        title: { type: string, description: "The event's name, the field that changed, the identity's namespace or the consent's channel." }
        detail: { type: object, additionalProperties: true }
        source: { type: string }
    Consent:
      type: object
      required: [id, record_id, channel, topic, purpose, status, source, evidence, occurred_at, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        record_id: { type: string, format: uuid }
        channel: { type: string, enum: [email, sms, push, whatsapp, in_app] }
        topic: { type: string, description: "A subscription topic's key, or empty for the whole channel." }
        purpose: { type: string, example: marketing }
        status: { type: string, enum: [granted, withdrawn] }
        source: { type: string, example: signup_form }
        evidence: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [channel, status]
      properties:
        channel: { type: string, enum: [email, sms, push, whatsapp, in_app] }
        topic: { type: string, description: "A subscription topic's key, such as product_updates. Empty for the whole channel." }
        purpose: { type: string, description: Default marketing. }
        status: { type: string, enum: [granted, withdrawn] }
        source: { type: string, example: signup_form, description: "Where it was given or taken back: signup_form, preference_center, unsubscribe_link, import. Default api." }
        evidence: { type: object, additionalProperties: true, description: "What proves it, such as the form and the wording's version. Under 4 KB." }
        occurred_at: { type: string, format: date-time, description: Default now. }
    Brand:
      type: object
      required: [id, name, handle, website, domains, platforms, links, status, context_version, counts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Repocket }
        handle: { type: string, example: repocket, description: "Short name for URLs and API calls (?brand=repocket). Unique in the workspace." }
        website: { type: string, example: repocket.com, description: "The brand's main website, its point of truth." }
        domains: { type: array, items: { type: string }, description: "Every domain that belongs to the brand, the website first. Analytics and SEO reports for these domains are the brand's." }
        platforms: { type: array, items: { type: string, enum: [web, ios, android, tv, desktop, console, extension, api] } }
        links: { type: array, items: { $ref: "#/components/schemas/BrandLink" }, description: "Where else the brand lives: app store listings, socials, docs." }
        status: { type: string, enum: [active, archived], description: "archived: hidden from pickers; its records are kept." }
        context_version: { type: integer, description: The brand context's version. }
        counts:
          type: object
          required: [projects, domains, mailboxes, lead_lists, sequences, active_sequences]
          properties:
            projects: { type: integer, description: Not archived. }
            domains: { type: integer }
            mailboxes: { type: integer }
            lead_lists: { type: integer }
            sequences: { type: integer, description: Not archived. }
            active_sequences: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnalyticsSiteBrand:
      type: object
      required: [integration_id, site, host, brand_id, source, updated_at]
      properties:
        integration_id: { type: string, format: uuid }
        site: { type: string, description: "The tool's id for the site." }
        host: { type: string, description: "The site's domain; empty when the tool shows none." }
        brand_id: { type: [string, "null"], format: uuid, description: The brand it reports for; null when shared. }
        source: { type: string, enum: [set, domain, none], description: "set: someone picked it; domain: the brand's domains include the site's; none: no brand has it." }
        updated_at: { type: [string, "null"], format: date-time, description: When someone last picked it. }
    BrandRules:
      type: object
      required: [cross_brand_days]
      properties:
        cross_brand_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Days a person is kept from a second brand's first email after an email from another brand. Null turns the rule off.
          example: 30
    BrandLink:
      type: object
      required: [url]
      properties:
        kind: { type: string, enum: [app_store, google_play, tv_app, chrome_web_store, microsoft_store, steam, docs, help, blog, status, x, linkedin, youtube, instagram, tiktok, facebook, discord, reddit, github, other], description: "What it is. Guessed from the address when left out (apps.apple.com is app_store); other when unknown." }
        url: { type: string, format: uri, example: "https://apps.apple.com/app/repocket/id1234567890" }
        label: { type: string, maxLength: 60, description: "Optional, such as Fire TV or Support docs." }
    BrandInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        handle: { type: string, minLength: 2, maxLength: 40, pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$", description: Made from the name when left out. }
        website: { type: string, description: "A domain or URL; stored as the domain, such as repocket.com." }
        domains: { type: array, items: { type: string }, maxItems: 100, description: The brand's other domains. The website is always included. }
        platforms: { type: array, items: { type: string, enum: [web, ios, android, tv, desktop, console, extension, api] } }
        links: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/BrandLink" }, description: "Replaces the brand's links. kind is guessed from the address when left out." }
        status: { type: string, enum: [active, archived], description: Updates only. }
    BrandContext:
      type: object
      required: [brand_id, name, handle, website, platforms, links, about, audience, goals, voice, rules, notes, version, updated_at, updated_by]
      properties:
        brand_id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        website: { type: string }
        platforms: { type: array, items: { type: string } }
        links: { type: array, items: { $ref: "#/components/schemas/BrandLink" } }
        about: { type: string, description: What the brand is and does. }
        audience: { type: string, description: Who it is for. }
        goals: { type: string }
        voice: { type: string, description: "How its emails and posts sound. Wins over the company's voice." }
        rules: { type: string, description: "Things never to do for this brand. Added to the company's rules, never replacing them." }
        notes: { type: string, description: "Everything else, in Markdown." }
        version: { type: integer, description: Bumped on every real change. }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"] }
    BrandContextInput:
      type: object
      properties:
        about: { type: string, maxLength: 4000 }
        audience: { type: string, maxLength: 4000 }
        goals: { type: string, maxLength: 4000 }
        voice: { type: string, maxLength: 4000 }
        rules: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 100000 }
        version: { type: integer, description: The version you read; the edit fails with 409 context_changed if the context changed since. }
    BrandMembers:
      type: object
      properties:
        project_ids: { type: array, items: { type: string, format: uuid }, description: A project brings everything in it. }
        domains: { type: array, items: { type: string }, example: [repocket-mail.com] }
        mailbox_ids: { type: array, items: { type: string, format: uuid } }
        lead_list_ids: { type: array, items: { type: string, format: uuid } }
        sequence_ids: { type: array, items: { type: string, format: uuid } }
        mission_ids: { type: array, items: { type: string, format: uuid } }
        with_mailboxes: { type: boolean, description: A domain brings its mailboxes unless this is false. }
    BrandMoved:
      type: object
      required: [projects, domains, mailboxes, lead_lists, sequences, missions, in_project]
      properties:
        projects: { type: integer }
        domains: { type: integer }
        mailboxes: { type: integer }
        lead_lists: { type: integer }
        sequences: { type: integer }
        missions: { type: integer }
        in_project: { type: integer, description: "Named records left as they were because they are in a project: they take the project's brand, so move the project instead." }
    ProjectInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        status: { type: string, enum: [active, paused, archived] }
        offer: { type: string, maxLength: 4000 }
        audience: { type: string, maxLength: 4000 }
        market: { type: string, maxLength: 4000 }
        brief: { type: string, maxLength: 100000 }
        icp: { oneOf: [{ $ref: "#/components/schemas/ICPInput" }, { type: "null" }], description: Replaces the whole ICP. Null clears it. }
        daily_send_limit: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        brand_id: { type: [string, "null"], description: "The brand the project markets: a brand's id or handle. Null makes it shared. Changing it moves everything in the project to the brand. Not for project tokens." }
        brief_version: { type: integer, description: "Updates only: the version your edit is based on. A brief edit fails with 409 if the brief changed since." }
    ProjectBrief:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, paused, archived] }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        offer: { type: string }
        audience: { type: string }
        market: { type: string }
        icp: { $ref: "#/components/schemas/ICP" }
        brief: { type: string }
        markdown: { type: string, description: "Everything above as one Markdown document, ready to put in a prompt." }
    ProjectMembers:
      type: object
      properties:
        domains: { type: array, items: { type: string }, example: [acme-mail.com] }
        mailbox_ids: { type: array, items: { type: string, format: uuid } }
        lead_list_ids: { type: array, items: { type: string, format: uuid } }
        sequence_ids: { type: array, items: { type: string, format: uuid } }
        with_mailboxes: { type: boolean, description: "Whether a domain's mailboxes move with it. Default true." }
    ProjectMoved:
      type: object
      required: [domains, mailboxes, lead_lists, sequences]
      properties:
        domains: { type: integer }
        mailboxes: { type: integer }
        lead_lists: { type: integer }
        sequences: { type: integer }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        allocation_mode: { type: [string, "null"], enum: [suggest, automatic, null], description: Null follows the workspace. }
        member_ids: { type: array, items: { type: string, format: uuid }, description: User ids. }
        senders: { type: integer }
        sequences: { type: integer }
        created_at: { type: string, format: date-time }
    TeamInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        allocation_mode: { type: [string, "null"], enum: [suggest, automatic, null] }
        member_ids: { type: array, items: { type: string, format: uuid } }
    Sender:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "The name recipients see, e.g. Ana Smith." }
        kind: { type: string, enum: [person, persona, shared] }
        user_id: { type: [string, "null"], format: uuid, description: "The workspace member this sender is, for kind person." }
        status: { type: string, enum: [active, retired] }
        team_ids: { type: array, items: { type: string, format: uuid }, description: Empty for a shared sender any team may use. }
        mailboxes: { type: integer }
        created_at: { type: string, format: date-time }
    SenderInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, enum: [person, persona, shared] }
        user_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, retired] }
        team_ids: { type: array, items: { type: string, format: uuid } }
    AllocationBlocking:
      type: object
      description: Mailboxes that could not be used, grouped by why.
      properties:
        reason: { type: string, example: "not ready: mailbox is warming" }
        count: { type: integer }
    PlannedChange:
      type: object
      properties:
        mailbox_id: { type: string, format: uuid }
        action: { type: string, enum: [assign, release, move, drain, finish_drain] }
        from_sequence_id: { type: string, format: uuid }
        to_sequence_id: { type: string, format: uuid }
        reason: { type: string, description: Plain-language explanation. }
        needs: { type: string, enum: [team_approval, owner_approval], description: Set when someone must approve it first. }
        approver_team_id: { type: string, format: uuid }
    AllocationCapacity:
      type: object
      properties:
        sequence_id: { type: string, format: uuid }
        needed_daily: { type: [integer, "null"], description: Sends a day the sequence should have capacity for. }
        active_daily: { type: integer }
        incoming_daily: { type: integer, description: Capacity from mailboxes still draining elsewhere. }
        blocking: { type: array, items: { $ref: "#/components/schemas/AllocationBlocking" } }
        note: { type: string }
    AllocationSuggestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        sequence_id: { type: string, format: uuid }
        sequence_name: { type: string }
        mailbox_id: { type: string, format: uuid }
        mailbox_email: { type: string }
        action: { type: string, enum: [assign, release, drain] }
        from_sequence_id: { type: [string, "null"], format: uuid }
        needs: { type: string, enum: [review, team_approval, owner_approval] }
        approver_team_id: { type: [string, "null"], format: uuid }
        approver_team_name: { type: [string, "null"] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    AllocationChange:
      type: object
      properties:
        id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        mailbox_email: { type: string }
        action: { type: string, enum: [assign, release, move, drain, finish_drain] }
        from_sequence_id: { type: [string, "null"], format: uuid }
        from_sequence_name: { type: [string, "null"] }
        to_sequence_id: { type: [string, "null"], format: uuid }
        to_sequence_name: { type: [string, "null"] }
        source: { type: string, enum: [manual, automatic, approval, undo, external], description: "external is a change made in an outside sequencer and accepted on sync." }
        reason: { type: string }
        actor_name: { type: [string, "null"] }
        undone_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    AssignedMailbox:
      type: object
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        sender_name: { type: [string, "null"] }
        state: { type: string, enum: [active, draining] }
        next_sequence_id: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [manual, automatic, external] }
        reason: { type: string }
        daily_limit: { type: integer }
        in_flight: { type: integer, description: Leads mid-sequence from this mailbox. }
        lock_kind: { type: [string, "null"], enum: [sequence, team, manual_only, null] }
        assigned_at: { type: string, format: date-time }
        mailbox_status: { type: string }
        platform: { type: [string, "null"], description: The sequencer it sends through. Null when Outflare sends. }
        confirmed: { type: boolean, description: False until the platform shows the mailbox on the campaign. }
        drain_until: { type: [string, "null"], format: date-time, description: "When a mailbox leaving a platform campaign is detached: platforms don't say which leads each mailbox has follow-ups for, so it stays for the campaign's sequence length." }
    PlatformAccount:
      type: object
      properties:
        integration_id: { type: string, format: uuid }
        name: { type: string }
        connector: { type: string, example: emailbison }
        control: { type: string, enum: [full, read_only], description: "read_only accounts are watched but never changed: Apollo picks the mailbox for each contact itself." }
        synced_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"], description: Why the last read failed. }
        stale: { type: boolean, description: "Not read successfully in 30 minutes. Its mailboxes count as busy until it is." }
        awaiting_review: { type: boolean, description: Changes for its campaigns are only suggested until the first plan is reviewed. }
        mailboxes: { type: integer }
        campaigns: { type: integer }
        unconfirmed: { type: integer, description: Attaches the platform does not show yet. }
        conflicts: { type: integer, description: "Mailboxes on more than one campaign, or on a campaign they are not allocated to." }
    CampaignLink:
      type: object
      description: A platform campaign a sequence runs as. The platform owns its status, steps and leads; Outflare decides its mailboxes.
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        platform: { type: string }
        connector: { type: string }
        external_id: { type: string }
        name: { type: string }
        status: { type: string }
        control: { type: string, enum: [full, read_only] }
        last_synced_at: { type: [string, "null"], format: date-time }
    MailboxAllocationResult:
      type: object
      properties:
        mailbox_id: { type: string, format: uuid }
        result: { type: string, enum: [assigned, moved, draining, released, unchanged, refused] }
        message: { type: string }
    SequenceSettings:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        project_id: { type: [string, "null"], format: uuid, description: "The project the sequence belongs to. Only that project's mailboxes and shared ones send for it. Null: shared." }
        pool_id: { type: [string, "null"], format: uuid, description: "Restrict allocation to mailboxes in this pool. Null allows any mailbox." }
        timezone: { type: string, example: Australia/Sydney, description: IANA time zone for the sending window. }
        send_days:
          type: array
          description: ISO weekdays, 1 (Monday) to 7 (Sunday).
          items: { type: integer, minimum: 1, maximum: 7 }
        send_start: { type: string, example: "09:00" }
        send_end: { type: string, example: "17:00" }
        daily_new_limit: { type: [integer, "null"], minimum: 1, description: Most leads started per day. Null is no cap. }
        stop_on_reply: { type: boolean }
        track_clicks: { type: boolean, description: "Rewrite links so clicks are counted. Off by default: rewritten links can hurt deliverability, so use it with a verified tracking domain." }
        unsubscribe_header: { type: boolean, description: "Add List-Unsubscribe and one-click headers. On by default; Gmail and Yahoo expect them from bulk senders." }
        team_id: { type: [string, "null"], format: uuid, description: "The team that owns it. Its mailboxes come from this team's senders first, then shared ones. An API token's default team is used when left out." }
        priority: { type: string, enum: [low, normal, high], description: "Higher priority may take mailboxes from lower, down to their min_daily. An API token cannot go above its max_priority." }
        target_daily: { type: [integer, "null"], minimum: 1, description: "Sends a day to allocate mailboxes for. Null uses daily_new_limit times the number of steps; with neither, no mailboxes are allocated automatically." }
        min_daily: { type: [integer, "null"], minimum: 1, description: Capacity a higher-priority sequence may never take below. }
        allocation_mode: { type: [string, "null"], enum: [suggest, automatic, null], description: "Null follows the team, then the workspace." }
        preferred_sender_ids: { type: array, items: { type: string, format: uuid }, description: Senders to use first. Replaces the list when sent. }
    StepInput:
      type: object
      required: [body]
      properties:
        delay_days: { type: integer, minimum: 0, maximum: 365, description: Days after the previous step. }
        subject: { type: string, description: "Empty on a later step replies in the same thread." }
        body:
          type: string
          description: "Plain text. Variables: {{first_name}}, {{company|fallback}}, any custom field, {{sender_name}}, {{unsubscribe_url}}."
    Step:
      type: object
      required: [position, delay_days, subject, body]
      properties:
        position: { type: integer, description: 0 is the first step. }
        delay_days: { type: integer }
        subject: { type: string }
        body: { type: string }
    Sequence:
      type: object
      required: [id, name, status, pool_id, timezone, send_days, send_start, send_end, daily_new_limit, stop_on_reply, track_clicks, unsubscribe_header, team_id, priority, target_daily, min_daily, allocation_mode, preferred_sender_ids, started_by_agent, allocation, links, steps, stats, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        project_id: { type: [string, "null"], format: uuid }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand that owns it, or null when shared by every brand. In a project it is the project's brand." }
        pool_id: { type: [string, "null"], format: uuid }
        timezone: { type: string }
        send_days:
          type: array
          items: { type: integer }
        send_start: { type: string }
        send_end: { type: string }
        daily_new_limit: { type: [integer, "null"] }
        stop_on_reply: { type: boolean }
        track_clicks: { type: boolean }
        unsubscribe_header: { type: boolean }
        team_id: { type: [string, "null"], format: uuid }
        priority: { type: string, enum: [low, normal, high] }
        target_daily: { type: [integer, "null"] }
        min_daily: { type: [integer, "null"] }
        allocation_mode: { type: [string, "null"], enum: [suggest, automatic, null] }
        preferred_sender_ids: { type: array, items: { type: string, format: uuid } }
        started_by_agent: { type: boolean, description: Created with an API token. }
        mission_id: { type: [string, "null"], format: uuid, description: The agent mission it was started in. }
        allocation:
          type: object
          description: Mailbox capacity as of the last plan.
          required: [mailboxes, active_daily, needed_daily, note, planned_at]
          properties:
            mailboxes: { type: integer }
            active_daily: { type: integer }
            needed_daily: { type: [integer, "null"] }
            note: { type: string }
            planned_at: { type: [string, "null"], format: date-time }
        links:
          type: array
          description: "Platform campaigns this sequence runs as. When set, change its status, steps and leads in the platform: Outflare refuses them here."
          items: { $ref: "#/components/schemas/CampaignLink" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        stats:
          type: object
          description: Enrollments by status, plus `sent` (messages delivered) and `clicked` (leads who clicked a tracked link, leaving out likely link scanners).
          additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TrackingDomain:
      type: object
      required: [id, domain, status, error, target, last_checked_at, verified_at, created_at]
      properties:
        id: { type: string, format: uuid }
        domain: { type: string, example: links.acme.com }
        status: { type: string, enum: [pending, verified, failed], description: "pending until the CNAME is first seen; failed when a verified domain stops pointing here." }
        error: { type: string, description: "What to fix, when not verified." }
        target: { type: string, description: The host the CNAME record must point to. }
        last_checked_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    EnrollmentStatus:
      type: string
      enum: [active, completed, stopped, unsubscribed, bounced, replied, blocked, failed]
      description: "replied means the lead answered and the sequence stops on reply. unsubscribed also covers a reply asking to be removed."
    Enrollment:
      type: object
      required: [id, lead_id, email, name, company, status, status_reason, next_step, next_send_at, mailbox_email, created_at]
      properties:
        id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        company: { type: string }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        status_reason:
          type: [string, "null"]
          description: "Why it is waiting or ended, e.g. outside_sending_window, mailbox_daily_limit, domain_paused, domain_daily_limit, server_paused, server_daily_limit, sequence_daily_new_limit, no_mailbox_allocated, sender_mailbox_gone (its mailbox was removed; resolve with orphaned-follow-ups), token_daily_budget, project_paused, project_daily_limit, missing_variable: first_name, suppressed_email:bounced."
        next_step: { type: integer }
        next_send_at: { type: [string, "null"], format: date-time }
        mailbox_email: { type: [string, "null"], description: The mailbox this lead's thread is sent from. }
        created_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, sequence_id, enrollment_id, step_position, lead_id, mailbox_id, from, to, subject, body, message_id, status, error, created_at, sent_at]
      properties:
        id: { type: string, format: uuid }
        sequence_id: { type: [string, "null"], format: uuid }
        enrollment_id: { type: [string, "null"], format: uuid }
        step_position: { type: [integer, "null"] }
        lead_id: { type: [string, "null"], format: uuid }
        mailbox_id: { type: [string, "null"], format: uuid }
        from: { type: string }
        to: { type: string }
        subject: { type: string }
        body: { type: string }
        message_id: { type: string, description: The Message-ID header. }
        status: { type: string, enum: [sending, sent, failed, blocked, unknown] }
        error: { type: [string, "null"], description: "SMTP error, or the policy reason for a blocked message." }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
    InboundMessage:
      type: object
      required: [id, mailbox_id, mailbox_email, from, from_name, to, subject, body, kind, opt_out, read, lead_id, lead_name, company, sequence_id, sequence_name, received_at, category, category_source, assigned_to, assignee_name, snoozed_until, done, labels, source, integration_id, category_confidence, category_reason, details, needs_review, classified_at, project_id, brand_id, group]
      properties:
        id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        mailbox_email: { type: string }
        from: { type: string }
        from_name: { type: string }
        to: { type: string }
        subject: { type: string }
        body: { type: string, description: Plain text (HTML mail is converted). }
        kind:
          type: string
          enum: [reply, auto_reply, bounce, other]
          description: "reply: a lead answered. auto_reply: out of office and the like. bounce: a delivery failure report. other: not about a lead."
        opt_out: { type: boolean, description: The reply asked not to be contacted again; the address was suppressed. }
        read: { type: boolean }
        lead_id: { type: [string, "null"], format: uuid }
        lead_name: { type: [string, "null"] }
        company: { type: [string, "null"] }
        sequence_id: { type: [string, "null"], format: uuid }
        sequence_name: { type: [string, "null"] }
        received_at: { type: string, format: date-time }
        category:
          type: [string, "null"]
          enum: [interested, meeting_booked, question, referral, not_now, objection, not_interested, wrong_person, unsubscribe, complaint, out_of_office, auto_reply, null]
          description: What the reply means. Set on arrival by built-in rules when they can tell, otherwise null until a person, agent or the AI labels it.
        category_source:
          type: [string, "null"]
          enum: [rules, ai, human, api_token, agent, system, null]
          description: "Who set the category: the built-in rules, the AI, a person, an API token, or an agent running a mission."
        assigned_to: { type: [string, "null"], format: uuid, description: The member handling it. }
        assignee_name: { type: [string, "null"] }
        snoozed_until: { type: [string, "null"], format: date-time, description: Hidden from the open inbox until then. }
        done: { type: boolean, description: Handled. Hidden from the open inbox; a new reply from the lead arrives as a new open message. }
        labels: { type: array, items: { type: string }, description: "Tags (GET .../inbox-tags lists them with colours)." }
        source: { type: string, description: "mailbox for Outflare's own mailboxes, else the connector id of the sequencer the reply was read from.", example: mailbox }
        integration_id: { type: [string, "null"], format: uuid, description: The sequencer connection it was read from. }
        category_confidence: { type: [number, "null"], minimum: 0, maximum: 1, description: How sure whoever labelled it was. Rules and people are 1. }
        category_reason: { type: [string, "null"], description: "Why it got its label, in a few words (an objection's reason, say)." }
        details: { type: object, additionalProperties: true, description: "Details read from the reply: a return date, a referred contact." }
        needs_review: { type: boolean, description: "The label is unsure, or an unsure opt-out was acted on; a person should check." }
        classified_at: { type: [string, "null"], format: date-time }
        project_id: { type: [string, "null"], format: uuid, description: The project of its sequence or mailbox. }
        brand_id: { type: [string, "null"], format: uuid, description: The brand of its sequence or mailbox. }
        group: { type: [string, "null"], enum: [hot, later, closed, automatic, null], description: The category's group. }
    InboxTag:
      type: object
      required: [id, name, color, replies, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Lower-case; the name stored on replies. }
        color: { type: string, enum: [gray, red, orange, amber, green, teal, blue, violet, pink] }
        replies: { type: integer, description: Replies with this tag. }
        created_at: { type: string, format: date-time }
    InboxView:
      type: object
      required: [id, name, shared, filters, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shared: { type: boolean, description: Seen by the whole workspace; otherwise only by the person who saved it. }
        filters:
          type: object
          additionalProperties: { type: string }
          description: "Query parameters for GET .../inbox: status, kind, category, group, source, tag, assigned_to, mailbox_id, sequence_id, project_id, brand, unread, needs_review, min_confidence, q."
          example: { group: hot, status: open, assigned_to: me }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ThreadEntry:
      type: object
      required: [id, direction, from, to, subject, body, status, at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [in, out] }
        from: { type: string }
        to: { type: string }
        subject: { type: string }
        body: { type: string }
        status: { type: string, description: "For sent mail the message status; for received mail its kind." }
        at: { type: string, format: date-time }
    WorkspaceStats:
      type: object
      required: [mailboxes, domains, warmup_inbox_rate, sent_24h, sent_7d, replies_7d, bounces_7d, unread_replies, active_sequences, active_enrollments, leads]
      properties:
        mailboxes:
          type: object
          required: [total, active, error, paused, verifying, daily_capacity, warming]
          properties:
            total: { type: integer }
            active: { type: integer }
            error: { type: integer }
            paused: { type: integer }
            verifying: { type: integer }
            daily_capacity: { type: integer, description: "Most emails that can go out in 24 hours: active mailboxes' daily limits, held to each domain's cap, with paused domains at 0." }
            warming: { type: integer, description: Active mailboxes with warm-up on. }
        warmup_inbox_rate: { type: [number, "null"], description: "Share of the last 7 days' placed warm-up mail that reached the inbox." }
        domains:
          type: object
          required: [total, paused, need_attention]
          properties:
            total: { type: integer }
            paused: { type: integer }
            need_attention: { type: integer, description: Domains whose health is warning or critical. }
        sent_24h: { type: integer }
        sent_7d: { type: integer }
        replies_7d: { type: integer, description: "Replies from people, not auto-replies or bounces." }
        bounces_7d: { type: integer }
        unread_replies: { type: integer, description: "Unread replies not yet marked done." }
        active_sequences: { type: integer }
        active_enrollments: { type: integer }
        leads: { type: integer }
    SupplierMailbox:
      type: object
      required: [external_id, email, name, provider, status, vendor_status, daily_limit, tags, connected_to, import_state, import_error, mailbox_id, mailbox_status, imported_at, updated_at]
      properties:
        external_id: { type: string, description: "The supplier's id for the mailbox." }
        email: { type: string }
        name: { type: string }
        provider: { type: string, enum: [google, microsoft, other] }
        status: { type: string, enum: [provisioning, active, cancelling, cancelled, failed], description: Status at the supplier. }
        vendor_status: { type: string, description: "The supplier's own status word." }
        daily_limit: { type: [integer, "null"], description: "The supplier's daily cap." }
        tags: { type: array, items: { type: string } }
        connected_to: { type: array, items: { type: string }, description: "Other sending platforms the supplier says this mailbox is connected to, e.g. emailbison." }
        import_state:
          type: string
          enum: [available, queued, waiting, app_password, imported, failed]
          description: |
            available: not imported. queued: importing now. waiting: imports
            when the supplier finishes setting it up. app_password: waiting
            for the supplier to make a Google app password. imported.
            failed: see import_error.
        import_error: { type: [string, "null"] }
        mailbox_id: { type: [string, "null"], format: uuid, description: "The Outflare mailbox, once imported." }
        mailbox_status: { type: [string, "null"], description: "The Outflare mailbox's status: verifying, active, paused or error." }
        imported_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }
    SupplierSync:
      type: object
      required: [integration_id, auto_import, app_passwords, daily_limit, webhook, last_synced_at, last_sync_error, push]
      properties:
        integration_id: { type: string, format: uuid }
        auto_import: { type: boolean }
        app_passwords: { type: boolean }
        daily_limit: { type: [integer, "null"] }
        webhook: { type: boolean, description: "The supplier pushes changes; otherwise they arrive with the 15-minute sync." }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_sync_error: { type: [string, "null"] }
        push: { $ref: "#/components/schemas/SupplierPush" }
    SupplierPush:
      type: object
      description: |
        Push: the supplier sends mailboxes into Outflare itself, through the
        EmailBison-compatible API, the way it sends them to a sequencer.
        Turning it on (PATCH .../mailbox-sync {"push": true}) makes an API
        token with mailboxes.read and mailboxes.manage and adds Outflare at
        the supplier as a self-hosted EmailBison. Turning it off revokes the
        token and removes the connection there; mailboxes already pushed
        stay.
      required: [available, state, base_url, connected_at, last_pushed_at, last_result, error]
      properties:
        available: { type: boolean, description: "The supplier supports push and this server has a public https address (PUBLIC_URL)." }
        state: { type: string, enum: [off, connecting, on, failed] }
        base_url: { type: [string, "null"], description: "The EmailBison-compatible address the supplier is given: PUBLIC_URL/emailbison/{ws}. Null when push is not available." }
        connected_at: { type: [string, "null"], format: date-time }
        last_pushed_at: { type: [string, "null"], format: date-time }
        last_result:
          type: [object, "null"]
          required: [synced, failed, skipped]
          properties:
            synced: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
        error: { type: [string, "null"], description: "Why connecting or the last push failed, as the supplier said." }
    SupplierMailboxList:
      type: object
      required: [integration, sync, synced, counts, total, mailboxes, next_offset, next_cursor]
      properties:
        integration: { type: object, additionalProperties: true, description: "The integration, as GET /v1/workspaces/{ws}/integrations/{id} returns it." }
        sync: { $ref: "#/components/schemas/SupplierSync" }
        synced: { type: boolean }
        counts:
          type: object
          required: [total, by_import_state, by_status, by_provider, connected_to]
          properties:
            total: { type: integer }
            by_import_state: { type: object, additionalProperties: { type: integer } }
            by_status: { type: object, additionalProperties: { type: integer } }
            by_provider: { type: object, additionalProperties: { type: integer } }
            connected_to: { type: object, additionalProperties: { type: integer } }
        total: { type: integer, description: How many match the filters. }
        mailboxes: { type: array, items: { $ref: "#/components/schemas/SupplierMailbox" } }
        next_offset: { type: [integer, "null"] }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    SupplierImportResult:
      type: object
      required: [queued, waiting, not_found]
      properties:
        queued: { type: integer }
        waiting: { type: integer, description: Import once the supplier finishes setting them up. }
        not_found: { type: array, items: { type: string } }
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Meta:
      type: object
      required: [name, version, api]
      properties:
        name:
          type: string
          example: Outflare
        version:
          type: string
          example: 0.1.0
        api:
          type: object
          required: [rest, openapi]
          properties:
            rest:
              type: string
              example: /v1
            openapi:
              type: string
              example: /v1/openapi.yaml
        capabilities:
          type: array
          description: |
            Features this server has. Extensions add their own; `email_verification_required` means signed-in people
            whose email isn't confirmed can use only their account and sign-in endpoints until they open the
            confirmation link.
          items:
            type: string
        mcp_url:
          type: string
          description: The hosted MCP server's address, when this server runs one (OUTFLARE_MCP_SERVER). AI apps connect with this URL and sign in with OAuth. Missing when the MCP server has to run on the person's computer.
          example: https://app.outflare.ai/mcp
        oauth_providers:
          type: array
          description: Providers whose consent screen is configured on this server (GOOGLE_OAUTH_CLIENT_ID, MICROSOFT_OAUTH_CLIENT_ID).
          items: { type: string, enum: [google, microsoft] }
        login_methods:
          type: array
          description: Ways to sign in on this server. google needs GOOGLE_OAUTH_CLIENT_ID with the sign-in callback registered.
          items: { type: string, enum: [password, google, passkey] }
        account_email:
          type: string
          example: postmark
          description: |
            How account emails (confirmation, password reset) are sent: `log`, `postmark`, `resend` or `cloudflare` in the
            open-source engine; a build with its own mail service may name another. `log` means no email service is set up
            (POSTMARK_SERVER_TOKEN, RESEND_API_KEY or CLOUDFLARE_EMAIL_API_TOKEN, with EMAIL_FROM), so links only appear in the server log.
        product_analytics:
          type: object
          description: |
            Present only when the operator set OUTFLARE_POSTHOG_KEY. The web app then sends product analytics to the
            operator's PostHog project through `api_host` on this server. Separate from the anonymous telemetry.
          required: [provider, key, api_host, ui_host]
          properties:
            provider: { type: string, enum: [posthog] }
            key: { type: string, description: "PostHog project key (public, it ships to the browser).", example: phc_abc123 }
            api_host: { type: string, example: /ingest }
            ui_host: { type: string, example: "https://us.posthog.com" }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, synced]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        synced:
          type: boolean
          description: Backed up by a password manager (iCloud Keychain, Google Password Manager, 1Password), so it survives losing the device.
    EmailVerification:
      type: object
      required: [email, email_verified]
      properties:
        email: { type: string }
        email_verified: { type: boolean }
        resend_after:
          type: integer
          description: Seconds before another link can be sent. Present when one was just sent.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable and machine-readable. GET /v1/error-codes lists every code; new ones may be added.
              example: unavailable
            message:
              type: string
              description: For people. It may change; branch on code and status instead.
            request_id:
              type: string
            param:
              type: string
              description: The request field a 400 is about, when there is one (for example url or events).
              example: url
    LifecycleStage:
      type: string
      enum: [warming, ready, resting, retired]
      description: |
        Where a mailbox is in its working life. Only ready mailboxes send cold
        email. warming: warming up. resting: no cold email for a while,
        warm-up continues. retired: out of use for good.
    InfraPersona:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, maxLength: 40 }
        last_name: { type: string, maxLength: 40 }
    InfraWarning:
      type: object
      required: [code, message, blocking]
      properties:
        code:
          type: string
          description: no_personas, not_enough_domains, too_few_personas, ready_by_too_soon, short_warmup, many_per_domain, quote_pending, quote_failed, domains_unavailable
        message: { type: string }
        blocking: { type: boolean, description: The plan cannot be approved until this is fixed. }
    InfraTimeline:
      type: object
      required: [setup_by, ready_on]
      properties:
        setup_by: { type: string, format: date-time, description: Buying and DNS done by this date. }
        ready_on: { type: string, format: date-time, description: "The earliest every mailbox can be ready, if warm-up goes well." }
    InfraPlanInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        project_id: { type: [string, "null"], format: uuid }
        supplier:
          type: string
          description: "manual (you buy; the plan waits for you), or a supplier connector such as cheapinboxes. See `suppliers` on GET /infrastructure."
        supplier_integration_id: { type: [string, "null"], format: uuid, description: The connected supplier account to buy with. }
        provider: { type: string, enum: [google, microsoft] }
        domain_count: { type: integer, minimum: 1, maximum: 200 }
        mailboxes_per_domain: { type: integer, minimum: 1, maximum: 10 }
        brand: { type: string, maxLength: 60, description: "Domain names are made from it, e.g. getacme.com, acmehq.com." }
        personas: { type: array, items: { $ref: "#/components/schemas/InfraPersona" }, maxItems: 20 }
        domains: { type: array, items: { type: string }, description: Domain names you chose. The rest are suggested from brand. }
        ready_by: { type: [string, "null"], format: date }
        warmup_days: { type: integer, minimum: 7, maximum: 60 }
        mailbox_daily_limit: { type: integer, minimum: 1, maximum: 500, description: Cold emails a day per mailbox once ready. }
        rest_below: { type: integer, minimum: 0, maximum: 100, description: A ready mailbox rests when its warm-up inbox placement falls below this percent. }
        retire_after_days: { type: [integer, "null"], minimum: 3, maximum: 120, description: Retire a mailbox that rested this long without recovering. Null never does. }
        notes: { type: string, maxLength: 4000 }
    InfraPlanDraft:
      type: object
      required: [domains, timeline, daily_capacity, warnings]
      properties:
        domains:
          type: array
          items:
            type: object
            required: [name, mailboxes]
            properties:
              name: { type: string }
              mailboxes:
                type: array
                items:
                  type: object
                  required: [email, first_name, last_name]
                  properties:
                    email: { type: string }
                    first_name: { type: string }
                    last_name: { type: string }
        timeline: { $ref: "#/components/schemas/InfraTimeline" }
        daily_capacity: { type: integer }
        warnings: { type: array, items: { $ref: "#/components/schemas/InfraWarning" } }
    InfraPlanItem:
      type: object
      required: [id, kind, name, domain, owned, first_name, last_name, stage, detail, available, price_cents, mailbox_id, lifecycle_stage, stage_changed_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [domain, mailbox] }
        name: { type: string, description: "The domain, or the mailbox's address." }
        domain: { type: string }
        owned: { type: boolean, description: The workspace already had this domain. }
        first_name: { type: string }
        last_name: { type: string }
        stage:
          type: string
          enum: [planned, buying, dns, connecting, done, failed, cancelled]
          description: "The build: planned, buying (ordered, or waiting for you to buy), dns (waiting for SPF, DKIM and DMARC), connecting (waiting for the mailbox), done."
        detail: { type: string, description: "What is left to do, in plain words." }
        available: { type: [boolean, "null"], description: The supplier's answer to the quote. }
        price_cents: { type: [integer, "null"], format: int64 }
        mailbox_id: { type: [string, "null"], format: uuid }
        lifecycle_stage:
          oneOf: [{ $ref: "#/components/schemas/LifecycleStage" }, { type: "null" }]
        stage_changed_at: { type: string, format: date-time }
    InfraPlan:
      type: object
      required: [id, status, name, project_id, supplier, supplier_integration_id, ready_by, retire_after_days, order_ref, created_by, approved_by, approved_at, completed_at, provider, domain_count, mailboxes_per_domain, brand, personas, warmup_days,
                 mailbox_daily_limit, rest_below, notes, quote, timeline, daily_capacity, warnings, counts, created_at, updated_at]
      properties:
        name: { type: string, maxLength: 200 }
        project_id: { type: [string, "null"], format: uuid }
        supplier:
          type: string
          description: "manual (you buy; the plan waits for you), or a supplier connector such as cheapinboxes. See `suppliers` on GET /infrastructure."
        supplier_integration_id: { type: [string, "null"], format: uuid, description: The connected supplier account to buy with. }
        provider: { type: string, enum: [google, microsoft] }
        domain_count: { type: integer, minimum: 1, maximum: 200 }
        mailboxes_per_domain: { type: integer, minimum: 1, maximum: 10 }
        brand: { type: string, maxLength: 60, description: "Domain names are made from it, e.g. getacme.com, acmehq.com." }
        personas: { type: array, items: { $ref: "#/components/schemas/InfraPersona" }, maxItems: 20 }
        ready_by: { type: [string, "null"], format: date }
        warmup_days: { type: integer, minimum: 7, maximum: 60 }
        mailbox_daily_limit: { type: integer, minimum: 1, maximum: 500, description: Cold emails a day per mailbox once ready. }
        rest_below: { type: integer, minimum: 0, maximum: 100, description: A ready mailbox rests when its warm-up inbox placement falls below this percent. }
        retire_after_days: { type: [integer, "null"], minimum: 3, maximum: 120, description: Retire a mailbox that rested this long without recovering. Null never does. }
        notes: { type: string, maxLength: 4000 }
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, building, warming, ready, cancelled]
          description: "draft: nothing bought. building: buying, DNS and connecting. warming: every mailbox warming up. ready: every mailbox can send."
        quote:
          type: object
          required: [status]
          description: The supplier's price. Manual plans have status none.
          properties:
            status: { type: string, enum: [none, pending, ready, failed] }
            currency: { type: string }
            once_cents: { type: [integer, "null"], format: int64 }
            monthly_cents: { type: [integer, "null"], format: int64 }
            error: { type: string }
        order_ref: { type: [string, "null"] }
        timeline: { $ref: "#/components/schemas/InfraTimeline" }
        daily_capacity: { type: integer, description: Cold emails a day across the plan's mailboxes once ready. }
        warnings: { type: array, items: { $ref: "#/components/schemas/InfraWarning" } }
        counts:
          type: object
          required: [domains, mailboxes]
          properties:
            domains: { type: object, additionalProperties: { type: integer } }
            mailboxes: { type: object, additionalProperties: { type: integer }, description: "Build stage until connected, then lifecycle stage." }
        items: { type: array, items: { $ref: "#/components/schemas/InfraPlanItem" }, description: Only on GET of one plan. }
        created_by: { type: [string, "null"], format: uuid }
        approved_by: { type: [string, "null"], format: uuid }
        approved_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InfrastructureOverview:
      type: object
      required: [mailboxes, not_ready, plans, suppliers]
      properties:
        mailboxes:
          type: object
          required: [warming, ready, resting, retired]
          properties:
            warming: { type: integer }
            ready: { type: integer }
            resting: { type: integer }
            retired: { type: integer }
        not_ready:
          type: array
          items:
            type: object
            required: [id, email, domain, stage, reason, until, changed_at, auto_rest, plan_id, placed_7d, inbox_rate]
            properties:
              id: { type: string, format: uuid }
              email: { type: string }
              domain: { type: string }
              stage: { $ref: "#/components/schemas/LifecycleStage" }
              reason: { type: string }
              until: { type: [string, "null"], format: date-time }
              changed_at: { type: string, format: date-time }
              auto_rest: { type: boolean }
              plan_id: { type: [string, "null"], format: uuid }
              placed_7d: { type: integer }
              inbox_rate: { type: [number, "null"] }
        plans: { type: array, items: { $ref: "#/components/schemas/InfraPlan" } }
        suppliers: { type: array, items: { type: string } }
