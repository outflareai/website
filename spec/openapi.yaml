      tags: [emails]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
      responses:
        "200":
          description: Topics, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmailTopic" } }
