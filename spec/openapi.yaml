      responses:
        "200":
          description: The mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/AllocationMode" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAllocationSettings
      x-outflare-access: { scope: members.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Set the workspace's allocation mode
      description: "Scope: members.manage."
