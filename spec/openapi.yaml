  /v1/workspaces/{ws}/lead-lists/{id}/leads/{lead}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lead, in: path, required: true, schema: { type: string, format: uuid } }
