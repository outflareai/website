        version: { type: string }
        os: { type: string }
        arch: { type: string }
        go_version: { type: string }
        container: { type: boolean }
        postgres_major: { type: integer }
        install_age_days: { type: string }
        counts: { $ref: "#/components/schemas/TelemetryCounts" }
