        calls: { type: integer }
        last_call_at: { type: [string, "null"], format: date-time }
        brief_version: { type: [integer, "null"], description: Project brief version at approval. }
        approved_by: { type: [string, "null"], format: uuid }
        approved_by_name: { type: [string, "null"] }
        approved_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        report: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: [string, "null"] }
        started_by_agent: { type: boolean }
        runner:
          type: string
          enum: [builtin, external]
