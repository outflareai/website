        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        available_scopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: "The write scopes the app could be given: what the role of the person who connected it allows, less what apps never get." }
        user_id: { type: string, format: uuid, description: Who connected it. }
        user_name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    APIToken:
      type: object
