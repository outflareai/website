  /v1/workspaces/{ws}/records:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listRecords
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: List customer records
      description: |
        Scope: customers.read. People, companies and the workspace's own record types, newest first. Merged records
        are left out. q matches the name or any active identity, such as part of an email.
      tags: [records]
      parameters:
        - { name: type, in: query, description: "A record type's key: person, account or the workspace's own.", schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: origin, in: query, schema: { $ref: "#/components/schemas/RecordOrigin" } }
        - { name: archived, in: query, description: Default false., schema: { type: string, enum: ["false", "true", all] } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  next_before: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRecord
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a customer record
      description: |
        Scope: customers.manage. Attributes are checked against the type's fields in the catalog; an unknown key is
        refused, so add the field first. Identities say who the record is: email and phone count only when verified
        (default false), and the workspace's own ids, payment customers and domains are trusted as sent. A verified
        identity another record already holds is refused with identity_taken; look it up with GET .../records/lookup.
        A person with no name takes first_name and last_name.
      tags: [records]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecordInput"
                - required: [type]
      responses:
        "201":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/lookup:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: lookupRecords
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: Find records by identity
      description: |
        Scope: customers.read. The records an email, phone, user id or other identity points at. owner is the one
        record holding it verified; the others hold it unverified, such as a sign-up that never confirmed its email.
      tags: [records]
      parameters:
        - { name: namespace, in: query, required: true, schema: { type: string, example: email } }
        - { name: value, in: query, required: true, schema: { type: string, example: ada@example.com } }
        - { $ref: "#/components/parameters/Brand" }
      responses:
        "200":
          description: Matching records, the owner first.
          content:
            application/json:
              schema:
                type: object
                required: [data, owner]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  owner: { type: [string, "null"], format: uuid }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
    get:
      operationId: getRecord
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: Read a customer record
      description: "Scope: customers.read. With its active identities."
      tags: [records]
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRecord
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change or archive a customer record
      description: |
        Scope: customers.manage. attributes merges: a key set to null clears it, keys left out stay. Each value keeps
        the source that set it, and a write from a lower-precedence source (by default manual, then first_party,
        crm_sync, enrichment) leaves it as it is and lists it in skipped. Send version to refuse the change with
        record_changed if someone else changed the record since you read it.
      tags: [records]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}/history:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
    get:
      operationId: getRecordHistory
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: A record's change history
      description: "Scope: customers.read. Every change to its name and attributes, newest first, with who made it and from which source."
      tags: [records]
      parameters:
        - { name: field, in: query, description: Only this field's changes (name for the record's name)., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AttributeChange" } }
                  next_before: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}/identities:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
    get:
      operationId: listRecordIdentities
      x-outflare-access: { scope: customers.read, brand_limited: true }
      summary: A record's identities
      description: "Scope: customers.read. Active ones, and with closed=true the closed ones too, such as an email the person changed."
      tags: [records]
      parameters:
        - { name: closed, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Identities, active first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RecordIdentity" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addRecordIdentity
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add, verify or change an identity
      description: |
        Scope: customers.manage. Adds an identity, or updates the record's own copy of it: sending verified: true for
        an email the record holds unverified verifies it (200). When a person changes their email, send the new one
        with replaces set to the old identity's id: the old one is closed as changed and kept in the history. A
        verified value another record holds is refused with identity_taken, never moved or merged.
      tags: [records]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordIdentityInput" }
      responses:
        "200":
          description: The identity the record already had, now verified or updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordIdentity" }
        "201":
          description: The new identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordIdentity" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/records/{record}/identities/{identity}/close:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/RecordID" }
      - { name: identity, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: closeRecordIdentity
      x-outflare-access: { scope: customers.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove an identity
      description: "Scope: customers.manage. It stops pointing at the record and stays in its history as removed."
