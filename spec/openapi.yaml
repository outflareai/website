      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListRun" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/data-providers:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listDataProviders
      x-outflare-access: { scope: leads.read, project_tokens: true, brand_limited: true }
      summary: Data providers that can search for people, find emails or enrich
      description: >-
        Scope: leads.read. Every data connector, available or planned, with the
        workspace's connected accounts for each and the filters its search
        understands. Connect one with POST /integrations.
      tags: [lists]
      responses:
        "200":
          description: Providers and the shared filter vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [data, filters, seniorities, employee_ranges]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DataProvider" }
                  filters: { type: array, items: { type: string } }
                  seniorities: { type: array, items: { type: string } }
                  employee_ranges: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads/{id}/sources:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listLeadSources
      x-outflare-access: { scope: leads.read }
      summary: Where a lead's data came from
      description: "Scope: leads.read. The providers that supplied this lead, their id for the person, and the list run that added it."
      tags: [leads]
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [data, imported_as]
                properties:
                  imported_as: { type: string, description: "The lead's source: csv, api, or a provider id." }
                  data:
                    type: array
                    items:
                      type: object
                      required: [provider, external_id, integration_id, list_id, run_id, first_seen_at, last_seen_at]
                      properties:
                        provider: { type: string }
                        external_id: { type: string }
                        integration_id: { type: [string, "null"], format: uuid }
                        list_id: { type: [string, "null"], format: uuid }
                        run_id: { type: [string, "null"], format: uuid }
                        first_seen_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/suppressions:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSuppressions
      x-outflare-access: { scope: leads.read, brand_limited: true }
      summary: List the suppression list, ordered by value
      description: "Scope: leads.read"
      tags: [suppression]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [email, domain] } }
        - { name: reason, in: query, schema: { $ref: "#/components/schemas/SuppressionReason" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "next_after from the previous page.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, next_after, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Suppression" }
                  total: { type: integer, description: Matches across all pages. }
                  next_after: { type: [string, "null"], description: Pass as after to get the next page. }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addSuppressions
      x-outflare-access: { scope: leads.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add emails or domains to the suppression list
      description: |
        Scope: leads.manage. Each value is an email address or a domain
        (also accepted as @acme.com or a URL). A suppressed domain blocks
        every address at it. Existing entries are left as they are.
      tags: [suppression]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  maxItems: 100000
                  items: { type: string }
                reason: { $ref: "#/components/schemas/SuppressionReason" }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                required: [added, existing, invalid]
                properties:
                  added: { type: integer }
                  existing: { type: integer }
                  invalid:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/suppressions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeSuppression
      x-outflare-access: { scope: suppressions.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a suppression entry
      description: "Scope: suppressions.manage (owners and admins by default). Audited."
      tags: [suppression]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/recipients/check:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: checkRecipients
      x-outflare-access: { scope: leads.read, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Ask the send policy whether addresses may be emailed
      description: |
        Scope: leads.read. Runs the same recipient checks every send goes
        through, without sending. Use it to filter before enrolling leads.
        With brand, also applies the workspace's cross-brand rule (GET
        /brand-rules): someone another brand emailed recently is refused with
        the reason other_brand:<handle>.
      tags: [suppression]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
                brand: { type: string, description: "The brand that would email them (id or handle), for the cross-brand rule.", example: repocket }
      responses:
        "200":
          description: One decision per email, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RecipientDecision" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/test-send:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testSendMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Send one test email from a mailbox now
      description: |
        Scope: mailboxes.manage. Goes through the recipient check and the
        mailbox's status, daily limit and minimum gap (not the sending
        window) and counts towards the daily limit. Returns 409 when the
        policy blocks it and 502 when the SMTP server refuses it.
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
                subject: { type: string }
                body: { type: string }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [message_id, status]
                properties:
                  message_id: { type: string, format: uuid }
                  status: { type: string, example: sent }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSequences
      x-outflare-access: { scope: sequences.read, project_tokens: true, brand_limited: true }
      summary: List sequences (archived ones are left out)
      description: "Scope: sequences.read"
      tags: [sequences]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: project_id, in: query, description: "A project's id, or none for records shared by the workspace. A project token always sees only its project.", schema: { type: string } }
      responses:
        "200":
          description: Sequences, newest first, with steps and enrollment counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sequence" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSequence
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a sequence
      description: |
        Scope: sequences.manage. A new sequence is a `draft`: it sends
        nothing until its status is set to `active`. Defaults: UTC,
        Monday to Friday, 09:00 to 17:00, no daily cap on new leads, stop on
        reply.
        A project token's sequences always belong to its project.
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SequenceSettings" }
                - type: object
                  required: [name]
                  properties:
                    steps:
                      type: array
                      maxItems: 20
                      items: { $ref: "#/components/schemas/StepInput" }
      responses:
        "201":
          description: The sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sequence" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSequence
      x-outflare-access: { scope: sequences.read, project_tokens: true, brand_limited: true }
      summary: Get a sequence
      description: "Scope: sequences.read"
      tags: [sequences]
      responses:
        "200":
          description: The sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sequence" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSequence
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a sequence's settings, or activate, pause or archive it
      description: |
        Scope: sequences.manage. Activating needs at least one step, and a
        daily_new_limit or target_daily (or mailboxes assigned by hand) so
        Outflare knows how many mailboxes to allocate; it allocates them
        straight away. Pausing holds every enrollment where it is, keeps the
        mailboxes with leads mid-sequence and frees the rest; activating
        again carries on.
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SequenceSettings" }
                - type: object
                  properties:
                    status: { type: string, enum: [active, paused, archived] }
      responses:
        "200":
          description: The updated sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sequence" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSequence
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a sequence that is not active
      description: "Scope: sequences.manage. Sent messages are kept in the message log."
      tags: [sequences]
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/steps:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: replaceSequenceSteps
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Replace a sequence's steps
      description: |
        Scope: sequences.manage. The first step needs a subject. A later
        step with an empty subject replies in the same thread ("Re: ...").
        `delay_days` is the wait after the previous step (at least 1 after
        the first). Enrollments carry on from their current position.
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/StepInput" }
      responses:
        "200":
          description: The sequence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sequence" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/preview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewSequence
      x-outflare-access: { scope: sequences.read, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Render every step for one lead
      description: |
        Scope: sequences.read. Shows the subject and body each step would
        send, and any variables the lead is missing (a missing variable
        blocks the real send).
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_id]
              properties:
                lead_id: { type: string, format: uuid }
      responses:
        "200":
          description: Rendered steps.
          content:
            application/json:
              schema:
                type: object
                required: [data, suppressed]
                properties:
                  suppressed: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      required: [position, subject, body, missing]
                      properties:
                        position: { type: integer }
                        subject: { type: string }
                        body: { type: string }
                        missing:
                          type: array
                          items: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/enrollments:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listEnrollments
      x-outflare-access: { scope: sequences.read, project_tokens: true, brand_limited: true }
      summary: List the leads in a sequence, ordered by email
      description: "Scope: sequences.read"
      tags: [sequences]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EnrollmentStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "next_after from the previous page.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Enrollments.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_after, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Enrollment" }
                  next_after: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: enrollLeads
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add leads to a sequence
      description: |
        Scope: sequences.manage. Send `lead_ids` or `list_id`. Suppressed
        leads are skipped, and so are leads active in another sequence
        unless `skip_active_elsewhere` is false. Adding a lead twice does
        nothing.
        A project token can only use `list_id` for one of its project's
        lists, and `lead_ids` reach only leads on its project's lists.
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lead_ids:
                  type: array
                  maxItems: 10000
                  items: { type: string, format: uuid }
                list_id: { type: string, format: uuid }
                skip_active_elsewhere: { type: boolean, default: true }
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [enrolled, already_enrolled, suppressed, active_elsewhere]
                properties:
                  enrolled: { type: integer }
                  already_enrolled: { type: integer }
                  suppressed: { type: integer }
                  active_elsewhere: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/enrollments/{eid}/stop:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopEnrollment
      x-outflare-access: { scope: sequences.manage, project_tokens: true, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Stop sending to one lead in a sequence
      description: "Scope: sequences.manage"
      tags: [sequences]
      responses:
        "204": { description: Stopped. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/messages:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMessages
      x-outflare-access: { scope: sequences.read }
      summary: List sent, failed and blocked messages, newest first
      description: |
        Scope: sequences.read. Every send attempt is recorded, including the
        ones the policy blocked and why.
      tags: [sequences]
      parameters:
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: lead_id, in: query, schema: { type: string, format: uuid } }
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: enrollment_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [sending, sent, failed, blocked, unknown] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: "next_before from the previous page.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_before: { type: [string, "null"], format: date-time }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /u/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: unsubscribePage
      security: []
      summary: Unsubscribe page linked from every email
      description: |
        Shows a confirmation button. A GET never unsubscribes, because mail
        scanners follow links.
      tags: [sequences]
      responses:
        "200": { description: HTML page., content: { text/html: {} } }
        "404": { description: The link is not valid., content: { text/html: {} } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: unsubscribe
      security: []
      summary: Unsubscribe (the page's button and RFC 8058 one-click)
      description: |
        Adds the address to the suppression list (reason unsubscribed) and
        stops every active sequence for it in the workspace.
      tags: [sequences]
      responses:
        "200": { description: HTML confirmation., content: { text/html: {} } }
        "404": { description: The link is not valid., content: { text/html: {} } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Check a mailbox for new mail now
      description: "Scope: mailboxes.manage. Active mailboxes are also synced automatically every two minutes."
      tags: [inbox]
      responses:
        "202":
          description: "Sync queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/test/inbound:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: simulateInbound
      x-outflare-access: { scope: inbox.manage }
      summary: Simulate an answer to a sent email (test workspaces)
      description: |
        Delivers a made-up reply, auto-reply, opt-out or bounce to a sent email, as if the lead's mail server had
        sent it. It is handled exactly like real mail: it shows in the inbox, a reply stops the lead's sequence, an
        opt-out or bounce suppresses the address, and webhooks fire. Only in a test workspace; a live one answers
        409 `live_workspace`.
      tags: [sandbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id: { type: string, format: uuid, description: "The sent email to answer. Give this or lead_id." }
                lead_id: { type: string, format: uuid, description: "Answer the latest email sent to this lead." }
                kind: { type: string, enum: [reply, auto_reply, opt_out, bounce], default: reply }
                body: { type: string, description: "The text of a reply, auto-reply or opt-out; a sensible default otherwise." }
      responses:
        "201":
          description: The message as it arrived in the inbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundMessage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/test/send-now:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: sendNow
      x-outflare-access: { scope: sequences.manage }
      summary: Send every due step now (test workspaces)
      description: |
        Sends the next step of every active enrollment at once, without waiting for step delays, the sending
        window or the new-lead cap, so a whole sequence can be tried in a minute. Mailbox daily limits still
        apply. Only in a test workspace; a live one answers 409 `live_workspace`.
      tags: [sandbox]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sequence_id: { type: string, format: uuid, description: Only this sequence. }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, description: Emails queued to send. }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInbox
      x-outflare-access: { scope: inbox.read, brand_limited: true }
      summary: List received mail, newest first
      description: |
        Scope: inbox.read. By default only replies and auto-replies from
        leads are listed; pass `kind=all` to include bounce reports and
        other mail.
      tags: [inbox]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [reply, auto_reply, bounce, other, all] } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: lead_id, in: query, schema: { type: string, format: uuid } }
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: "open: not done and not snoozed. Default all.", schema: { type: string, enum: [open, snoozed, done, all] } }
        - { name: category, in: query, description: "A category, several separated by commas, or none for replies nobody has labelled yet.", schema: { type: string }, example: "interested,question" }
        - { name: group, in: query, description: "hot (interested, meeting_booked, question), later (referral, not_now, objection), closed (not_interested, wrong_person, unsubscribe, complaint) or automatic (out_of_office, auto_reply); several separated by commas.", schema: { type: string }, example: hot }
        - { name: source, in: query, description: "Where replies came from: mailbox (Outflare's own mailboxes) or a sequencer's connector id; several separated by commas.", schema: { type: string }, example: "mailbox,emailbison" }
        - { name: needs_review, in: query, description: "true: replies whose label is unsure, or an unsure opt-out that was acted on.", schema: { type: boolean } }
        - { name: project_id, in: query, description: The project of the reply's sequence or mailbox., schema: { type: string, format: uuid } }
        - { name: min_confidence, in: query, description: Only replies labelled at least this surely (0 to 1)., schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: assigned_to, in: query, description: "me (signed-in person only), none, or a user id.", schema: { type: string } }
        - { name: tag, in: query, description: "A tag, or several separated by commas for replies with any of them.", schema: { type: string } }
        - { name: label, in: query, deprecated: true, description: The older name for tag., schema: { type: string } }
        - { name: q, in: query, description: "Search sender, subject and text.", schema: { type: string } }
        - { $ref: "#/components/parameters/Brand" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: "next_before from the previous page.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, unread_replies, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InboundMessage" }
                  next_before: { type: [string, "null"], format: date-time }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  unread_replies: { type: integer, description: "Unread replies not yet marked done, across the workspace." }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInboundMessage
      x-outflare-access: { scope: inbox.read, brand_limited: true }
      summary: Get a received message and its conversation
      description: |
        Scope: inbox.read. `thread` holds everything sent to and received
        from the lead through that mailbox, oldest first.
      tags: [inbox]
      responses:
        "200":
          description: The message and thread.
          content:
            application/json:
              schema:
                type: object
                required: [message, thread]
                properties:
                  message: { $ref: "#/components/schemas/InboundMessage" }
                  thread:
                    type: array
                    items: { $ref: "#/components/schemas/ThreadEntry" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInboundMessage
      x-outflare-access: { scope: inbox.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Triage a message
      description: |
        Scope: inbox.manage. Send only the fields to change. Mark it read,
        label it, assign it to a member, snooze it, mark it done, set its
        tags (labels) or settle a review. Changes other than read are
        audited; a new category also records inbox.classified, and settles
        needs_review unless you send it.
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                read: { type: boolean }
                category: { type: [string, "null"], enum: [interested, meeting_booked, question, referral, not_now, objection, not_interested, wrong_person, unsubscribe, complaint, out_of_office, auto_reply, null] }
                needs_review: { type: boolean, description: false once a person has checked the label. }
                assigned_to: { type: [string, "null"], format: uuid, description: "A workspace member's user id, or null to unassign." }
                snoozed_until: { type: [string, "null"], format: date-time, description: Must be in the future; null wakes it now. }
                done: { type: boolean }
                labels: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 }, description: "Replaces the tags. Lower-cased; a new name joins the workspace's tag list." }
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboundMessage" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox-tags:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInboxTags
      x-outflare-access: { scope: inbox.read }
      summary: List the workspace's inbox tags
      description: Scope inbox.read. Every tag with its colour and how many replies have it, by name.
      tags: [inbox]
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/InboxTag" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInboxTag
      x-outflare-access: { scope: inbox.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add an inbox tag
      description: Scope inbox.manage. Tags also appear when a reply is given a new one. 409 if the name exists; at most 200.
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 40, example: pricing }
                color: { type: string, enum: [gray, red, orange, amber, green, teal, blue, violet, pink], description: Default gray. }
      responses:
        "201":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxTag" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox-tags/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateInboxTag
      x-outflare-access: { scope: inbox.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Rename or recolour an inbox tag
      description: Scope inbox.manage. A rename changes the tag on every reply that has it.
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                color: { type: string, enum: [gray, red, orange, amber, green, teal, blue, violet, pink] }
      responses:
        "200":
          description: The tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxTag" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteInboxTag
      x-outflare-access: { scope: inbox.manage }
      summary: Delete an inbox tag
      description: Scope inbox.manage. Removes it from the list and from every reply.
      tags: [inbox]
      responses:
        "204": { description: Deleted. }
        "202": { $ref: "#/components/responses/MissionHeld" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox-views:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInboxViews
      x-outflare-access: { scope: inbox.read }
      summary: List saved inbox views
      description: Scope inbox.read. Views shared with the workspace, and your own.
      tags: [inbox]
      responses:
        "200":
          description: Views, in order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/InboxView" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInboxView
      x-outflare-access: { scope: inbox.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Save an inbox view
      description: |
        Scope inbox.read. Saves a set of inbox filters under a name. A
        view is yours alone unless shared is true; API tokens save shared
        views. At most 100 per workspace.
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60, example: My hot replies }
                filters: { type: object, additionalProperties: true, example: { group: hot, status: open, assigned_to: me } }
                shared: { type: boolean, description: Default false. }
                position: { type: integer }
      responses:
        "201":
          description: The view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxView" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox-views/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateInboxView
      x-outflare-access: { scope: inbox.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a saved inbox view
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                filters: { type: object, additionalProperties: true }
                position: { type: integer }
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxView" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteInboxView
      x-outflare-access: { scope: inbox.read }
      summary: Delete a saved inbox view
      tags: [inbox]
      responses:
        "204": { description: Deleted. }
        "202": { $ref: "#/components/responses/MissionHeld" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/inbox/{id}/reply:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: replyToInboundMessage
      x-outflare-access: { scope: inbox.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Reply from the mailbox the message arrived at, in the same thread
      description: |
        Scope: inbox.manage. Goes through the recipient check (a suppressed
        or opted-out address gets 409) and needs the mailbox to be active.
        It is not held to a sequence's sending window or the mailbox's
        pacing, but counts towards its daily limit.
      tags: [inbox]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [message_id, status]
                properties:
                  message_id: { type: string, format: uuid }
                  status: { type: string, example: sent }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/oauth-connections:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listOAuthConnections
      x-outflare-access: { scope: mailboxes.read }
      summary: List admin OAuth connections
      description: "Scope: mailboxes.read. Secrets are never returned."
      tags: [mailboxes]
      responses:
        "200":
          description: Connections.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/OAuthConnection" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOAuthConnection
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a Google service account or a Microsoft Entra app
      description: |
        Scope: mailboxes.manage. Admin-level access to every mailbox in an
        organisation, so mailboxes can be added without passwords.

        - Google: a service account key file with domain-wide delegation
          for the scope https://mail.google.com/.
        - Microsoft: an Entra app with the Exchange Online application
          permissions IMAP.AccessAsApp and SMTP.SendAsApp. The secret is
          checked by getting a token before it is saved.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [google, microsoft] }
                name: { type: string, description: Defaults to the service account's email or the tenant id. }
                service_account:
                  description: "Google: the key file, as a JSON object or as its text."
                  oneOf: [{ type: object }, { type: string }]
                tenant_id: { type: string, description: "Microsoft: directory (tenant) id." }
                client_id: { type: string, description: "Microsoft: application (client) id." }
                client_secret: { type: string, description: "Microsoft: client secret value." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/oauth-connections/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteOAuthConnection
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove an OAuth connection
      description: "Scope: mailboxes.manage. Refused with 409 while mailboxes use it."
      tags: [mailboxes]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/oauth-connections/{id}/mailboxes:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addOAuthConnectionMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add mailboxes that sign in through a connection
      description: |
        Scope: mailboxes.manage. Up to 5000 at once. No passwords: each
        mailbox signs in to SMTP and IMAP with XOAUTH2 using a token from
        the connection. Mailboxes that already exist are switched to the
        connection. Each is verified in the background.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailboxes]
              properties:
                mailboxes:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string }
                      display_name: { type: string }
                pool: { type: string, description: Pool name. Created if missing. }
                daily_limit: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Result. Errors refer to positions in the list, from 1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/oauth/{provider}/authorize:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, microsoft] } }
      - { name: pool, in: query, schema: { type: string }, description: Pool for the connected mailbox. }
    get:
      operationId: authorizeOAuth
      x-outflare-access: { scope: mailboxes.manage }
      summary: Connect one mailbox through the provider's consent screen
      description: |
        Scope: mailboxes.manage, signed-in users only (not API tokens).
        Open this in the browser: it redirects to Google or Microsoft, and
        after approval back to /v1/oauth/callback, which adds the mailbox
        and redirects to the web app with ?connected=<email> or
        ?oauth_error=<reason>. Needs the server's OAuth app to be
        configured; see oauth_providers in /v1/meta.
      tags: [mailboxes]
      responses:
        "302": { description: Redirect to the consent screen. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/oauth/callback:
    get:
      operationId: oauthCallback
      security: []
      summary: Where the provider returns after the consent screen
      description: Not called directly. Checks the signed state and that the same user is signed in.
      tags: [mailboxes]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the web app with the outcome. }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/mailboxes:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: "A mailbox supplier integration, such as Cheap Inboxes." }
      - { name: import_state, in: query, schema: { type: string, enum: [available, queued, waiting, app_password, imported, failed] } }
      - { name: status, in: query, schema: { type: string, enum: [provisioning, active, cancelling, cancelled, failed] }, description: Status at the supplier. }
      - { name: q, in: query, schema: { type: string }, description: Part of the email address. }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      - { $ref: "#/components/parameters/Cursor" }
      - { $ref: "#/components/parameters/Fields" }
    get:
      operationId: listSupplierMailboxes
      x-outflare-access: { scope: mailboxes.read }
      summary: List the mailboxes held at a supplier
      description: |
        Scope: mailboxes.read. Every mailbox the connected supplier account
        holds, imported or not, as of the last sync (every 15 minutes, and
        at once on the supplier's webhooks). The first call for an
        integration connected before syncing existed starts its first sync;
        `synced` is false until it finishes.
      tags: [mailboxes]
      responses:
        "200":
          description: Mailboxes and counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierMailboxList" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/mailboxes/sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncSupplierMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Refresh the supplier's mailboxes now
      description: "Scope: mailboxes.manage. Queues a full sync. Mailboxes the supplier cancelled are paused in Outflare."
      tags: [mailboxes]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/mailboxes/import:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importSupplierMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Import mailboxes from a supplier
      description: |
        Scope: mailboxes.manage. Reads each mailbox's password from the
        supplier and adds it like a CSV import, with SMTP, IMAP and DNS
        checks in the background. Google mailboxes first get an app
        password from the supplier (Google refuses plain passwords), at the
        pace the supplier allows: Cheap Inboxes makes 20 an hour, so a large
        Google import takes hours; follow `import_state` in the list.
        Mailboxes still being set up wait and import when they turn active.
        Listed mailboxes are imported again even if they were before, which
        refreshes their passwords.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean, description: Every mailbox not imported yet. }
                external_ids: { type: array, maxItems: 5000, items: { type: string } }
                emails: { type: array, maxItems: 5000, items: { type: string } }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/SupplierImportResult" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/emailbison-compat/calls:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listEmailBisonCompatCalls
      x-outflare-access: { scope: mailboxes.read }
      summary: List calls made to the EmailBison-compatible API
      description: |
        Scope: mailboxes.read. Outflare answers a subset of the EmailBison API
        at `/emailbison/{ws}/api/...` so a mailbox supplier that pushes to a
        self-hosted EmailBison (Cheap Inboxes does) can push into Outflare.
        Authenticate with an Outflare API token as the EmailBison API key; a
        write needs mailboxes.manage. Supported: `GET users`, `GET
        sender-emails` (page, per_page, search), `GET sender-emails/{id or
        email}`, `POST sender-emails/imap-smtp`, `POST sender-emails/bulk`,
        `PATCH sender-emails/{id}`, `DELETE sender-emails/{id}` (pauses the
        mailbox), `PATCH warmup/sender-emails/enable|disable`. Every call is
        logged here, newest first, with field names but never values, so
        any endpoint a client needs that Outflare does not answer yet shows
        up as `supported: false`. The latest 1,000 per workspace are kept.
      tags: [mailboxes]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Calls, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmailBisonCompatCall" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/mailboxes/push:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: pushSupplierMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Ask the supplier to push mailboxes in
      description: |
        Scope: mailboxes.manage. Needs push on (push.state is on). The
        supplier sends the mailboxes through the EmailBison-compatible API,
        where they are imported and checked like any other. With all, every
        active mailbox not yet in Outflare. The counts land in
        push.last_result.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                external_ids: { type: array, maxItems: 5000, items: { type: string }, description: "The supplier's mailbox ids." }
                all: { type: boolean }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [queued, mailboxes]
                    properties:
                      queued: { type: boolean, enum: [true] }
                      mailboxes: { type: integer, description: How many will be pushed. }
                  - { $ref: "#/components/schemas/MissionHeld" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/mailbox-sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSupplierSync
      x-outflare-access: { scope: mailboxes.read }
      summary: How a supplier's mailboxes are synced
      description: "Scope: mailboxes.read."
      tags: [mailboxes]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSync" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSupplierSync
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change how a supplier's mailboxes are synced
      description: "Scope: mailboxes.manage. Turning on auto_import queues every active mailbox not imported yet, and imports new ones as they appear."
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_import: { type: boolean }
                app_passwords: { type: boolean, description: Ask the supplier for Google app passwords before importing Google mailboxes. On by default. }
                daily_limit: { type: [integer, "null"], minimum: 1, maximum: 500, description: "Daily cap for imported mailboxes. Null uses the supplier's cap." }
                push: { type: boolean, description: "Let the supplier push mailboxes in (see SupplierPush). Turning it on also needs integrations.manage. Connecting runs in the background: follow push.state." }
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierSync" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/integrations/{id}/webhook:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: supplierWebhook
      security: []
      summary: Where a supplier posts its events
      description: |
        Not called directly. Registered at the supplier when the engine's
        PUBLIC_URL is https. The body's HMAC-SHA256 signature, keyed with the
        secret the supplier issued, is checked; repeated deliveries are
        ignored.
      tags: [mailboxes]
      responses:
        "200": { description: Accepted. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/stats:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getWorkspaceStats
      x-outflare-access: { scope: workspace.read, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/Brand" }]
      summary: Workspace overview
      description: "Scope: workspace.read. Mailbox health, sending and reply counts, in one call. Windows are rolling (last 24 hours, last 7 days). With a brand, everything but leads (which every brand shares) counts that brand's mailboxes and sequences; mail counts by its mailbox."
      tags: [access]
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceStats" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connectors:
    get:
      operationId: listConnectorCatalog
      security: []
      summary: Every connector this server ships, available or planned
      description: |
        Public, no key needed. Each entry says what the connector is, how it
        signs in (`api_key`, `oauth2` or `none`), the fields to paste, and its
        capabilities. `configured` is false for OAuth connectors whose app is
        not set up on this server.
      tags: [connectors]
      responses:
        "200":
          description: The catalog, available first, then by category and name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Connector" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/connectors/{id}/logo.svg:
    get:
      operationId: getConnectorLogo
      summary: Get a connector's logo
      description: |
        The company's logo as a square SVG, unmodified apart from cropping, or a
        monogram for connectors without one. Public, so it works in an `<img>`
        tag. Add `theme=dark` for the variant made for dark backgrounds.
      tags: [connectors]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: hubspot }
        - { name: theme, in: query, schema: { type: string, enum: [light, dark], default: light } }
      responses:
        "200":
          description: The logo.
          content:
            image/svg+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/connectors:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listConnectors
      x-outflare-access: { scope: integrations.read, brand_limited: true }
      summary: The catalog, with how many accounts the workspace connected to each
      description: "Scope: integrations.read."
      tags: [connectors]
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ConnectorCategory" } }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Connector" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listAnalyticsSources
      x-outflare-access: { scope: analytics.read }
      summary: List connected analytics tools
      description: |
        Scope: analytics.read. Every connection that reads website or
        product analytics or a search console (Google Analytics, Search
        Console, Bing Webmaster Tools, PostHog, Plausible and the rest),
        with the reports each one answers and its default site. Connect one
        with POST .../integrations (API key) or the OAuth authorize link,
        or hand a person a link with POST .../connect-requests. Nothing
        needs to be connected for the rest of Outflare to work.
      tags: [analytics]
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsSource" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/summary:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: analyticsSummary
      x-outflare-access: { scope: analytics.read }
      summary: Traffic totals from every analytics tool
      description: |
        Scope: analytics.read. The traffic report's totals from every
        analytics connection over one range, in one call. A connection
        that fails (no site picked, revoked key) carries an error instead
        of failing the answer. Dates are inclusive; the default is the
        last 28 days.
      tags: [analytics]
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - { $ref: "#/components/parameters/AnalyticsFresh" }
      responses:
        "200":
          description: One entry per connection.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, data]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsSummaryItem" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/history:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getAnalyticsHistory
      x-outflare-access: { scope: analytics.read, brand_limited: true }
      summary: Query stored analytics history
      description: |
        Scope: analytics.read. Reads what the sync stored, without calling the tools.
        `group` is `day` (one row per day per tool; the default for traffic),
        `tool` (totals per tool), `key` (each page, source, query or event added up
        across the tools picked; the default for the other reports) or `tool_key`.
        Counts are summed, click-through rate and position are weighted by impressions.
      tags: [analytics]
      parameters:
        - { name: report, in: query, schema: { $ref: "#/components/schemas/AnalyticsReportName" } }
        - { name: group, in: query, schema: { type: string, enum: [day, tool, key, tool_key] } }
        - { name: integration, in: query, schema: { type: string, format: uuid }, description: Only this connection. }
        - { name: host, in: query, schema: { type: string }, example: example.com, description: Only this website. }
        - { name: from, in: query, schema: { type: string, format: date }, description: First day. Default 28 days before to. }
        - { $ref: "#/components/parameters/Brand" }
        - { name: to, in: query, schema: { type: string, format: date }, description: Last day. Default yesterday (UTC). }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 100 } }
      responses:
        "200":
          description: Stored rows.
          content:
            application/json:
              schema:
                type: object
                required: [report, from, to, group, data, notes]
                properties:
                  report: { $ref: "#/components/schemas/AnalyticsReportName" }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  group: { type: string }
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsHistoryRow" } }
                  notes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/overview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getAnalyticsOverview
      x-outflare-access: { scope: analytics.read, brand_limited: true }
      summary: Every website across every tool
      description: "Scope: analytics.read. Stored traffic totals per website (by domain), with each tool side by side, search clicks added up across search consoles, and every connection's sync status."
      tags: [analytics]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Brand" }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, data, syncs, notes]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsOverviewSite" } }
                  syncs: { type: array, items: { $ref: "#/components/schemas/AnalyticsSync" } }
                  notes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/changes:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getAnalyticsChanges
      x-outflare-access: { scope: analytics.read }
      summary: What changed on each website
      description: >-
        Scope: analytics.read. Reads stored data only, so it is free. For each website (by domain): each tool's metrics over its own
        latest `days` stored days against the same number of days before (so a tool that runs behind is not read as a drop),
        search clicks added up across search consoles, the pages, sources and search queries that rose or fell most, unusual days
        against the 28 days before, the latest SEO snapshot against the one before (with keyword moves), plain-sentence headlines,
        and gaps: what is missing and which connector or action fixes it. Units for every metric are given once, in units.
      tags: [analytics]
      parameters:
        - { name: days, in: query, description: "Period length, 1 to 90. Default 7.", schema: { type: integer, minimum: 1, maximum: 90 } }
        - { name: to, in: query, description: "Last day to consider. Default yesterday, UTC.", schema: { type: string, format: date } }
        - { name: host, in: query, description: "One website, like example.com.", schema: { type: string } }
        - { name: limit, in: query, description: "Movers, unusual days and keyword moves per list, 1 to 25. Default 5.", schema: { type: integer, minimum: 1, maximum: 25 } }
      responses:
        "200":
          description: Changes per website.
          content:
            application/json:
              schema:
                type: object
                required: [days, to, websites, units, notes]
                properties:
                  days: { type: integer }
                  to: { type: string, format: date }
                  websites: { type: array, items: { $ref: "#/components/schemas/AnalyticsWebsiteChanges" } }
                  units: { type: object, additionalProperties: { type: string } }
                  notes: { type: array, items: { type: string } }
                  gaps: { type: array, description: "Only when no website is stored yet.", items: { $ref: "#/components/schemas/AnalyticsGap" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/catalog:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: getAnalyticsCatalog
      x-outflare-access: { scope: analytics.read }
      summary: What each website can be asked
      description: >-
        Scope: analytics.read. For each website: the analytics tools, which metrics each has stored per report, the days stored and
        last sync, the SEO tools with snapshots and budget left, and gaps with the connector or action that fixes each. ask maps
        common questions to the tool or endpoint that answers them.
      tags: [analytics]
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data, units, reports, ask]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AnalyticsCatalogSite" } }
                  units: { type: object, additionalProperties: { type: string } }
                  reports: { type: object, additionalProperties: { type: string } }
                  ask: { type: object, additionalProperties: { type: string } }
                  gaps: { type: array, items: { $ref: "#/components/schemas/AnalyticsGap" } }
        default: { $ref: "#/components/responses/Error" }
