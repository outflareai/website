    get:
      operationId: getEmailProvider
      x-outflare-access: { scope: emails.read }
      summary: Get an email provider
      description: "Scope: emails.read."
      tags: [emails]
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailProvider" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEmailProvider
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pause or resume a provider, make it the default, or set what it sends
      description: |
        Scope: emails.manage. A paused provider keeps its emails queued
        until it is resumed (or fails them after about a day). Disconnect
