  /v1/workspaces:
    post:
      operationId: createWorkspace
      x-outflare-access: { signed_in: true }
      summary: Create a workspace owned by the signed-in user
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                test: { type: boolean, default: false, description: "A test workspace (the sandbox): mailboxes are simulated and nothing is delivered, verified for real or bought. It cannot be changed later." }
                sample_data: { type: boolean, default: false, description: "With test: three simulated mailboxes and ten leads to start from." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getWorkspace
      x-outflare-access: { scope: workspace.read, brand_limited: true }
      summary: Get a workspace
      description: "Scope: workspace.read"
      tags: [access]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      x-outflare-access: { scope: workspace.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Rename a workspace or change its slug
      description: |
        Scope: workspace.manage. Send only the fields to change. The slug is the workspace's name in web app
        URLs (https://app.outflare.ai/{slug}/overview) and works in place of its ID in API paths. The old slug
        keeps working, in the app and the API, until another workspace takes it; store the ID, which never changes.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9-]{1,38}[A-Za-z0-9]$"
                  description: 3 to 40 letters, numbers and dashes (saved in lowercase), starting and ending with a letter or number. A few words the app uses for its own pages (admin, signup, settings and so on) are reserved.
                  example: acme
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "slug_taken: another workspace already uses the slug."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/slug-availability:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: checkWorkspaceSlug
      x-outflare-access: { scope: workspace.manage }
      summary: Check whether a slug is free
      description: "Scope: workspace.manage. For a settings form: says whether this workspace could take the slug, and why not."
      tags: [access]
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether the slug is free.
          content:
            application/json:
              schema:
                type: object
                required: [slug, available, reason]
                properties:
                  slug: { type: string, description: The slug as it would be saved (lowercased). }
                  available: { type: boolean, description: True when it is free or already this workspace's slug. }
                  reason: { type: [string, "null"], description: Why it cannot be used. }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/links/{kind}/{ref}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [sequence, project, list, mission, server, plan, connection, token, webhook] } }
      - { name: ref, in: path, required: true, description: "The item's ID, or any slug it has had. Underscores read as dashes.", schema: { type: string } }
    get:
      operationId: getItemLink
      x-outflare-access: { scope: workspace.read, brand_limited: true }
      summary: Find an item by the slug in its web app URL
      description: |
        Scope: workspace.read, plus the item's own read scope (sequences.read, projects.read, leads.read for lists,
        missions.read, mailboxes.read for servers, infrastructure.read for plans, integrations.read for connections,
        tokens.manage for API tokens, webhooks.read for webhook endpoints). The web app names items by a slug made from
        their name (https://app.outflare.ai/acme/sequences/q3-founders); a connection's slug comes from its connector
        instead (https://app.outflare.ai/acme/connectors/posthog, then posthog-2 for a second PostHog). This answers the
        item's ID and current slug for an ID or any slug it has had, so links keep working after a rename. A slug whose
        item was deleted goes to the next item that would get it. The API itself takes IDs.
      tags: [access]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                required: [kind, id, slug, name]
                properties:
                  kind: { type: string }
                  id: { type: string, format: uuid }
                  slug: { type: string, example: q3-founders }
                  name: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/members:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMembers
      x-outflare-access: { scope: members.read, brand_limited: true }
      summary: List members
      description: "Scope: members.read"
      tags: [access]
      responses:
        "200":
          description: Members, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMember
      x-outflare-access: { scope: members.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a member's role or brands
      description: |
        Scope: members.manage. Nobody can act above their own role; only owners can grant or change owner; the last owner
        cannot be demoted. Send `role`, `brand_ids` or both. `brand_ids` keeps an operator or viewer to some brands: they
        see those brands' records and the shared ones, change only their brands', and get 403 on endpoints that need every
        brand. Owners and admins always work on every brand, so making someone one clears their brands.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                brand_ids: { type: array, maxItems: 100, items: { type: string }, description: "Brand ids or handles; empty for every brand." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role, brand_ids]
                properties:
                  user_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
                  brand_ids: { type: array, items: { type: string, format: uuid } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      x-outflare-access: { scope: members.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a member
      description: "Scope: members.manage"
      tags: [access]
      responses:
        "204": { description: Removed. }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/invites:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInvites
      x-outflare-access: { scope: members.manage }
      summary: List pending invites
      description: "Scope: members.manage"
      tags: [access]
      responses:
        "200":
          description: Pending invites, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvite
      x-outflare-access: { scope: members.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Invite someone by email
      description: "Scope: members.manage. The token and link are returned once; they expire after 7 days."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, operator, viewer] }
                brand_ids: { type: array, maxItems: 100, items: { type: string }, description: "Brand ids or handles an operator or viewer will work on; empty or absent for every brand." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  token: { type: string }
                  invite_url: { type: string }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/invites/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeInvite
      x-outflare-access: { scope: members.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Revoke a pending invite
      description: "Scope: members.manage"
      tags: [access]
      responses:
        "204": { description: Revoked. }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/api-tokens:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listAPITokens
      x-outflare-access: { scope: tokens.manage }
      summary: List active API tokens
      description: "Scope: tokens.manage. Secrets are never returned after creation."
      tags: [access]
      responses:
        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAPIToken
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a scoped API token
      description: "Scope: tokens.manage. A token cannot hold scopes or looser limits than its creator. The secret is returned once."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/Scope" }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650 }
                daily_send_budget: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
                max_priority: { type: [string, "null"], enum: [low, normal, high, null] }
                may_take_mailboxes: { type: boolean }
                default_team_id: { type: [string, "null"], format: uuid }
                project_id: { type: [string, "null"], format: uuid, description: "Binds the token to one project: it sees and changes only that project's records, and endpoints that are not project-aware refuse it. Fixed for the token's life." }
                brand: { type: [string, "null"], description: "Binds the token to one brand, by id or handle: it sees that brand's records and the shared ones, changes only that brand's, and endpoints that need every brand refuse it. Fixed for the token's life; not with project_id.", example: repocket }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_token: { $ref: "#/components/schemas/APIToken" }
                  token: { type: string, description: "The secret, starting oft_. Shown once." }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/api-tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAPITokenLimits
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a token's name, permissions or limits
      description: "Scope: tokens.manage. Only the fields sent change. A token cannot change itself, add a scope it lacks, or grant looser limits than it has; taking a scope away is always allowed. A connected app's token is changed with updateAgentApp instead (400)."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APITokenLimits" }
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIToken" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeAPIToken
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Revoke an API token
      description: "Scope: tokens.manage"
      tags: [access]
      responses:
        "204": { description: Revoked. }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/agent-apps:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listAgentApps
      x-outflare-access: { scope: workspace.read }
      summary: List AI apps connected with OAuth
      description: "Scope: workspace.read. Apps such as Claude, ChatGPT or Cursor that a person connected to the hosted MCP server (`/mcp`) by signing in. Members see the apps they connected; people with tokens.manage see everyone's. Each app runs on an API token, which listAPITokens leaves out."
      tags: [access]
      responses:
        "200":
          description: Connected apps, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgentApp" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/agent-apps/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAgentApp
      x-outflare-access: { scope: workspace.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change what a connected AI app may do
      description: "Scope: workspace.read for an app you connected, tokens.manage for anyone's; people only, never a token, so an app can't change its own access. The app keeps reading what the person who connected it can read; `scopes` lists the changes it may make, from the app's `available_scopes`. Takes effect on the app's next call, with no need to connect again."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: "The write scopes to allow. Empty is read only." }
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentApp" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectAgentApp
      x-outflare-access: { scope: workspace.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Disconnect an AI app
      description: "Scope: workspace.read for an app you connected, tokens.manage for anyone's. Revokes the app's token and refresh token at once; the app has to be connected again."
      tags: [access]
      responses:
        "204": { description: Disconnected. }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent-apps/authorize:
    get:
      operationId: getAgentAuthorization
      x-outflare-access: { signed_in: true }
      summary: What an AI app asks to connect to
      description: For the consent screen at `/oauth/authorize`. Names the app that registered `client_id`, where it sends the person back to, whether that is an app Outflare recognises, and the workspaces the person can connect it to with what it may do in each.
      tags: [access]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The app and the person's workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [client, app, redirect_host, resource, workspaces]
                properties:
                  client:
                    type: object
                    required: [id, name, uri]
                    properties:
                      id: { type: string }
                      name: { type: string, description: "The name the app registered with. Anyone can register any name, so trust app and redirect_host over it." }
                      uri: { type: string }
                  app: { $ref: "#/components/schemas/AgentAppKind" }
                  redirect_host: { type: string, description: Where the person is sent back to after approving. }
                  resource: { type: string, description: The MCP server the app gets access to. }
                  workspaces:
                    type: array
                    items:
                      type: object
                      required: [id, slug, name, role, full_scopes, read_scopes, can_spend]
                      properties:
                        id: { type: string, format: uuid }
                        slug: { type: string }
                        name: { type: string }
                        role: { type: string }
                        full_scopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: "What access full gives: everything the role allows except managing members, tokens and the workspace, approving missions, removing suppressions, managing webhooks and spending money." }
                        read_scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                        can_spend: { type: boolean, description: "The role may approve spending (infrastructure.approve), so allow_spending can add it." }
                        brands:
                          description: Set when the person is kept to some brands there; the app is then kept to the one they pick (send it as brand). Null for every brand.
                          type: [array, "null"]
                          items:
                            type: object
                            required: [id, handle, name]
                            properties:
                              id: { type: string, format: uuid }
                              handle: { type: string }
                              name: { type: string }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: approveAgentAuthorization
      x-outflare-access: { signed_in: true }
      summary: Approve or decline an AI app
      description: The consent screen's answer. Approving issues a ten-minute, single-use authorization code bound to the PKCE challenge; the app swaps it at `POST /oauth/token` for an access token (an API token that lasts an hour) and a refresh token. Either way, send the browser to `redirect_url`.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, approve]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                state: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
                workspace_id: { type: string, description: The workspace's id or slug. }
                access: { type: string, enum: [full, read], description: "full or read, unless scopes is set." }
                allow_spending: { type: boolean, description: "Also let the app approve spending money on domains and mailboxes (infrastructure.approve). Off by default." }
                scopes:
                  type: array
                  items: { type: string }
                  description: "The exact write scopes to give the app, from the workspace's full_scopes plus infrastructure.approve when can_spend. The role's read scopes are always included. When set, access and allow_spending are ignored."
                brand: { type: string, description: "For a person kept to some brands: the brand (id or handle) the app is kept to. Required for them, ignored for everyone else." }
                approve: { type: boolean, description: False declines; the app hears access_denied. }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/audit-events:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listAuditEvents
      x-outflare-access: { scope: audit.read }
      summary: Audit log, newest first
      description: "Scope: audit.read. Page with before=next_before. brand narrows it to changes to one brand's records."
      tags: [access]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_before: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/events:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listEvents
      x-outflare-access: { scope: webhooks.read }
      summary: Events since a point, oldest first
      description: |
        Scope: webhooks.read. The same events webhooks send, for callers that cannot receive webhooks, such as agents
        and scripts behind a firewall. Start without after to read from the beginning of the audit log, keep
        next_after, and call again with after=next_after to get only what happened since. next_after is always set,
        so polling never loses its place; has_more says another page is ready now.
      tags: [webhooks]
      parameters:
        - { name: after, in: query, description: "An event id (evt_...) from next_after, or latest to start from now (no events, and next_after set to the newest).", schema: { type: string }, example: evt_48213 }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: types, in: query, description: 'Comma-separated event types or wildcards ("lead.*"). Default: every type.', schema: { type: string }, example: "lead.replied,mailbox.*" }
        - { $ref: "#/components/parameters/Brand" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_after, has_more, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEvent" }
                  next_after: { type: string, description: Pass as after next time. }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/jobs:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listJobs
      x-outflare-access: { scope: workspace.read }
      summary: List background jobs, newest first
      description: |
        Scope: workspace.read. Work that runs in the background (syncs, imports, DNS checks, sends) is a job.
        Filter by status to see what is still running or what failed. Finished jobs are kept for 14 days.
      tags: [system]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, failed] } }
        - { name: kind, in: query, description: "A job kind, such as analytics.sync.", schema: { type: string } }
        - { name: before, in: query, description: "A job id (job_...) from next_before.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  next_before: { type: [string, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string }, example: job_1042 }
    get:
      operationId: getJob
      x-outflare-access: { scope: workspace.read }
      summary: Get one background job
      description: "Scope: workspace.read. Poll this after a 202 that names a job, until status is succeeded or failed."
      tags: [system]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/logs:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listLogs
      x-outflare-access: { scope: audit.read, brand_limited: true }
      summary: Request logs, newest first
      description: |
        Scope: audit.read. Every API call made in the workspace, from the web app, the API, MCP, the CLI or an agent's
        mission, with its status, duration, error code and who made it. Only what describes the call is kept: never
        bodies, query values, headers or keys. Logs are kept 30 days (OUTFLARE_LOG_RETENTION_DAYS on self-hosted servers).
        Page back with before=next_before. To follow new calls as they happen, start with after=latest, then call again
        with after=next_after every few seconds: those pages are oldest first and next_after is always set. A
        brand-limited caller sees only calls about its brands.
      tags: [system]
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogStatus" }
        - { $ref: "#/components/parameters/LogSurface" }
        - { $ref: "#/components/parameters/LogMethod" }
        - { $ref: "#/components/parameters/LogOperation" }
        - { $ref: "#/components/parameters/LogErrorCode" }
        - { $ref: "#/components/parameters/LogMCPTool" }
        - { $ref: "#/components/parameters/LogRequestID" }
        - { $ref: "#/components/parameters/LogActor" }
        - { $ref: "#/components/parameters/LogToken" }
        - { $ref: "#/components/parameters/LogMission" }
        - { $ref: "#/components/parameters/LogProject" }
        - { $ref: "#/components/parameters/Brand" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { $ref: "#/components/parameters/LogSince" }
        - { $ref: "#/components/parameters/LogUntil" }
        - { name: before, in: query, description: "A log id (log_...) from next_before.", schema: { type: string }, example: log_48213 }
        - { name: after, in: query, description: "A log id (log_...) from next_after, or latest to start following from now.", schema: { type: string }, example: latest }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_after, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  next_before: { type: [string, "null"], description: Pass as before for older calls; null at the end. }
                  next_after: { type: [string, "null"], description: "Set when following (after=...): pass as after next time." }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/logs/export:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: exportLogs
      x-outflare-access: { scope: audit.read, brand_limited: true }
      summary: Export request logs
      description: "Scope: audit.read. The calls matching the same filters as listing them, newest first, as CSV (default) or newline-delimited JSON. Up to 50,000 rows; narrow since and until for more."
      tags: [system]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson], default: csv } }
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogStatus" }
        - { $ref: "#/components/parameters/LogSurface" }
        - { $ref: "#/components/parameters/LogMethod" }
        - { $ref: "#/components/parameters/LogOperation" }
        - { $ref: "#/components/parameters/LogErrorCode" }
        - { $ref: "#/components/parameters/LogMCPTool" }
        - { $ref: "#/components/parameters/LogRequestID" }
        - { $ref: "#/components/parameters/LogActor" }
        - { $ref: "#/components/parameters/LogToken" }
        - { $ref: "#/components/parameters/LogMission" }
        - { $ref: "#/components/parameters/LogProject" }
        - { $ref: "#/components/parameters/Brand" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { $ref: "#/components/parameters/LogSince" }
        - { $ref: "#/components/parameters/LogUntil" }
      responses:
        "200":
          description: The file.
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/logs/histogram:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getLogHistogram
      x-outflare-access: { scope: audit.read, brand_limited: true }
      summary: Count request logs over time
      description: |
        Scope: audit.read. Calls matching the same filters as listing them, counted by level in time buckets: 10 seconds for up to 20 minutes, a minute
        for up to 90 minutes, 5 minutes up to 6 hours, an hour up to 3 days, a day beyond. since defaults to 24h.
        Buckets with no calls are left out.
      tags: [system]
      parameters:
        - { $ref: "#/components/parameters/LogLevel" }
        - { $ref: "#/components/parameters/LogStatus" }
        - { $ref: "#/components/parameters/LogSurface" }
        - { $ref: "#/components/parameters/LogMethod" }
        - { $ref: "#/components/parameters/LogOperation" }
        - { $ref: "#/components/parameters/LogErrorCode" }
        - { $ref: "#/components/parameters/LogMCPTool" }
        - { $ref: "#/components/parameters/LogRequestID" }
        - { $ref: "#/components/parameters/LogActor" }
        - { $ref: "#/components/parameters/LogToken" }
        - { $ref: "#/components/parameters/LogMission" }
        - { $ref: "#/components/parameters/LogProject" }
        - { $ref: "#/components/parameters/Brand" }
        - { $ref: "#/components/parameters/LogQuery" }
        - { $ref: "#/components/parameters/LogSince" }
        - { $ref: "#/components/parameters/LogUntil" }
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [bucket_seconds, since, until, data]
                properties:
                  bucket_seconds: { type: integer, example: 3600 }
                  since: { type: string, format: date-time }
                  until: { type: string, format: date-time }
                  data:
                    type: array
                    items:
                      type: object
                      required: [at, info, warning, error]
                      properties:
                        at: { type: string, format: date-time, description: Start of the bucket. }
                        info: { type: integer, description: Calls that worked (status below 400). }
                        warning: { type: integer, description: Calls refused (4xx). }
                        error: { type: integer, description: Calls that broke (5xx). }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/logs/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: "A log id (log_...) or the call's request id (the X-Request-Id header and request_id in errors).", schema: { type: string }, example: log_48213 }
    get:
      operationId: getLog
      x-outflare-access: { scope: audit.read, brand_limited: true }
      summary: Get one request log
      description: "Scope: audit.read. One call and the audit log entries it wrote, so you can see what a call changed. Look up the request_id from an error to see the call that failed."
      tags: [system]
      responses:
        "200":
          description: The call.
          content:
            application/json:
              schema:
                type: object
                required: [log, audit_events]
                properties:
                  log: { $ref: "#/components/schemas/LogEntry" }
                  audit_events:
                    type: array
                    description: What the call changed, oldest first.
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listWebhooks
      x-outflare-access: { scope: webhooks.read }
      summary: List webhook endpoints
      description: "Scope: webhooks.read. Signing secrets are not included."
      tags: [webhooks]
      responses:
        "200":
          description: Endpoints, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhook
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a webhook endpoint
      description: |
        Scope: webhooks.manage. Outflare POSTs each subscribed event to the URL as JSON, signed the Standard Webhooks
        way (webhook-id, webhook-timestamp and webhook-signature headers), and retries failures with backoff for
        about three and a half hours. The answer includes the signing secret; GET .../secret shows it again.
        The URL must be public https unless the server sets WEBHOOKS_ALLOW_PRIVATE. At most 20 per workspace.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: The endpoint, with its signing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWebhook
      x-outflare-access: { scope: webhooks.read }
      summary: Get a webhook endpoint
      description: "Scope: webhooks.read."
      tags: [webhooks]
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWebhook
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a webhook endpoint, or turn it off and on
      description: |
        Scope: webhooks.manage. Send only what changes; events replaces the whole list. enabled: true turns back on
        an endpoint Outflare turned off (after a 410 Gone, or five days of failures) and clears its failure state.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a webhook endpoint
      description: "Scope: webhooks.manage. Deliveries still waiting are dropped."
      tags: [webhooks]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}/secret:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWebhookSecret
      x-outflare-access: { scope: webhooks.manage }
      summary: Show a webhook's signing secret
      description: "Scope: webhooks.manage."
      tags: [webhooks]
      responses:
        "200":
          description: The endpoint, with its signing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}/rotate-secret:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rotateWebhookSecret
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Make a new signing secret
      description: |
        Scope: webhooks.manage. For 24 hours deliveries carry two signatures, one per secret, so a receiver can move
        to the new secret without missing any. expire_now: true stops using the old secret at once (for a leak).
      tags: [webhooks]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expire_now: { type: boolean, description: "true stops signing with the old secret at once. Default false." }
      responses:
        "200":
          description: The endpoint, with its new signing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}/test:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: testWebhook
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Send a test event now
      description: |
        Scope: webhooks.manage. Sends a webhook.test event straight away, even to an endpoint that is off, and
        answers with the delivery: status delivered, or failed with the receiver's status code or the error.
      tags: [webhooks]
      responses:
        "200":
          description: The test delivery and its result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}/deliveries:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listWebhookDeliveries
      x-outflare-access: { scope: webhooks.read }
      summary: Deliveries to an endpoint, newest first
      description: "Scope: webhooks.read. Kept for 30 days. Page with before=next_before."
      tags: [webhooks]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" } }
        - { name: event_type, in: query, schema: { type: string }, example: lead.replied }
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  next_before: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/webhooks/{id}/deliveries/{delivery}/redeliver:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: delivery, in: path, required: true, schema: { type: integer } }
    post:
      operationId: redeliverWebhook
      x-outflare-access: { scope: webhooks.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Send a delivery again now
      description: |
        Scope: webhooks.manage. Same webhook-id as before, so a receiver that already handled it can skip it. A
        delivery still being retried keeps its schedule if this try fails too.
      tags: [webhooks]
      responses:
        "200":
          description: The delivery and the result of this try.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMailboxes
      x-outflare-access: { scope: mailboxes.read, project_tokens: true, brand_limited: true }
      summary: List mailboxes
      description: "Scope: mailboxes.read. Credentials are never returned."
      tags: [mailboxes]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MailboxStatus" } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/LifecycleStage" } }
        - { name: pool_id, in: query, schema: { type: string, format: uuid } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: project_id, in: query, description: "A project's id, or none for records shared by the workspace. A project token always sees only its project.", schema: { type: string } }
      responses:
        "200":
          description: Mailboxes, ordered by email.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Mailbox" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add or update one mailbox
      description: |
        Scope: mailboxes.manage. Upserts by email. Google Workspace and
        Microsoft 365 are detected from MX records; other providers need the
        host and port fields. The mailbox starts as `verifying` while a job
        signs in over SMTP and IMAP.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailboxInput" }
      responses:
        "200":
          description: Updated an existing mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/import:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: importMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      summary: Bulk import mailboxes from CSV
      description: |
        Scope: mailboxes.manage. Send the CSV file as the body (up to 5 MB and
        5000 rows). Required columns: `email` and `password` (or
        `smtp_password`). Optional: `name` (or `first_name` and `last_name`),
        `provider`, `smtp_host`, `smtp_port`, `smtp_username`,
        `smtp_password`, `imap_host`, `imap_port`, `imap_username`,
        `imap_password`, `pool` and `daily_limit`. Common reseller and
        sequencer headers such as `Email Address` and `App Password` are
        recognised. Rows are upserted by email; bad rows are reported by line
        and the rest still import.
      tags: [mailboxes]
      parameters:
        - name: pool
          in: query
          description: Pool name for rows that do not name one. Created if missing.
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailbox
      x-outflare-access: { scope: mailboxes.read, project_tokens: true, brand_limited: true }
      summary: Get a mailbox
      description: "Scope: mailboxes.read"
      tags: [mailboxes]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a mailbox's name, limits, pool, or pause and resume it
      description: |
        Scope: mailboxes.manage. Set `status` to `paused` to stop sending, or
        to `active` to resume; resuming re-verifies the connection first.
        Set `pool_id` to null to remove the mailbox from its pool.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                daily_limit: { type: integer, minimum: 1, maximum: 500 }
                min_gap_seconds: { type: integer, minimum: 0, maximum: 3600 }
                pool_id: { type: [string, "null"], format: uuid }
                status: { type: string, enum: [paused, active] }
                warmup: { $ref: "#/components/schemas/WarmupSettings" }
      responses:
        "200":
          description: The updated mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a mailbox and its stored credentials
      description: "Scope: mailboxes.manage"
      tags: [mailboxes]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/verify:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a mailbox's SMTP and IMAP sign-in and its domain's DNS
      description: "Scope: mailboxes.manage. Runs in the background; poll the mailbox for the result."
      tags: [mailboxes]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/warmup:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailboxWarmup
      x-outflare-access: { scope: mailboxes.read }
      deprecated: true
      summary: A mailbox's results from Outflare's own warm-up for each of the last 14 days
      description: "Scope: mailboxes.read. Days are UTC, oldest first. Outflare no longer sends warm-up mail itself, so the days run down to zero; a connected sequencer's warm-up score is in the mailbox's `warmup.platform`."
      tags: [mailboxes]
      responses:
        "200":
          description: Daily results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WarmupDay" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/warmup:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: updateWarmup
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Turn warm-up on or off in connected sequencers for many mailboxes
      description: |
        Scope: mailboxes.manage. Applies to the mailboxes in `mailbox_ids`,
        or to every mailbox in `pool_id`, or to every mailbox in the
        workspace when neither is given. Outflare doesn't send warm-up mail
        itself: a connected sequencer with its own warm-up (EmailBison,
        Instantly, Smartlead) runs it, and Outflare switches it there.
        Turning warm-up on without `provider` keeps each mailbox's
        sequencer, or picks a connected one it is in; a listed mailbox in
        none is a 400, and for the whole workspace such mailboxes are left
        out.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WarmupSettings" }
                - type: object
                  properties:
                    mailbox_ids: { type: array, items: { type: string, format: uuid } }
                    pool_id: { type: string, format: uuid }
      responses:
        "200":
          description: How many mailboxes changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-pools:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMailboxPools
      x-outflare-access: { scope: mailboxes.read, brand_limited: true }
      summary: List mailbox pools
      description: "Scope: mailboxes.read"
      tags: [mailboxes]
      responses:
        "200":
          description: Pools.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MailboxPool" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMailboxPool
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a mailbox pool
      description: "Scope: mailboxes.manage"
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailboxPool" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-pools/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteMailboxPool
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a pool. Its mailboxes stay, without a pool.
      description: "Scope: mailboxes.manage"
      tags: [mailboxes]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSendingDomains
      x-outflare-access: { scope: mailboxes.read, project_tokens: true, brand_limited: true }
      summary: List sending domains with health, settings and sending stats
      description: |
        Scope: mailboxes.read. Every domain your mailboxes send from, plus
        domains added by hand. Each carries its DNS (MX, SPF, DKIM, DMARC)
        and blocklist results, the issues to fix, its settings, mailbox
        counts and sends, replies and bounces over rolling windows.
      tags: [domains]
      parameters:
        - { $ref: "#/components/parameters/Brand" }
        - { name: project_id, in: query, description: "A project's id, or none for records shared by the workspace. A project token always sees only its project.", schema: { type: string } }
      responses:
        "200":
          description: Domains, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SendingDomain" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a domain to track before it has mailboxes
      description: |
        Scope: mailboxes.manage. Accepts `acme.com`, `@acme.com`, a URL or an
        address on the domain. Its DNS check runs in the background; poll the
        domain until `checked_at` is set. Domains of connected mailboxes are
        added on their own.
      tags: [domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: acme.com }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains/check:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: checkAllSendingDomains
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check DNS and blocklists for every domain
      description: "Scope: mailboxes.manage. Runs in the background. Every domain is also re-checked on its own once a day."
      tags: [domains]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [queued], properties: { queued: { type: integer, description: "Domains queued for a check." } } }, { $ref: "#/components/schemas/MissionHeld" }] }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains/{domain}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/Domain" }
    get:
      operationId: getSendingDomain
      x-outflare-access: { scope: mailboxes.read, project_tokens: true, brand_limited: true }
      summary: Get a domain, with daily sends, replies and bounces for 14 days
      description: "Scope: mailboxes.read. List the domain's mailboxes with `GET /mailboxes?domain=`."
      tags: [domains]
      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingDomainDetail" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pause or resume a domain, cap its daily sends, or set limits on all its mailboxes
      description: |
        Scope: mailboxes.manage. `status: paused` stops sequence and test
        sends from every mailbox on the domain (replies written in the inbox
        still go); `active` resumes. `daily_limit` caps sends from all of the
        domain's mailboxes together in any 24 hours; null removes the cap.
        `mailbox_daily_limit` and `mailbox_min_gap_seconds` set those
        settings on every mailbox on the domain at once.
      tags: [domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, paused] }
                daily_limit: { type: [integer, "null"], minimum: 1, maximum: 100000 }
                notes: { type: string, maxLength: 2000 }
                mailbox_daily_limit: { type: integer, minimum: 1, maximum: 500 }
                mailbox_min_gap_seconds: { type: integer, minimum: 0, maximum: 3600 }
      responses:
        "200":
          description: The updated domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Stop tracking a domain that has no mailboxes
      description: "Scope: mailboxes.manage. Returns 409 while mailboxes on the domain are connected."
      tags: [domains]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains/{domain}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/Domain" }
    post:
      operationId: checkSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a domain's DNS and blocklists now
      description: "Scope: mailboxes.manage. Runs in the background; poll the domain for a new `checked_at`. Use it after changing DNS records."
      tags: [domains]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSendingServers
      x-outflare-access: { scope: mailboxes.read }
      summary: List sending servers with IPs, blocklist results, settings and sending stats
      description: |
        Scope: mailboxes.read. A sending server is the SMTP host a group of
        mailboxes signs in to, and the IP addresses they share: a cold-email
        SMTP vendor's server (Mailreef, Infraforge) or your own mail server.
        Mailboxes outside Google and Microsoft join one on their own when
        they are connected, grouped by `smtp_host`. Each server carries its
        IPs, their blocklist results, the issues to fix, a shared daily
        limit and pause, mailbox counts and sends over rolling windows.
      tags: [servers]
      responses:
        "200":
          description: Servers, sorted by host.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SendingServer" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/check:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: checkAllSendingServers
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check IPs and blocklists for every server
      description: "Scope: mailboxes.manage. Runs in the background. Every server is also re-checked on its own once a day."
      tags: [servers]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [queued], properties: { queued: { type: integer, description: "Servers queued for a check." } } }, { $ref: "#/components/schemas/MissionHeld" }] }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSendingServer
      x-outflare-access: { scope: mailboxes.read }
      summary: Get a sending server
      description: "Scope: mailboxes.read. List its mailboxes with `GET /mailboxes?server_id=`."
      tags: [servers]
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingServer" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pause or resume a server, cap its daily sends, or set its sending IPs
      description: |
        Scope: mailboxes.manage. `status: paused` stops sequence and test
        sends from every mailbox on the server (replies written in the inbox
        still go); `active` resumes, including after an automatic blocklist
        pause. `daily_limit` caps sends from all its mailboxes together in
        any 24 hours; null removes the cap. `pause_on_listing` (on by
        default) pauses the server when a check finds one of its IPs on a
        blocklist, and resumes it when every IP is clear again; a pause by a
        person is never lifted automatically. `ips` sets the sending
        addresses by hand, for servers that accept mail on one address and
        send from others; null goes back to the host's DNS records. Changing
        `ips` queues a new check.
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                status: { type: string, enum: [active, paused] }
                daily_limit: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
                notes: { type: string, maxLength: 2000 }
                pause_on_listing: { type: boolean }
                ips:
                  type: [array, "null"]
                  minItems: 1
                  maxItems: 256
                  items: { type: string, description: An IPv4 or IPv6 address. }
      responses:
        "200":
          description: The updated server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingServer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a server that no mailbox uses
      description: "Scope: mailboxes.manage. Returns 409 while mailboxes still sign in to it."
      tags: [servers]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/{id}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a server's IPs and blocklists now
      description: "Scope: mailboxes.manage. Runs in the background; poll the server for a new `checked_at`. Use it after a delisting request."
      tags: [servers]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listTrackingDomains
      x-outflare-access: { scope: mailboxes.read, brand_limited: true }
      summary: List tracking domains
      description: |
        Scope: mailboxes.read. Optional. Once a domain is verified, the
        workspace's unsubscribe links and any click-tracked links use it
        instead of this server's address. `target` is what the CNAME must
        point to.
      tags: [tracking]
      responses:
        "200":
          description: Tracking domains.
          content:
            application/json:
              schema:
                type: object
                required: [data, target]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TrackingDomain" }
                  target: { type: string }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a tracking domain
      description: "Scope: mailboxes.manage. Add a CNAME record from the domain to `target` first or after; the DNS is checked straight away and whenever you call check."
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: links.acme.com }
      responses:
        "201":
          description: The domain, with the result of the first check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a tracking domain
      description: "Scope: mailboxes.manage. Links already sent keep working only while the domain still points here."
      tags: [tracking]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains/{id}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Check a tracking domain's DNS now
      description: "Scope: mailboxes.manage."
      tags: [tracking]
      responses:
        "200":
          description: The domain, with the result of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingDomain" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listLeads
      x-outflare-access: { scope: leads.read, brand_limited: true }
      summary: List and search leads, ordered by email
      description: "Scope: leads.read"
      tags: [leads]
      parameters:
        - { name: list_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Matches email, name or company.", schema: { type: string } }
        - { name: suppressed, in: query, schema: { type: boolean } }
        - { name: verification, in: query, description: "Latest verification result, or unverified for never checked.", schema: { type: string, enum: [deliverable, undeliverable, risky, unknown, unverified] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "next_after from the previous page.", schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Leads.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, next_after, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lead" }
                  total: { type: integer, description: Matches across all pages. }
                  next_after: { type: [string, "null"], description: Pass as after to get the next page. }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: upsertLead
      x-outflare-access: { scope: leads.manage, brand_limited: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a lead, or update the lead with this email
      description: "Scope: leads.manage. Empty fields keep stored values; custom fields are merged."
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads/import:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: importLeads
      x-outflare-access: { scope: leads.manage, brand_limited: true }
      summary: Bulk import leads from CSV
      description: |
        Scope: leads.manage. Send the CSV file as the body (up to 50 MB and
        100,000 rows). Only an email column is required. Standard columns are
        recognised under common export names (first name, last name, full
        name, company, title, phone, LinkedIn URL, website); every other
        column is kept as a custom field under its snake_case header, for use
        in templates. Leads are upserted by email: a row for an existing lead
        fills in non-empty fields and merges custom fields. Rows repeating an
        email within the file are merged. Suppressed people are imported but
        counted, and are never emailed.
      tags: [leads]
      parameters:
        - name: list
          in: query
          description: Add every imported lead to this list, created if missing.
          schema: { type: string, maxLength: 100 }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLead
      x-outflare-access: { scope: leads.read, brand_limited: true }
      summary: Get a lead
      description: "Scope: leads.read"
      tags: [leads]
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLead
      x-outflare-access: { scope: leads.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a lead's fields
      description: "Scope: leads.manage. In custom, a null value removes that field."
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                company: { type: string }
                title: { type: string }
                phone: { type: string }
                linkedin_url: { type: string }
                website: { type: string }
                custom:
                  type: object
                  additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: The updated lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLead
      x-outflare-access: { scope: leads.manage }
      summary: Delete a lead
      description: |
        Scope: leads.manage. With suppress=true the address is also added to
        the suppression list (reason do_not_contact), so an erasure request is
        honoured even if the person is imported again later.
      tags: [leads]
      parameters:
        - { name: suppress, in: query, schema: { type: boolean, default: false } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
