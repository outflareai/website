      parameters:
        - { name: project_id, in: query, description: "A project's id, or none for records shared by the workspace. A project token always sees only its project.", schema: { type: string } }
      responses:
        "200":
          description: Domains, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SendingDomain" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a domain to track before it has mailboxes
      description: |
        Scope: mailboxes.manage. Accepts `acme.com`, `@acme.com`, a URL or an
        address on the domain. Its DNS check runs in the background; poll the
        domain until `checked_at` is set. Domains of connected mailboxes are
        added on their own.
      tags: [domains]
      requestBody:
