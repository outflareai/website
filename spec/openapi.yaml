      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/AllocationMode" }
      responses:
        "200":
          description: The mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/AllocationMode" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/plan:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: previewAllocation
      x-outflare-access: { scope: sequences.read }
      summary: Dry run, showing what the allocator would change now
      description: "Scope: sequences.read. Changes nothing."
      tags: [allocation]
      responses:
        "200":
          description: Planned changes and each active sequence's capacity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/PlannedChange" } }
                  capacity: { type: array, items: { $ref: "#/components/schemas/AllocationCapacity" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/run:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: runAllocation
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Plan and apply now
      description: |
        Scope: sequences.manage. The allocator also runs every minute and
        after any relevant change. In suggest mode, and for changes that need
        another team's or the owner's approval, it records suggestions instead.
      tags: [allocation]
      responses:
        "200":
          description: What was applied and what was suggested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: array, items: { $ref: "#/components/schemas/PlannedChange" } }
                  suggested: { type: array, items: { $ref: "#/components/schemas/PlannedChange" } }
        "202": { $ref: "#/components/responses/MissionHeld" }
