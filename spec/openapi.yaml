      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [queued], properties: { queued: { type: integer, description: "Domains queued for a check." } } }, { $ref: "#/components/schemas/MissionHeld" }] }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains/{domain}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/Domain" }
    get:
      operationId: getSendingDomain
      x-outflare-access: { scope: mailboxes.read, project_tokens: true }
      summary: Get a domain, with daily sends, replies and bounces for 14 days
      description: "Scope: mailboxes.read. List the domain's mailboxes with `GET /mailboxes?domain=`."
      tags: [domains]
      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingDomainDetail" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pause or resume a domain, cap its daily sends, or set limits on all its mailboxes
      description: |
        Scope: mailboxes.manage. `status: paused` stops sequence and test
        sends from every mailbox on the domain (replies written in the inbox
        still go); `active` resumes. `daily_limit` caps sends from all of the
        domain's mailboxes together in any 24 hours; null removes the cap.
        `mailbox_daily_limit` and `mailbox_min_gap_seconds` set those
        settings on every mailbox on the domain at once.
      tags: [domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, paused] }
                daily_limit: { type: [integer, "null"], minimum: 1, maximum: 100000 }
                notes: { type: string, maxLength: 2000 }
                mailbox_daily_limit: { type: integer, minimum: 1, maximum: 500 }
                mailbox_min_gap_seconds: { type: integer, minimum: 0, maximum: 3600 }
      responses:
        "200":
          description: The updated domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingDomain" }
