      properties:
        lifecycle:
          type: object
          required: [stage, reason, until, changed_at, auto_rest, plan_id]
          description: Where the mailbox is in its working life. Only ready mailboxes send cold email.
          properties:
            stage: { $ref: "#/components/schemas/LifecycleStage" }
            reason: { type: string }
            until: { type: [string, "null"], format: date-time, description: "Warming: the earliest it can be ready. Resting: when the rest ends." }
            changed_at: { type: string, format: date-time }
            auto_rest: { type: boolean }
            plan_id: { type: [string, "null"], format: uuid, description: The infrastructure plan that built it. }
        id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        display_name: { type: string }
        provider: { type: string, enum: [google, microsoft, other] }
        project_id: { type: [string, "null"], format: uuid, description: "The project that owns the mailbox; it then sends only for that project's sequences. Null: shared by the workspace." }
        auth_method: { type: string, enum: [password, oauth] }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        status: { $ref: "#/components/schemas/MailboxStatus" }
        status_reason: { type: [string, "null"], description: Why the last connection check failed. }
        daily_limit: { type: integer, minimum: 1, maximum: 500 }
        min_gap_seconds: { type: integer, minimum: 0, maximum: 3600, description: Least time between two sends from this mailbox. }
        smtp_ok: { type: [boolean, "null"] }
        imap_ok: { type: [boolean, "null"] }
        last_verified_at: { type: [string, "null"], format: date-time }
        last_synced_at: { type: [string, "null"], format: date-time, description: When the inbox was last checked for new mail. }
        sync_error: { type: [string, "null"], description: Why the last inbox sync failed. }
