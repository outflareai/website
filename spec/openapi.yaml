    patch:
      operationId: updateAPITokenLimits
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a token's sending and allocation limits
      description: "Scope: tokens.manage. A token cannot change its own limits, or grant looser ones than it has. Scopes are fixed; issue a new token to change them."
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APITokenLimits" }
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIToken" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeAPIToken
      x-outflare-access: { scope: tokens.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Revoke an API token
      description: "Scope: tokens.manage"
      tags: [access]
