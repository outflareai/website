      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, sender_id]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                sender_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: How many mailboxes changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
