            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AllocationSuggestion" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/suggestions/{id}/apply:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: applyAllocationSuggestion
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Apply or approve a suggestion
      description: |
        Scope: sequences.manage. A team_approval needs a member of that team,
        or a workspace owner or admin. An owner_approval needs a person, not
        an API token. Fails with 409 if the mailbox changed since.
      tags: [allocation]
      responses:
        "200":
          description: The change made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { $ref: "#/components/schemas/PlannedChange" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/suggestions/{id}/decline:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: declineAllocationSuggestion
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Decline a suggestion, so it is not proposed again
      description: "Scope: sequences.manage."
      tags: [allocation]
      responses:
        "204": { description: Declined. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/changes:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listAllocationChanges
      x-outflare-access: { scope: sequences.read }
      summary: Mailbox assignment history, newest first
      description: "Scope: sequences.read."
      tags: [allocation]
      parameters:
        - { name: sequence_id, in: query, schema: { type: string, format: uuid } }
        - { name: mailbox_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Fields" }
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_offset, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
                  next_offset: { type: [integer, "null"] }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/changes/{id}/undo:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: undoAllocationChange
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Undo a change
      description: |
        Scope: sequences.manage. Only the latest change to a mailbox can be
        undone. Undoing an automatic choice also stops the allocator from
        making it again.
      tags: [allocation]
      responses:
        "200":
          description: The reversing change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { $ref: "#/components/schemas/PlannedChange" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/allocation/attention:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getAllocationAttention
      x-outflare-access: { scope: sequences.read }
      summary: What needs a person
      description: "Scope: sequences.read. Approvals, suggestions to review, shortages, follow-ups whose mailbox is gone and unconfirmed senders."
      tags: [allocation]
      responses:
        "200":
          description: Items needing attention.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals: { type: array, items: { $ref: "#/components/schemas/AllocationSuggestion" } }
                  suggestions_to_review: { type: integer }
                  shortages:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence_id: { type: string, format: uuid }
                        sequence_name: { type: string }
                        needed_daily: { type: integer }
                        active_daily: { type: integer }
                        blocking: { type: array, items: { $ref: "#/components/schemas/AllocationBlocking" } }
                        note: { type: string }
                  orphaned_follow_ups:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence_id: { type: string, format: uuid }
                        sequence_name: { type: string }
                        leads: { type: integer }
                  unconfirmed_senders: { type: integer, description: Only counted once the workspace has teams. }
                  platforms:
                    type: array
                    description: Platform accounts that are out of date, have a first plan to review, or have mailboxes in conflict.
                    items: { $ref: "#/components/schemas/PlatformAccount" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listPlatforms
      x-outflare-access: { scope: sequences.read }
      summary: List connected sequencer accounts
      description: "Scope: sequences.read. Every connected account of an outside sequencer (EmailBison, Instantly, Smartlead) that mailbox allocation reads. Outflare reads each one every 5 minutes; its live campaigns become sequences with `links`, and its mailboxes become mailboxes with `has_login: false` unless Outflare already has them."
      tags: [allocation]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlatformAccount" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms/{id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: The connection (integration) id., schema: { type: string, format: uuid } }
    post:
      operationId: syncPlatform
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Read a sequencer account now
      description: "Scope: sequences.manage. Reads mailboxes and campaigns now instead of waiting for the next 5-minute sync. Mailboxes added to or removed from a campaign in the platform are accepted as manual changes; attaches Outflare asked for are confirmed once the platform shows them."
      tags: [allocation]
      responses:
        "200":
          description: What the sync found and changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailboxes: { type: integer }
                  campaigns: { type: integer, description: Live campaigns linked to sequences. }
                  accepted: { type: integer, description: "Changes made in the platform, accepted as manual ones." }
                  confirmed: { type: integer, description: Attaches the platform now shows. }
                  replies: { type: integer, description: New replies brought into the inbox, for a platform that reports them. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/platforms/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, description: The connection (integration) id., schema: { type: string, format: uuid } }
    post:
      operationId: reviewPlatformPlan
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Let allocation change a newly connected account
      description: "Scope: sequences.manage. Until this is called, every change for the account's campaigns is only suggested, so you can look at the first plan before anything moves. Runs a plan straight away."
      tags: [allocation]
      responses:
        "200":
          description: The plan that ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
                  suggested: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/assign:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: assignMailboxes
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Assign mailboxes to a sequence by hand
      description: |
        Scope: sequences.manage. A mailbox with leads mid-sequence elsewhere
        drains first: it finishes those follow-ups, then joins. Locks are
        honoured; a mailbox locked elsewhere is refused.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, sequence_id]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                sequence_id: { type: string, format: uuid }
      responses:
        "200":
          description: One result per mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/release:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: releaseMailboxes
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Take mailboxes off their sequence
      description: "Scope: sequences.manage. Mailboxes with leads in flight drain first."
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
      responses:
        "200":
          description: One result per mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/lock:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: lockMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Lock mailboxes, or clear their locks
      description: |
        Scope: mailboxes.manage. sequence: keep on this sequence (assigns it
        now). team: only this team's sequences. manual_only: the allocator
        never touches it. A null kind clears the lock. until is optional.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, kind]
              properties:
                mailbox_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
                kind: { type: [string, "null"], enum: [sequence, team, manual_only, null] }
                sequence_id: { type: string, format: uuid }
                team_id: { type: string, format: uuid }
                until: { type: [string, "null"], format: date-time }
                note: { type: string }
      responses:
        "200":
          description: Mailboxes changed, and any assignments a sequence lock made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  assignments: { type: array, items: { $ref: "#/components/schemas/MailboxAllocationResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/allocation:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSequenceAllocation
      x-outflare-access: { scope: sequences.read }
      summary: A sequence's mailboxes, capacity, suggestions and history
      description: "Scope: sequences.read."
      tags: [allocation]
      responses:
        "200":
          description: The sequence's allocation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence_id: { type: string, format: uuid }
                  mode: { $ref: "#/components/schemas/AllocationMode" }
                  needed_daily: { type: [integer, "null"] }
                  active_daily: { type: integer }
                  blocking: { type: array, items: { $ref: "#/components/schemas/AllocationBlocking" } }
                  note: { type: string }
                  planned_at: { type: [string, "null"], format: date-time }
                  mailboxes: { type: array, items: { $ref: "#/components/schemas/AssignedMailbox" } }
                  incoming: { type: array, items: { $ref: "#/components/schemas/AssignedMailbox" }, description: Mailboxes draining elsewhere that join next. }
                  suggestions: { type: array, items: { $ref: "#/components/schemas/AllocationSuggestion" } }
                  changes: { type: array, items: { $ref: "#/components/schemas/AllocationChange" } }
                  orphaned_follow_ups: { type: integer }
                  links: { type: array, items: { $ref: "#/components/schemas/CampaignLink" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sequences/{id}/orphaned-follow-ups:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveOrphanedFollowUps
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Decide what happens to follow-ups whose mailbox is gone
      description: |
        Scope: sequences.manage. cancel stops them. handoff sends the next
        step from another of the sequence's mailboxes as a fresh email, not a
        reply, since the new sender never wrote before.
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [cancel, handoff] }
      responses:
        "200":
          description: How many leads changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: getInfrastructure
      x-outflare-access: { scope: infrastructure.read }
      summary: Mailboxes by lifecycle stage, the ones not ready, and plans in progress
      description: |
        Scope: infrastructure.read. Counts of mailboxes in each lifecycle
        stage (warming, ready, resting, retired), every mailbox that is not
        ready with the reason and until when, the plans that are not finished,
        and the suppliers plans can buy from on this server.
      tags: [infrastructure]
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfrastructureOverview" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure/preview:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: previewInfraPlan
      x-outflare-access: { scope: infrastructure.read }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Draft a plan without saving it
      description: |
        Scope: infrastructure.read. Takes the same fields as creating a plan
        and returns the domains, mailboxes, timeline, daily capacity and
        warnings it would have. Nothing is saved or bought.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InfraPlanInput" }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlanDraft" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infrastructure/move:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: moveMailboxStage
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Move mailboxes to warming, ready, resting or retired
      description: |
        Scope: infrastructure.manage. Works on any mailbox, including ones
        you imported yourself. Only ready mailboxes send cold email; warm-up
        carries on while warming and resting. Retiring pauses the mailbox and
        turns warm-up off for good; its unfinished follow-ups wait for you to
        cancel them or hand them to another mailbox. A mailbox that cannot
        make the move is returned with `skipped` saying why.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_ids, stage]
              properties:
                mailbox_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 1000 }
                stage: { $ref: "#/components/schemas/LifecycleStage" }
                reason: { type: string, maxLength: 500, description: Shown on the mailbox and in the audit log. }
                until:
                  type: string
                  format: date-time
                  description: "Resting: when the rest ends (default 7 days). Warming: the earliest it can be ready (default 14 days)."
                auto_rest:
                  type: boolean
                  description: Rest on its own when warm-up inbox placement drops, and come back when it recovers.
                cancel_at_supplier:
                  type: boolean
                  description: Retiring a mailbox a plan bought also cancels it at the supplier, at the end of the period.
      responses:
        "200":
          description: What happened to each mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [moved, results]
                properties:
                  moved: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, email, from, to]
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string }
                        from: { $ref: "#/components/schemas/LifecycleStage" }
                        to: { $ref: "#/components/schemas/LifecycleStage" }
                        skipped: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listInfraPlans
      x-outflare-access: { scope: infrastructure.read }
      summary: List infrastructure plans
      description: "Scope: infrastructure.read. Newest first, without their items."
      tags: [infrastructure]
      responses:
        "200":
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InfraPlan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Draft a plan for domains and mailboxes
      description: |
        Scope: infrastructure.manage. "10 domains and 30 mailboxes for this
        project by the 14th" is `domain_count: 10, mailboxes_per_domain: 3,
        ready_by: "2026-11-14", project_id`. Domain names come from `brand`
        unless you list them in `domains`; listing a domain the workspace
        already has adds mailboxes to it instead of buying it. Mailbox names
        come from `personas`. A plan with a supplier is priced in the
        background; read it again until `quote.status` is `ready`. A draft
        buys nothing until it is approved.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/InfraPlanInput"
                - required: [name, domain_count]
      responses:
        "201":
          description: The draft plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInfraPlan
      x-outflare-access: { scope: infrastructure.read }
      summary: Get a plan with every domain and mailbox and where each one is
      description: "Scope: infrastructure.read"
      tags: [infrastructure]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a draft plan
      description: |
        Scope: infrastructure.manage. Drafts only. Domains already in the plan
        are kept unless you send `domains`; ones the supplier said are taken
        are replaced with new suggestions.
      tags: [infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InfraPlanInput" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteInfraPlan
      x-outflare-access: { scope: infrastructure.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a draft or cancelled plan
      description: "Scope: infrastructure.manage. Domains and mailboxes it built stay."
      tags: [infrastructure]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/infra-plans/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveInfraPlan
      x-outflare-access: { scope: infrastructure.approve }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Approve a plan, which starts buying
      description: |
        Scope: infrastructure.approve (owners and admins; give it to an agent
        token only if it may spend). Fails with 409 while the plan has a
        blocking warning. When the plan has a price, send `once_cents` and
        `monthly_cents` exactly as its `quote` shows them, so a price that
        changed is never approved by accident. Customers pay the supplier
        directly, on their own account.
      tags: [infrastructure]
      requestBody:
        content:
          application/json:
