        connectors:
          type: array
          description: Connectors the plan needs that are not connected yet.
          items: { type: object, required: [id, why], properties: { id: { type: string }, name: { type: string }, why: { type: string } } }
        questions: { type: array, items: { type: string } }
        assumptions: { type: array, items: { type: string } }
    MissionPlanResult:
      type: object
      required: [mission, draft, usage]
      properties:
        mission: { $ref: "#/components/schemas/Mission" }
        draft: { $ref: "#/components/schemas/MissionDraft" }
        usage:
          type: object
          required: [model, input_tokens, output_tokens]
          properties:
            model: { type: string, example: claude-opus-5-5 }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
    MissionInput:
      type: object
      properties:
        name: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        goal: { type: string, description: The goal in words. }
        goal_metric: { type: [string, "null"], enum: [meetings, replies, sends, leads, null] }
        goal_target: { type: [integer, "null"], minimum: 1 }
        instructions: { type: string, description: Guidance on top of the project brief (Markdown). }
        plan: { type: string, description: The agent's plan (Markdown). }
        mode: { $ref: "#/components/schemas/MissionMode" }
        token_id: { type: [string, "null"], format: uuid, description: The only token that may act in the mission. }
        max_sends: { type: [integer, "null"], minimum: 1 }
        max_spend_cents: { type: [integer, "null"], minimum: 0, description: "US cents, from the spend ledger." }
        ends_at: { type: [string, "null"], format: date-time, description: The mission ends itself at this time. }
    Mission:
      type: object
      required: [id, name, project_id, brand_id, project_name, goal, instructions, plan, plan_updated_at, mode, status, status_reason, token_id, token_name, limits, progress, writes, pending_actions, calls, last_call_at, brief_version, approved_by, approved_by_name, approved_at, started_at, ended_at, report, created_by, created_by_name, started_by_agent, runner, turns, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        brand_id: { type: [string, "null"], format: uuid, description: "The brand that owns it, or null when shared by every brand. In a project it is the project's brand." }
        project_name: { type: [string, "null"] }
        goal:
