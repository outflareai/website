      responses:
        "200":
          description: The closed identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordIdentity" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
