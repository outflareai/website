          application/json:
            schema:
              type: object
              properties:
                sync: { type: boolean }
                domain: { type: string, example: example.com }
      responses:
        "200":
          description: The site as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSitePlan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/{id}/site:
