          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            confirmed: { type: boolean }
        suggested_sender_id: { type: [string, "null"], format: uuid }
        assignment:
          type: [object, "null"]
          description: The sequence this mailbox sends for now. Null when free.
          properties:
            sequence_id: { type: string, format: uuid }
            sequence_name: { type: string }
            state: { type: string, enum: [active, draining] }
            next_sequence_id: { type: [string, "null"], format: uuid }
            source: { type: string, enum: [manual, automatic, external] }
            reason: { type: string }
            platform: { type: [string, "null"], description: The sequencer it sends through for this sequence. Null when Outflare sends. }
            confirmed: { type: boolean, description: False until the platform shows the mailbox on the campaign. }
