      operationId: createSender
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create a sender
      description: "Scope: mailboxes.manage."
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SenderInput" }
      responses:
        "201":
          description: The sender.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sender" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/senders/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSender
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a sender, or retire it
      description: "Scope: mailboxes.manage. A retired sender's mailboxes finish their follow-ups and take no new leads."
      tags: [allocation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SenderInput" }
      responses:
        "200":
          description: The sender.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sender" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSender
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Delete a sender
      description: "Scope: mailboxes.manage. Its mailboxes become unconfirmed."
      tags: [allocation]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/senders/matches:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSenderMatches
      x-outflare-access: { scope: mailboxes.read }
      summary: Suggest senders for unconfirmed mailboxes
      description: |
        Scope: mailboxes.read. Matches a mailbox to a sender only when its
        display name is exactly the sender's name. Confirm each with
        POST /mailboxes/sender.
      tags: [allocation]
      responses:
        "200":
          description: Matches, plus how many mailboxes have no confirmed sender.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        mailbox_id: { type: string, format: uuid }
                        email: { type: string }
                        display_name: { type: string }
                        sender_id: { type: string, format: uuid }
                        sender_name: { type: string }
                  unconfirmed: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/sender:
