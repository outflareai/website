          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, paused] }
                is_default: { type: boolean, enum: [true] }
                purposes: { type: array, minItems: 1, items: { type: string, enum: [transactional, lifecycle] } }
                brand_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The updated provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailProvider" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
