                site: { type: string, example: "123456789" }
                domain: { type: string, example: example.com, description: "The website's domain, which lines this connection up with other tools in the overview and compare. Set it when the tool does not show one (Google Analytics properties, Vercel projects). An empty string clears it. Stored history moves to the new domain." }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [site]
                properties:
                  site: { type: string }
                  domain: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/analytics/site-brands:
