      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailDomain" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEmailProviderDomain
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a sending domain from Outflare
      description: "Scope: emails.manage. It stays in the provider's account; emails from it are refused until it is added again."
      tags: [emails]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
