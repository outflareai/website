      properties:
        project_id: { type: string, format: uuid }
        name: { type: string }
        offer: { type: string }
        audience: { type: string }
        market: { type: string }
        brief: { type: string }
        icp: { type: object, additionalProperties: true }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        changed_since_approval: { type: boolean }
    MissionCall:
      type: object
