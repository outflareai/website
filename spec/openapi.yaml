      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkEmailProviderDomain
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Check a sending domain's DNS records now
      description: "Scope: emails.manage. Runs in the background within seconds; poll the domain for a new `checked_at`."
      tags: [emails]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-templates:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listEmailTemplates
      x-outflare-access: { scope: emails.read }
      summary: List email templates
      description: "Scope: emails.read."
      tags: [emails]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
      responses:
        "200":
          description: Templates, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmailTemplate" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEmailTemplate
      x-outflare-access: { scope: emails.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Create an email template
      description: |
        Scope: emails.manage. Content uses `{{name}}`, `{{name|fallback}}`,
        `{{user.plan}}`, `{{{raw_html}}}` and `{{#if name}}...{{else}}...{{/if}}`
        (also `#unless`); nothing else runs. `{{unsubscribe_url}}` and
