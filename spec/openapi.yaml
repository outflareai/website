        method: { type: string }
        path: { type: string }
        query: { type: string }
        outcome: { type: string, enum: [executed, simulated, queued, refused] }
        status_code: { type: integer }
        duration_ms: { type: integer }
        reason: { type: string }
        action_id: { type: [string, "null"], format: uuid }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    MissionAction:
      type: object
      required: [id, mission_id, mission_name, actor_id, actor_name, method, path, query, reason, summary, status, decided_by, decided_by_name, decided_at, decision_note, result_status, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        mission_name: { type: string }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        method: { type: string }
        path: { type: string }
        query: { type: string }
        body: { description: "The request body, as JSON when it was JSON." }
        reason: { type: string }
        summary: { type: string, example: Create sequence }
        status: { type: string, enum: [simulated, pending, executed, failed, rejected, canceled] }
        decided_by: { type: [string, "null"], format: uuid }
        decided_by_name: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: string }
        result_status: { type: [integer, "null"] }
        result: { description: The response when it ran. }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    EmailCounts:
      type: object
      required: [queued, sent, delivered, bounced, complained, failed, suppressed]
      properties:
        queued: { type: integer }
        sent: { type: integer, description: "Handed to the provider, including those delivered or bounced since." }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        failed: { type: integer }
        suppressed: { type: integer }
    EmailOverview:
      type: object
      required: [setup, totals_30d, daily]
      properties:
        setup:
          type: object
          required: [providers, events_active, domains, domains_verified, templates, test_sent, sent]
          properties:
            providers: { type: integer }
            events_active: { type: boolean, description: At least one provider's delivery events are coming in. }
            domains: { type: integer }
            domains_verified: { type: integer }
            templates: { type: integer }
            test_sent: { type: boolean }
            sent: { type: boolean, description: A real (not test) email has been sent. }
        totals_30d: { $ref: "#/components/schemas/EmailCounts" }
        daily:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EmailCounts" }
              - { type: object, required: [date], properties: { date: { type: string, format: date } } }
    EmailProviderGuide:
      type: object
      required: [connector, name, minutes, summary, needs, steps, limits, agent_prompt]
      properties:
        connector: { type: string, enum: [amazon_ses, postmark, resend] }
        name: { type: string }
        minutes: { type: integer, description: Roughly how long it takes. }
        summary: { type: string }
        needs: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            required: [title, body, who]
            properties:
              title: { type: string }
              body: { type: string }
              who: { type: string, enum: [you, outflare], description: "you: in the provider's console. outflare: happens on its own once connected." }
              link: { type: string }
              link_label: { type: string }
              code: { type: string, description: "Something to copy, such as an IAM policy." }
              code_label: { type: string }
        limits: { type: string, description: New-account limits and how to lift them. }
        agent_prompt: { type: string, description: A prompt for your own AI agent to do the setup. It never asks for keys in the chat. }
    EmailProvider:
      type: object
      required: [id, integration_id, connector, name, brand_id, channel, status, purposes, is_default, events_status, events_error, last_event_at, connection, connection_error, account, domains, domains_verified, sent_30d, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        connector: { type: string, description: "amazon_ses, postmark or resend." }
        name: { type: string, description: The integration's name. }
        brand_id: { type: [string, "null"], format: uuid }
        channel: { type: string, enum: [email, sms, push, whatsapp] }
        status: { type: string, enum: [active, paused] }
        purposes: { type: array, items: { type: string, enum: [transactional, lifecycle] } }
        is_default: { type: boolean }
        events_status:
          type: string
          enum: [not_set_up, setting_up, active, manual, failed]
          description: "Delivery events coming back. manual: add the callback URL in the provider yourself (GET .../callback); failed: events_error says why."
        events_error: { type: [string, "null"] }
        last_event_at: { type: [string, "null"], format: date-time }
        connection: { type: string, enum: [connected, error], description: Whether the provider accepts the key. }
        connection_error: { type: [string, "null"] }
        account:
          type: object
          additionalProperties: { type: string }
          description: "What the provider says about the account, such as SES's mode (sandbox or production), daily_quota and region."
        domains: { type: integer }
        domains_verified: { type: integer }
        sent_30d: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EmailDomainRecord:
      type: object
      required: [purpose, type, name, value, required, status]
      properties:
        purpose: { type: string, enum: [dkim, spf, return_path, dmarc, verification, mx] }
        type: { type: string, enum: [TXT, CNAME, MX] }
        name: { type: string, description: The full record name. }
        value: { type: string }
        priority: { type: integer, description: MX only. }
        required: { type: boolean, description: "Needed before the domain sends. DMARC is recommended, not required." }
        status: { type: string, enum: [pending, verified, missing, mismatch] }
        found: { type: string, description: "What public DNS has instead, when it differs." }
    EmailDomain:
      type: object
      required: [id, provider_id, connector, brand_id, domain, status, status_reason, records, checked_at, verified_at, created_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        connector: { type: string }
        brand_id: { type: [string, "null"], format: uuid }
        domain: { type: string }
        status: { type: string, enum: [pending, verified, failed] }
        status_reason: { type: [string, "null"] }
        records: { type: array, items: { $ref: "#/components/schemas/EmailDomainRecord" }, description: "Empty until the provider has registered the domain, within seconds." }
        checked_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    EmailTemplateVariable:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$" }
        required: { type: boolean, description: A send without it is refused with 422 template_variables_missing. }
        default: { type: string, description: Used when a send leaves it out. }
        example: { type: string, description: Shown in previews. }
    EmailTopicRef:
      type: object
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
    EmailTopic:
      type: object
      required: [id, key, name, description, subscribed_by_default, visibility, status, templates, sent_30d, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: "What consents on customer records point at (channel email, topic = key). It never changes." }
        name: { type: string, description: What people see on the preference page. }
        description: { type: string }
        subscribed_by_default: { type: boolean, description: "true: everyone gets it until they unsubscribe. false: only people who opted in." }
        visibility: { type: string, enum: [public, private], description: "public topics are listed on the preference page; private ones only to people who get them." }
        status: { type: string, enum: [active, archived] }
        templates: { type: integer, description: Active templates in this topic. }
        sent_30d: { type: integer, description: "Emails in this topic in the last 30 days, not counting tests." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EmailTopicInput:
      type: object
      properties:
        key: { type: string, pattern: "^[a-z0-9][a-z0-9_]{0,62}$", description: "Made from the name when left out. It can't change later." }
        name: { type: string, maxLength: 100, description: Required when creating. }
        description: { type: string, maxLength: 500 }
        subscribed_by_default: { type: boolean, description: Default true. }
        visibility: { type: string, enum: [public, private], description: Default public. }
        status: { type: string, enum: [active, archived], description: "Updates only: archive a topic to stop new sends to it." }
    EmailTemplateInput:
      type: object
      properties:
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$" }
        name: { type: string, maxLength: 200, description: Required when creating. }
        brand_id: { type: [string, "null"], format: uuid }
        purpose: { type: string, enum: [transactional, lifecycle] }
        status: { type: string, enum: [active, archived] }
        from: { type: string, description: "Default sender, such as Acme <billing@acme.example>." }
        reply_to: { type: string }
        subject: { type: string, maxLength: 998 }
        html: { type: string }
        text: { type: string, description: The plain-text part; made from the HTML when empty. }
        variables: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/EmailTemplateVariable" } }
        track_opens: { type: boolean, description: "Count opens with a one-pixel image. Off by default. A setting, not content: it applies at once, without a publish." }
        track_clicks: { type: boolean, description: "Send links through tracked click links. Off by default. Applies at once, without a publish." }
        topic: { type: [string, "null"], description: "Lifecycle templates only: the topic's key or id, or null for none. Sends then skip people who unsubscribed from it, or never opted in to an opt-in topic. Applies at once, without a publish." }
        publish: { type: boolean, description: Publish the result as the next version. }
        note: { type: string, maxLength: 500, description: "With publish: what changed." }
    EmailTemplate:
      type: object
      required: [id, handle, name, brand_id, channel, purpose, status, from, reply_to, subject, html, text, variables, track_opens, track_clicks, topic, published_version, unpublished_changes, sent_30d, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        name: { type: string }
        brand_id: { type: [string, "null"], format: uuid }
        channel: { type: string, enum: [email, sms, push, whatsapp] }
        purpose: { type: string, enum: [transactional, lifecycle] }
        status: { type: string, enum: [active, archived] }
        from: { type: string }
        reply_to: { type: string }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables: { type: array, items: { $ref: "#/components/schemas/EmailTemplateVariable" } }
        track_opens: { type: boolean }
        track_clicks: { type: boolean }
        topic: { oneOf: [{ $ref: "#/components/schemas/EmailTopicRef" }, { type: "null" }] }
        published_version: { type: [integer, "null"] }
        unpublished_changes: { type: boolean }
        sent_30d: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EmailTemplateVersion:
      type: object
      required: [version, from, reply_to, subject, html, text, variables, note, published_by, published_at]
      properties:
        version: { type: integer }
        from: { type: string }
        reply_to: { type: string }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables: { type: array, items: { $ref: "#/components/schemas/EmailTemplateVariable" } }
        note: { type: string }
        published_by: { type: [string, "null"], description: Who published it. }
        published_at: { type: string, format: date-time }
    EmailPreview:
      type: object
      required: [subject, html, text, missing, unknown]
      properties:
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        missing: { type: array, items: { type: string } }
        unknown: { type: array, items: { type: string } }
    EmailStatus:
      type: string
      enum: [queued, scheduled, sending, sent, delivered, delayed, bounced, complained, suppressed, failed, cancelled]
    AddressList:
      oneOf:
        - { type: string }
        - { type: array, items: { type: string } }
    SendEmailInput:
      type: object
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/AddressList" }
        cc: { $ref: "#/components/schemas/AddressList" }
        bcc: { $ref: "#/components/schemas/AddressList" }
        reply_to: { $ref: "#/components/schemas/AddressList" }
        from: { type: string, description: "On a verified sending domain, such as Acme <billing@acme.example>. Defaults to the template's sender." }
        template: { type: string, description: A template's handle or id. }
        version: { type: integer, description: A published version to use instead of the latest. }
        draft: { type: boolean, description: "Use the template's draft, for test sends before publishing." }
        data: { type: object, additionalProperties: true, description: The template's variables. }
        subject: { type: string, maxLength: 998 }
        html: { type: string }
        text: { type: string }
        purpose: { type: string, enum: [transactional, lifecycle], description: "Defaults to the template's, else transactional." }
        topic: { type: string, description: "Lifecycle email only: a topic's key or id, instead of the template's. People who unsubscribed from it, or never opted in to an opt-in topic, are skipped (suppressed)." }
        provider_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 64 } }
        metadata: { type: object, additionalProperties: true, description: "Your own ids, up to 8 KB." }
        send_at: { type: string, format: date-time, description: "Send later, within 30 days." }
        test: { type: boolean, description: "Marks a test send, kept out of the overview's numbers." }
        track:
          type: object
          description: "Turns open or click tracking on or off for this send; each defaults to the template's setting, else off."
          properties:
            opens: { type: boolean }
            clicks: { type: boolean }
    EmailTrigger:
      type: object
      description: "What sent the email: an API call (kind api, from the web app, the API, MCP, the CLI or a mission; request_id opens it on the Logs page), a test send, and in time an event, a journey or a broadcast (ref is its id)."
      required: [kind, ref, request_id, surface, token_id, token_name, mission_id, actor_id, actor_name]
      properties:
        kind: { type: string, enum: [api, test, event, journey, broadcast, system] }
        ref: { type: [string, "null"], description: "The event, journey step or broadcast behind it." }
        request_id: { type: [string, "null"], description: The API call that queued it. }
        surface: { type: [string, "null"], description: "web, api, mcp, cli, sdk or mission." }
        token_id: { type: [string, "null"], format: uuid, description: The API token the call used. }
        token_name: { type: [string, "null"] }
        mission_id: { type: [string, "null"], format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"], description: "The person, token or agent that asked for it." }
    EmailRecipient:
      type: object
      required: [address, counts, first_sent_at, last_sent_at, suppressed, lead_id, events, next_before]
      properties:
        address: { type: string }
        counts:
          type: object
          description: Emails sent to the address, test sends left out.
          required: [emails, delivered, bounced, complained, opened, clicked]
          properties:
            emails: { type: integer }
            delivered: { type: integer }
            bounced: { type: integer }
            complained: { type: integer }
            opened: { type: integer }
            clicked: { type: integer }
        first_sent_at: { type: [string, "null"], format: date-time }
        last_sent_at: { type: [string, "null"], format: date-time }
        suppressed:
          type: [object, "null"]
          description: Set when the address is on the suppression list.
          required: [reason, source, created_at]
          properties:
            reason: { type: string }
            source: { type: string }
            created_at: { type: string, format: date-time }
        lead_id: { type: [string, "null"], format: uuid, description: "The lead with this address, if there is one." }
        events:
          type: array
          items:
            type: object
            required: [email_id, subject, template_handle, purpose, trigger, type, detail, occurred_at]
            properties:
              email_id: { type: string, format: uuid }
              subject: { type: string }
              template_handle: { type: [string, "null"] }
              purpose: { type: string, enum: [transactional, lifecycle] }
              trigger: { type: string }
              type: { type: string }
              detail: { type: [string, "null"] }
              occurred_at: { type: string, format: date-time }
        next_before: { type: [string, "null"], format: date-time }
    EmailEvent:
      type: object
      required: [type, recipient, detail, occurred_at]
      properties:
        type: { type: string, description: "queued, scheduled, sent, delivered, delayed, bounced, complained, opened, clicked, opened_automatic, clicked_automatic (a mail scanner or privacy proxy, not counted), suppressed, retrying, failed, cancelled, unsubscribed or preferences_changed." }
        recipient: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
    Email:
      type: object
      required: [id, provider_id, connector, brand_id, channel, purpose, status, status_reason, bounce_type, from, to, cc, bcc, reply_to, subject, template_id, template_handle, template_version, topic, tags, metadata, test, provider_message_id, send_at, sent_at, delivered_at, attempts, trigger, track_opens, track_clicks, opens, clicks, opened_at, clicked_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: [string, "null"], format: uuid }
        connector: { type: [string, "null"] }
        brand_id: { type: [string, "null"], format: uuid }
        channel: { type: string, enum: [email, sms, push, whatsapp] }
        purpose: { type: string, enum: [transactional, lifecycle] }
        status: { $ref: "#/components/schemas/EmailStatus" }
        status_reason: { type: [string, "null"] }
        bounce_type: { type: [string, "null"], enum: [hard, soft, null] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        reply_to: { type: array, items: { type: string } }
        subject: { type: string }
        template_id: { type: [string, "null"], format: uuid }
        template_handle: { type: [string, "null"] }
        template_version: { type: [integer, "null"] }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        test: { type: boolean }
        provider_message_id: { type: [string, "null"] }
        send_at: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        attempts: { type: integer }
        trigger: { $ref: "#/components/schemas/EmailTrigger" }
        track_opens: { type: boolean }
        track_clicks: { type: boolean }
        topic: { oneOf: [{ $ref: "#/components/schemas/EmailTopicRef" }, { type: "null" }] }
        opens: { type: integer, description: "Opens counted, scanner and proxy loads left out. Opens are a rough signal: some mail apps load images for privacy, others block them." }
        clicks: { type: integer }
        opened_at: { type: [string, "null"], format: date-time }
        clicked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        html: { type: string, description: "Only on GET .../emails/{id}." }
        text: { type: string, description: "Only on GET .../emails/{id}." }
        events: { type: array, items: { $ref: "#/components/schemas/EmailEvent" }, description: "Only on GET .../emails/{id}." }
    Queued:
      type: object
      description: The work was queued and runs in the background.
      required: [queued]
      properties:
        queued: { type: boolean, enum: [true] }
    MissionHeld:
      type: object
      description: "Answer (202) to a write made in a mission that did not run: a dry run, or held for approval."
      required: [mission_action, dry_run, approval_required, message]
      properties:
        mission_action: { $ref: "#/components/schemas/MissionAction" }
        dry_run: { type: boolean }
        approval_required: { type: boolean }
        message: { type: string }
    MissionUpdate:
      type: object
      required: [id, author, actor_id, actor_name, kind, body, data, resolved_at, created_at]
      properties:
        id: { type: integer }
        author: { type: string, enum: [agent, person, system] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        kind: { type: string, enum: [note, progress, question, instruction, report, connect_request] }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ConnectorCategory:
      type: string
      enum: [email_verification, email_sending, sequencer, mailbox_provider, dns, crm, data, signals, analytics, seo, calendar, registrar, warehouse, notification, model, custom]
    ConnectorField:
      type: object
      required: [name, label, secret, optional]
      properties:
        name: { type: string }
        label: { type: string }
        secret: { type: boolean }
        optional: { type: boolean }
        placeholder: { type: string }
        help: { type: string }
    Connector:
      type: object
      required: [id, name, category, summary, description, website, docs_url, auth, auth_methods, auth_options, fields, capabilities, status, configured, connected, logo_url, logo_dark_url]
      properties:
        id: { type: string, example: zerobounce }
        name: { type: string }
        category: { $ref: "#/components/schemas/ConnectorCategory" }
        summary: { type: string }
        description: { type: string }
        website: { type: string }
        docs_url: { type: string }
        key_url: { type: string, description: Where to find the API key. }
        auth: { $ref: "#/components/schemas/ConnectorAuthMethod" }
        auth_methods:
          type: array
          items: { $ref: "#/components/schemas/ConnectorAuthMethod" }
          example: [oauth2, api_key]
          description: "Every way to connect, recommended first. When both are listed, the person chooses: sign in (oauth2, GET .../integrations/oauth/{connector}/authorize) or paste the fields (api_key, POST .../integrations)."
        auth_options:
          type: array
          items: { $ref: "#/components/schemas/ConnectorAuthOption" }
          description: Each way to connect and whether it works on this server. The first available one is marked recommended.
        fields: { type: array, items: { $ref: "#/components/schemas/ConnectorField" }, description: What the api_key method asks for. Empty when the connector only signs in with OAuth. }
        oauth:
          type: object
          properties:
            scopes: { type: array, items: { type: string } }
            client_metadata: { type: boolean, description: "The provider reads Outflare's sign-in details from a document this server hosts, so it only needs PUBLIC_URL on a public https address, no app to register." }
        capabilities: { type: array, items: { type: string }, example: [verify] }
        status: { type: string, enum: [available, planned], description: "planned: listed but not connectable yet." }
        pricing: { type: string }
        also_connects:
          type: array
          items: { type: string }
          description: Other connectors the same sign-in connects too, when the person grants them (one Google sign-in connects Google Analytics and Search Console).
        configured: { type: boolean, description: "Can be connected on this server now, in at least one way." }
        connected: { type: integer, description: Accounts the workspace connected (0 in the public catalog). }
        logo_url: { type: string, format: uri, description: "The company's logo as a square SVG for light backgrounds, or a monogram when there is none. Public and cacheable." }
        logo_dark_url: { type: string, format: uri, description: The same logo for dark backgrounds. }
    ConnectorAuthMethod:
      type: string
      enum: [api_key, oauth2, none]
      description: "oauth2: sign in on the provider's consent screen. api_key: paste the connector's fields. none: built in."
    ConnectorAuthOption:
      type: object
      required: [method, available, recommended]
      properties:
        method: { $ref: "#/components/schemas/ConnectorAuthMethod" }
        available: { type: boolean, description: "False when this server cannot use the method yet, e.g. OAuth without an app configured." }
        recommended: { type: boolean }
        reason: { type: string, description: "Why it is not available and what the server's owner can set, e.g. CONNECTOR_CALENDLY_CLIENT_ID and CONNECTOR_CALENDLY_CLIENT_SECRET." }
    ConnectorAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        credits: { type: number, description: "Credits or quota left, when the service reports it." }
        details: { type: object, additionalProperties: { type: string } }
    ReportMetrics:
      type: object
      required: [sent, contacted, new_leads, follow_ups, failed, blocked, bounced, replies, replied_leads, auto_replies, opt_outs, unsubscribes, warmup_inbox, warmup_spam, warmup_missing, reply_rate, bounce_rate, opt_out_rate, inbox_placement, clicks, clicked_leads, click_rate]
      properties:
        sent: { type: integer }
        contacted: { type: integer, description: Distinct leads emailed. }
        new_leads: { type: integer, description: First steps sent. }
        follow_ups: { type: integer }
        failed: { type: integer }
        blocked: { type: integer, description: Stopped by the send policy before sending. }
        bounced: { type: integer }
        replies: { type: integer }
        replied_leads: { type: integer }
        auto_replies: { type: integer }
        opt_outs: { type: integer, description: Replies asking not to be contacted. }
        unsubscribes: { type: integer }
        warmup_inbox: { type: integer }
        warmup_spam: { type: integer }
        warmup_missing: { type: integer }
        reply_rate: { type: [number, "null"], description: Percent of contacted leads who replied. }
        bounce_rate: { type: [number, "null"] }
        opt_out_rate: { type: [number, "null"] }
        inbox_placement: { type: [number, "null"] }
        clicks: { type: integer, description: "Tracked link clicks, leaving out likely link scanners. Zero unless click tracking is on." }
        clicked_leads: { type: integer }
        click_rate: { type: [number, "null"], description: Percent of contacted leads who clicked. }
    Report:
      type: object
      required: [from, to, group_by, totals, rows]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string }
        totals: { $ref: "#/components/schemas/ReportMetrics" }
        rows:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ReportMetrics" }
              - type: object
                required: [key, name, label]
                properties:
                  key: { type: string, description: "The day, week start, step number, or the sequence or mailbox id." }
                  name: { type: string, description: "What to show: the sequence name, mailbox address, \"Step 2\"." }
                  label: { type: string, deprecated: true, description: The same as name; use name. }
    HealthSignal:
      type: object
      required: [key, level, title, detail]
      properties:
        key: { type: string, example: bounce_rate, description: "sign_in, inbox_sync, send_failures, bounce_rate, placement, warmup, domain_spf, domain_dkim, domain_dmarc, blocklist, domain_paused, paused" }
        level: { type: string, enum: [ok, warning, critical, paused] }
        title: { type: string }
        detail: { type: string }
        fix: { type: string }
        value: { type: number }
    MailboxHealth:
      type: object
      required: [mailbox_id, email, domain, provider, status, level, score, signals, stats]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        domain: { type: string }
        provider: { type: string }
        status: { $ref: "#/components/schemas/MailboxStatus" }
        level: { type: string, enum: [ok, warning, critical, paused] }
        score: { type: integer, description: 100 is healthy. }
        signals: { type: array, items: { $ref: "#/components/schemas/HealthSignal" } }
        stats:
          type: object
          required: [sent_24h, bounced_24h, sent_7d, bounced_7d, bounce_rate_7d, failed_24h, replies_7d, warmup_landed_7d, warmup_spam_7d, warmup_missing_7d, inbox_placement_7d]
          properties:
            sent_24h: { type: integer }
            bounced_24h: { type: integer }
            sent_7d: { type: integer }
            bounced_7d: { type: integer }
            bounce_rate_7d: { type: [number, "null"], description: Percent; null under 20 sends. }
            failed_24h: { type: integer }
            replies_7d: { type: integer }
            warmup_landed_7d: { type: integer }
            warmup_spam_7d: { type: integer }
            warmup_missing_7d: { type: integer }
            inbox_placement_7d: { type: [number, "null"], description: Percent of warm-up email in the inbox; null under 10. }
    MailboxHealthSummary:
      type: object
      required: [total, ok, warning, critical, paused]
      properties:
        total: { type: integer }
        ok: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
        paused: { type: integer }
    HealthSettings:
      type: object
      required: [auto_pause, pause_bounce_rate, min_sends]
      properties:
        auto_pause: { type: boolean, description: Pause a mailbox when its 24-hour bounce rate reaches pause_bounce_rate. }
        pause_bounce_rate: { type: number, description: "Percent. Default 5." }
        min_sends: { type: integer, description: "Sends in 24 hours before the rate counts. Default 20." }
    ExternalStep:
      type: object
      required: [delay_days, subject, body]
      properties:
        delay_days: { type: integer, description: Days after the previous step. }
        subject: { type: string }
        body: { type: string }
        variants: { type: array, items: { type: string }, description: Other A/B bodies. }
    ExternalCampaign:
      type: object
      required: [id, name, status, steps, mailbox_emails, lead_count]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, description: "The other tool's word: active, paused, draft, completed." }
        timezone: { type: string }
        daily_limit: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/ExternalStep" } }
        mailbox_emails: { type: array, items: { type: string } }
        lead_count: { type: integer }
    ExternalMailbox:
      type: object
      required: [email, warmup_enabled]
      properties:
        email: { type: string }
        name: { type: string }
        provider: { type: string, description: "google, microsoft or smtp" }
        daily_limit: { type: integer }
        warmup_enabled: { type: boolean }
        status: { type: string }
    MailboxMatch:
      type: object
      required: [total, matched, missing]
      properties:
        total: { type: integer }
        matched: { type: integer, description: Already in this workspace. }
        missing: { type: array, items: { $ref: "#/components/schemas/ExternalMailbox" }, description: "Not here yet. Other tools never reveal passwords, so connect these (Google or Microsoft sign-in, or an SMTP/IMAP CSV) to send from them." }
    ImportPreview:
      type: object
      required: [campaigns, mailboxes]
      properties:
        campaigns: { type: array, items: { $ref: "#/components/schemas/ExternalCampaign" } }
        mailboxes: { $ref: "#/components/schemas/MailboxMatch" }
    CRMImportPreview:
      type: object
      required: [connector, limit, workspace, objects, lists, members, notes, tasks]
      properties:
        connector: { type: string, description: "The connector id, such as attio." }
        limit: { type: integer, description: "Where each count stops." }
        workspace: { type: string, description: "The CRM workspace's name." }
        objects: { type: array, items: { $ref: "#/components/schemas/CRMObject" } }
        lists: { type: array, items: { $ref: "#/components/schemas/CRMList" } }
        members: { type: integer, description: "People with access to the CRM workspace." }
        notes: { $ref: "#/components/schemas/CRMCount" }
        tasks: { $ref: "#/components/schemas/CRMCount" }
    CRMCount:
      type: object
      required: [count, capped]
      properties:
        count: { type: integer }
        capped: { type: boolean, description: "True when counting stopped at the limit, so there are more." }
    CRMObject:
      type: object
      required: [slug, name, plural, records, fields]
      properties:
        slug: { type: string }
        name: { type: string }
        plural: { type: string }
        records: { $ref: "#/components/schemas/CRMCount" }
        fields: { type: array, items: { $ref: "#/components/schemas/CRMField" } }
    CRMList:
      type: object
      required: [slug, name, object, entries, fields]
      properties:
        slug: { type: string }
        name: { type: string }
        object: { type: string, description: "The object its entries point at, such as deals." }
        entries: { $ref: "#/components/schemas/CRMCount" }
        fields: { type: array, items: { $ref: "#/components/schemas/CRMField" }, description: "Fields that belong to the list, such as a pipeline stage." }
    CRMField:
      type: object
      required: [slug, title, type, system, multiple, unique, required, filled]
      properties:
        slug: { type: string }
        title: { type: string }
        type: { type: string, description: "The CRM's own type name, such as text, status, record-reference or actor-reference." }
        kind:
          type: string
          enum: [text, number, checkbox, currency, date, timestamp, rating, select, status, email, phone, domain, reference, member, location, name, unsupported]
          description: "What the field holds, whatever the CRM calls it. unsupported fields are worked out by the CRM (such as last interaction) and are not imported."
        system: { type: boolean, description: "Built into the CRM rather than added by the workspace." }
        multiple: { type: boolean }
        unique: { type: boolean }
        required: { type: boolean }
        options: { type: array, items: { type: string }, description: "Select options or pipeline stages, in order." }
        target: { type: array, items: { type: string }, description: "Objects a record reference points at." }
        filled: { type: integer, description: "How many of the counted records or entries have a value." }
    CRMImport:
      type: object
      required: [id, integration_id, connector, status, objects, summary, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        connector: { type: string, description: "The connector id, such as attio." }
        status: { type: string, enum: [queued, running, done, failed] }
        objects: { type: array, items: { type: string }, description: "The objects asked for; empty means every object." }
        summary:
          type: object
          required: [objects, catalog, members, placeholders, warnings, more_warnings]
          properties:
            objects:
              type: array
              items:
                type: object
                required: [object, name, record_type, seen, created, matched, updated, unchanged]
                properties:
                  object: { type: string, description: "The CRM object's slug." }
                  name: { type: string }
                  record_type: { type: string, description: "The record type its records became." }
                  seen: { type: integer }
                  created: { type: integer }
                  matched: { type: integer, description: "Records already here (by verified email or domain) that the import filled in." }
                  updated: { type: integer, description: "Records an earlier import added that changed." }
                  unchanged: { type: integer }
            catalog:
              type: object
              required: [types_created, fields_created, fields_reused, option_sets_created, fields_skipped]
              properties:
                types_created: { type: array, items: { type: string } }
                fields_created: { type: array, items: { type: string }, description: "type.field keys." }
                fields_reused: { type: array, items: { type: string }, description: "Existing fields the CRM's values went into." }
                option_sets_created: { type: array, items: { type: string } }
                fields_skipped: { type: array, items: { type: string }, description: "CRM fields left out, each with why." }
            members:
              type: object
              required: [total, matched]
              properties:
                total: { type: integer }
                matched: { type: integer, description: "CRM members matched to members here by email; owner and other member fields use them." }
            placeholders: { type: integer, description: "Empty records added for records another record points at that the CRM did not return. Importing that object fills them in." }
            warnings: { type: array, items: { type: string }, description: "Values left out, with why. At most 100." }
            more_warnings: { type: integer }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ImportRun:
      type: object
      required: [id, integration_id, connector, options, status, summary, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        options:
          type: object
          properties:
            campaign_ids: { type: array, items: { type: string } }
            leads: { type: boolean }
            mailboxes: { type: boolean }
        status: { type: string, enum: [queued, running, done, failed] }
        summary:
          type: object
          required: [campaigns, leads]
          properties:
            campaigns:
              type: array
              items:
                type: object
                required: [external_id, name, status, sequence_id, created, steps, leads, enrolled, warnings]
                properties:
                  external_id: { type: string }
                  name: { type: string }
                  status: { type: string }
                  sequence_id: { type: string }
                  created: { type: boolean, description: False when an earlier import's sequence was reused. }
                  steps: { type: integer }
                  leads: { type: integer }
                  enrolled: { type: integer }
                  warnings: { type: array, items: { type: string } }
            mailboxes: { $ref: "#/components/schemas/MailboxMatch" }
            leads:
              type: object
              required: [seen, created, updated, suppressed, enrolled, skipped]
              properties:
                seen: { type: integer }
                created: { type: integer }
                updated: { type: integer }
                suppressed: { type: integer }
                enrolled: { type: integer }
                skipped: { type: integer, description: "Replied, finished, unsubscribed, bounced, or past the last step." }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ConnectRequest:
      type: object
      required: [id, connector, connector_name, name, reason, use_for_verification, status, integration_id, created_by_type, expires_at, completed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        connector: { type: string }
        connector_name: { type: string }
        name: { type: string }
        reason: { type: string }
        use_for_verification: { type: boolean }
        status: { type: string, enum: [pending, connected, cancelled, expired] }
        integration_id: { type: [string, "null"], format: uuid }
        created_by_type: { type: string, description: "human or api_token" }
        expires_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        url: { type: string, description: The one-time link. Only in the answer to POST. }
    Integration:
      type: object
      required: [id, connector, auth_method, connector_name, category, capabilities, name, status, account, config, last_checked_at, last_error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        connector: { type: string }
        auth_method: { type: string, enum: [api_key, oauth2], description: How it was connected. Pasting new credentials with PATCH switches a signed-in connection to api_key. }
        connector_name: { type: string }
        category: { $ref: "#/components/schemas/ConnectorCategory" }
        capabilities: { type: array, items: { type: string } }
        name: { type: string }
        status: { type: string, enum: [connected, error], description: "error: the service refused the credentials; see last_error." }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        config:
          type: object
          additionalProperties: true
          description: "Settings for this connection, never secret. warmup_tags (a sequencer with control.warmup): the tags it puts in its warm-up mail, at most 20 of 4 to 100 characters. The inbox leaves out received mail whose subject or body holds one, without reading or moving it."
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnalyticsReportName:
      type: string
      enum: [traffic, pages, sources, search_queries, events]
    AnalyticsSource:
      type: object
      required: [id, name, connector, connector_name, status, last_error, account, site, reports]
      properties:
        id: { type: string, format: uuid, description: The integration id. }
        name: { type: string }
        connector: { type: string, example: google_analytics }
        connector_name: { type: string }
        status: { type: string, enum: [connected, error] }
        last_error: { type: [string, "null"] }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        site: { type: string, description: "The default site; empty until one is picked, unless the account has only one." }
        reports: { type: array, items: { $ref: "#/components/schemas/AnalyticsReportName" } }
    AnalyticsSite:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: "123456789" }
        name: { type: string, example: "acme.com (Acme)" }
        url: { type: string }
    AnalyticsSitePlan:
      allOf:
        - { $ref: "#/components/schemas/AnalyticsSite" }
        - type: object
          required: [host, domain, sync]
          properties:
            host: { type: string, example: example.com, description: "The domain the site counts under in the overview, compare and history; empty when unknown." }
            domain: { type: string, description: "The domain someone set for this site, overriding the tool's own; empty when none is set." }
            sync: { type: boolean, description: Whether the sync stores this site. }
    AnalyticsMetrics:
      type: object
      description: Every field is optional. A missing field means the provider does not measure it; zero means it measured none.
      properties:
        visitors: { type: number, description: Unique visitors or users. }
        pageviews: { type: number }
        sessions: { type: number, description: Visits. }
        bounce_rate: { type: number, description: A fraction from 0 to 1. }
        avg_duration: { type: number, description: Average visit length in seconds. }
        clicks: { type: number, description: Clicks from search results. }
        impressions: { type: number, description: Times shown in search results. }
        ctr: { type: number, description: "Click-through rate, 0 to 1." }
        position: { type: number, description: Average position in search results; 1 is the top. }
        events: { type: number }
        conversions: { type: number, description: "Events that count as conversions: GA4 key events, Plausible goals, Matomo goals, Fathom events." }
    AnalyticsRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "A page path, a source, a search query or an event name. (none) means not set." }
    AnalyticsPoint:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
    AnalyticsReport:
      type: object
      required: [report, site, from, to, totals, notes, integration_id, connector, cached, fetched_at]
      properties:
        report: { $ref: "#/components/schemas/AnalyticsReportName" }
        site: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date, description: "Clarity only covers the last three days, so its range may differ from the one asked for." }
        totals: { $ref: "#/components/schemas/AnalyticsMetrics" }
        series: { type: array, items: { $ref: "#/components/schemas/AnalyticsPoint" }, description: The traffic report's days. }
        rows: { type: array, items: { $ref: "#/components/schemas/AnalyticsRow" }, description: "A breakdown report's rows, biggest first." }
        notes: { type: array, items: { type: string } }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        cached: { type: boolean }
        fetched_at: { type: string, format: date-time }
    AnalyticsHistoryRow:
      allOf:
        - $ref: "#/components/schemas/AnalyticsMetrics"
        - type: object
          properties:
            day: { type: string, format: date }
            key: { type: string }
            integration_id: { type: string, format: uuid }
            connector: { type: string }
            host: { type: string }
    AnalyticsSync:
      type: object
      required: [integration_id, name, connector, site, host, first_day, last_day, last_run_at, last_ok_at, last_error, paused]
      properties:
        integration_id: { type: string, format: uuid }
        name: { type: string }
        connector: { type: string }
        site: { type: string }
        host: { type: string, description: "The website's domain; empty when the tool shows none. Set it with PATCH .../analytics/{id}/sites/{site}." }
        first_day: { type: [string, "null"], format: date }
        last_day: { type: [string, "null"], format: date }
        last_run_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        paused: { type: boolean }
    AnalyticsChange:
      type: object
      description: One metric now and in the period before. before, change and change_pct are missing when nothing was stored before; change_pct also when before was 0.
      required: [metric, now]
      properties:
        metric: { type: string }
        now: { type: number }
        before: { type: number }
        change: { type: number }
        change_pct: { type: number }
    AnalyticsWindow:
      type: object
      required: [from, to, days_stored]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days_stored: { type: integer }
    AnalyticsGap:
      type: object
      description: Something missing for a full picture, and how to fix it. connectors are ids for a connect request.
      required: [what, why, action]
      properties:
        what: { type: string }
        why: { type: string }
        connectors: { type: array, items: { type: string } }
        integration_id: { type: string, format: uuid }
        action: { type: string }
    AnalyticsMover:
      type: object
      required: [key, now, before, change]
      properties:
        key: { type: string }
        now: { type: number }
        before: { type: number }
        change: { type: number }
    AnalyticsWebsiteChanges:
      type: object
      required: [host, headline, tools]
      properties:
        host: { type: string, description: "The domain; empty for tools whose site shows none." }
        headline: { type: array, items: { type: string }, description: "Plain sentences, each naming its tool and dates." }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, now, before, metrics]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              now: { $ref: "#/components/schemas/AnalyticsWindow" }
              before: { $ref: "#/components/schemas/AnalyticsWindow" }
              metrics: { type: array, items: { $ref: "#/components/schemas/AnalyticsChange" } }
        search: { type: array, description: "Clicks and impressions added up across search consoles, when there are several.", items: { $ref: "#/components/schemas/AnalyticsChange" } }
        movers:
          type: array
          items:
            type: object
            required: [report, tools, metric, up, down]
            properties:
              report: { type: string }
              tools: { type: array, items: { type: string } }
              metric: { type: string }
              up: { type: array, items: { $ref: "#/components/schemas/AnalyticsMover" } }
              down: { type: array, items: { $ref: "#/components/schemas/AnalyticsMover" } }
        unusual_days:
          type: array
          items:
            type: object
            required: [day, connector, name, metric, value, typical, what]
            properties:
              day: { type: string, format: date }
              connector: { type: string }
              name: { type: string }
              metric: { type: string }
              value: { type: number }
              typical: { type: number, description: Median of the 28 days before the period. }
              what: { type: string }
        seo:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, day, metrics]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              day: { type: string, format: date }
              previous_day: { type: string, format: date }
              metrics: { type: array, items: { $ref: "#/components/schemas/AnalyticsChange" } }
              keywords_up: { type: array, items: { $ref: "#/components/schemas/SEOKeywordMove" } }
              keywords_down: { type: array, items: { $ref: "#/components/schemas/SEOKeywordMove" } }
              keywords_new: { type: integer }
              keywords_lost: { type: integer }
        gaps: { type: array, items: { $ref: "#/components/schemas/AnalyticsGap" } }
    SEOKeywordMove:
      type: object
      required: [keyword, position, previous]
      properties:
        keyword: { type: string }
        position: { type: number }
        previous: { type: number }
        volume: { type: number }
    AnalyticsCatalogSite:
      type: object
      required: [host, tools, seo, gaps]
      properties:
        host: { type: string }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, status, measures]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              site: { type: string }
              status: { type: string }
              measures: { type: object, description: "Per report, the metrics stored in the last 35 days.", additionalProperties: { type: array, items: { type: string } } }
              first_day: { type: string, format: date }
              last_day: { type: string, format: date }
              last_synced_at: { type: string, format: date-time }
              error: { type: string }
        seo:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, reports, snapshots, budget_left, budget_unit]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              reports: { type: array, items: { type: string } }
              snapshots: { type: integer }
              first_snapshot: { type: string, format: date }
              last_snapshot: { type: string, format: date }
              budget_left: { type: number }
              budget_unit: { type: string }
        gaps: { type: array, items: { $ref: "#/components/schemas/AnalyticsGap" } }
    AnalyticsOverviewSite:
      type: object
      required: [host, tools, search, seo]
      properties:
        host: { type: string, description: "The domain; empty groups tools whose site has no domain yet." }
        tools:
          type: array
          items:
            type: object
            required: [integration_id, name, connector, site, site_name, totals, first_day, last_day, last_synced_at]
            properties:
              integration_id: { type: string, format: uuid }
              name: { type: string }
              connector: { type: string }
              site: { type: string }
              site_name: { type: string, description: "The site's name in the tool (a GA4 property's name); empty until a sync stores it." }
              totals: { $ref: "#/components/schemas/AnalyticsMetrics" }
              first_day: { type: [string, "null"], format: date }
              last_day: { type: [string, "null"], format: date }
              last_synced_at: { type: [string, "null"], format: date-time }
        search: { $ref: "#/components/schemas/AnalyticsMetrics" }
        seo: { type: array, items: { $ref: "#/components/schemas/SEOLatest" }, description: "Each SEO connection's latest snapshot of the domain." }
    SEOReportName:
      type: string
      enum: [overview, keywords, backlinks, competitors, audit]
    SEOMetrics:
      type: object
      description: Every field is optional; a missing field is not measured by the provider.
      properties:
        domain_rating: { type: number, description: "Link strength, 0 to 100: Ahrefs DR, or DataForSEO rank on a 0 to 100 scale (not the same measure)." }
        backlinks: { type: number }
        referring_domains: { type: number }
        organic_keywords: { type: number, description: Keywords ranking in the top 100. }
        top3: { type: number, description: Keywords ranking in the top 3. }
        organic_traffic: { type: number, description: The provider's estimate of monthly visits from search. }
        traffic_value: { type: number, description: "What that traffic would cost in ads, in US dollars." }
        position: { type: number, description: "A keyword's position; 1 is the top. For a competitor, its average position." }
        volume: { type: number, description: Monthly searches. }
        traffic: { type: number, description: Estimated monthly visits from this keyword. }
        common_keywords: { type: number, description: Keywords a competitor shares with the domain. }
        health_score: { type: number, description: "Site audit health, 0 to 100." }
        pages: { type: number, description: "Pages crawled, or pages an audit issue affects." }
    SEORow:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "A keyword, linking domain, competitor domain or audit issue." }
            url: { type: string, description: A keyword's ranking page. }
            kind: { type: string, enum: [error, warning, notice], description: An audit issue's importance. }
    SEOCost:
      type: object
      properties:
        usd: { type: number, description: "Dollars, as DataForSEO reported them." }
        units: { type: number, description: Ahrefs API units. }
        estimated: { type: boolean, description: "Worked out from the provider's price list, because it does not report it." }
    SEOBudget:
      type: object
      required: [unit, limit, spent, default]
      properties:
        unit: { type: string, enum: [USD, API unit] }
        limit: { type: number }
        spent: { type: number, description: Spent this calendar month (UTC). }
        default: { type: boolean }
    SEOAnswer:
      type: object
      required: [report, target, country, totals, notes, cost, integration_id, connector, cached, fetched_at, budget]
      properties:
        report: { $ref: "#/components/schemas/SEOReportName" }
        target: { type: string }
        country: { type: string }
        totals: { $ref: "#/components/schemas/SEOMetrics" }
        rows: { type: array, items: { $ref: "#/components/schemas/SEORow" } }
        notes: { type: array, items: { type: string } }
        cost: { $ref: "#/components/schemas/SEOCost" }
        integration_id: { type: string, format: uuid }
        connector: { type: string }
        cached: { type: boolean, description: A kept answer under a day old; it cost nothing. }
        fetched_at: { type: string, format: date-time }
        budget: { $ref: "#/components/schemas/SEOBudget" }
    SEOSite:
      type: object
      required: [id, brand_id, host, start_url, status, schedule, max_pages, crawl_delay_ms, obey_robots, verified, verified_at, verify_method, verify_checked_at, verification, limits, last_crawl, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid, description: The brand the site belongs to; null is shared by every brand. }
        host: { type: string, example: www.example.com }
        start_url: { type: string, example: "https://www.example.com/" }
        status: { type: string, enum: [active, paused] }
        schedule: { type: string, enum: ["off", daily, weekly], description: How often Outflare crawls the site by itself. }
        max_pages: { type: integer }
        crawl_delay_ms: { type: integer }
        obey_robots: { type: boolean, description: "false audits pages the site's robots.txt hides; only for a verified site." }
        verified: { type: boolean, description: Whether this workspace has proved it owns the site. }
        verified_at: { type: [string, "null"], format: date-time }
        verify_method: { type: [string, "null"], enum: [dns, meta, file, test, null] }
        verify_checked_at: { type: [string, "null"], format: date-time }
        verification:
          type: object
          description: "The three ways to prove you own the site; any one is enough."
          required: [dns_name, dns_value, meta_tag, file_url, file_body]
          properties:
            dns_name: { type: string, example: example.com, description: Where the TXT record goes. }
            dns_value: { type: string, example: outflare-site-verification=4f1c2a9e }
            meta_tag: { type: string, example: '<meta name="outflare-site-verification" content="4f1c2a9e">', description: Goes in the head of the start page. }
            file_url: { type: string, example: "https://www.example.com/.well-known/outflare-site-verification.txt" }
            file_body: { type: string, example: 4f1c2a9e }
        limits:
          type: object
          description: What this site's settings may be, which proving ownership raises.
          required: [max_pages, min_crawl_delay_ms, may_ignore_robots]
          properties:
            max_pages: { type: integer, example: 100 }
            min_crawl_delay_ms: { type: integer, example: 2000 }
            may_ignore_robots: { type: boolean }
        last_crawl: { oneOf: [{ $ref: "#/components/schemas/Crawl" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Crawl:
      type: object
      required: [id, site_id, host, status, trigger, reason, error_code, max_pages, delay_ms, obey_robots, pages_fetched, pages_blocked, pages_failed, pages_found, pages_fallback, pages_firewalled, fallback_hint, health_score, issues, bytes, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        host: { type: string, example: www.example.com }
        status: { type: string, enum: [queued, running, done, stopped, failed] }
        trigger: { type: string, enum: [manual, schedule] }
        reason:
          type: [string, "null"]
          description: "Why it ended: done (every page found was read), limit (max_pages reached), stopped, opted_out, robots_unreachable (robots.txt answered 5xx or not at all, so nothing may be read), site_errors (ten errors in a row) or error."
          example: done
        error_code: { type: [string, "null"], example: site_errors }
        max_pages: { type: integer, description: "The limits this crawl keeps, fixed when it started." }
        delay_ms: { type: integer, description: The pause between requests now; it doubles when the site asks the crawler to slow down. }
        obey_robots: { type: boolean }
        pages_fetched: { type: integer }
        pages_blocked: { type: integer, description: Pages robots.txt kept the crawler away from. }
        pages_failed: { type: integer }
        pages_found: { type: integer, description: "Every URL found, read or not." }
        pages_fallback: { type: integer, description: "Pages the site's firewall blocked, or that were only an empty JavaScript app shell, read through a scraping connector (Geonode) instead; only for a proved site." }
        pages_firewalled: { type: integer, description: "Pages a firewall or bot protection answered with a 403 or a challenge page, whether or not a connector then read them." }
        fallback_hint:
          type: string
          enum: ["", verify_site, connect_geonode]
          description: "What would let the next crawl read firewalled pages: prove you own the site, or connect Geonode with your own key. Outflare never reads them with keys of its own. Empty when nothing is needed."
        health_score: { type: [integer, "null"], minimum: 0, maximum: 100, description: "The share of the crawl's pages (HTML or broken) with no error-level issue. null until the crawl has finished." }
        issues:
          type: object
          description: How many issues the audit found, by severity; GET .../issues lists them.
          required: [errors, warnings, notices]
          properties:
            errors: { type: integer }
            warnings: { type: integer }
            notices: { type: integer }
        bytes: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    CrawlPage:
      type: object
      required: [id, url, depth, source, found_on, status, reason, http_status, content_type, bytes, duration_ms, redirect_to, noindex, nofollow, links_out, links_in, fetched_at, x_robots_tag, title, title_count, meta_description, canonical, canonical_count, h1, lang, hreflang, schema_types, word_count, images, images_no_alt, content_hash, viewport, fetched_via]
      properties:
        id: { type: string, example: "1042" }
        url: { type: string, example: "https://www.example.com/pricing" }
        depth: { type: integer, description: Clicks from the start page; sitemap pages count as 1. }
        source: { type: string, enum: [start, link, sitemap, redirect] }
        found_on: { type: [string, "null"], description: The page or sitemap that led here. }
        status: { type: string, enum: [queued, fetched, blocked, failed, skipped] }
        reason: { type: [string, "null"], description: "robots (blocked by robots.txt), network, private_address, server_error, truncated (over 5 MB, cut off), or why a page was skipped (limit, stopped)." }
        http_status: { type: [integer, "null"], example: 200 }
        content_type: { type: [string, "null"], example: text/html }
        bytes: { type: integer }
        duration_ms: { type: integer }
        redirect_to: { type: [string, "null"], description: "Where a 3xx answer pointed; on the same site it is a page of its own." }
        noindex: { type: boolean }
        nofollow: { type: boolean, description: "The page asked crawlers not to follow its links, so its links were not queued." }
        links_out: { type: integer, description: "Links on the page, to the site and elsewhere." }
        links_in: { type: integer, description: "Pages of the site that link here, counted when the crawl ends. 0 on a page found only in a sitemap is an orphan." }
        fetched_at: { type: [string, "null"], format: date-time }
        x_robots_tag: { type: [string, "null"], description: "The X-Robots-Tag header, which can also say noindex or nofollow." }
        title: { type: [string, "null"], description: "The first <title>, spaces tidied." }
        title_count: { type: integer, description: "<title> tags on the page; more than one is a problem." }
        meta_description: { type: [string, "null"] }
        canonical: { type: [string, "null"], description: "The first rel=canonical link, made absolute." }
        canonical_count: { type: integer }
        h1: { type: array, items: { type: string }, description: The page's h1 headings (up to 10). }
        lang: { type: [string, "null"], example: en-AU, description: The html element's lang. }
        hreflang:
          type: array
          items:
            type: object
            required: [lang, url]
            properties:
              lang: { type: string, example: de }
              url: { type: string }
        schema_types: { type: array, items: { type: string }, example: [Organization, Product], description: "Schema.org @type values in the page's JSON-LD." }
        word_count: { type: integer, description: Words a reader sees (not scripts or the title). }
        images: { type: integer }
        images_no_alt: { type: integer, description: Images with no alt attribute (an empty alt marks a decorative image and is fine). }
        content_hash: { type: [string, "null"], description: "The same for pages with the same words: duplicates." }
        viewport: { type: boolean, description: Whether the page has a viewport meta tag (mobile friendly). }
        fetched_via: { type: [string, "null"], example: geonode, description: "The connector that read the page because the site's firewall or a bot challenge blocked OutflareBot, or the page was only an empty JavaScript app shell; null when OutflareBot read it itself." }
    SEORule:
      type: object
      required: [id, severity, category, title, why, fix]
      properties:
        id: { type: string, example: title_missing }
        severity: { type: string, enum: [error, warning, notice] }
        category: { type: string, enum: [indexability, links, content, metadata, performance] }
        title: { type: string, example: Missing title }
        why: { type: string, description: "Why it matters, in plain words." }
        fix: { type: string, description: How to fix it. }
    CrawlIssue:
      allOf:
        - { $ref: "#/components/schemas/SEORule" }
        - type: object
          required: [pages, templates]
          properties:
            pages: { type: integer, description: Pages that break the rule. }
            templates:
              type: array
              description: "The pages by URL template, most first."
              items:
                type: object
                required: [template, pages]
                properties:
                  template: { type: string, example: /blog/* }
                  pages: { type: integer }
    Fix:
      type: object
      required: [id, source, subject, brand_id, rule, group, status, assignee, note, count, unit, found_by, last_found_by, confirmed_by, fixed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [seo_audit], description: "What found it: seo_audit is a site audit's crawl issues." }
        subject:
          type: object
          required: [type, id]
          description: What it is about.
          properties:
            type: { type: string, enum: [seo_site] }
            id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid, description: "The subject's brand; null is shared." }
        rule: { $ref: "#/components/schemas/SEORule" }
        group: { type: string, example: /blog/*, description: "What the source groups by: for a site audit, the URL template whose pages break the rule." }
        status: { type: string, enum: [open, in_progress, done, ignored] }
        assignee:
          oneOf:
            - type: object
              required: [id, name, type]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                type: { type: string, example: human }
            - { type: "null" }
        note: { type: string }
        count: { type: integer, description: "How much is left in the latest run that found it, in unit; 0 once a run confirms it fixed." }
        unit: { type: string, example: pages }
        found_by: { type: [string, "null"], format: uuid, description: "The source's first run that found it: for a site audit, a crawl." }
        last_found_by: { type: [string, "null"], format: uuid }
        confirmed_by: { type: [string, "null"], format: uuid, description: The complete run that no longer found it. }
        fixed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CrawlLink:
      type: object
      required: [url, anchor, internal, nofollow, http_status]
      properties:
        url: { type: string }
        anchor: { type: string, description: "The link's text, or an image's alt text." }
        internal: { type: boolean, description: On the site (its host or its www. twin). }
        nofollow: { type: boolean, description: "rel nofollow, ugc or sponsored." }
        http_status: { type: [integer, "null"], description: "The status this crawl got from the page; null when it did not read it." }
    SEOSource:
      type: object
      required: [id, name, connector, connector_name, status, last_error, account, reports, country, sync, domains_set, domains, budget]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        connector: { type: string }
        connector_name: { type: string }
        status: { type: string }
        last_error: { type: [string, "null"] }
        account: { $ref: "#/components/schemas/ConnectorAccount" }
        reports: { type: array, items: { $ref: "#/components/schemas/SEOReportName" } }
        country: { type: string }
        sync: { type: string, enum: [weekly, "off"] }
        domains_set: { type: boolean, description: "false: the domains follow the analytics tools." }
        domains:
          type: array
          items:
            type: object
            required: [host, last_run_at, last_ok_at, last_error, last_cost]
            properties:
              host: { type: string }
              last_run_at: { type: [string, "null"], format: date-time }
              last_ok_at: { type: [string, "null"], format: date-time }
              last_error: { type: [string, "null"] }
              last_cost: { type: [number, "null"] }
        budget: { $ref: "#/components/schemas/SEOBudget" }
    SEOHistoryRow:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [day, integration_id, connector, host, country]
          properties:
            day: { type: string, format: date }
            integration_id: { type: string, format: uuid }
            connector: { type: string }
            host: { type: string }
            country: { type: string }
            key: { type: string }
            url: { type: string }
            kind: { type: string }
            previous: { $ref: "#/components/schemas/SEOMetrics" }
    SEOTrend:
      type: object
      required: [current, previous, change, direction]
      properties:
        current: { type: [number, "null"], description: "The last 4 weeks added up, or the latest snapshot." }
        previous: { type: [number, "null"], description: "The 4 weeks before, or the last snapshot at least 4 weeks older." }
        change: { type: [number, "null"], description: "(current - previous) / previous; 0.12 is 12% up." }
        direction: { type: string, enum: [up, down, flat, unknown], description: "Within 3% is flat; unknown when either side has no data." }
    SEOOverviewBrand:
      type: object
      required: [brand, terms, hosts, weeks, seo, trends, sites, open_fixes]
      properties:
        brand:
          oneOf:
            - type: object
              required: [id, name, handle]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                handle: { type: string }
            - { type: "null" }
          description: null for the websites no brand claims.
        terms: { type: array, items: { type: string }, description: "What a search must contain to count as branded." }
        hosts: { type: array, items: { type: string }, description: The brand's websites. }
        weeks:
          type: array
          description: Oldest first; a null is not measured that week.
          items:
            type: object
            required: [week, branded_clicks, branded_impressions, search_clicks, search_impressions, visitors, sessions]
            properties:
              week: { type: string, format: date, description: The week's Monday. }
              branded_clicks: { type: [number, "null"] }
              branded_impressions: { type: [number, "null"] }
              search_clicks: { type: [number, "null"] }
              search_impressions: { type: [number, "null"] }
              visitors: { type: [number, "null"] }
              sessions: { type: [number, "null"] }
        seo:
          type: array
          description: "One row per snapshot day, oldest first: Ahrefs when it is connected, the main website's rating, links added up across the brand's websites."
          items:
            type: object
            required: [day, connector, domain_rating, backlinks, referring_domains, organic_traffic]
            properties:
              day: { type: string, format: date }
              connector: { type: string }
              domain_rating: { type: [number, "null"] }
              backlinks: { type: [number, "null"] }
              referring_domains: { type: [number, "null"] }
              organic_traffic: { type: [number, "null"] }
        trends:
          type: object
          required: [branded_search, search_clicks, visitors, domain_rating, backlinks, referring_domains]
          properties:
            branded_search: { $ref: "#/components/schemas/SEOTrend" }
            search_clicks: { $ref: "#/components/schemas/SEOTrend" }
            visitors: { $ref: "#/components/schemas/SEOTrend" }
            domain_rating: { $ref: "#/components/schemas/SEOTrend" }
            backlinks: { $ref: "#/components/schemas/SEOTrend" }
            referring_domains: { $ref: "#/components/schemas/SEOTrend" }
        sites:
          type: array
          description: The brand's audited sites and their latest health score; empty without seo.read.
          items:
            type: object
            required: [id, host, health_score, crawled_at]
            properties:
              id: { type: string, format: uuid }
              host: { type: string }
              health_score: { type: [integer, "null"] }
              crawled_at: { type: [string, "null"], format: date-time }
        open_fixes: { type: [integer, "null"], description: "Open and in-progress fixes; null without seo.read." }
    SEOLatest:
      allOf:
        - $ref: "#/components/schemas/SEOMetrics"
        - type: object
          required: [integration_id, name, connector, day]
          properties:
            integration_id: { type: string, format: uuid }
            name: { type: string }
            connector: { type: string }
            day: { type: string, format: date }
    AnalyticsSummaryItem:
      allOf:
        - $ref: "#/components/schemas/AnalyticsSource"
        - type: object
          required: [report, totals, notes, error]
          properties:
            report: { type: string }
            totals:
              oneOf:
                - $ref: "#/components/schemas/AnalyticsMetrics"
                - type: "null"
            from: { type: string, format: date }
            to: { type: string, format: date }
            notes: { type: array, items: { type: string } }
            error: { type: [string, "null"] }
    VerificationStatus:
      type: string
      enum: [deliverable, undeliverable, risky, unknown]
    AIPrice:
      type: object
      description: US cents per million tokens.
      required: [input_cents_per_million, output_cents_per_million]
      properties:
        input_cents_per_million: { type: number, example: 400 }
        output_cents_per_million: { type: number, example: 2000 }
    AISettings:
      type: object
      required: [integration_id, model, input_cents_per_million, output_cents_per_million, monthly_limit_cents, spent_this_month_cents, domain_research, domain_research_limit_cents, domain_research_spent_this_month_cents, active, problem, providers, updated_at]
      properties:
        integration_id: { type: [string, "null"], format: uuid, description: The chosen connection; null uses the first connected AI model. }
        model: { type: string, description: The chosen model; empty uses the provider's default. }
        input_cents_per_million: { type: [number, "null"] }
        output_cents_per_million: { type: [number, "null"] }
        monthly_limit_cents: { type: [integer, "null"], description: Most AI calls may cost in a calendar month (UTC); null is no limit. }
        spent_this_month_cents: { type: integer }
        domain_research: { type: boolean, description: "Whether unknown email domains are researched by reading their homepage with this workspace's own page reader and AI key. Off by default, because it spends the workspace's money with two providers." }
        domain_research_limit_cents: { type: [integer, "null"], description: "Most domain research may cost in a calendar month (UTC); the workspace's overall AI limit still applies and research stops at whichever comes first. 20000 (US$200) by default." }
        domain_research_spent_this_month_cents: { type: integer }
        active:
          description: The model in use now; null when none can be.
          oneOf:
            - type: "null"
            - type: object
              required: [provider, provider_name, integration_id, model, price, price_source]
              properties:
                provider: { type: string, enum: [claude, openai, gemini, mistral] }
                provider_name: { type: string }
                integration_id: { type: string, format: uuid }
                model: { type: string }
                price: { $ref: "#/components/schemas/AIPrice" }
                price_source: { type: string, enum: [list, workspace, ""], description: "list: Outflare knows the price. workspace: entered with the choice. Empty: unknown, so the model can't run yet." }
        problem:
          description: What must be done before missions can be planned or run; null when nothing.
          oneOf:
            - type: "null"
            - type: object
              required: [code, message]
              properties:
                code: { type: string, enum: [connector_needed, ai_model_needed] }
                message: { type: string }
        providers:
          type: array
          items:
            type: object
            required: [connector, name, default_model, key_url, pricing_url, connections, known_prices]
            properties:
              connector: { type: string, enum: [claude, openai, gemini, mistral] }
              name: { type: string }
              default_model: { type: [string, "null"] }
              key_url: { type: string, format: uri }
              pricing_url: { type: string, format: uri }
              connections:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
              known_prices:
                type: object
                description: List prices Outflare knows, by model id.
                additionalProperties: { $ref: "#/components/schemas/AIPrice" }
        updated_at: { type: [string, "null"], format: date-time }
    VerificationSettings:
      type: object
      required: [integration_id, provider, verify_on_import, verify_before_send, block_risky, block_catch_all, block_unknown, max_age_days]
      properties:
        integration_id: { type: [string, "null"], description: Null uses the free built-in checks. }
        provider: { type: string, description: "The connector id, or builtin." }
        verify_on_import: { type: boolean }
        verify_before_send: { type: boolean, description: "Hold a lead's first email until its address has a fresh result." }
        block_risky: { type: boolean }
        block_catch_all: { type: boolean }
        block_unknown: { type: boolean }
        max_age_days: { type: integer, description: Results older than this are checked again before a first email. }
    Verification:
      type: object
      required: [email, status, reason, catch_all, disposable, role, free, provider, provider_status, integration_id, checked_at]
      properties:
        email: { type: string }
        status: { $ref: "#/components/schemas/VerificationStatus" }
        reason: { type: string }
        catch_all: { type: boolean }
        disposable: { type: boolean }
        role: { type: boolean }
        free: { type: boolean }
        suggestion: { type: string, description: "A likely correction, e.g. for a misspelt domain." }
        score: { type: integer, minimum: 0, maximum: 100 }
        provider: { type: string, description: "Connector id that answered, or builtin." }
        provider_status: { type: string, description: The provider's own status words. }
        integration_id: { type: [string, "null"] }
        checked_at: { type: string, format: date-time }
    VerificationSummary:
      type: object
      required: [leads, verified, stale, unverified, deliverable, undeliverable, risky, catch_all, unknown, pending, settings]
      properties:
        leads: { type: integer }
        verified: { type: integer, description: Leads with a fresh result. }
        stale: { type: integer, description: Leads whose result is older than max_age_days. }
        unverified: { type: integer }
        deliverable: { type: integer }
        undeliverable: { type: integer }
        risky: { type: integer }
        catch_all: { type: integer }
        unknown: { type: integer }
        pending: { type: integer, description: Addresses waiting to be verified. }
        settings: { $ref: "#/components/schemas/VerificationSettings" }
    Tri:
      description: '`true`, `false`, or `"unknown"` when there is no evidence either way.'
      oneOf:
        - { type: boolean }
        - { type: string, enum: [unknown] }
    Classification:
      type: object
      required: [scope, normalized_domain, registrable_domain, taxonomy_version, intelligence_version, global, effective, analysis]
      properties:
        scope: { type: string, enum: [email, domain], description: "email when an address was sent; address-only attributes are left out for domain." }
        normalized_domain: { type: string, description: "Lowercase, punycode for internationalised names.", example: mail.example.co.uk }
        registrable_domain: { type: string, example: example.co.uk }
        taxonomy_version: { type: string, example: "1.0" }
        intelligence_version: { type: string, description: The data snapshot that answered., example: 2026-10-26.1 }
        global: { $ref: "#/components/schemas/ClassificationAssessment" }
        research: { $ref: "#/components/schemas/ClassificationResearch" }
        effective: { $ref: "#/components/schemas/ClassificationEffective" }
        analysis:
          type: object
          required: [status, provisional]
          properties:
            status:
              type: string
              enum: [complete, not_queued, queued, researched]
              description: |
                complete: nothing more to find out. not_queued: an unknown
                domain, and this workspace has domain research off.
                queued: research is running on the workspace's own page
                reader and AI key; ask again shortly. researched: the
                workspace's own research answered, and `research` says what
                it found.
            provisional: { type: boolean, description: True while the domain is unknown. }
    ClassificationCategory:
      type: string
      enum: [business, free_personal, private_mailbox, disposable, relay_alias, education, government, nonprofit_institutional, personal_custom, managed_other, unknown]
      description: |
        What the domain is. free_personal: a free consumer mailbox (Gmail, Outlook.com, ISP mail).
        private_mailbox: a privacy-first or paid personal mailbox (Proton, Tuta, Fastmail); not disposable.
        relay_alias: an alias service that forwards to a real mailbox (Hide My Email, SimpleLogin); not disposable on that alone.
        disposable: a throwaway or temporary inbox. education and government: from the domain's suffix (edu, ac.uk, gov.au), a hint rather than proof.
        unknown: not enough evidence yet, a valid answer in its own right. The other codes are reserved for later versions.
    ClassificationSubcategory:
      type: [string, "null"]
      enum: [short_lived_mailbox, throwaway_persistent, shared_public_inbox, temporary_forwarder, rotating_domain_provider, anonymous_alias, permanent_alias, unknown_disposable_subtype, null]
    ClassificationAssessment:
      type: object
      required: [category, subcategory, confidence, confidence_status, provider, attributes, risk, evidence, last_checked_at]
      properties:
        category: { $ref: "#/components/schemas/ClassificationCategory" }
        subcategory: { $ref: "#/components/schemas/ClassificationSubcategory" }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1, description: "Calibrated probability the category is right. Null until calibration exists." }
        confidence_status:
          type: string
          enum: [verified, corroborated, inferred, insufficient_evidence, conflicted]
          description: "verified: a provider Outflare reviewed. corroborated: independent sources agree. inferred: one source or indicator. conflicted: sources disagree."
        provider:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, example: proton }
            name: { type: string, example: Proton Mail }
        attributes:
          type: object
          required: [is_disposable, is_public_inbox, is_forwarder, is_alias_service, is_privacy_provider, is_free_provider, is_catch_all_domain, is_new_domain, has_mx, has_mail_receiving_path, has_valid_syntax, is_internationalized_domain, mx_provider_id]
          properties:
            is_disposable: { $ref: "#/components/schemas/Tri" }
            is_public_inbox: { $ref: "#/components/schemas/Tri" }
            is_forwarder: { $ref: "#/components/schemas/Tri" }
            is_alias_service: { $ref: "#/components/schemas/Tri" }
            is_privacy_provider: { $ref: "#/components/schemas/Tri" }
            is_free_provider: { $ref: "#/components/schemas/Tri" }
            is_role_address: { $ref: "#/components/schemas/Tri", description: "Email scope only: a shared inbox such as info@ or support@." }
            is_catch_all_domain: { $ref: "#/components/schemas/Tri" }
            is_new_domain: { $ref: "#/components/schemas/Tri" }
            has_mx: { $ref: "#/components/schemas/Tri" }
            has_mail_receiving_path: { $ref: "#/components/schemas/Tri", description: "MX records, or none but an address mail can fall back to." }
            has_valid_syntax: { $ref: "#/components/schemas/Tri" }
            is_internationalized_domain: { $ref: "#/components/schemas/Tri" }
            mx_provider_id: { type: [string, "null"], description: "Who runs the mail servers when recognised (google, microsoft, zoho...). Never proof of what the domain is.", example: google }
        risk:
          type: object
          required: [status, score, level, signals]
          description: How much the domain should concern a sign-up flow, separate from what it is. Rule-based until calibrated, and never a probability that a person is fraudulent.
          properties:
            status: { type: string, enum: [assessed, not_assessed] }
            score: { type: [integer, "null"], minimum: 0, maximum: 100, description: Higher is more concern. }
            level: { type: string, enum: [low, medium, high, unknown] }
            signals: { type: array, items: { type: string }, example: [listed_disposable_provider], description: "listed_disposable_provider, rotating_domain_provider, domain_accepts_no_mail, no_mail_servers, role_address. More may be added." }
        evidence:
          type: array
          items:
            type: object
            required: [source, signal]
            properties:
              source: { type: string, description: "outflare (reviewed by Outflare), disposable-email-domains, fakefilter, dns or public_suffix." }
              signal: { type: string, description: "reviewed_provider, listed_disposable, listed_disposable_outranked, institution_suffix, mx_provider, null_mx, no_mail_servers. More may be added." }
              detail: { type: string, description: "A fixed note, such as the list entry or MX provider matched." }
        last_checked_at: { type: [string, "null"], format: date-time, description: When DNS was last asked. }
    ClassificationResearch:
      type: [object, "null"]
      description: |
        What this workspace's own research made of the domain, when it has
        researched it. Research reads the domain's homepage through the
        workspace's own page reader (Geonode) and asks the workspace's own
        AI model what the words mean, on the workspace's own accounts:
        Outflare never supplies an API key. A verdict belongs to the
        workspace that paid for it, is absent for every other workspace,
        and never changes `global`, which stays Outflare's reviewed data.
        Turn it on with `domain_research` under the workspace's AI settings.
      required: [category, subcategory, confidence_status, signals, evidence, model, researched_at]
      properties:
        category: { $ref: "#/components/schemas/ClassificationCategory" }
        subcategory: { $ref: "#/components/schemas/ClassificationSubcategory" }
        confidence_status:
          type: string
          enum: [verified, corroborated, inferred, insufficient_evidence, conflicted]
          description: "corroborated: research agrees with the global answer. conflicted: it disagrees, so the global answer stands and the action becomes review."
        signals:
          type: array
          items: { type: string }
          example: [site_offers_temporary_addresses]
          description: |
            What the homepage said, from a fixed list:
            site_offers_temporary_addresses, site_offers_free_mailboxes,
            site_offers_paid_mailboxes, site_offers_forwarding,
            site_is_organisation, site_is_school_or_government,
            site_is_parked, site_says_nothing_about_email,
            site_could_not_be_read. More may be added.
        evidence:
          type: array
          items:
            type: object
            required: [source, signal]
            properties:
              source: { type: string, description: Always research. }
              signal: { type: string }
              detail: { type: string }
        note: { type: string, maxLength: 200, description: "The model's one-line reason, for a person reading the record." }
        model: { type: string, example: claude-haiku-5-5 }
        researched_at: { type: string, format: date-time }
    ClassificationEffective:
      type: object
      required: [category, subcategory, override_applied, override_id, action, matched_policy_id]
      properties:
        category: { $ref: "#/components/schemas/ClassificationCategory" }
        subcategory: { $ref: "#/components/schemas/ClassificationSubcategory" }
        override_applied: { type: boolean }
        override_id: { type: [string, "null"] }
        action: { type: string, enum: [allow, verify, review, block], description: Advice for a sign-up flow. }
        matched_policy_id: { type: string, description: "The rule that chose the action: default_disposable, default_no_mail, default_unknown, default_allow, default_research_allow or default_research_unsettled (research disagreed with the global answer, or could not place the domain) until workspaces have their own.", example: default_allow }
