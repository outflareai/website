      tags: [access]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_before: { type: [integer, "null"] }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMailboxes
      x-outflare-access: { scope: mailboxes.read, project_tokens: true }
      summary: List mailboxes
      description: "Scope: mailboxes.read. Credentials are never returned."
      tags: [mailboxes]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MailboxStatus" } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/LifecycleStage" } }
        - { name: pool_id, in: query, schema: { type: string, format: uuid } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: server_id, in: query, schema: { type: string, format: uuid } }
        - { name: project_id, in: query, description: "A project's id, or none for records shared by the workspace. A project token always sees only its project.", schema: { type: string } }
      responses:
        "200":
          description: Mailboxes, ordered by email.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Mailbox" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add or update one mailbox
      description: |
        Scope: mailboxes.manage. Upserts by email. Google Workspace and
        Microsoft 365 are detected from MX records; other providers need the
        host and port fields. The mailbox starts as `verifying` while a job
        signs in over SMTP and IMAP.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailboxInput" }
      responses:
        "200":
          description: Updated an existing mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/import:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: importMailboxes
      x-outflare-access: { scope: mailboxes.manage }
      summary: Bulk import mailboxes from CSV
      description: |
        Scope: mailboxes.manage. Send the CSV file as the body (up to 5 MB and
        5000 rows). Required columns: `email` and `password` (or
        `smtp_password`). Optional: `name` (or `first_name` and `last_name`),
        `provider`, `smtp_host`, `smtp_port`, `smtp_username`,
        `smtp_password`, `imap_host`, `imap_port`, `imap_username`,
        `imap_password`, `pool` and `daily_limit`. Common reseller and
        sequencer headers such as `Email Address` and `App Password` are
        recognised. Rows are upserted by email; bad rows are reported by line
        and the rest still import.
      tags: [mailboxes]
      parameters:
        - name: pool
          in: query
          description: Pool name for rows that do not name one. Created if missing.
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailbox
      x-outflare-access: { scope: mailboxes.read, project_tokens: true }
      summary: Get a mailbox
      description: "Scope: mailboxes.read"
      tags: [mailboxes]
      responses:
        "200":
          description: The mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Change a mailbox's name, limits, pool, or pause and resume it
      description: |
        Scope: mailboxes.manage. Set `status` to `paused` to stop sending, or
        to `active` to resume; resuming re-verifies the connection first.
        Set `pool_id` to null to remove the mailbox from its pool.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                daily_limit: { type: integer, minimum: 1, maximum: 500 }
                min_gap_seconds: { type: integer, minimum: 0, maximum: 3600 }
                pool_id: { type: [string, "null"], format: uuid }
                status: { type: string, enum: [paused, active] }
                warmup: { $ref: "#/components/schemas/WarmupSettings" }
      responses:
        "200":
          description: The updated mailbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a mailbox and its stored credentials
      description: "Scope: mailboxes.manage"
      tags: [mailboxes]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/verify:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyMailbox
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a mailbox's SMTP and IMAP sign-in and its domain's DNS
      description: "Scope: mailboxes.manage. Runs in the background; poll the mailbox for the result."
      tags: [mailboxes]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/{id}/warmup:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailboxWarmup
      x-outflare-access: { scope: mailboxes.read }
      summary: A mailbox's warm-up results for each of the last 14 days
      description: "Scope: mailboxes.read. Days are UTC, oldest first."
      tags: [mailboxes]
      responses:
        "200":
          description: Daily results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WarmupDay" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailboxes/warmup:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: updateWarmup
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Turn warm-up on or off, or change its settings, for many mailboxes
      description: |
        Scope: mailboxes.manage. Applies to the mailboxes in `mailbox_ids`,
        or to every mailbox in `pool_id`, or to every mailbox in the
        workspace when neither is given. Warming mailboxes email each other,
        so turn it on for at least two, ideally on different domains.
        Turning warm-up on starts the ramp from its first day: 2 emails a
        day, then 2 more each day up to `daily_target`.
      tags: [mailboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WarmupSettings" }
                - type: object
                  properties:
                    mailbox_ids: { type: array, items: { type: string, format: uuid } }
                    pool_id: { type: string, format: uuid }
      responses:
        "200":
          description: How many mailboxes changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-pools:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMailboxPools
      x-outflare-access: { scope: mailboxes.read }
      summary: List mailbox pools
      description: "Scope: mailboxes.read"
      tags: [mailboxes]
      responses:
        "200":
          description: Pools.
          content:
            application/json:
              schema:
