      tags: [domains]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-domains/{domain}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { $ref: "#/components/parameters/Domain" }
    post:
      operationId: checkSendingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a domain's DNS and blocklists now
      description: "Scope: mailboxes.manage. Runs in the background; poll the domain for a new `checked_at`. Use it after changing DNS records."
      tags: [domains]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listSendingServers
      x-outflare-access: { scope: mailboxes.read }
      summary: List sending servers with IPs, blocklist results, settings and sending stats
      description: |
        Scope: mailboxes.read. A sending server is the SMTP host a group of
        mailboxes signs in to, and the IP addresses they share: a cold-email
        SMTP vendor's server (Mailreef, Infraforge) or your own mail server.
        Mailboxes outside Google and Microsoft join one on their own when
        they are connected, grouped by `smtp_host`. Each server carries its
        IPs, their blocklist results, the issues to fix, a shared daily
        limit and pause, mailbox counts and sends over rolling windows.
      tags: [servers]
      responses:
        "200":
          description: Servers, sorted by host.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SendingServer" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/check:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: checkAllSendingServers
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check IPs and blocklists for every server
      description: "Scope: mailboxes.manage. Runs in the background. Every server is also re-checked on its own once a day."
      tags: [servers]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ type: object, required: [queued], properties: { queued: { type: integer, description: "Servers queued for a check." } } }, { $ref: "#/components/schemas/MissionHeld" }] }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSendingServer
      x-outflare-access: { scope: mailboxes.read }
      summary: Get a sending server
      description: "Scope: mailboxes.read. List its mailboxes with `GET /mailboxes?server_id=`."
      tags: [servers]
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingServer" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Pause or resume a server, cap its daily sends, or set its sending IPs
      description: |
        Scope: mailboxes.manage. `status: paused` stops sequence and test
        sends from every mailbox on the server (replies written in the inbox
        still go); `active` resumes, including after an automatic blocklist
        pause. `daily_limit` caps sends from all its mailboxes together in
        any 24 hours; null removes the cap. `pause_on_listing` (on by
        default) pauses the server when a check finds one of its IPs on a
        blocklist, and resumes it when every IP is clear again; a pause by a
        person is never lifted automatically. `ips` sets the sending
        addresses by hand, for servers that accept mail on one address and
        send from others; null goes back to the host's DNS records. Changing
        `ips` queues a new check.
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                status: { type: string, enum: [active, paused] }
                daily_limit: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
                notes: { type: string, maxLength: 2000 }
                pause_on_listing: { type: boolean }
                ips:
                  type: [array, "null"]
                  minItems: 1
                  maxItems: 256
                  items: { type: string, description: An IPv4 or IPv6 address. }
      responses:
        "200":
          description: The updated server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendingServer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a server that no mailbox uses
      description: "Scope: mailboxes.manage. Returns 409 while mailboxes still sign in to it."
      tags: [servers]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/sending-servers/{id}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkSendingServer
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Re-check a server's IPs and blocklists now
      description: "Scope: mailboxes.manage. Runs in the background; poll the server for a new `checked_at`. Use it after a delisting request."
      tags: [servers]
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/Queued" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listTrackingDomains
      x-outflare-access: { scope: mailboxes.read }
      summary: List tracking domains
      description: |
        Scope: mailboxes.read. Optional. Once a domain is verified, the
        workspace's unsubscribe links and any click-tracked links use it
        instead of this server's address. `target` is what the CNAME must
