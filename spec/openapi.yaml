          content:
            application/json:
              schema:
                type: object
                required: [data, target]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TrackingDomain" }
                  target: { type: string }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a tracking domain
      description: "Scope: mailboxes.manage. Add a CNAME record from the domain to `target` first or after; the DNS is checked straight away and whenever you call check."
      tags: [tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: links.acme.com }
      responses:
        "201":
          description: The domain, with the result of the first check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Remove a tracking domain
      description: "Scope: mailboxes.manage. Links already sent keep working only while the domain still points here."
      tags: [tracking]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/tracking-domains/{id}/check:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkTrackingDomain
      x-outflare-access: { scope: mailboxes.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Check a tracking domain's DNS now
      description: "Scope: mailboxes.manage."
      tags: [tracking]
      responses:
        "200":
          description: The domain, with the result of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingDomain" }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listLeads
      x-outflare-access: { scope: leads.read }
      summary: List and search leads, ordered by email
      description: "Scope: leads.read"
      tags: [leads]
      parameters:
        - { name: list_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Matches email, name or company.", schema: { type: string } }
        - { name: suppressed, in: query, schema: { type: boolean } }
        - { name: verification, in: query, description: "Latest verification result, or unverified for never checked.", schema: { type: string, enum: [deliverable, undeliverable, risky, unknown, unverified] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "next_after from the previous page.", schema: { type: string } }
      responses:
        "200":
          description: Leads.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, next_after]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lead" }
                  total: { type: integer, description: Matches across all pages. }
                  next_after: { type: [string, "null"], description: Pass as after to get the next page. }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: upsertLead
      x-outflare-access: { scope: leads.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Add a lead, or update the lead with this email
      description: "Scope: leads.manage. Empty fields keep stored values; custom fields are merged."
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads/import:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: importLeads
      x-outflare-access: { scope: leads.manage }
      summary: Bulk import leads from CSV
      description: |
        Scope: leads.manage. Send the CSV file as the body (up to 50 MB and
        100,000 rows). Only an email column is required. Standard columns are
        recognised under common export names (first name, last name, full
        name, company, title, phone, LinkedIn URL, website); every other
        column is kept as a custom field under its snake_case header, for use
        in templates. Leads are upserted by email: a row for an existing lead
        fills in non-empty fields and merges custom fields. Rows repeating an
        email within the file are merged. Suppressed people are imported but
        counted, and are never emailed.
      tags: [leads]
      parameters:
        - name: list
          in: query
          description: Add every imported lead to this list, created if missing.
          schema: { type: string, maxLength: 100 }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/leads/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
