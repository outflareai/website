      summary: Remove a lead from a list
      description: "Scope: leads.manage"
      tags: [lists]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/lead-lists/{id}/runs:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listListRuns
      x-outflare-access: { scope: leads.read, project_tokens: true }
      summary: List a list's runs, newest first
      description: "Scope: leads.read"
      tags: [lists]
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ListRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startListRun
      x-outflare-access: { scope: leads.manage, project_tokens: true }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Build, refresh or enrich a list
      description: >-
        Scope: leads.manage. Spends provider credits. build and refresh search
        the provider, find missing emails through the waterfall and add new
        leads; enrich fills in missing fields on the list's leads. One run at a
        time per list (409 while one is queued or running). max_leads and
        credit_cap override the list's limits for this run only.
      tags: [lists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [build, refresh, enrich], default: build }
                max_leads: { type: integer, minimum: 1, maximum: 50000 }
                credit_cap: { type: number, minimum: 0 }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/ListRun" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/list-runs/{run}:
    parameters:
