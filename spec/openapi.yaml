                  data: { type: array, items: { $ref: "#/components/schemas/EmailTemplateVersion" } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-topics:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listEmailTopics
      x-outflare-access: { scope: emails.read }
