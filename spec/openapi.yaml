  /v1/workspaces/{ws}/missions:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listMissions
      x-outflare-access: { scope: missions.read }
      summary: List missions
      description: "Scope: missions.read. Waiting for approval first, then running, paused, drafts and ended."
      tags: [missions]
      parameters:
        - { name: status, in: query, description: "Comma-separated statuses.", schema: { type: string, example: "running,paused" } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Missions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Mission" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMission
      x-outflare-access: { scope: missions.run }
      summary: Create a mission
      description: |
        Scope: missions.run. Starts as a draft: writes made in it are dry
        runs until a person approves it. A mission created with an API token
        is run by that token; a person can assign any token with token_id.
        A token bound to a project creates missions only in that project.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MissionInput" }
                - { required: [name] }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/plan:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      operationId: planMission
      x-outflare-access: { scope: missions.run }
      summary: Plan a mission from a goal
      description: |
        Scope: missions.run. Type a goal in plain words ("book 10 meetings
        with fintech CFOs in Australia by 30 November") and Claude drafts
        the mission: a measurable goal, steps, instructions for the agent,
        limits sized to your mailboxes, and the connectors it needs. The
        draft is saved as a mission in status draft, with a connect request
        for each missing connector and any questions for you. Nothing runs
        until a person approves it.

        Uses the workspace's Claude connection (connect it under Connectors
        with your own API key). Without one the call fails with 409
        `connector_needed`. Claude is sent the goal, the project brief and a
        summary of the workspace, never lead lists or email addresses.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionPlanInput" }
      responses:
        "201":
          description: The draft mission and what the planner proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionPlanResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMission
      x-outflare-access: { scope: missions.read }
      summary: Check in on a mission
      description: |
        Scope: missions.read. What an agent reads before it acts: the
        mission, the project brief (and whether it changed since approval),
        limits, progress, open connect requests and the latest notes.
      tags: [missions]
      responses:
        "200":
          description: The mission and its context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission: { $ref: "#/components/schemas/Mission" }
                  brief: { oneOf: [{ $ref: "#/components/schemas/MissionBrief" }, { type: "null" }] }
                  updates: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
                  open_connect_requests: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
                  how_to_act:
                    type: object
                    properties:
                      header: { type: string }
                      reason_header: { type: string }
                      writes: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMission
      x-outflare-access: { scope: missions.run }
      summary: Change a mission
      description: |
        Scope: missions.run. Once a mission is approved, changing its mode,
        limits, token or project also needs missions.approve, and an agent
        cannot change its own. An ended mission cannot change.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionInput" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/submit:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitMission
      x-outflare-access: { scope: missions.run }
      summary: Submit the plan for approval
      description: "Scope: missions.run. From draft. Writes stay dry runs until approved."
      tags: [missions]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { plan: { type: string, description: Markdown. } } }
      responses:
        "200": { description: Submitted., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/approve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveMission
      x-outflare-access: { scope: missions.approve }
      summary: Approve and start a mission
      description: |
        Scope: missions.approve. A person, or an approver token that is not
        the mission's own. Records the project brief version it was
        approved against.

        `runner: builtin` hands the mission to Outflare's own agent, which
        runs it in turns with the workspace's Claude key. It gets a token of
        its own (operator scopes, never more than yours, never
        missions.approve) and goes through the same gate as any agent, so
        the mode still decides whether its writes run, wait for you or are
        dry runs. A turn runs at once, whenever a person writes to the
        mission or decides on a held change, and when the agent asks to look
        again. Answers 409 `connector_needed` until Claude is connected.
      tags: [missions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { $ref: "#/components/schemas/MissionMode" }
                note: { type: string }
                runner:
                  type: string
                  enum: [builtin, external]
                  description: Who carries the mission out. Left out, it stays as it is (external for a new mission).
      responses:
        "200": { description: Running., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/pause:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: pauseMission
      x-outflare-access: { scope: missions.run }
      summary: Pause a mission
      description: "Scope: missions.run, so an agent can pause itself. Writes are refused and its campaigns stop sending until it resumes."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: Paused., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/resume:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resumeMission
      x-outflare-access: { scope: missions.approve }
      summary: Resume a paused mission
      description: "Scope: missions.approve, and not the mission's own agent."
      tags: [missions]
      responses:
        "200": { description: Running., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/stop:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: stopMission
      x-outflare-access: { scope: missions.run }
      summary: Stop a mission now
      description: "Scope: missions.run. Ends it: held writes are canceled, its campaigns are paused, and further calls in it are refused."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        "200": { description: Stopped., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeMission
      x-outflare-access: { scope: missions.run }
      summary: Finish a mission with a report
      description: "Scope: missions.run. The agent's final report, in Markdown. Its campaigns are paused."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { report: { type: string } } } } }
      responses:
        "200": { description: Completed., content: { application/json: { schema: { $ref: "#/components/schemas/Mission" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/calls:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionCalls
      x-outflare-access: { scope: missions.read }
      summary: Every call made in the mission, newest first
      description: "Scope: missions.read. What a write changed is in the audit log under the same request_id."
      tags: [missions]
      parameters:
        - { name: writes, in: query, schema: { type: boolean }, description: Only writes. }
        - { name: before, in: query, schema: { type: integer }, description: A call id, for the next page. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionCall" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionActions
      x-outflare-access: { scope: missions.read }
      summary: Writes the mission held or dry-ran
      description: "Scope: missions.read."
      tags: [missions]
      parameters:
        - { name: status, in: query, description: "Comma-separated.", schema: { type: string, example: pending } }
      responses:
        "200":
          description: Actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionAction" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMissionAction
      x-outflare-access: { scope: missions.read }
      summary: One held write, with its decision and result
      description: "Scope: missions.read. Agents poll this after a 202."
      tags: [missions]
      responses:
        "200": { description: The action., content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}/approve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveMissionAction
      x-outflare-access: { scope: missions.approve }
      summary: Approve and run a held write
      description: |
        Scope: missions.approve. Runs the stored request as the agent that
        made it, through every normal check, and keeps the response as the
        result. Works on pending writes, and on dry runs once the mission
        is running. Never by the agent that made it.
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: The action, executed or failed., content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/actions/{action}/reject:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectMissionAction
      x-outflare-access: { scope: missions.approve }
      summary: Reject a held write
      description: "Scope: missions.approve. A note is passed to the agent as an instruction."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: Rejected., content: { application/json: { schema: { $ref: "#/components/schemas/MissionAction" } } } }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/updates:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMissionUpdates
      x-outflare-access: { scope: missions.read }
      summary: Notes between the agent and people
      description: "Scope: missions.read."
      tags: [missions]
      parameters:
        - { name: open_requests, in: query, schema: { type: boolean }, description: Only connect requests not yet resolved. }
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Updates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionUpdate" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: postMissionUpdate
      x-outflare-access: { scope: missions.run }
      summary: Post a note, question, instruction or connect request
      description: |
        Scope: missions.run. kind connect_request asks a person to connect
        a tool the agent needs (they paste the key or sign in with OAuth);
        give connector as the connector id.
      tags: [missions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                kind: { type: string, enum: [note, progress, question, instruction, connect_request], default: note }
                body: { type: string }
                connector: { type: string, example: zerobounce }
      responses:
        "201": { description: Posted., content: { application/json: { schema: { $ref: "#/components/schemas/MissionUpdate" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/missions/{id}/updates/{update}/resolve:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: update, in: path, required: true, schema: { type: integer } }
    post:
      operationId: resolveMissionConnectRequest
      x-outflare-access: { scope: missions.run }
      summary: Close a connect request
      description: "Scope: missions.run. The tool was connected, or a person decided not to."
      tags: [missions]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "204": { description: Resolved. }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mission-actions:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      operationId: listPendingMissionActions
      x-outflare-access: { scope: missions.read }
      summary: Writes waiting for a person, across missions
      description: "Scope: missions.read. The approval inbox."
      tags: [missions]
      responses:
        "200":
          description: Pending actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MissionAction" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/connect-requests:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listConnectRequests
      x-outflare-access: { scope: integrations.read }
      summary: List connect requests
      description: "Scope: integrations.read. The 100 newest, with status pending, connected, cancelled or expired."
      tags: [connectors]
      responses:
        "200":
          description: Connect requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ConnectRequest" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createConnectRequest
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Ask a person to connect a service
      description: |
        Scope: integrations.manage. The agent-first way to connect anything:
        returns a one-time link to give the person. They open it, without
        logging in, and paste the key or approve the OAuth sign-in. The
        secret never passes through the agent. Poll
        GET /connect-requests/{id} until status is connected.
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector]
              properties:
                connector: { type: string, example: zerobounce }
                name: { type: string, description: Name for the integration it creates. }
                reason: { type: string, maxLength: 500, description: Why it is needed; shown to the person on the link's page. }
                use_for_verification: { type: boolean, description: "Make it the workspace's verification service. Default true for verification connectors." }
                expires_in_minutes: { type: integer, minimum: 10, maximum: 10080, description: Default 1440 (24 hours). }
      responses:
        "201":
          description: Created. `url` is only returned here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/connect-requests/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConnectRequest
      x-outflare-access: { scope: integrations.read }
      summary: Read a connect request
      description: "Scope: integrations.read. Once status is connected, integration_id is the new integration."
      tags: [connectors]
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectRequest" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelConnectRequest
      x-outflare-access: { scope: integrations.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Cancel a pending connect request
      description: "Scope: integrations.manage. The link stops working."
      tags: [connectors]
      responses:
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/lookup:
    post:
      operationId: connectLookup
      summary: What a connect link is for
      description: Used by the link's page. No login; the token from the link is the authority.
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: The connector and who asked.
          content:
            application/json:
              schema:
                type: object
                required: [workspace_name, connector, name, reason, requested_by, expires_at]
                properties:
                  workspace_name: { type: string }
                  connector: { $ref: "#/components/schemas/Connector" }
                  name: { type: string }
                  reason: { type: string }
                  requested_by: { type: string, enum: [agent, person] }
                  expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/complete:
    post:
      operationId: connectComplete
      summary: Finish a connect link with an API key
      description: Tests the credentials and saves the integration. The link then stops working.
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credentials]
              properties:
                token: { type: string }
                credentials: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [connector_name, name, workspace_name]
                properties:
                  connector_name: { type: string }
                  name: { type: string }
                  workspace_name: { type: string }
                  account: { $ref: "#/components/schemas/ConnectorAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/connect/oauth:
    post:
      operationId: connectOAuth
      summary: Start the OAuth sign-in for a connect link
      tags: [connectors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: The provider's sign-in URL. Afterwards the browser lands on /connect.
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/import-preview:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: importPreview
      x-outflare-access: { scope: integrations.read }
      summary: See what an import from another sequencer would bring over
      description: "Scope: integrations.read. Reads the connected Instantly or Smartlead account live: campaigns with their steps, and sending accounts matched to this workspace's mailboxes by address. Changes nothing."
      tags: [imports]
      responses:
        "200":
          description: The outside account's campaigns and sending accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/integrations/{id}/imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startImport
      x-outflare-access: { scope: sequences.manage }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Import campaigns, leads and mailboxes from another sequencer
      description: |
        Scope: sequences.manage, plus leads.manage when importing leads. Runs
        in the background; read it with GET /imports/{id}. Campaigns become
        draft sequences, so nothing sends until someone starts them. Leads
        keep the step they reached and the mailbox that wrote to them;
        bounced and unsubscribed leads go on the suppression list. Running it
        again updates the same sequences instead of duplicating them.
      tags: [imports]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_ids: { type: array, items: { type: string }, description: Only these campaigns. Default every campaign. }
                leads: { type: boolean, description: Default true. }
                mailboxes: { type: boolean, description: "Match sending accounts. Default true." }
      responses:
        "202":
          description: "Queued. Inside a mission, a MissionHeld answer when the call was held for approval or dry-run instead."
          content:
            application/json:
              schema: { oneOf: [{ $ref: "#/components/schemas/ImportRun" }, { $ref: "#/components/schemas/MissionHeld" }] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/imports:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: listImports
      x-outflare-access: { scope: sequences.read }
      summary: List imports
      description: "Scope: sequences.read. The 50 newest."
      tags: [imports]
      responses:
        "200":
          description: Imports, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ImportRun" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/imports/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImport
      x-outflare-access: { scope: sequences.read }
      summary: Read an import and what it did
      description: "Scope: sequences.read."
      tags: [imports]
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-health:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
    get:
      operationId: mailboxHealth
      x-outflare-access: { scope: mailboxes.read }
      summary: How every sending mailbox is doing
      description: |
        Scope: mailboxes.read. Graded from every signal: sign-in and inbox sync
        errors (explained, e.g. suspended account or revoked consent), send
        failures, bounce rate, warm-up inbox placement, the domain's SPF, DKIM,
        DMARC and blocklists, and new mailboxes not warming up. Each signal
        says what to do. Worst first. Computed on read.
      tags: [mailboxes]
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [ok, warning, critical, paused] } }
        - { name: mailbox_id, in: query, schema: { type: string }, description: One or more ids, comma separated. }
      responses:
        "200":
          description: Health by mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [summary, data]
                properties:
                  summary: { $ref: "#/components/schemas/MailboxHealthSummary" }
                  data: { type: array, items: { $ref: "#/components/schemas/MailboxHealth" } }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/mailbox-health/settings:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
