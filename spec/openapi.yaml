        "200":
          description: The plan, now building.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfraPlan" }
        "409": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
