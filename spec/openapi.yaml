              properties:
                subject: { type: string }
                html: { type: string }
                text: { type: string }
                variables: { type: array, items: { $ref: "#/components/schemas/EmailTemplateVariable" } }
                data: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The filled-in content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "202": { $ref: "#/components/responses/MissionHeld" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces/{ws}/email-templates/{id}:
    parameters:
      - { $ref: "#/components/parameters/Workspace" }
