          items: { type: string }
    MissionMode:
      type: string
      enum: [dry_run, approve_writes, autonomous]
      description: "dry_run: writes recorded, never run. approve_writes: each write waits for a person. autonomous: writes run within the limits."
    MissionStatus:
      type: string
      enum: [draft, pending_approval, running, paused, completed, stopped, failed]
    MissionPlanInput:
      type: object
